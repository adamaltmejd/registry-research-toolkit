label = "Diagnoskod, den förlösta"
axis = "ordinal"

[[accept]]
register = "sos/mfr"
key = "gdiag"
label = "Diagnoskod under graviditet"
axis = "ordinal"

# ── Curated classification umbrella groups (#516) ───────────────────────────
# A [[classification_group]] folds genuinely-DISTINCT classification dimensions
# under one browse umbrella with a single `axis` — NOT vintage editions (those
# are #571 succession edges in classification_replaced_by). Members are exact
# `classification = "<slug>"` references (the standing curation rule forbids
# name patterns); each carries its `value`/`label` on the group's `axis`.
# Catalog-scoped (classifications are global), resolved by slug at materialize
# time — a dangling slug or an already-grouped classification FAILS the build.

# SUN — Svensk utbildningsnomenklatur. Its three CURRENT (2020) editions are the
# genuinely-distinct dimensions of one education classification (level /
# orientation / grouping); alongside them ride the two nivå AGGREGATES
# (niva-old / niva-grov — coarsenings of the level dimension). All five fold
# under a single `dimension` axis. The older sun1996 + 2000 editions are LEFT
# OUT — each is a temporal succession of its dimension (reached via the leaf
# edition-chain panel), not a parallel dimension. The aggregates are a
# granularity of the nivå dimension, not a separate axis; multi-axis concept
# groups were removed in #585, so they ride the single `dimension` axis for now
# (the proper granularity surface is deferred to the value-set viewer, #609).
[[classification_group]]
key = "sun"
label = "Svensk utbildningsnomenklatur (SUN)"
axis = "dimension"
[[classification_group.members]]
classification = "sun-niva2020"
value = "niva"
label = "Utbildningsnivå"
[[classification_group.members]]
classification = "sun-inriktning2020"
value = "inriktning"
label = "Utbildningsinriktning"
[[classification_group.members]]
classification = "sun-grupp2020"
value = "grupp"
label = "Utbildningsgrupper"
[[classification_group.members]]
classification = "niva-oldv1"
value = "niva-old"
label = "Nivå – aggregat, 7 nivåer"
[[classification_group.members]]
classification = "niva-grovv1"
value = "niva-grov"
label = "Nivå – aggregat, 5 nivåer"

# LISA's AGI monthly-income family: one concept ("Löne- eller
# företagarinkomst i {månad}") × a rank axis (agi1/agi2/agi3 = största / näst
# största / tredje största förvärvskälla). #319 merged each rank's 12 month
# columns into ONE variable (slug agi1lonfink / agi2lonfink / agi3lonfink — the
# family stem), so the per-rank month-token groups no longer derive. The members
# are now plain `variable =` attachments carrying only the rank facet; the
# per-month dimension lives in `variable_alias_window` (read-time via resolve_at),
# not a concept group. The family merge runs BEFORE concept groups, so these
# merged-variable slugs resolve.
[[variable_group]]
register = "scb/lisa"
key = "agilonfink"
label = "Löne- eller företagarinkomst per månad (AGI)"
axis = "rank"

[[variable_group.members]]
variable = "agi1lonfink"
value = "1"
label = "största förvärvskällan"

[[variable_group.members]]
variable = "agi2lonfink"
value = "2"
label = "näst största förvärvskällan"

[[variable_group.members]]
variable = "agi3lonfink"
value = "3"
label = "tredje största förvärvskällan"

# LOVA repeated-event ordinal families (#374; spun out of #362.4). LOVA records
