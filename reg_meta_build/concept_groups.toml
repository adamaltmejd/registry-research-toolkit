# LISA "huvudsaklig" näringsgren split (#488). 21 variables ALL named identically
# "Näringsgren för statistiken, huvudsaklig" — the auto edge grouper lumped them
# into ONE family (`ast-sni`), so a browsing user couldn't tell a person's industry
# from a workplace's from a firm's. The disambiguation is the DELIVERY POPULATION:
# astsni*→individ (person), ast-sni*→arbetsställe (workplace), org-sni*→företag
# (firm). Population is therefore the GROUP SPLIT (three groups), NOT a facet axis.
# Within each group the single `edition` axis carries the SNI vintage+granularity
# variant (1992/2002/2007 × b/g/u serie); #584's variable vintage lift will later
# collapse the vintage dimension into succession, leaving granularity on the axis.
# Curated `[[variable_group]]` precedence (#591) claims these 21 FQIDs, dissolving
# the conflated auto edge group.

[[variable_group]]
register = "scb/lisa"
key = "naringsgren-huvudsaklig-individ"
label = "Näringsgren för statistiken, huvudsaklig — individ"
axis = "edition"

