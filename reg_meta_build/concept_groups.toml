key = "bflop"
label = "Åtgärdskod, barnet"
axis = "ordinal"

[[accept]]
register = "scb/energianvandning-fiske"
key = "signal"
label = "Fartygets identitetssnummer"
axis = "ordinal"

# Batch 4 (#496): the MOTHER + PREGNANCY diagnosis/procedure-code families in mfr,
# parallel to the accepted child families (bdiag/bdiag-bk/bflop). These surfaced
# once the generator's agreement metric became number-invariant (#561) — their
# slot number sits mid-label ("Diagnoskod N, den förlösta"), so the old metric
# mis-scored them as batteries. (mfr `apgar` 1/5/10 min is a TIMEPOINT fold, a
# different facet — left for a later, separate consideration.)
[[accept]]
