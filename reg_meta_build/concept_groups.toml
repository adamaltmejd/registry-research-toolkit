delivery_column = "CDISP"
coords = [
  { axis = "enhet", value = "individ", label = "Individ" },
  { axis = "hushallsbegrepp", value = "na", label = "—" },
  { axis = "kapitalvinst", value = "inkl", label = "Inkl. kapitalvinst" },
]

