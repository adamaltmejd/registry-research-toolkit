# Curated concept-group families (#303) — dimension 2 of the derived
# presentation-only concept-group layer (see concept_groups.py). Two entry
# kinds, both folded only when present (opt-in):
#
# 1. [[variable_group]] — a hand-authored family with an exact member list, NO
#    name patterns. Single-axis families use `axis = "<name>"` or
#    `axes = [{ axis = "<name>", label = "<display>" }]`, with each member carrying
#    flat `value`/`label`. Multi-axis families use `axes = [...]` plus per-member
#    `coords = [{ axis, value, label }, ...]`; add `delivery_column` only when the
#    member is representation-grained. Axis-less variable umbrellas are explicit as
#    `axes = []`, with member tables listing only `variable = "<slug>"`.
#
# 2. [[accept]] (#496) — fold a candidate family from the generated, committed
#    concept_groups.auto.toml BY REFERENCE. The `concept-group-candidates`
#    command emits that machine-owned catalog; an auto family folds ONLY when an
#    accept here names it. Schema:
#      register = "<provider>/<register>"  # 2-segment FQID; locates the family
#      key      = "<stem>"                 # the auto family's `key`
#      label    = "<override>"             # optional; defaults to the auto label
#      axis     = "<override>"             # optional; defaults to the auto axis
#      exclude  = ["<slug>", …]            # optional; drop these member slugs
#    >= 2 members must remain after `exclude`. Worked example (do NOT enable
#    until the family is reviewed — kept here as documentation only):
#      # [[accept]]
#      # register = "sos/dors"
#      # key      = "morsak"
#      # axis     = "ordinal"
#
# Both kinds resolve against the built DB at materialize time; a dangling
# reference (or an accept of a family absent from concept_groups.auto.toml, or
# a stale `exclude`) FAILS the build (EXIT_CONFIG) — fix the entry, don't
# ignore it.
#
# Grouping is presentation, not identity: a group is not FQID-addressable and
# never affects bindings/orders/stats. A wrong family here is a cosmetic bug.

# ── Accepted auto families ──────────────────────────────────────────────────
# Batch 1 (#496): SOS multi-instance medical families — the Nth occurrence of ONE
# concept (multiple causes of death, substances, diagnosis/procedure/occupation
# codes), the LOVA repeated-event pattern (#374) folded by an `ordinal` facet.
# Hand-picked from concept_groups.auto.toml against the real corpus: each is
# unambiguously one concept repeated across numbered slots (NOT distinct
# variables like course grades or classification variants). `axis` is pinned so a
# catalog regeneration that re-infers it can't silently change the facet.
[[accept]]
register = "sos/dors"
key = "dodsorsak"
axis = "ordinal"

[[accept]]
