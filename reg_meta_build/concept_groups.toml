# Curated concept-group families (#303) — dimension 2 of the derived
# presentation-only concept-group layer (see concept_groups.py). Two entry
# kinds, both folded only when present (opt-in):
#
# 1. [[variable_group]] — a hand-authored family with an exact member list, NO
#    name patterns: a member either absorbs a derived token group
#    (`group = "<stem>"` — its variables keep their month facets and gain this
#    family's facet) or attaches a single variable (`variable = "<slug>"`).
#
# 2. [[accept]] (#496) — fold a candidate family from the generated, committed
#    concept_groups.auto.toml BY REFERENCE. The `concept-group-candidates`
#    command emits that machine-owned catalog; an auto family folds ONLY when an
#    accept here names it. Schema:
#      register = "<provider>/<register>"  # 2-segment FQID; locates the family
#      key      = "<stem>"                 # the auto family's `key`
#      label    = "<override>"             # optional; defaults to the auto label
#      axis     = "<override>"             # optional; defaults to the auto axis
#      exclude  = ["<slug>", …]            # optional; drop these member slugs
#    >= 2 members must remain after `exclude`. Worked example (do NOT enable
#    until the family is reviewed — kept here as documentation only):
#      # [[accept]]
#      # register = "sos/dors"
#      # key      = "morsak"
#      # axis     = "ordinal"
#
# Both kinds resolve against the built DB at materialize time; a dangling
# reference (or an accept of a family absent from concept_groups.auto.toml, or
# a stale `exclude`) FAILS the build (EXIT_CONFIG) — fix the entry, don't
# ignore it.
#
# Grouping is presentation, not identity: a group is not FQID-addressable and
# never affects bindings/orders/stats. A wrong family here is a cosmetic bug.

# ── Accepted auto families ──────────────────────────────────────────────────
# Batch 1 (#496): SOS multi-instance medical families — the Nth occurrence of ONE
# concept (multiple causes of death, substances, diagnosis/procedure/occupation
# codes), the LOVA repeated-event pattern (#374) folded by an `ordinal` facet.
# Hand-picked from concept_groups.auto.toml against the real corpus: each is
# unambiguously one concept repeated across numbered slots (NOT distinct
# variables like course grades or classification variants). `axis` is pinned so a
# catalog regeneration that re-infers it can't silently change the facet.
[[accept]]
register = "sos/dors"
key = "morsak"
axis = "ordinal"

[[accept]]
register = "sos/dors"
key = "substans"
axis = "ordinal"

[[accept]]
register = "sos/dors"
key = "ro"
label = "Position på intyget av dödsorsaken (per dödsorsak)"
axis = "ordinal"

[[accept]]
register = "sos/par"
key = "opd"
axis = "ordinal"

[[accept]]
register = "sos/par"
key = "ekod"
axis = "ordinal"

[[accept]]
register = "sos/par"
key = "ane"
axis = "ordinal"

[[accept]]
register = "sos/mfr"
key = "bdiag-bk"
axis = "ordinal"

[[accept]]
register = "sos/hsl"
key = "yrkesbet"
axis = "ordinal"

[[accept]]
register = "sos/lmed"
key = "spkod"
axis = "ordinal"

# LISA's AGI monthly-income family: one concept ("Löne- eller
# företagarinkomst i {månad}") × a rank axis (agi1/agi2/agi3 = största / näst
# största / tredje största förvärvskälla). #319 merged each rank's 12 month
# columns into ONE variable (slug agi1lonfink / agi2lonfink / agi3lonfink — the
# family stem), so the per-rank month-token groups no longer derive. The members
# are now plain `variable =` attachments carrying only the rank facet; the
# per-month dimension lives in `variable_alias_window` (read-time via resolve_at),
# not a concept group. The family merge runs BEFORE concept groups, so these
# merged-variable slugs resolve.
[[variable_group]]
register = "scb/lisa"
key = "agilonfink"
label = "Löne- eller företagarinkomst per månad (AGI)"
axis = "rank"

[[variable_group.members]]
variable = "agi1lonfink"
value = "1"
label = "största förvärvskällan"

[[variable_group.members]]
variable = "agi2lonfink"
value = "2"
label = "näst största förvärvskällan"

[[variable_group.members]]
variable = "agi3lonfink"
value = "3"
label = "tredje största förvärvskällan"

# LOVA repeated-event ordinal families (#374; spun out of #362.4). LOVA records
# up to nine immigration/emigration events per person, each as a numbered series.
# The Nth occurrence is a DISTINCT variable — correctly NOT merged (each holds a
# different event) — but the flat 1..9 rows surface as N near-identical browse
# rows. These fold the human-readable date and country series into one
# presentation group each, under an `ordinal` facet. Members are an exact
# hand-listed vocabulary (the standing curation rule forbids regex name-patterns),
# attached as plain `variable =` members because the series carries no month/edge
# token group. Slugs are SOS column names (INVDATUM/INVLAND/UTVDATUM/UTVLAND).
# The parallel NUMERIC date representation (columns INVARN/UTVARN → slugs
# invarn*/utvarn*, "… N numerisk") is folded the same way below, in its own
# invarn/utvarn families (#420).

[[variable_group]]
register = "sos/lova"
key = "invdatum"
label = "Invandringsdatum (per invandringstillfälle)"
axis = "ordinal"

