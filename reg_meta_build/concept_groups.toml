# Curated concept-group families (#303) — dimension 2 of the derived
# presentation-only concept-group layer (see concept_groups.py). Exact member
# lists only, NO name patterns: a member either absorbs a derived token group
# (`group = "<stem>"` — its variables keep their month facets and gain this
# family's facet) or attaches a single variable (`variable = "<slug>"`).
# References resolve against the built DB at materialize time; a dangling
# reference FAILS the build (EXIT_CONFIG) — fix the entry, don't ignore it.
#
# Grouping is presentation, not identity: a group is not FQID-addressable and
# never affects bindings/orders/stats. A wrong family here is a cosmetic bug.

# LISA's AGI monthly-income family: one concept ("Löne- eller
# företagarinkomst i {månad}") × a rank axis (agi1/agi2/agi3 = största / näst
# största / tredje största förvärvskälla). #319 merged each rank's 12 month
# columns into ONE variable (slug agi1lonfink / agi2lonfink / agi3lonfink — the
# family stem), so the per-rank month-token groups no longer derive. The members
# are now plain `variable =` attachments carrying only the rank facet; the
# per-month dimension lives in `variable_alias_window` (read-time via resolve_at),
# not a concept group. The family merge runs BEFORE concept groups, so these
# merged-variable slugs resolve.
[[variable_group]]
register = "scb/lisa"
key = "agilonfink"
label = "Löne- eller företagarinkomst per månad (AGI)"
axis = "rank"

[[variable_group.members]]
variable = "agi1lonfink"
value = "1"
label = "största förvärvskällan"

[[variable_group.members]]
variable = "agi2lonfink"
value = "2"
label = "näst största förvärvskällan"

[[variable_group.members]]
variable = "agi3lonfink"
value = "3"
label = "tredje största förvärvskällan"

# LOVA repeated-event ordinal families (#374; spun out of #362.4). LOVA records
# up to nine immigration/emigration events per person, each as a numbered series.
# The Nth occurrence is a DISTINCT variable — correctly NOT merged (each holds a
# different event) — but the flat 1..9 rows surface as N near-identical browse
# rows. These fold the human-readable date and country series into one
# presentation group each, under an `ordinal` facet. Members are an exact
# hand-listed vocabulary (the standing curation rule forbids regex name-patterns),
# attached as plain `variable =` members because the series carries no month/edge
# token group. Slugs are SOS column names (INVDATUM/INVLAND/UTVDATUM/UTVLAND).
# The parallel NUMERIC date representation (columns INVARN/UTVARN → slugs
# invarn*/utvarn*, "… N numerisk") stays flat — out of scope.

[[variable_group]]
register = "sos/lova"
key = "invdatum"
label = "Invandringsdatum (per invandringstillfälle)"
axis = "ordinal"

[[variable_group.members]]
variable = "invdatum1"
value = "1"
label = "1:a"

[[variable_group.members]]
variable = "invdatum2"
value = "2"
label = "2:a"

[[variable_group.members]]
variable = "invdatum3"
value = "3"
label = "3:e"

[[variable_group.members]]
variable = "invdatum4"
value = "4"
label = "4:e"

[[variable_group.members]]
variable = "invdatum5"
value = "5"
label = "5:e"

[[variable_group.members]]
variable = "invdatum6"
value = "6"
label = "6:e"

[[variable_group.members]]
variable = "invdatum7"
value = "7"
label = "7:e"

[[variable_group.members]]
variable = "invdatum8"
value = "8"
