# Curated variable → classification links (#416 tail) — see
# reg_meta_build/classification_links.py.
#
# The build-time code-set-containment detector
# (`classifications.link_value_set_classifications`) auto-links the CONFIDENT
# tier: value sets whose inline codes unambiguously enumerate ONE classification
# (single-family AND (≥15 distinct codes OR ≥0.90 (code,label) agreement)). The
# residue is the family-ambiguous short numeric sets (SNI / SSYK / SUN coincide
# below ~15 codes) the detector deliberately leaves for a human. THIS file is the
# curated override for that tail.
#
# Each [[link]] entry names a single variable and the classification its inline
# codes belong to:
#
#   variable       = "provider/register/variable"   # 3-segment FQID
#   classification = "<short_name>"                  # a seeded classification
#   note           = "..."                           # optional, provenance
#
# Precedence: a curated link OVERRIDES every auto/feed candidate for the
# variable's value-set state keys (delete-then-insert into
# `classification_candidate`, before the auto detector runs). References resolve
# against the built DB at materialize time; an unresolved FQID or short_name
# FAILS the build (EXIT_CONFIG) — fix the entry, don't ignore it. An entry whose
# provider isn't in the build is SKIPPED (a partial --providers build can't
# represent it). An empty file is a no-op — no links written.
#
# This file SHIPS EMPTY today: the residue curation is a deferred follow-up. The
# example below is commented out — uncomment and adapt to add a real link.

# [[link]]
# variable       = "scb/ulf/ha0611m"   # an ICD-coded ULF health variable
# classification = "ICD-10-SE"
# note           = "curated:#416 family-ambiguous tail"
