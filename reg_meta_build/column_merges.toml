# Column-merge curation (see reg_meta_build/DESIGN.md → Build-time triage (SCB))
# — see reg_meta_build/column_merges.py.
#
# A register sometimes RENAMES a delivery column between eras (`PNR` →
# `PersonNr`): the two headers never co-occur in one edition, so the coalescer's
# rule-2 connectivity sees two components — and once the var_id is a split
# container (other columns DO co-deliver), each component shards into its own
# sibling variable, splitting one identity's history across fragments. The
# maintainer asserts the equivalence here and the coalescer treats the columns
# as ONE union-find node from the start, upstream of triage.
#
# NOT this surface:
#   - case/diacritic twins (`PersonNr`/`Personnr`, `Kon`/`Kön`) — collapsed
#     automatically (the connectivity key is case-folded);
#   - contested same-edition columns (`Ksjusni`/`NG1`) — fold_overrides.toml;
#   - two value-set codings on ONE column in one period — codelivery.toml;
#   - the same column attributed to SEVERAL var_ids (#197) — cross-var_id
#     sharing is unrepresentable here by construction (the key is per-var).
#
# Key: (register_id, var_id) — stable SCB source ids (RegisterId + VarId ==
# variable.provider_key). One [[merge]] is ONE merge group for one
# (register, var); a var with two independent groups gets two [[merge]] entries
# with that same key. Columns are case-folded at load, so TOML casing is
# cosmetic.
#
# The build FAILS (EXIT_CONFIG) on bad curation: a named column never observed
# as a delivery column of the var (typo / stale entry), or a duplicate /
# overlapping group. An empty file is a no-op — connectivity stays exactly as
# the case-folded rule-2 intersection decides.
#
# Every entry below is verified against the raw SCB Registerinformation source:
# the named columns NEVER share a (variant, edition) bucket (so they are not
# fold_overrides material) and carry the SAME role (never merge a subject key
# with a relation column — RTB's personnrmor/personnrsamh CO-occur with
# personnr and correctly stay split siblings).

# ── RTB (reg 2) subject personnummer: era rename `pnr` → `personnr` ──
#    The #196 canonical case: var 57 ("Personnummer") delivered as the legacy
#    `pnr` header in early editions and `personnr` later, never co-occurring.
#    Without the merge the var (a split container via the co-delivered
#    relation-pnr columns) shards the subject key into a sparse legacy `pnr`
#    fragment + the well-materialized `personnr` — and the A4.4d panel keys
#    ended up pinned to the sparse fragment.
[[merge]]
register_id = 2
var_id = 57
columns = ["pnr", "personnr"]

# ── FRIDA (reg 121) firm key: era rename `borgnr` → `persorgnr` → `borgnr` ──
#    var 56 ("Person-/organisationsnummer"): the Punktskatter variant delivers
#    the firm key as `persorgnr` for 2014-2017, exactly filling the gap in
#    `borgnr`'s 2007-2023 coverage there; the two never co-occur. The variant's
#    OTHER var-56 columns are different ROLES and stay split: `bpnr` (the
#    person-side key) and `borgnr_bolag` (N3B's referenced partnership) both
#    CO-occur with `borgnr`. See #197 for the full FRIDA borgnr resolution.
[[merge]]
register_id = 121
var_id = 56
columns = ["borgnr", "persorgnr"]
