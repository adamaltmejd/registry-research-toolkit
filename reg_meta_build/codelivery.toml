# Co-delivery curation (§5.7) — see reg_meta_build/codelivery.py.
#
# When ONE delivery column carries TWO distinct value-set codings in the same
# period and the SCB coalescer's deterministic cascade (sources/scb.py) cannot
# resolve it, the build FAILS. Each entry below pins which coding the column
# KEEPS. The cascade already handles the RECURRING families (preliminär/final,
# sub-annual HT/VT and dated snapshots, calendar vs academic year); only genuine
# ONE-OFF re-codings land here.
#
# Key: (register_id, var_id, column) — stable SCB source ids + the delivery
# column. `column = ""` for a code-bearing variable with no delivery alias.
# Two label sources, by design: `keep` is matched (stripped) against the EMITTED
# label — what lands in `variable_state`, the label you see when drafting a pin —
# because a §5.7 fold/collapse can relabel the raw source label; `keep_rule =
# "latest_year"` instead reads the 4-digit year out of the RAW source
# `value_set_version_label`. A pin that resolves no SURVIVING coding leaves the
# column GENUINE, which FAILS the build: the coalescer raises before shipping any
# state (--validate re-checks as a redundant backstop). So a build that completes
# is proof every pin here still matches a live coding.
#
# REVIEWED (phase 2 sign-off): the picks below were maintainer defaults (fuller /
# newer / contemporaneous coding); each has now been checked against the backing
# SCB codings (codes, sizes, sub/superset, classification vintage). One case —
# UpplForm (reg32) — is FLAGGED as a §5.7 SPLIT candidate rather than a genuine
# re-coding; its pin is a lossless interim until the split lands (see its note).

# ── branschgrupp (SNI92 vs SNI2007): keep the standard CONTEMPORANEOUS to the
#    period. The two codings reuse the same integer codes for DIFFERENT industries
#    (code 100 = "Kolgruvor" in SNI92 vs "Livsmedelsframställning" in SNI2007), so
#    a period's delivered codes only mean one thing under its own vintage. Keeping
#    Br07 throughout would MISLABEL the 1998–1999 data — SNI2007 did not exist
#    before 2008. Cross-vintage comparison is a downstream SNI92↔SNI2007 crosswalk,
#    not a catalog relabel. (reg187 and reg382 are separate registers/columns, not
#    one continuous time series.)
[[resolve]]                       # SNI92 vs SNI2007 — contemporaneous (confirmed)
register_id = 187
var_id = 3310
column = "AL2UndEjU"
keep = "Br92-kod"
note = "Konjunkturstatistik AL2UndEjU 1998-1999: SNI92 (Br92, 53 codes) is contemporaneous; SNI2007 did not exist yet."

[[resolve]]                       # SNI92 vs SNI2007 — contemporaneous (confirmed)
register_id = 382
var_id = 3310
column = "AL2UndEjU"
keep = "Br07-kod"
note = "Produktion inom näringslivet AL2UndEjU 2009-2010: SNI2007 (Br07, 45 codes) is the operative standard by 2009."

