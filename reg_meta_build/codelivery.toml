note = "FoU ID_INST 2023: 'Universitet/högskolor' (129) over 'Högskolekod 2017' (41)."

# ── distance-school unit register: RECURRING yearly '15 oktober YYYY' snapshots
#    (codes are school-unit ids; the value SET is a dated register capture). Keep
#    the latest snapshot per year. keep_rule, not a one-off pin. ──
[[resolve]]
register_id = 366
var_id = 45133
column = "skolenhetskod"
keep_rule = "latest_year"
note = "skolenhetskod distans: latest '15 oktober YYYY' register snapshot per year."
