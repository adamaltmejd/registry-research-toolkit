register_id = 32
var_id = 4472
column = "UpplForm"
keep = "UpplFormFoB75Lgh"
note = "FoB75 UpplForm 1975: dwelling coding (12 codes) over household (5)."

# ── SUN2020 utbildningsinriktning (classification id=8): the two 4-pos codings
#    differ by exactly one code, the '----' missing-value placeholder. Keep the
#    canonical SUN2020 coding ('4pos', 377) — '----' is a data missing-marker, not
#    a SUN2020 category. ──
[[resolve]]
register_id = 24
var_id = 65
column = "SUN2020Inr"
keep = "4pos"
note = "SUN2020Inr classification: '4pos' (377, canonical) over '4pos-1' (378, adds '----')."

