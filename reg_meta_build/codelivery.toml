# Co-delivery curation (§5.7) — see reg_meta_build/codelivery.py.
#
# When ONE delivery column carries TWO distinct value-set codings in the same
# period and the SCB coalescer's deterministic cascade (sources/scb.py) cannot
# resolve it, build-db --validate FAILS. Each entry below pins which coding the
# column KEEPS, by its `value_set_version_label` (matched stripped). The cascade
# already handles the RECURRING families (preliminär/final, sub-annual HT/VT and
# dated snapshots, calendar vs academic year); only genuine ONE-OFF re-codings
# land here.
#
# Key: (register_id, var_id, column) — stable SCB source ids + the delivery
# column. `column = ""` for a code-bearing variable with no delivery alias.
# A `keep` that matches no surviving coding raises `codelivery_pin_stale`.
#
# DRAFT — proposed picks default to the fuller / newer / contemporaneous coding;
# entries marked REVIEW are domain judgment calls awaiting maintainer sign-off.

# ── branschgrupp (SNI92 vs SNI2007) — pick the standard contemporaneous to the
#    period: Br92 (SNI92) for the 1998–1999 window, Br07 (SNI2007) for 2009–2010.
[[resolve]]                       # REVIEW: SNI92 vs SNI2007 vintage choice
register_id = 187
var_id = 3310
column = "AL2UndEjU"
keep = "Br92-kod"
note = "Konjunkturstatistik, AL2UndEjU 1998-1999: SNI92 is contemporaneous."

[[resolve]]                       # REVIEW: SNI92 vs SNI2007 vintage choice
register_id = 382
var_id = 3310
column = "AL2UndEjU"
keep = "Br07-kod"
note = "Produktion inom näringslivet, AL2UndEjU 2009-2010: SNI2007 is contemporaneous."

