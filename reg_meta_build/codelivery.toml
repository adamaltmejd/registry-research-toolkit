# ── komvux SFI school codes: RECURRING per-year vintages (SFI 1999/2000/2001/
#    2002/2004 + the all-school-forms set 't.o.m. maj 2013'), a different label
#    pair every year — one `keep` can't cover it. keep_rule keeps, per year, the
#    coding whose label embeds the latest year (latest SFI vintage; the
#    all-school-forms 2013 set where it overlaps). The few intra-year ties
#    (e.g. 2012/2013 SFI pairs) are broken upstream by recency / cosmetic-drift,
#    so the build resolves green. ──
[[resolve]]
register_id = 248
var_id = 104
column = "Skolkod"
keep_rule = "latest_year"
note = "Komvux SFI Skolkod: latest-vintage SFI / all-school-forms coding per year."

# ── FoB75 tenure form — FLAGGED: SPLIT candidate, not a one-off re-coding ──
#    'UpplFormFoB75Hh' (household, 5 codes) and 'UpplFormFoB75Lgh' (dwelling, 12)
#    share the four tenure codes (0 äger / 1 bostadsrätt / 3 hyres / 4 annat) but
#    differ in UNIT and UNIVERSE: the dwelling coding adds occupancy states (5–9:
#    under reparation, ledig till uthyrning, disponeras av fastighetsägaren,
#    utrymd inför rivning, upplåten utan mantalsskriven boende) that have NO
#    household analogue — an empty dwelling has no household. FoB75 tabulated
#    tenure for BOTH hushåll and bostadslägenheter; these are two concepts. The
#    correct fix is a §5.7 SPLIT into sibling variables (household tenure /
#    dwelling tenure+occupancy), a build change out of scope for this TOML. Until
#    then keep the Lgh superset as a LOSSLESS interim (it contains all four
#    household tenure codes), so --validate stays green. MAINTAINER: split, then
#    drop this pin.
[[resolve]]                       # FLAGGED: split candidate (interim pin keeps superset)
register_id = 32
var_id = 4472
column = "UpplForm"
keep = "UpplFormFoB75Lgh"
note = "FoB75 UpplForm 1975: interim — keep dwelling coding (12, superset of household's 5). SPLIT candidate: Hh vs Lgh are distinct units/universes (see comment); recommend splitting into sibling variables rather than pinning."

