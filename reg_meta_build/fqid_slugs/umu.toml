# Curated FQID slugs for Umeå universitet / högskoleprovet (#443).
#
# Same grammar as pliktverket/riksarkivet.toml. TOML keys are minted ids —
# mint("umu", <reg_key>) / mint(..., "_default"). Single-table provresultat
# register → synthesized _default variant. Panel: entity = personnummer, time =
# tillfalle (provtillfälle YYYYA/YYYYB — occasion-level, since a participant may sit
# more than one test in a year), grain = row. Variable slugs stay AUTO. Regenerate
# .snapshot.json after edits:  reg-meta-build precheck-slugs --update-snapshot


# Högskoleprovet (provresultat)
[register."5444831050852607094"]
slug = "hogskoleprovet"

[register_variant."5444831050852607094.5876203108261893022"]
slug = "_default"
display_group = "Högskoleprovet (provresultat)"
panel_entity_key = "lopnr-personnr"
panel_time_key = "tillfalle"
panel_time_grain = "row"


# GENERATED entity-key slug pins — reg-meta-build entity-key-pins (#546, #554).
#
# A panel_entity_key ref binds to a variable.slug, which CHURNS every build
# (the default freeze zone re-derives it). These pins freeze the slug each
# entity-key ref depends on so a reslug can't dangle the ref. The build-side
# curation gate (validate._check_entity_key_vars_curated) makes the pin
# MANDATORY — a new entity-key variable can't ship un-pinned. Scope: ALL
# global providers (#554).
#
# Regenerate after onboarding/repointing a panel: run
#   reg-meta-build --db <built-db> entity-key-pins --out-dir /tmp/pins/
# and fold the NON-duplicate entries from each /tmp/pins/<provider>.toml
# into fqid_slugs/<provider>.toml. dbdiff-identical (slug values only —
# pins reproduce the slug the variable already carries).
# 1 pin(s).

[variable."5444831050852607094.Personnummer"]  # hogskoleprovet: panel_entity_key = 'lopnr-personnr'
slug = "lopnr-personnr"

