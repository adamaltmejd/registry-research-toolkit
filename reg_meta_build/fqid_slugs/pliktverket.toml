# Companion to fohm.toml / fk.toml / lakemedelsverket.toml; same grammar. TOML
# keys are the minted ids — mint("pliktverket", <reg_key>) for the register (each
# is single-table → synthesized `_default` variant). Panel keys: entity = penr
# (personnummer), time = the mönstrings-/prov-/diagnos-datum, grain = row.
# Variable slugs stay AUTO. Regenerate .snapshot.json after edits:
#   reg-meta-build precheck-slugs --update-snapshot


