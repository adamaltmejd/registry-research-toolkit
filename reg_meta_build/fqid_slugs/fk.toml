# Curated FQID slugs for Försäkringskassan (FK) registers (#422, phase 2).
#
# Companion to scb.toml / sos.toml / fohm.toml; same grammar/shape (see
# reg_meta/DESIGN.md → FQID grammar and reg_meta_build/DESIGN.md → Slug
# curation). TOML keys are the minted FK ids — mint("fk", <reg_key>) for a
# register, mint("fk", <reg_key>, <variant_key>) for a variant (the
# synthesized single-table register uses mint("fk", <reg_key>, "_default")).
# FK registers carry no SCB RegisterId, so the minted id IS the source id
# populate_slugs looks up. The register slug equals the register key; the
# variant slug equals the variant key (or `_default`). Variable slugs stay
# AUTO (populate_variable_slugs -> fk.auto.toml, transient/not committed),
# derived from each variable's clean column (underscores fold to hyphens,
# e.g. `Del_from_datum` -> `del-from-datum`). Panel keys: entity = the
# variant's primary person/child/org-id column slug; time = a date column
# (delfall/fall start, betalnings-/besluts-/besöksdatum) or the monthly
# payment label; grain = row. Regenerate .snapshot.json after edits:
#   reg-meta-build precheck-slugs --update-snapshot


