# Curated FQID slugs for Riksarkivet (#443).
#
# Companion to pliktverket.toml (the modern mönstring half); same grammar.
# TOML keys are minted ids — mint("riksarkivet", <reg_key>) / mint(..., "_default").
# Single-table historical inskrivningsregister → synthesized _default variant.
# Panel: entity = penr, time = bari (år för inskrivning — a clean year-grain temporal
# axis; inst/inställelsedatum encodes date+omgång together, less suitable as the panel
# key), grain = row. Variable
# slugs stay AUTO. Regenerate .snapshot.json after edits:
#   reg-meta-build precheck-slugs --update-snapshot


# Inskrivningsregister (mönstring)
[register."7217173874749089767"]
slug = "inskrivning"

[register_variant."7217173874749089767.4861471296827173126"]
slug = "_default"
display_group = "Inskrivningsregister (mönstring)"
panel_entity_key = "personnr"
panel_time_key = "ar-for-inskrivning"
panel_time_grain = "row"


# GENERATED entity-key slug pins — reg-meta-build entity-key-pins (#546, #554).
#
# A panel_entity_key ref binds to a variable.slug, which CHURNS every build
# (the default freeze zone re-derives it). These pins freeze the slug each
# entity-key ref depends on so a reslug can't dangle the ref. The build-side
# curation gate (validate._check_entity_key_vars_curated) makes the pin
# MANDATORY — a new entity-key variable can't ship un-pinned. Scope: ALL
# global providers (#554).
#
# Regenerate after onboarding/repointing a panel: run
#   reg-meta-build --db <built-db> entity-key-pins --out-dir /tmp/pins/
# and fold the NON-duplicate entries from each /tmp/pins/<provider>.toml
# into fqid_slugs/<provider>.toml. dbdiff-identical (slug values only —
# pins reproduce the slug the variable already carries).
# 1 pin(s).

[variable."7217173874749089767.PENR"]  # inskrivning: panel_entity_key = 'personnr'
slug = "personnr"

