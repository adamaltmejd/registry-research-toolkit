# Curated FQID slugs for Skatteverket registers (#443).
#
# Companion to fohm/fk/lakemedelsverket/pliktverket.toml; same grammar. TOML
# keys are the minted ids — mint("skatteverket", <reg_key>) for the register,
# mint("skatteverket", <reg_key>, <variant_key>) for each variant. Panel keys:
# entity = persorgnr; time = the per-stage event date (or YYYYMM redovisnings-
# period); grain = row. The annual egenavgift snapshot has no time column
# (entity-only cross-section). Variable slugs stay AUTO. Regenerate
# .snapshot.json after edits:  reg-meta-build precheck-slugs --update-snapshot


