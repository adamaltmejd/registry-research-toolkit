# #526 curation: var 57 "Personnummer" is a genuine #143 drifter (delivery column
# renamed PersonNr→PNR). Its `personnr` slug was only stable because its name
# "Personnummer" COLLIDED with a sibling whose drift was spurious case-wobble
# (PersonNrSamh/PersonNrsamh) that #526's value-set fold correctly collapses —
# the collision routed both to their earliest column. Without it the auto-slug
# flips to the name basis `personnummer`, dangling every RTB variant's
# `panel_entity_key = "personnr"`. Pin it (split-sibling key: earliest column
