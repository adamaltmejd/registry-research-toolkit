# Curated FQID slugs for classifications (provider-independent —
# see reg_meta/DESIGN.md → FQID grammar on the `class/<slug>` namespace).
#
# Uniqueness is by slug alone: the vintage is baked into the
# slug, so the FQID is the 2-segment `class/<slug>` (e.g. `class/sun2020`,
# `class/lkf2007`) — there is no separate version segment. Each year of a
# yearly family is its own slug, e.g. `lkf1980` … `lkf2026`.
#
# A same_as edge (none today) must name the version-baked slug in its
# `classification_slug` target (e.g. `sun2020`, not `sun`).
#
# Notable family structure: SUN is asymmetric across the 2000 redesign
# (LISA `_methodology-education.md` §3; aligned SUN 2000 to ISCED 97).
#   `sun1996`        — monolithic, one nested code space (5-digit leaves,
#                      3- and 2-char aggregations under the same hierarchy).
#                      Pre-redesign delivery shape.
#   `sun-niva{2000,2020}`        — 3-digit numeric levels (independent code space).
#   `sun-grupp{2000,2020}`       — 3-char alphanumeric groups (independent code space).
#   `sun-inriktning{2000,2020}`  — variable-length specialization codes (independent).
# The three 2000+ siblings are **parallel classifications**, not levels of
# one hierarchy — `03A` (grupp) and `100` (niva) don't relate as parent/child.
# `niva-oldv1` / `niva-grovv1` are SCB aggregations introduced alongside
# SUN2000 to bridge old-SUN level comparability (placeholder `v1` vintage).

