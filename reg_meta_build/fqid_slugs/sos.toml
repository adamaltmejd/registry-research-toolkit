# Curated FQID slugs for Socialstyrelsen (SOS) registers (A4.4b).
#
# Companion to scb.toml; same grammar/shape (see reg_meta/DESIGN.md → FQID grammar and reg_meta_build/DESIGN.md → Slug curation). The
# TOML keys are the minted SOS ids (mint("sos", <abbrev>[, <variant-name>]),
# band [2^62, 2^63)), NOT SCB's low source ids — SOS registers carry no SCB
# RegisterId, so the minted id IS the source id populate_slugs looks up.
#
# Register slug = the 3-letter SOS abbrev (_sos_abbrev(reg): the
# parenthesized code in the workbook filename, lowercased). Variant slug =
# the deldatamängd name kebab-cased via derive_variable_slug. The synthesized
# default variant of variant-less registers (LSS, BU) takes slug `_default` —
# the project-wide default-variant sentinel (`validate_slug(..., allow_default=
# True)` permits it for register_variant only; the runtime resolver looks it up
# exactly). Variant slugs are browse coordinates, not FQID segments.
#
# Variable slugs stay AUTO (populate_variable_slugs -> sos.auto.toml,
# transient/not committed). Regenerate .snapshot.json after edits:
#   reg-meta-build precheck-slugs --update-snapshot

