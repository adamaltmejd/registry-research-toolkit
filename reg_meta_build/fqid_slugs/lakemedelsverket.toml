# Curated FQID slugs for Läkemedelsverket (LV) registers (#443).
#
# Companion to scb.toml / sos.toml / fohm.toml / fk.toml; same grammar (see
# reg_meta_build/DESIGN.md → Slug curation). TOML keys are the minted LV ids —
# mint("lakemedelsverket", <reg_key>) for the register, mint(..., <variant_key>)
# for each variant. The biverkningar register has two delivered tables modeled as
# variants (handlagda / arbetsflode). Panel keys: entity = the report löpnummer
# (seqrpt, always present — IdNumber/personnummer is often missing), time = the
# first-received date, grain = row. Variable slugs stay AUTO
# (lakemedelsverket.auto.toml). Regenerate .snapshot.json after edits:
#   reg-meta-build precheck-slugs --update-snapshot


# Misstänkta läkemedelsbiverkningar
[register."7228002101699435108"]
slug = "biverkningar"

[register_variant."7228002101699435108.7807483842367253820"]
slug = "handlagda"
display_group = "Misstänkta läkemedelsbiverkningar"
panel_entity_key = "seqrpt"
panel_time_key = "initreceivedate"
panel_time_grain = "row"

[register_variant."7228002101699435108.7812619579915107644"]
slug = "arbetsflode"
display_group = "Misstänkta läkemedelsbiverkningar"
panel_entity_key = "seqrpt"
panel_time_key = "initreceivedate"
panel_time_grain = "row"


# GENERATED entity-key slug pins — reg-meta-build entity-key-pins (#546, #554).
#
# A panel_entity_key ref binds to a variable.slug, which CHURNS every build
# (the default freeze zone re-derives it). These pins freeze the slug each
# entity-key ref depends on so a reslug can't dangle the ref. The build-side
# curation gate (validate._check_entity_key_vars_curated) makes the pin
# MANDATORY — a new entity-key variable can't ship un-pinned. Scope: ALL
# global providers (#554).
#
# Regenerate after onboarding/repointing a panel: run
#   reg-meta-build --db <built-db> entity-key-pins --out-dir /tmp/pins/
# and fold the NON-duplicate entries from each /tmp/pins/<provider>.toml
# into fqid_slugs/<provider>.toml. dbdiff-identical (slug values only —
# pins reproduce the slug the variable already carries).
# 1 pin(s).

[variable."7228002101699435108.SeqRpt"]  # biverkningar: panel_entity_key = 'seqrpt'
slug = "seqrpt"

