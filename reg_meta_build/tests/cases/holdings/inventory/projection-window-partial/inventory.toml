version = 1
steward = "swecov"

# A windowed column the parent only partly covers (#1645, #1634). Wide delivers
# Field for 2015..2016; Narrow's FieldA claims 2015..2017, so Wide serves only part
# of it and the overlap is Narrow's own claim on Wide's cell. FieldB (2018..2019)
# lies outside Wide's window and is Narrow's own cell, so it is admitted.
[[table]]
id = "Narrow"
edition = { from = 2015, to = 2019 }
projection = { of = "Wide", token = "narrow" }
[[table.column]]
name = "FieldA"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/field"
representation = "Field"
window = { from = 2015, to = 2017 }
[[table.column]]
name = "FieldB"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/field"
representation = "Field"
window = { from = 2018, to = 2019 }
[[table.column]]
name = "Id"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/id"
representation = "Id"

[[table]]
id = "Wide"
edition = { from = 2015, to = 2019 }
[[table.column]]
name = "Field"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/field"
representation = "Field"
window = { from = 2015, to = 2016 }
[[table.column]]
name = "Id"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/id"
representation = "Id"
