representation = "DIA"
member = { position = 1 }
[[table.column]]
name = "DIA2"
[[table.column.mapping]]
register_variant = "sos/par/sluten"
variable = "sos/par/diagnos"
representation = "DIA"
member = { position = 2 }
[[table.column]]
name = "DIA"
[[table.column.mapping]]
