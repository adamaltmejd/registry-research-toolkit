[register]
provider = "scb"
slug = "foretag"
native_id = "6"

# A curated group that claims one member of the dodsorsak1/2/3 family.
[[group]]
register = "scb/foretag"
key = "dodsorsak-forsta"
label = "Underliggande dödsorsak"
axis = "ordinal"
members = [{ variable = "dodsorsak1", value = "1", label = "kod" }, { variable = "dodsorsak-text", value = "2", label = "text" }]

# An accepted auto family: artal-person-1/2/3 (raw stem `artal-person-`), keyed on
# its trimmed stem, which the later peer artal-person4/5/6 also trims to.
[[group]]
register = "scb/foretag"
key = "artal-person"
label = "Antal år som person"
axis = "ordinal"
members = [{ variable = "artal-person-1", value = "1", label = "1" }, { variable = "artal-person-2", value = "2", label = "2" }, { variable = "artal-person-3", value = "3", label = "3" }]

# An accepted family that no longer folds: foo4/5/6 (raw stem `foo`) are named
# Apples, Oranges and Cars, a battery; the peer foo-1/2/3 still folds to `foo`.
[[group]]
register = "scb/foretag"
key = "foo"
label = "Frukt och bilar"
axis = "ordinal"
members = [{ variable = "foo4", value = "4", label = "4" }, { variable = "foo5", value = "5", label = "5" }, { variable = "foo6", value = "6", label = "6" }]

[[variant]]
native_id = "6.60"
slug = "foretag"

[[variant]]
