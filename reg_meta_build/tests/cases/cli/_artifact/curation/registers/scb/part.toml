[register]
provider = "scb"
slug = "part"
native_id = "4"

[[variant]]
native_id = "4.40"
slug = "people"
panel_entity_key = "lopnr"

[variable]
"4.5.first" = "first"
"4.5.second" = "second"

# The entity-key variable is a partition member whose slug is not its native id's
# discriminator.
"4.7.lopnrny" = "lopnr"
"4.7.konx" = "kon"

# Slugs that suffix the key of the `first` edge group.
"4.41" = "first1"
"4.42" = "first2"

[[identity.partition]]
variable = "4.5"
columns = { FIRST = "4.5.first", SECOND = "4.5.second" }
columns_ref = "fixture"

[[identity.partition]]
variable = "4.7"
columns = { LOPNRNY = "4.7.lopnrny", KONX = "4.7.konx" }
columns_ref = "fixture"
