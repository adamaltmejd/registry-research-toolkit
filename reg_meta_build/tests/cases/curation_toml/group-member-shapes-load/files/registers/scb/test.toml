[[group]]
register = "scb/test"
key = "umbrella"
label = "Umbrella"
members = [{ variable = "a" }, { variable = "b" }]

[[group]]
register = "scb/test"
key = "years"
label = "Years"
axis = "year"
[[group.members]]
variable = "c"
value = "1"
label = "One"
[[group.members]]
variable = "d"
value = "2"
label = "Two"

[[group]]
