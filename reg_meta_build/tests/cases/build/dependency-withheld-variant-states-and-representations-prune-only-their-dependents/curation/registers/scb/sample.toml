[register]
provider = "scb"
slug = "sample"
native_id = "1"
[[variant]]
native_id = "1.10"
slug = "people"
panel_entity_key = "value"
panel_time_key = "period"
panel_time_grain = "delivery"
[[variant]]
native_id = "1.20"
slug = "others"
panel_entity_key = "value"
panel_time_key = "period"
panel_time_grain = "delivery"

[variable]
"1.101" = "value"
"1.102" = "omit"
"1.103" = "untyped"
"1.104" = "par"

[[identity.partition]]
variable = "1.104"
columns = { PAR_A = "1.104", PAR_B = "1.104" }
columns_ref = "reviewed shared identity"
[[group]]
register = "scb/sample"
key = "columns"
label = "Columns"
axes = [{ axis = "column", label = "Column" }]
members = [{ variable = "value", delivery_column = "VALUE", coords = [{ axis = "column", value = "c", label = "Column" }] }, { variable = "par", delivery_column = "PAR_A", coords = [{ axis = "column", value = "c", label = "Column" }] }, { variable = "par", delivery_column = "PAR_B", coords = [{ axis = "column", value = "c", label = "Column" }] }]
