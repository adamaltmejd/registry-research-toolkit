[register]
provider = "scb"
slug = "sample"
native_id = "1"
[[variant]]
native_id = "1.10"
slug = "people"
[[variant]]
native_id = "1.11"
slug = "movers"
[[variant]]
native_id = "1.12"
slug = "workers"
[[variant]]
native_id = "1.13"
slug = "described"

[variable]
# 5: an unassigned family withholds its declared native naming.
"1.5" = "quantity"

# 6: a declared unassigned literal keeps the native family.
"1.6.owned" = "owned"

# 7: an implicit suffix binds KEPT; `unknown` matches no literal.
"1.7.kept" = "kept"
"1.7.unknown" = "unknown"

# 9: one edition-scoped owner names an absent edition (column_owner 1, 2).
"1.9.old" = "old"
"1.9.new" = "new"

# 10: two edition-scoped owners claim one edition (column_owner 3, 4).
"1.10.former" = "former"
"1.10.latter" = "latter"

# 11, 12: digest-only owner alternatives (column_owner 5, 6).
"1.11.removed" = "removed"
"1.12.added" = "added"

# 14: an exact scoped owner takes one PP_ID occurrence (column_owner 7).
"1.14.other" = "other"
"1.14.supported" = "supported"

# 15-17: guarded stored text roles (coding.uncoded 1, 2) and an ordinary entry (3).
"1.15" = "text-a"
"1.16" = "text-b"
"1.17" = "text-c"

# 18: descriptions of two partition owners of one record.
"1.18.a" = "a"
"1.18.b" = "b"

# 19: a description beside a sibling column's source description on one record.
"1.19.c" = "c"
"1.19.d" = "d"

# 13, 20, 21: digest-only owners (column_owner 8-10) whose own original changes a
# field (13) or a parent fact (20), or stays unchanged (21).
"1.13.field" = "field-owner"
"1.20.parent" = "parent-owner"
"1.21.kept" = "kept-owner"

# 22, 23: guarded stored text roles (coding.uncoded 4, 5) whose original's parent
# fact changes (22) or that stays unchanged (23).
"1.22" = "text-d"
"1.23" = "text-e"

[[identity.unassigned]]
variable = "1.5"
expected_evidence_sha256 = {{evidence_sha256 variable=5}}
evidence = "complete source review: no supported owner"
[[identity.partition]]
variable = "1.6"
columns = { PA_OWNED = "1.6.owned" }
unassigned_columns = ["PA_LEFT"]
columns_ref = "fixture map"

# 8: a partition map whose owner has no split naming.
[[identity.partition]]
variable = "1.8"
columns = { MAP_ONE = "1.8.one" }
unassigned_columns = ["MAP_LEFT"]
columns_ref = "fixture map"
