# 5: an unassigned family withholds its declared native naming.
[[variable]]
native_id = "1.5"
slug = "quantity"
[[identity.unassigned]]
variable = "1.5"
expected_evidence_sha256 = {{evidence_sha256 variable=5}}
evidence = "complete source review: no supported owner"

# 6: a declared unassigned literal keeps the native family.
[[variable]]
native_id = "1.6.owned"
slug = "owned"
[[identity.partition]]
variable = "1.6"
columns = { PA_OWNED = "1.6.owned" }
unassigned_columns = ["PA_LEFT"]
columns_ref = "fixture map"

# 7: an implicit suffix binds KEPT; `unknown` matches no literal.
[[variable]]
native_id = "1.7.kept"
slug = "kept"
[[variable]]
native_id = "1.7.unknown"
slug = "unknown"

# 8: a partition map whose owner has no split naming.
[[identity.partition]]
variable = "1.8"
columns = { MAP_ONE = "1.8.one" }
unassigned_columns = ["MAP_LEFT"]
columns_ref = "fixture map"

