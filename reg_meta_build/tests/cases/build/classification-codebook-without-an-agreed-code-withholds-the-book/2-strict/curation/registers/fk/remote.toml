[register]
provider = "fk"
slug = "remote"
native_id = {{naming_id kind=register provider=fk register_key=remote}}
[[variant]]
slug = "default"
native_id = {{naming_id kind=register_variant provider=fk register_key=remote member_key=_default}}

[variable]
{{naming_id kind=variable provider=fk register_key=remote member_key=AMOUNT}} = "amount"
{{naming_id kind=variable provider=fk register_key=remote member_key=SCORE}} = "score"
{{naming_id kind=variable provider=fk register_key=remote member_key=FAMILY}} = "family"
