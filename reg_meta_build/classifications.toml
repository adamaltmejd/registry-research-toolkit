# ===========================================================================
# Socialstyrelsen (SOS) code systems — provider = "sos" gated
# ===========================================================================
# Health / social-services code systems delivered with SOS register data. They
# have canonical code CSVs (under input_data/classifications/sos/) but no SCB
# `vardemangdsversion` instance labels, so they tag no variable instances —
# they seed only the canonical codes. PR2 wires SOS variable → classification
# linkage; the short_names below are stable identifiers that linkage depends on.
# These are always seeded (their canonical codes from the CSVs above); the
# `provider` tag is only their label-source, so in an SCB-only build they simply
# tag no SCB value-set instances — it no longer gates whether they are seeded.

[[classification]]
short_name = "ATC"
name = "Anatomisk Terapeutisk Kemisk klassifikation (ATC)"
name_en = "Anatomical Therapeutic Chemical classification (ATC)"
publisher = "Läkemedelsverket"
provider = "sos"
url = "https://nsl.mpa.se/sensl-v2.0.zip"
valid_codes_file = "sos/atc.csv"

[[classification]]
short_name = "ICD-10-SE"
name = "Internationell statistisk klassifikation av sjukdomar och relaterade hälsoproblem, svensk version (ICD-10-SE)"
name_en = "International Statistical Classification of Diseases, Swedish version (ICD-10-SE)"
publisher = "Socialstyrelsen"
provider = "sos"
valid_from = 1997
url = "https://samarbetsyta.ehalsomyndigheten.se/download/attachments/451267009/icd-10-se.tsv?version=1&modificationDate=1779615619577&api=v2"
valid_codes_file = "sos/icd-10-se.csv"

# KVÅ is published upstream as two disjoint code spaces — KMÅ (medical) and
# KKÅ (surgical) — but SOS registers reference it as ONE åtgärd field mixing
# both. Merged into a single classification (kva.csv = KMÅ ∪ KKÅ). The ~50
# 1–2-character codes that appear in both TSVs are organizational chapter/section
# headers (e.g. KMÅ "A" = "Utredning, anatomiskt perspektiv"; KKÅ "A" =
# "Operationer på nervsystemet") — cross-space collisions, not shared semantics.
# These headers are never leaf åtgärd codes referenced by registers, so keeping
# the KMÅ label on collisions is a cosmetic choice; all disjoint 5-char leaf
# codes are preserved with correct labels. See
# scripts/fetch_sos_classifications.py for the upstream fetch+merge.
[[classification]]
short_name = "KVA"
name = "Klassifikation av vårdåtgärder (KVÅ)"
name_en = "Swedish Classification of Health Interventions (KVÅ)"
