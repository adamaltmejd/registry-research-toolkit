# Classification seed for reg_meta.
#
# Each [[classification]] entry declares one normalized code system
# (SUN2000, SSYK2012, SNI2007, ...) and lists the raw
# `variable_instance.vardemangdsversion` strings that map to it.
#
# Matching is exact string equality against variable_instance rows during
# `reg-meta-build build-db`. Trailing / leading whitespace is preserved
# verbatim — SCB's export contains many labels with stray whitespace, and
# `get values` already exposes the raw string. Keep what you see here.
#
# Optional `valid_codes_file` points to a CSV under
# reg_meta_build/input_data/classifications/ that lists the canonical (officially
# published) codes for the classification. CSV-backed classifications insert
# only those canonical rows into `classification_code` (`is_valid=1`). Codes
# that appear in the CSV but never in observed data are still inserted as
# canonical-but-unobserved (queryable, no `value_set_member` linkage). Observed
# non-canonical codes are recorded per affected state in the conformance tables
# instead of being mixed into the canonical classification list.
# Without the field, all codes for the classification carry `is_valid=NULL`
# (validity unknown).
#
# Classification succession (which edition supersedes which) is NOT declared
# here. It lives in `classification_replaced_by` — auto year-tail edition chains
# (`derive_classification_succession`) plus curated cross-stem edges in
# `curation/relations.toml` (`type = "replaced_by"`, `class/<slug>`). The
# `classification.supersedes_id` column is a DERIVED back-pointer projected from
# that edge table at build time (`derive_supersedes_from_edges`); the seed sets
# no succession.
#
# Build-time invariants (violations fail the build loudly):
#   - Every classification must resolve to >= 1 distinct value code
#   - A given `vardemangdsversion` string may belong to at most one classification
#   - Every `valid_codes_file` must resolve to an existing CSV whose first two
#     columns are `vardekod,vardebenamning` or `code,label`, with >= 1 row
#
# `provider` declares the label-source — which provider's
# `variable_instance.value_set_version_label` strings carry the classification.
# Untagged entries are implicitly SCB-sourced. Classifications are shared standards:
# e.g. `ICD-10-SE`/`ATC` are tagged `provider="sos"` but referenced via curated
# `classification=` links by FOHM, FK, Läkemedelsverket, and Pliktverket. A
# provider-tagged entry is seeded when its tag-provider is built OR a built provider
# references it via a curated link; it is skipped only when neither holds. Untagged
# entries are always seeded (#597).
#
# `vardemangdsversion` is OPTIONAL. When listed, drift checking is per-classification
# on label-source: an unmatched string is a hard error when the classification's
# label-source provider is built (or the classification is mixed: >=1 matched,
# >=1 unmatched). It is demoted to a progress note only when the label-source provider
# is not built AND the whole classification is absent (zero strings matched).
# Concretely: `--providers scb` stays strict for untagged SCB classifications.
# Entries WITHOUT `vardemangdsversion` tag no instances — they seed only canonical
# codes from `valid_codes_file` and are exempt from the instance-match gate but
# still need >= 1 canonical code.
#
# To enumerate candidates from the live data:
#   SELECT vardemangdsversion, COUNT(*) FROM variable_instance
#   WHERE vardemangdsversion IS NOT NULL AND vardemangdsversion != ''
#   GROUP BY vardemangdsversion ORDER BY 2 DESC;

# ---------------------------------------------------------------------------
# Education — Svensk utbildningsnomenklatur (SUN)
# ---------------------------------------------------------------------------

[[classification]]
short_name = "SUN1996"
name = "Svensk utbildningsnomenklatur 1996"
name_en = "Swedish Standard Classification of Education 1996"
publisher = "SCB"
valid_from = 1996
valid_to = 1999
url = "https://www.scb.se/dokumentation/klassifikationer-och-standarder/svensk-utbildningsnomenklatur-sun/"
vardemangdsversion = [
  "SUN 1996",
  "SUN 1996, 5 positioner, brutto",
]
valid_codes_file = "sun1996.csv"

# SUN2000 has three orthogonal dimensions, each with its own code space:
#   - Utbildningsnivå       → 3-digit numeric education level
#   - Utbildningsinriktning → 3-digit numeric field of study
#   - Utbildningsgrupper    → 3-character alphanumeric standardized groups
# A code like "520" appears in both Nivå ("Övrig eftergymnasial utbildning,
# 2 år") and Inriktning ("Teknik och teknisk industri, allmän utbildning"),
# so they must be separate classifications.
#
# SUN1996 (a single combined 5-digit level+direction system) is succeeded by ALL
# THREE 2000 dimensions — a 1→many cross-stem split the auto same-stem year-tail
# rule can't produce. Those edges are CURATED in `curation/relations.toml`
# (`class/sun1996 → class/sun2000-niva / sun2000-inriktning / sun2000-grupp`),
# land in `classification_replaced_by`, and the derived `supersedes_id` then
# points every 2000 dimension back at sun1996. Succession is NOT declared here.

[[classification]]
short_name = "SUN2000-NIVA"
name = "Svensk utbildningsnomenklatur 2000 — Utbildningsnivå"
name_en = "Swedish Standard Classification of Education 2000 — Level"
publisher = "SCB"
valid_from = 2000
valid_to = 2019
url = "https://www.scb.se/dokumentation/klassifikationer-och-standarder/svensk-utbildningsnomenklatur-sun/"
valid_codes_file = "sun2000-niva.csv"
vardemangdsversion = [
  "SUN 2000 - Utbildningsnivå",
  "Utbildningsnivå (SUN 2000)  ",
  "SUN2000Niva",
]

[[classification]]
short_name = "SUN2000-INRIKTNING"
name = "Svensk utbildningsnomenklatur 2000 — Utbildningsinriktning"
name_en = "Swedish Standard Classification of Education 2000 — Field of Study"
publisher = "SCB"
valid_from = 2000
valid_to = 2019
url = "https://www.scb.se/dokumentation/klassifikationer-och-standarder/svensk-utbildningsnomenklatur-sun/"
valid_codes_file = "sun2000-inriktning.csv"
vardemangdsversion = [
