# Curated cross-register "see also" edges (#353) — see
# reg_meta_build/variable_related_to.py.
#
# A weak, maintainer-asserted association between two variables that are NOT the
# same definition but are worth surfacing together when browsing (e.g. an income
# concept in one register and its counterpart in another). Edges land in the
# existing `variable_related_to` table — the same table the A2.2 triage feeds
# with `auto:triage` split-sibling edges — but on a DISJOINT relation-kind
# vocabulary so a curated "see also" can never be mistaken for a split sibling.
#
# Each [[related]] entry is an UNORDERED pair of 3-segment
# provider/register/variable FQIDs (`a` / `b`); the build writes BOTH directions.
# `relation_kind` must be a curated kind (see CURATED_RELATION_KINDS in
# variable_related_to.py — currently just `similar_concept`); the auto:triage
# kind `same_definition_different_column` is REJECTED here (it is foldable by the
# concept-group edge pass — a curated weak link must never fold). `note` is
# optional (convention: `note = "curated:cross_register"` for provenance).
#
# References resolve against the built DB at materialize time; a dangling FQID
# FAILS the build (EXIT_CONFIG) — fix the entry, don't ignore it. An edge whose
# provider isn't in the build is SKIPPED (a partial --providers build can't
# represent it). An empty file is a no-op — no edges written.

# [[related]]
# a = "scb/lisa/<variable>"
# b = "scb/rams/<variable>"
# relation_kind = "similar_concept"
# note = "curated:cross_register"
