# Curated thin-provider catalog — Umeå universitet (#443), the steward of the
# högskoleprovet (Swedish Scholastic Aptitude Test / SweSAT) research database.
# Read by reg_meta_build.sources.curated.CuratedAdapter.
#
# Source: Umeå universitet's public SweSAT variable documentation
# (https://www.umu.se/institutionen-for-tillampad-utbildningsvetenskap/
# hogskoleprovet/for-forskare/variabeloversikt/) — the authoritative
# researcher-facing överblick of the provresultat variables. Confidential
# restricted-access individdata (released via SCB MONA); only the METADATA below is
# public. `column` tokens are SOURCE-EXACT to the delivery (the subtest
# abbreviations ORD/LÄS/MEK/… are also the published variable names); variable slugs
# stay AUTO (NFKD-folded: LÄS → las, Lärosäte → larosate, År → ar). The delivery's
# pseudonymized `P1105_LopNr_PersonNr` key is modelled as the documented field
# `Personnummer` (the SWECOV order-template prefix is not part of the agency field).
#
# data_type follows the documented form: subtest and section råpoäng are `integer`,
# normerade resultat (0,00–2,00) are `decimal`, ids/koder/perioder are `text`.
#
# Coverage: the SweSAT database runs from spring 1977 (provtillfälle YYYYA/YYYYB) and
# is ongoing → register valid_from = 1977, open-ended. Per-variable validity captures
# documented lifecycles: the autumn-2011 (HT2011) restructure introduced MEK, KVA,
# XYZ and the verbal/quantitative SECTION scores (valid_from = 2011-07-01, so the
# catalog does not advertise them for the spring VT2011 sitting); ELF replaced the
# original study-technique subtest STUF in 1992 (STUF ran 1977–1991); the
# general-knowledge subtest AO was
# discontinued after 1995; provort was recorded as Län t.o.m. 1983 and as a specific
# Lärosäte fr.o.m. 1984. FLAG: DTK and NOG introduction dates are not precisely
# modelled — they inherit the 1977 register start.


[[register]]
key = "hogskoleprovet"
name = "Högskoleprovet (provresultat)"
valid_from = "1977-01-01"  # SweSAT introduced spring 1977; ongoing (open-ended)
purpose = "Provresultat från högskoleprovet (SweSAT): normerade och råa poäng per delprov (verbala ORD/LÄS/MEK/ELF, kvantitativa XYZ/KVA/NOG/DTK), verbal och kvantitativ delsumma, totalt normerat resultat, samt provtillfälle, provår och provort/lärosäte. Databasen förvaltas av Umeå universitet."

[[register.variable]]
name = "Personnummer"
column = "Personnummer"
definition = "Personnummer (avidentifieras till löpnummer hos SCB)."
data_type = "text"
is_identifier = true
is_sensitive = true

[[register.variable]]
name = "Provår"
column = "År"
definition = "Provår (året provet skrevs)."
data_type = "text"

[[register.variable]]
name = "Provtillfälle"
column = "Tillfälle"
definition = "Provtillfälle inom året — vårprov (A) eller höstprov (B), kodat YYYYA/YYYYB."
data_type = "text"

[[register.variable]]
name = "Lärosäte"
column = "Lärosäte"
definition = "Lärosäte/provort där provet skrevs — specifik provenhet, registrerad fr.o.m. 1984."
data_type = "text"
valid_from = "1984-01-01"

[[register.variable]]
name = "Län"
column = "Län"
definition = "Län för provorten — provorten registrerades på länsnivå t.o.m. 1983."
data_type = "text"
valid_to = "1983-12-31"

[[register.variable]]
name = "Ordförståelse (ORD)"
column = "ORD"
definition = "Delprov ORD — ordförståelse (verbal del). Råpoäng."
data_type = "integer"

[[register.variable]]
name = "Läsförståelse (LÄS)"
column = "LÄS"
definition = "Delprov LÄS — svensk läsförståelse (verbal del). Råpoäng."
data_type = "integer"

[[register.variable]]
name = "Meningskomplettering (MEK)"
column = "MEK"
definition = "Delprov MEK — meningskomplettering (verbal del). Råpoäng."
data_type = "integer"
valid_from = "2011-07-01"

[[register.variable]]
name = "Engelsk läsförståelse (ELF)"
column = "ELF"
definition = "Delprov ELF — engelsk läsförståelse (verbal del). Råpoäng."
data_type = "integer"
valid_from = "1992-01-01"

[[register.variable]]
name = "Matematisk problemlösning (XYZ)"
column = "XYZ"
definition = "Delprov XYZ — matematisk problemlösning (kvantitativ del). Råpoäng."
data_type = "integer"
valid_from = "2011-07-01"

[[register.variable]]
name = "Kvantitativa jämförelser (KVA)"
column = "KVA"
definition = "Delprov KVA — kvantitativa jämförelser (kvantitativ del). Råpoäng."
data_type = "integer"
valid_from = "2011-07-01"

[[register.variable]]
name = "Kvantitativa resonemang (NOG)"
column = "NOG"
definition = "Delprov NOG — kvantitativa resonemang (tillräcklig information; kvantitativ del). Råpoäng."
data_type = "integer"

[[register.variable]]
name = "Diagram, tabeller och kartor (DTK)"
column = "DTK"
definition = "Delprov DTK — diagram, tabeller och kartor (kvantitativ del). Råpoäng."
data_type = "integer"

[[register.variable]]
name = "Allmän orientering (AO)"
column = "AO"
definition = "Delprov AO — allmän orientering (allmänkunskap). Råpoäng."
data_type = "integer"
valid_to = "1995-12-31"

[[register.variable]]
name = "Studietekniska färdigheter (STUF)"
column = "STUF"
definition = "Delprov STUF — studietekniska färdigheter (verbal del; ett av de ursprungliga delproven från 1977, utgick 1991 och ersattes av ELF 1992). Råpoäng."
data_type = "integer"
valid_to = "1991-12-31"

[[register.variable]]
name = "Verbal delsumma (Verb)"
column = "Verb"
definition = "Verbal delprovssumma (summerade verbala råpoäng)."
data_type = "integer"
valid_from = "2011-07-01"

[[register.variable]]
name = "Kvantitativ delsumma (Kvant)"
column = "Kvant"
definition = "Kvantitativ delprovssumma (summerade kvantitativa råpoäng)."
data_type = "integer"
valid_from = "2011-07-01"

[[register.variable]]
name = "Verbalt normerat resultat (VeNorm)"
column = "VeNorm"
definition = "Verbalt normerat resultat (0,00–2,00)."
data_type = "decimal"
valid_from = "2011-07-01"

[[register.variable]]
name = "Kvantitativt normerat resultat (KvNorm)"
column = "KvNorm"
definition = "Kvantitativt normerat resultat (0,00–2,00)."
data_type = "decimal"
valid_from = "2011-07-01"

[[register.variable]]
name = "Normerat resultat (Norm)"
column = "Norm"
definition = "Totalt normerat provresultat på skalan 0,00–2,00 (steg 0,05)."
data_type = "decimal"

[[register.variable]]
name = "Total råpoäng (Total)"
column = "Total"
definition = "Total råpoäng (summa över delproven)."
data_type = "integer"
