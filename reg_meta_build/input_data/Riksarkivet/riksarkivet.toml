# Curated thin-provider catalog — Riksarkivet (the Swedish National Archives,
# Krigsarkivet), #443. Read by reg_meta_build.sources.curated.CuratedAdapter.
#
# Source: Krigsarkivet's own field documentation `krigsarkivet_variabler.xlsx`
# — the historical conscription/mönstring (inskrivnings) record that predates
# Pliktverket's 1997-2010 digital era ([[pliktverket]] is the modern half). One
# register `inskrivning` (SWECOV delivery table RA_Insark). Confidential
# restricted-access individdata (released via SCB MONA); only the METADATA below
# is public. `column` tokens are SOURCE-EXACT 4-letter codes (penr, sjn1, pprf,
# …); variable slugs stay AUTO. Data types are UNDOCUMENTED in the source (codes
# and measurements alike) → all `text` (honest, avoids false numeric/precision
# claims). The six sjukdomsnummer (sjn1–6) are HISTORICAL disease codes from the
# pre-ICD-10-SE era → left UNLINKED (the modern ICD-10-SE classification would
# misdate them). Conscription medical/psychological exam fields are flagged
# is_sensitive.
#
# FLAG/GAP — coverage window: the source carries no year range. valid_from=1969
# is sourced from the variable content (standardized inskrivningsprov regime:
# I-prov, standardpoäng, psychological profile — the 1969 conscription reform);
# valid_to=1996 from the Pliktverket digital takeover in 1997. Maintainer to
# confirm the real archival span.


[[register]]
key = "inskrivning"
name = "Inskrivningsregister (mönstring)"
valid_from = "1969-01-01"  # FLAG: standardized inskrivningsprov regime (1969 reform)
valid_to = "1996-12-31"  # FLAG: Pliktverket takes over the digital register 1997
purpose = "Historiskt inskrivnings-/mönstringsregister (Krigsarkivet): resultat från värnpliktsmönstringen — bosättning, sjukdomsnummer, psykologisk och medicinsk kapacitetsprofil, fysiska och medicinska mått (syn, hörsel, längd, vikt, blodtryck, kondition), inskrivningsprov samt placering och förbandsönskemål. Föregångare till Pliktverkets register 1997–2010."

