# Curated thin-provider catalog — Pliktverket / Plikt- och prövningsverket (#443),
# the Swedish enlistment/conscription assessment authority. Read by
# reg_meta_build.sources.curated.CuratedAdapter.
#
# Source: Pliktverket's own field documentation `pliktverket_variabler.xls`
# ("Mönstringsregister för forskning, 1997-2010") — the authoritative delivery
# field list. Confidential restricted-access individdata (released via SCB MONA);
# only the METADATA below is public. `column` tokens are SOURCE-EXACT (penr, lkf,
# befl, psyf, …); inline code lists from the doc's "Mer info" column are embedded
# in each definition (categorical value sets are a follow-up — no codes minted,
# same as FOHM/FK). Three registers cover the same 1997-2010 mönstring: `insark`
# (mönstringsresultat), `insiprov` (inskrivningsprovet/G-faktor), `diagnos`. The
# diagnosis `sjnr` (sjukdomsnummer) is ICD-coded (ICD-10-SE era) → linked to the
# catalog ICD-10-SE classification. Variable slugs stay AUTO.


[[register]]
key = "insark"
name = "Mönstringsregister"
valid_from = "1997-01-01"  # Mönstringsregister för forskning, 1997-2010
purpose = "Mönstringsregister för forskning (1997–2010): resultat från mönstringen — status, fysiska och medicinska mått (blodtryck, kondition, hörsel, syn), psykologisk och fysisk kapacitet samt befattning."

