[[register.variable]]
name = "VARDGIVARPRIS"
column = "VARDGIVARPRIS"
definition = "Det pris som vårdgivaren har angett att åtgärden kostar. I de fall åtgärden har registrerats i ärendet via ett åtgärdspaket saknas belopp för åtgärden. Observera att ingen tvätt av orimliga värden görs, det förekommer att mottagningar rapporterar in värden med tex en eller flera nollor för mycket. En bedömning av rimiligheten kan eventuellt göras mot REFERENSPRIS_ATGARD. Prissättningen för tandvård är dock fri. Försäkringskassan betalar endast ut ersättning baserat på det lägsta beloppet av VARDGIVARPRIS OCH REFERENSPRIS_ATGARD."
data_type = "decimal"
variants = ["atgarder"]

[[register.variable]]
name = "REFERENSPRIS_ATGARD"
