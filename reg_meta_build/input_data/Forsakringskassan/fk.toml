# Curated thin-provider catalog — Försäkringskassan (FK), the Swedish Social
# Insurance Agency. Read by reg_meta_build.sources.curated.CuratedAdapter (#422,
# phase 2; FOHM was phase 1).
#
# FK publishes no machine-readable microdata-metadata export, so this TOML is the
# authoritative, hand-curated source. It models FK's individdata catalog in two
# tiers:
#
#   1. TWELVE publicly-documented registers, grounded directly in FK's published
#      variabelförteckningar (the per-förmån xlsx "Information om mikrodata"
#      workbooks). Each carries one [[register.variant]] per documented delivery
#      table (fall/delfall, mottagare/barn/beviljanden/avslag, the tandvård
#      delivery tables, …) with the variables transcribed VERBATIM from the
#      förteckning's `Variabel | Beskrivning` sheets. A variable delivered in
#      several variants is declared once with a `variants = [...]` subset (omit
#      ⇒ every variant). Registers: arbetsskadeersattning, assistansersattning,
#      bilstod, foraldrapenning, tillfallig-foraldrapenning,
#      sjuk-aktivitetsersattning, sjukpenning, merkostnadsersattning,
#      omvardnadsbidrag, lakarintygsregistret, tandvardsstodet, underhallsstod.
#
#   2. SIXTEEN thin SWECOV-core benefit registers with NO public variable
#      documentation — modeled as a single (`_default`) variant with the common
#      payment/period core (personnummer/organisationsnummer + utbetalningsmånad
#      + period + belopp). These transcribe the benefit-level description only.
#
# The delivered microdata is confidential restricted-access individdata (released
# to researchers after review, pseudonymised: personnummer/organisationsnummer →
# löpnummer, typically via SCB MONA); only the METADATA below is public.
#
# COLUMN TOKENS. For the 12 documented registers the `column` is the FK field
# name AS PUBLISHED in the förteckning (case preserved, e.g. `Lopnr`, `Ar_manad`,
# `Manadsbelopp_ASL_fs`); a parenthetical field ("Diagnoskod (den vuxnas)") is
# given a clean unique token (`Diagnoskod_vuxen`) with the full name kept in
# `name`. For the 16 thin registers the `column` is a clean ASCII token derived
# from the documented benefit field name (same situation as FOHM). The variable
# auto-slug folds each column (underscores→hyphens, lowercased), so panel-key
# refs use the hyphenated/lowercased form (e.g. `Del_from_datum` → `del-from-datum`).
#
# Enumerated code lists (the categorical value sets) remain a follow-up (#422):
# categorical variables carry a data_type and embed the förteckning's inline code
# list in `definition`, but mint no codes yet. The diagnosis-CODE fields
# (`Diagnos*_kod`/`Diagnoskod`/`DIAGNOSKOD`/`BIDIAGNOS*`) ARE linked to the catalog
# `ICD-10-SE` classification (FOHM SmiNet `diagnos` precedent, #446): FK codes
# diagnoses per the version current in the data year, so ICD-10-SE tags the modern
# bulk while the pre-1997 ICD-9 tail is a known historical caveat. Klartext (name)
# diagnosis fields stay unlinked. All diagnosis columns are marked is_sensitive.
#
# valid_from is the register's documented coverage start where FK publishes one
# (read from the förteckning's Information sheet / table titles). Where FK
# publishes no register data-coverage start it is the BENEFIT-INTRODUCTION date —
# a lower bound; uncertainty is flagged in a per-register `# FLAG/GAP` comment.
# The real per-register MONA extract coverage is maintainer-held.
#
# Sources:
#   MiDAS overview + the public catalog of variabelförteckningar — FK,
#   "Beställning av individdata för forskning":
#     https://www.forsakringskassan.se/statistik-och-analys/bestallning-av-individdata-och-statistik/bestallning-av-individdata-for-forskning
#
# NOTE: FK delivers pseudonymised ids; the catalog still models the source concept
# as a löpnummer / organisationsnummer with is_identifier + is_sensitive. Variable
# slugs stay AUTO (populate_variable_slugs -> fk.auto.toml, transient/not
# committed), derived from each variable's column. Regenerate .snapshot.json after
# edits:
#   reg-meta-build precheck-slugs --update-snapshot


# ============================================================================
# TIER 1 — 12 publicly-documented registers (variabelförteckningar)
# ============================================================================

[[register]]
key = "arbetsskadeersattning"
name = "Arbetsskadeersättning"
valid_from = "1999-01-01"
purpose = "Ersättning för arbetsskador (egenlivränta enligt arbetsskade- och yrkesskadeförsäkringen samt beslut om arbetsskadeersättning). Innehåller månadsvisa utbetalningar av livränta och beslutsdata."

[[register.variant]]
key = "arbetsskadelivranta-manadsdata"
name = "Arbetsskadelivränta utbetalningar per månad 1999-"
description = "Månadspanel med utbetalningar av egenlivränta enligt arbetsskadeförsäkringen. Observera att olika regelverk gäller för personer födda efter 1937 sedan år 2003. För personer födda efter 1937 upphör livräntan i regel från och med den månad personen fyller 65 år men senast månaden innan den fyller 67 år. Personer som är födda 1937 eller tidigare kan vid en låg pension få livränta även efter 65 års ålder. OBS! Åren 1999-2002 finns endast data för december månad. Från år 2003 och framåt finns data för alla årets månader."

[[register.variant]]
key = "yrkesskadelivranta-manadsdata"
name = "Yrkesskadelivränta utbetalningar per månad 1999-"
description = "Månadspanel med utbetalningar av livränta enligt lagen om yrkesskadeförsäkring som gäller i de fall skadetidpunkten var före 1 juli 1977. Yrkesskadelivränta kan betalas ut som egenlivränta och efterlevandelivränta. OBS! Åren 1999-2001 finns endast data för december månad. Året 2002 har januari och december data. Från år 2003 och framåt finns data för alla årets månader."

[[register.variant]]
key = "beslut"
name = "Beslut om arbetsskadeersättning 2013-"
description = "Innehåller information om beslut av ersättning enligt Arbetsskadeförsäkringen. Ersättning kan vara i form av livränta, ersättning för sjukvårds- och tandvårdskostnader, ersättning för kostnader för särskilda hjälpmedel eller för sjukvård utomlands. Beslut om ett sjukfall eller en skada är en arbetsskada s.k. serviceprövning finns även med i tabellen. Liksom serviceprövning dödsfall som Försäkringskassan utreder åt Pensionsmyndigheten. Tabellen innehåller både beslut som görs i samband med att en arbetsskada prövas för första gången samt beslut för redan godkända arbetsskador."

[[register.variable]]
name = "Lopnr"
column = "Lopnr"
definition = "Individspecifikt löpnummer"
