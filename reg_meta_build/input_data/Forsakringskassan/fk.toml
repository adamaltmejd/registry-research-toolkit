variants = ["atgarder", "betalningar"]

[[register.variable]]
name = "BETALNINGSDATUM"
column = "BETALNINGSDATUM"
definition = "Betalningens planerade utbetalningsdatum. Uppgiften saknas i källsystemet och räknas därför fram i Store. Planerat betalningsdatum var fram till 2015-09-29 alltid näst-nästkommande tisdag med utgångspunkt från ärendets beslutsdatum. Därefter är planerat betalningsdatum nästkommande tisdag + 1 dag med utgångspunkt från ärendets beslutsdatum."
data_type = "date"
variants = ["betalningar"]

[[register.variable]]
name = "BELOPP"
