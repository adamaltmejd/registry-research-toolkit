[[register]]
key = "bilstod"
name = "Bilstöd"
valid_from = "1988-10-01"
purpose = "Bilstöd till personer med funktionsnedsättning (och föräldrar till barn med funktionsnedsättning) för att anskaffa eller anpassa fordon. Innehåller utbetalningar samt ansökningar och beslut."

[[register.variant]]
key = "utbetalningar"
name = "Bilstöd - Utbetalningar"
description = "Innehåller alla utbetalningar för bilstöd. Alla attribut avser tidpunkten vid utbetalningen, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

[[register.variant]]
key = "ansokningar-beslut"
name = "Bilstöd - Ansökningar & beslut"
description = "Innehåller alla ansökningar och beslut för bilstöd. Alla attribut avser tidpunkten vid ansökan eller beslutet, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

[[register.variable]]
name = "Lopnr_sokande"
column = "Lopnr_sokande"
definition = "Individspecifikt löpnummer för betalningsmottagare."
data_type = "text"
is_identifier = true
is_sensitive = true

[[register.variable]]
name = "Lopnr_barn"
column = "Lopnr_barn"
definition = "Individspecifikt löpnummer för barnet som utbetalningen gäller."
data_type = "text"
is_identifier = true
is_sensitive = true

[[register.variable]]
name = "Utbetalningsdatum"
column = "Utbetalningsdatum"
definition = "Bokföringsdatum, d.v.s. det datum som utbetalningen bokfördes."
data_type = "date"
variants = ["utbetalningar"]

[[register.variable]]
name = "Kon_sokande"
