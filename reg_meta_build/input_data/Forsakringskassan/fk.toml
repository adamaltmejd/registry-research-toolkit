is_identifier = true
is_sensitive = true

[[register.variable]]
name = "Ar_manad"
column = "Ar_manad"
definition = "Sista dagen i månaden som utbetalningen skett."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata", "yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Kon"
column = "Kon"
definition = "Det kön den försäkrade har sista dagen i utbetalningsmånaden."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata", "yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Alder"
column = "Alder"
definition = "Personens ålder sista dagen i utbetalningsmånaden."
data_type = "integer"
variants = ["arbetsskadelivranta-manadsdata", "yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Lan"
column = "Lan"
definition = "Det län personen är mantalsskriven sista dagen i utbetalningsmånaden."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata", "yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Kommun"
column = "Kommun"
definition = "Det kommun personen är mantalsskriven sista dagen i utbetalningsmånaden."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata", "yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Skadedatum"
column = "Skadedatum"
definition = "Personens skadedatum för livräntan."
data_type = "date"

[[register.variable]]
name = "Livranteorsak"
column = "Livranteorsak"
definition = "Livränteorsak: Arbetsoförmåga till följd av arbetssjukdom, Arbetsoförmåga till följd av olycksfall i arbetet, Arbetsoförmåga till följd av olycksfall vid färd till och från arbetet, Rehabilitering till följd av arbetssjukdom, Rehabilitering till följd av olycksfall i arbetet, Rehabilitering till följd av olycksfall vid färd till och från arbetet."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata"]

[[register.variable]]
name = "Livrantetyp"
column = "Livrantetyp"
definition = "Egenlivränta."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata", "yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Manadsbelopp_ASL_fs"
column = "Manadsbelopp_ASL_fs"
definition = "Belopp livränta före samordning med andra ersättningar."
data_type = "decimal"
variants = ["arbetsskadelivranta-manadsdata"]

[[register.variable]]
name = "Manadsbelopp_ASL_es"
column = "Manadsbelopp_ASL_es"
definition = "Belopp livränta efter samordning med andra ersättningar."
data_type = "decimal"
variants = ["arbetsskadelivranta-manadsdata"]

[[register.variable]]
name = "Fodd_efter_1937"
column = "Fodd_efter_1937"
definition = "1 om personen är född efter 1937 och 0 om personen är född innan."
data_type = "text"
variants = ["arbetsskadelivranta-manadsdata"]

[[register.variable]]
name = "Manadsbelopp_YFL"
column = "Manadsbelopp_YFL"
definition = "Belopp som betalas ut i livränta före skatt."
data_type = "decimal"
variants = ["yrkesskadelivranta-manadsdata"]

[[register.variable]]
name = "Beslutsår"
column = "Beslutsår"
definition = "Året som slutmeddelandet expedieras."
data_type = "text"
variants = ["beslut"]

[[register.variable]]
name = "Startdatum"
column = "Startdatum"
definition = "Datum då ansökan inkomststämplas."
data_type = "date"
variants = ["beslut"]

[[register.variable]]
name = "Slutdatum"
column = "Slutdatum"
definition = "Datum då slutmeddelandet expedieras."
data_type = "date"
variants = ["beslut"]

[[register.variable]]
name = "Skadetyp"
column = "Skadetyp"
definition = "Skadetyp:\n1. Arbetssjukdom \n2. Olycksfall\n3. Färdolycksfall."
data_type = "text"
variants = ["beslut"]

[[register.variable]]
name = "Lag"
column = "Lag"
definition = "Lagrum som beslutet tagits inom:\n1. Lag från 2002-07-01 (LAF 3)\n2. Lag från 1993-01-01 (LAF 2)\n3. Lag från 1977-07-01 (LAF 1)\n4. Personskador LSP (lag om statligt personskadeskydd)"
data_type = "text"
variants = ["beslut"]

[[register.variable]]
name = "Ersattningsslag"
column = "Ersattningsslag"
definition = "Ersättningsslag:\n1. Egenlivränta \n2. Tandvård \n3. Särskilt hjälpmedel \n6. Sjukvård \n7. Sjukpenning \n8. Serviceprövning\n9. Sjukvård utomlands \n10. Vårdförmån I Sverige enl EG-förordning \n11. Ej ersättningsbart yrkande \n12. Efterkontroll \n13. Serviceprövning dödsfall."
data_type = "text"
variants = ["beslut"]

# Diagnosis-CODE columns below are linked to the catalog ICD-10-SE classification. The pre-1997 tail is ICD-9 — the code system follows the data year, so the link tags the modern bulk; klartext (name) fields stay unlinked.
[[register.variable]]
name = "Diagnoskod"
column = "Diagnoskod"
definition = "Diagnoskod enligt ICD-10."
data_type = "text"
is_sensitive = true
variants = ["beslut"]
classification = "ICD-10-SE"

[[register.variable]]
name = "Avslutsanledning"
column = "Avslutsanledning"
definition = "Avslutsanledning:\n1. Bifall\n2. Avslag - ej nedsatt 1/15\n3. Avslag - ej nedsatt ¼\n4. Avslag - ej varaktigt nedsatt\n5. Avslag - ej arbetsskada\n6. Avslag - ej arbetsskada psyk. – undantag\n7. Endast ändrad samordningsprocent\n8. Avvisat\n9. Makulerat\n11. Höjning av livränta enl. 4 kap. 12 § LAF (kan ej registreras from febR 2013)\n12. Indragning av livränta enl. 4 kap. 12 § LAF (kan ej registreras from febR 2013)\n13. Nedsättning av livränta enl. 4 kap. 12 § LAF (kan ej registreras from febR 2013)\n14. Beslut oförändrat enl. 4 kap. 12 § LAF (kan ej registreras from febR 2013)\n15. Indragning av livränta enl. 6 kap. 7 § LAF (kan ej registreras from febR 2013)\n16. Nedsättning av livränta enl. 6 kap. 7 § LAF (kan ej registreras from febR 2013)\n17. Beslut oförändrat enl. 6 kap. 7 § LAF (kan ej registreras from febR 2013)\n18. Ändring enl. 8 kap. 12 § LAF (kan ej registreras from febR 2013)\n19. Beslut oförändrat enl. 8 kap. 12 § LAF (kan ej registreras from febR 2013)\n20. Avslag\n21. Höjning (gäller from febR 2013)\n22. Stoppat (gäller from febR 2013)\n23. Sänkning (gäller from febR 2013)\n24. Oförändrat (gäller from febR 2013)\n25. Utbetalning."
data_type = "text"
variants = ["beslut"]

[[register.variable]]
name = "Skadlig_inverkan"
column = "Skadlig_inverkan"
definition = "Skadlig inverkan:\n0. Uppgift saknas \n10. Fysisk belastning, tunga lyft \n11. Fysisk belastning, förflyttningar av bördor \n12. Fysisk belastning, ensidigt och monotont arbete \n13. Fysisk belastning, olämpliga arbetsställningar \n14. Fysisk belastning, annat \n20. Organisatoriska eller sociala faktorer, trakasserier \n21. Organisatoriska eller sociala faktorer, hög arbetsbelastning \n22. Organisatoriska eller sociala faktorer, annat \n30. Kemiska eller biologiska ämnen/faktorer \n40. Buller \n50. Vibrationer \n60. Smitta \n90. Övrigt, oklart."
data_type = "text"
variants = ["beslut"]


[[register]]
key = "assistansersattning"
name = "Assistansersättning"
valid_from = "1994-01-01"
purpose = "Statlig assistansersättning enligt socialförsäkringsbalken (tidigare LSS/LASS) för personer med omfattande funktionsnedsättning. Innehåller pågående beslut, beviljanden, avslag och fattade beslut med timmar och timbelopp."

[[register.variant]]
key = "pagaende-beslut-1994-2001"
name = "Assistansersättning - Pågående beslut, 1994-2001"
description = "Innehåller alla pågående beslut för personer som har rätt till assistansersättning vid månadsskifte, d.v.s. den sista per månad. Har personen rätt till assistansersättning en del av månaden, men inte den sista dagen i månaden, kommer den personen inte med i urvalet. Har ett beslut om rätten till fattats aktuell månad, men avser period efter månadsskiftet, kommer den personen inte med. Alla attribut avser den sista dagen i månaden där det är relevant, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

[[register.variant]]
key = "pagaende-beslut-2002-201809"
name = "Assistansersättning - Pågående beslut, 2002-201809"
description = "Innehåller alla pågående beslut för personer som har rätt till assistansersättning vid månadsskifte, d.v.s. den sista per månad. Har personen rätt till assistansersättning en del av månaden, men inte den sista dagen i månaden, kommer den personen inte med i urvalet. Har ett beslut om rätten till fattats aktuell månad, men avser period efter månadsskiftet, kommer den personen inte med. Alla attribut avser den sista dagen i månaden där det är relevant, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

[[register.variant]]
key = "pagaende-beslut-201810"
name = "Assistansersättning - Pågående beslut, 201810-"
description = "Innehåller alla pågående beslut för personer som har rätt till assistansersättning vid månadsskifte, d.v.s. den sista per månad. Har personen rätt till assistansersättning en del av månaden, men inte den sista dagen i månaden, kommer den personen inte med i urvalet. Har ett beslut om rätten till fattats aktuell månad, men avser period efter månadsskiftet, kommer den personen inte med. Alla attribut avser den sista dagen i månaden där det är relevant, t.ex. personens ålder och geografi. Detaljerade uppgifter om timmarna finns för personer som har fått ett nytt beslut efter 201809. Annars finns bara uppgift om totala antalet timmar. Data uppdateras månadsvis."

[[register.variant]]
key = "beviljanden"
name = "Assistansersättning - Beviljanden, 1994-201809"
description = "Beviljanden från år 1994 och framåt går att få som antingen enbart förstagångsbeviljanden eller förstagångsbeviljanden tillsammans med återvändare. Ett förstagångsbeviljande är första gången en person har blivit beviljad assistansersättning och en återvändare är när en person tidigare har haft rätt till assistansersättning, blivit av med den av någon anledning och sedan blir beviljad igen. Alla attribut avser tidpunkten vid beslutet, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

[[register.variant]]
key = "avslag"
name = "Assistansersättning - Avslag, 1994-201809"
description = "Innehåller avslag på rätten till assistansersättning. Alla attribut avser tidpunkten vid beslutet, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

[[register.variant]]
key = "fattade-beslut"
name = "Assistansersättning - Fattade beslut, 201810-"
description = "Innehåller alla fattade beslut (bl.a. både beviljanden och avslag) för personer gällande assistansersättningen. Varje rad avser ett beslut och en person. Alla attribut avser tidpunkten vid beslutet, t.ex. personens ålder och geografi. Data uppdateras månadsvis."

