name = "Alder_barn"
column = "Alder_barn"
definition = "Barnets ålder."
data_type = "integer"

[[register.variable]]
name = "Lan_sokande"
column = "Lan_sokande"
definition = "Den sökandes län."
data_type = "text"

[[register.variable]]
name = "Lan_barn"
column = "Lan_barn"
definition = "Barnets län."
data_type = "text"

[[register.variable]]
name = "Kommun_sokande"
column = "Kommun_sokande"
definition = "Den sökandes kommun."
data_type = "text"

[[register.variable]]
name = "Kommun_barn"
column = "Kommun_barn"
definition = "Barnets kommun."
data_type = "text"

[[register.variable]]
name = "Bidragstyp"
column = "Bidragstyp"
definition = "Vilket typ av bidrag utbetalningen avser."
data_type = "text"
variants = ["utbetalningar"]

[[register.variable]]
name = "Fordonsslag"
column = "Fordonsslag"
definition = "Vilket typ av fordon utbetalningen avser. Denna uppgift finns mellan 2014-2022."
