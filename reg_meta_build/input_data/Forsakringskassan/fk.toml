# Diagnosis-CODE columns below are linked to the catalog ICD-10-SE classification. The pre-1997 tail is ICD-9 — the code system follows the data year, so the link tags the modern bulk; klartext (name) fields stay unlinked.
[[register.variable]]
name = "Diagnos_1"
column = "Diagnos_1"
definition = "Diagnoskod på den sökande/barnet. Uppgiften finns från år 2014, men täckningen är väldigt dålig. Majoriteten av alla ansökningar och beslut saknar diagnoskod."
data_type = "text"
is_sensitive = true
variants = ["ansokningar-beslut"]
classification = "ICD-10-SE"

[[register.variable]]
name = "Diagnos_2"
column = "Diagnos_2"
definition = "Diagnoskod på den sökande/barnet. Uppgiften finns från år 2014, men täckningen är väldigt dålig. Majoriteten av alla ansökningar och beslut saknar diagnoskod."
data_type = "text"
is_sensitive = true
variants = ["ansokningar-beslut"]
classification = "ICD-10-SE"

[[register.variable]]
name = "Reparation"
column = "Reparation"
definition = "Visar om registreringen gäller en reparation. Uppgiften finns från år 2014 och enbart för ansökningar."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Ansokan_period"
column = "Ansokan_period"
definition = "Visar om ansökan har gjorts inom en tidsperiod för när det egentligen inte får beviljas nytt bilstöd. Uppgiften finns från år 2014 med varierande kvalité."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Beviljandeorsak_period"
column = "Beviljandeorsak_period"
definition = "Orsaken till varför bilstöd har beviljats inom tidsperioden för när det egentligen inte får beviljas nytt bilstöd. Uppgiften finns från år 2014."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Avslagsorsak"
column = "Avslagsorsak"
definition = "Orsak till avslag eller delvis beviljande. Uppgiften finns för beslut från år 2014."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Villkorat_beslut"
column = "Villkorat_beslut"
definition = "Beslutsutfallet för rätten till bidrag är ett beviljande, men kommande utbetalningar är förenade med villkor. Uppgiften finns för beslut från år 2014."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Sokt_bidrag"
column = "Sokt_bidrag"
definition = "Anger vilka bidrag som har sökts för i ansökningarna."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Sokande"
column = "Sokande"
definition = "Anger vem ansökan gäller. Enbart den sökande, enbart barnet eller båda. Uppgiften finns från år 2021, men är inte heltäckande."
data_type = "text"
variants = ["ansokningar-beslut"]

[[register.variable]]
name = "Beslutat_belopp"
column = "Beslutat_belopp"
definition = "Beviljat belopp för beslutet. Det beviljade beloppet kan skilja sig från det utbetalda beloppet. Uppgiften finns från år 2021, men är inte heltäckande."
data_type = "decimal"
variants = ["ansokningar-beslut"]


