[[register]]
key = "sjukpenning"
name = "Sjukpenning och rehabiliteringspenning"
valid_from = "1994-01-01"
purpose = "Sjukpenning, förebyggande sjukpenning, rehabiliteringspenning och arbetsskadesjukpenning — dagersättningar vid nedsatt arbetsförmåga. MiDAS-data i form av sammanhängande sjukfall (fall) och delsjukfall (delfall), med förmån/delförmån, inkomsttyp, omfattning, dagbelopp, brutto-/nettodagar, diagnos och belopp."

[[register.variant]]
key = "fall-1"
name = "MiDAS - Ohälsa - Sjukpenning och rehabiliteringspenning - Fall1"
description = "Innehåller episoder med sammanhängande utbetalningar av sjukpenning, förebyggande sjukpenning, rehabiliteringspenning och arbetsskadesjukpenning sedan 1994. Kan innehålla kortare perioder utan ersättning från Försäkringskassan till följd av karenstid, sjuklön, semester och återinsjuknande."

[[register.variant]]
key = "delfall-1-1"
name = "MiDAS - Ohälsa - Sjukpenning och rehabiliteringspenning - Delfall 1-1"
description = "Innehåller episoder med sammanhängande utbetalningar av sjukpenning, förebyggande sjukpenning, rehabiliteringspenning och arbetsskadesjukpenning sedan 1994 med samma delförmån och inkomsttyp. Händelser som definierar slutet på ett delsjukfall och början på ett nytt är förändring av omfattning eller dagbelopp. Parallella delsjukfall för en individ uppstår vid parallella ersättningsperioder med olika delförmåner eller inkomsttyper."

[[register.variant]]
key = "delfall-2-1"
name = "MiDAS - Ohälsa - Sjukpenning och rehabiliteringspenning - Delfall 2-1"
description = "Innehåller episoder med sammanhängande utbetalningar av sjukpenning, förebyggande sjukpenning, rehabiliteringspenning och arbetsskadesjukpenning sedan 1994 med samma delförmån. Händelser som definierar slutet på ett delsjukfall och början på ett nytt är förändring av inkomsttyp, omfattning eller dagbelopp. Parallella delsjukfall för en individ uppstår vid parallella ersättningsperioder med olika delförmåner. Vid parallella inkomsttyper används kombinationskoden för SGI blandinkomst."

[[register.variant]]
key = "delfall-3-1"
name = "MiDAS - Ohälsa - Sjukpenning och rehabiliteringspenning - Delfall 3-1"
description = "Innehåller episoder med sammanhängande utbetalningar av sjukpenning, förebyggande sjukpenning, rehabiliteringspenning och arbetsskadesjukpenning sedan 1994 med samma förmån. Händelser som definierar slutet på ett delsjukfall och början på ett nytt är förändring av inkomsttyp, omfattning eller dagbelopp. Parallella delsjukfall för en individ uppstår vid parallella ersättningsperioder med olika förmåner. Vid parallella inkomsttyper används kombinationskoden för SGI blandinkomst. Produkten saknar information om delförmån."

[[register.variant]]
key = "delfall-4-1"
name = "MiDAS - Ohälsa - Sjukpenning och rehabiliteringspenning - Delfall 4-1"
description = "Innehåller episoder med sammanhängande utbetalningar av sjukpenning, förebyggande sjukpenning, rehabiliteringspenning och arbetsskadesjukpenning sedan 1994. Händelser som definierar slutet på ett delsjukfall och början på ett nytt är förändring av delförmån, inkomsttyp, omfattning eller dagbelopp. Det förekommer här inga parallella delsjukfall för en individ. Vid parallella delförmåner används istället två delförmånsvariabler och vid parallella inkomsttyper används kombinationskoden för SGI blandinkomst."

