name = "ATB_ERS"
column = "ATB_ERS"
definition = "Totalt utnyttjat bidragsbelopp (ATB) i ärendet. I de fall utbetalningar kan skapas för ärendet motsvarar detta belopp vad som är utbetalt i detta ärende. Om utbetalningar kan skapas för ärendet styrs av vilken huvudstatus ärendet har (se TVS_ODS_HUVUDSTATUS_ARETYP_U). För korrigeringsärenden är detta totalt utnyttjat bidragsbelopp från och med original-ärendet och inte specifikt vad som utnyttjats i korrigeringsärendet."
data_type = "decimal"
variants = ["arenden-detaljerat", "arende-atgard"]

[[register.variable]]
name = "KORR_BELOPP"  # source förteckning label "KORR_ BELOPP" (stray space); canonical field KORR_BELOPP
column = "KORR_BELOPP"
definition = "Den totala förändring av tandvårdsstödet som sker i ett ärende av typ Korrigeringsärende eller Korrigering BTB Det tandvårdsstöd som betalas ut ytterligare om positivt belopp, återkrav genom kvittning om negativt belopp."
data_type = "decimal"
variants = ["arenden-detaljerat"]

[[register.variable]]
name = "KORR_ATB_ERS"
column = "KORR_ATB_ERS"
definition = "Korrigeringsbelopp avseende ATB (del av KORR_BELOPP)"
data_type = "decimal"
variants = ["arenden-detaljerat", "arende-atgard"]

[[register.variable]]
name = "KORR_HCP_ERS"
column = "KORR_HCP_ERS"
definition = "Korrigeringsbelopp avseende Tandvårdsersättning/HCP (del av KORR_BELOPP)"
data_type = "decimal"
variants = ["arenden-detaljerat"]

[[register.variable]]
name = "ERSGR_BELOPP_FORE_KORR"
column = "ERSGR_BELOPP_FORE_KORR"
definition = "I ett korrigeringsärende är detta Utg. ersättningsgrundande belopp i föregående ärende, dvs. Patientens ersättningsgrundande belopp som det var efter att föregående ärende godkändes. Verkar vara: Utg ersgr belopp i det senaste beslutade ärendet inom ersättningsperioden innan beslutstidpunkten på korrigeringsärendet. Behöver verifieras!"
data_type = "decimal"
variants = ["arenden-detaljerat"]

[[register.variable]]
name = "ERSGR_BELOPP_EFTER_KORR"
column = "ERSGR_BELOPP_EFTER_KORR"
definition = "Patientens totala ersättningsgrundande belopp inom ersättningsperioden efter korrigeringen. Motsvarar alltid utg.ersgr belopp på korrigeringsärendet (UTG_ERSGR_BELOPP)."
data_type = "decimal"
variants = ["arenden-detaljerat"]

[[register.variable]]
name = "MAN_KORR_ERSGR_BELOPP"
column = "MAN_KORR_ERSGR_BELOPP"
definition = "Korrigeringsbelopp som används för att inom korrigeringen justera det ersättningsgrundande beloppet så att patientens tandvårdsstöd inte påverkas men att det utgående ersättningsgrundande beloppet ändå kan uppdateras."
