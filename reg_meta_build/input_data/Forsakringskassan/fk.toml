[[register]]
key = "underhallsstod"
name = "Underhållsstöd"
valid_from = "1996-12-01"  # earliest documented coverage (Innehållsförteckning); per-variant coverage drifts (utbetalningar-barn from 2018, beslut/utbetalningar-manad from 1997)
purpose = "Underhållsstöd till barn vars föräldrar inte bor tillsammans, när den bidragsskyldiga föräldern inte betalar underhåll. Innehåller utbetalningar, beslut och inbetalningar på barnnivå."

[[register.variant]]
key = "utbetalningar-barn"
name = "Barn och familj - Underhållsstöd — Utbetalningar barn"
description = "Varje rad är en utbetalning av underhållsstöd på barnnivå. Data finns från 2018-01-01 och framåt."

[[register.variant]]
key = "beslut"
name = "Barn och familj - Underhållsstöd — Beslut"
description = "Denna tabell innehåller beslut om underhållsstöd, där varje rad motsvarar ett beslut kopplat till ett specifikt barn. Datan sträcker sig från 1997 och framåt."

[[register.variant]]
key = "utbetalningar-manad"
name = "Barn och familj - Underhållsstöd — Utbetalningar manad"
description = "Den här tabellen visar faktiska utbetalningar av underhållsstöd per barn och månad. Varje rad motsvarar en utbetalning. Data finns från 1997 och framåt."

[[register.variant]]
key = "beslut-bidragsskyldig"
name = "Barn och familj - Underhållsstöd — Beslut bidragsskyldig"
description = "Den här tabellen innehåller beslut om återbetalningsbelopp som ska debiteras den bidragsskyldige per månad. Varje rad motsvarar ett sådant beslut, kopplat till ett visst barn och månad."

[[register.variant]]
key = "inbetalningar"
name = "Barn och familj - Underhållsstöd — Inbetalningar"
description = "Den här tabellen innehåller uppgifter om inbetalningar från den bidragsskyldige. Varje rad motsvarar ett avräknat belopp kopplat till ett visst barn och en viss period."

