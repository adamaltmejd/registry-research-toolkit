[[register]]
key = "merkostnadsersattning"
name = "Merkostnadsersättning"
valid_from = "2019-01-01"
purpose = "Merkostnadsersättning för merkostnader till följd av en vuxens eller ett barns funktionsnedsättning. Infördes 2019 och ersatte handikappersättningen (och, tillsammans med omvårdnadsbidrag, vårdbidraget). Innehåller mottagare, barn, beviljanden och avslag."

[[register.variant]]
key = "mottagare"
name = "Merkostnadsersättning – beståndet/populationen/utbetalningar — Tabell 1. Mottagare"
description = "Data visar vilka vuxna och vilka föräldrar som har rätt till merkostnadsersättningen."

[[register.variant]]
key = "barn"
name = "Merkostnadsersättning – beståndet/populationen/utbetalningar — Tabell 2. Barn"
description = "Data visar vilka föräldrar och barn som har rätt till merkostnadsersättningen."

[[register.variant]]
