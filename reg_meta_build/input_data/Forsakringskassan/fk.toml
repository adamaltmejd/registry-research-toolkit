[[register.variant]]
key = "fp-delfall1"
name = "MiDAS - Barn och familj - Föräldrapenning - FP_Delfall1"
description = "Innehåller episoder med sammanhängande utbetalningar av föräldrapenning (”fall”) sedan 1993. Förändringar i omfattning, nivå, typ av dag eller för vilket barn föräldrapenning tas ut för genererar ”delfall”. Parallella delfall kan uppstå om en mottagare tar ut föräldrapenning för olika barn, olika nivåer eller olika typer under samma period. Vissa perioder kan börja innan 1993."

[[register.variant]]
key = "fl-fall"
name = "MiDAS - Barn och familj -  Föräldrapenning och skattad föräldraledighet - FL_Fall"
description = "Innehåller episoder med sammanhängande skattat föräldraledighet (”fall”) i samband med uttag av föräldrapenning sedan 1993. Vissa perioder kan börja innan 1993."

[[register.variant]]
key = "fl-delfall1"
name = "MiDAS - Barn och familj - Föräldrapenning och skattad föräldraledighet - FL_Delfall1"
description = "Innehåller episoder med sammanhängande skattat föräldraledighet (”fall”) i samband med uttag av föräldrapenning sedan 1993. Förändringar i omfattning, nivå, typ av dag eller för vilket barn personen är ledig med genererar ”delfall”. Parallella delfall kan uppstå om en personen är ledig med olika barn, på olika nivåer eller olika typer under samma period. Vissa perioder kan börja innan 1993."

