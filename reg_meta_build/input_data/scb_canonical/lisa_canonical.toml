# Curated LISA doc-coverage attachments (#400) — LISA columns documented in SCB's
# doc library (lisa-bakgrundsfakta-1990-2017) but ABSENT from the machine-export
# catalog. Read by the #400 attach loader and minted onto the EXISTING `lisa`
# register (scb/lisa), attached to an existing `register_variant`.
#
# Provenance: each [[attach]] mirrors one column's doc at
# reg_meta_build/docs/lisa/<Column>.md — name, definition, documented coverage
# window, and (for categorical columns) the EXISTING catalog classification it
# links. One entry per column; 32 columns total. This is a doc-coverage diagnostic
# (classification-link-only where applicable), not a value-set source — no codes
# are minted here.
#
# Curation notes:
#  * variant = the existing lisa register_variant slug holding the column's closest
#    catalog sibling. These are all individual-level attributes (the individual's
#    yrke / workplace-SNI / pension / income / folkbokföring), so the default and
#    confirmed-by-sibling variant is `individer-15plus`.
#  * data_type uses the canonical seed vocabulary text|decimal|integer|date
#    (codes/identifiers -> text; *_Belopp_*/lön/ersättning -> decimal;
#    *_Bdag_*/*_Ndag_* day-counts -> integer), cross-checked against the sibling's
#    catalog data_type where one exists.
#  * classification linked ONLY where an existing catalog short_name matches the
#    column's code system (verified present in the built catalog): Ssyk3/4_J16 ->
#    SSYK96; AstSNI2002(B/G)J -> SNI2002; SektorKodJ -> SEKTOR2000. InstKod7J's
#    10-position institutional sector code has no catalog classification (omitted);
#    YSEG_J16/MedbLandNamn have no matching catalog classification (omitted).
#  * is_identifier = true ONLY where the column's catalog sibling carries it (so an
#    identifier column is NOT published as ordinary text, weakening the PII guard):
#    CfarNrSregJ (sibling CFARNrSreg), PeOrgNrSregJ (sibling PeOrgNrSreg), ArbstIdJ
#    (linkage id; sibling ArbstId) -> is_identifier=1. None of the 32 has a sensitive
#    sibling, so is_sensitive is left at the default (false) throughout.
#  * "justerad metod" (J) columns are SCB's single backcast year 2003, produced to
#    bridge the 2004 RAMS method change ("Uppgiften har tagits fram avseende årgång
#    2003 för att underlätta jämförelser över tid") -> windowed 2003-01-01..2003-12-31.


