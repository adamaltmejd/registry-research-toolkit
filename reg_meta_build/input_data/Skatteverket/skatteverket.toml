purpose = "Tillfällig nedsättning av egenavgifter inkomstår 2020 (COVID-19), redovisad i inkomstdeklarationen — för överskott upp till 100 000 kr."

[[register.variable]]
name = "Person-/organisationsnummer"
column = "persorgnr"
definition = "Person- eller organisationsnummer. Byts ut mot ett löpnummer hos SCB (avidentifiering)."
data_type = "text"
is_identifier = true
is_sensitive = true

[[register.variable]]
name = "Tillfällig nedsättning egenavgifter"
column = "AVDR_EGENAVG_TILLF_NED"
definition = "Tillfällig nedsättning av egenavgifter (corona-stöd) — tillfällig nedsättning för överskott upp till 100 000 kr, gäller 2020."
data_type = "decimal"


