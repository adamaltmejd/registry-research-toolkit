# Curated register-version related documents (#740).
#
# Binaries are maintainer-supplied, gitignored seed files under
# `reg_meta_build/input_data/SCB/docs/<register>/`. `sha256` and `byte_size`
# pin the exact gitignored bytes so release assets are reproducible. The build
# stores the bytes plus this provenance in `reg_meta_docs.db` so the released
# asset can rehost permitted documents as one file.
#
# SCB's "Relaterat dokument - Registerversion" file links are served from the
# mikrometadata UI without stable public PDF URLs. For those files, `source_url`
# names that source surface; the exact binary identity is the register-local
# filename plus the build-computed sha256.

