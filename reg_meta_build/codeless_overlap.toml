# Curated resolution for the residual code-less ↔ code-bearing overlap class
# (epic #858; residual characterized in #866, mechanism #868).
#
# After the automatic full-cover removal (#867) deletes the code-less
# `variable_state` rows fully covered by code-bearing siblings, a partial-coverage
# tail remains: a code-less span extending into uncoded years (an "edge", or an
# "interior" gap around a coded window). Each remaining residual is a per-column
# maintainer decision landed here. The build FAILS (EXIT_CONFIG) if any residual
# overlap has no `[[resolve]]` entry — this file must be mandatory-complete.
#
# A maintainer artifact like `codelivery.toml` / the slug TOMLs: it is NOT shipped
# in wheels (build-db is maintainer-only).
#
# Format — one table per residual `(register, variable, column)`:
#
#   [[resolve]]
#   register   = "<register-slug>"     # e.g. "naringsgren"
#   variable   = "<variable-slug>"     # e.g. "sni"
#   column     = "<delivery-column>"   # e.g. "SNI" (case-folded for matching);
#                                      # OMIT this field to match a state whose
#                                      # delivery column is NULL (no delivery alias)
#   resolution = "cap" | "drop" | "extend"
#   # extend = "<value_set_version_label>"   # REQUIRED iff resolution == "extend"
#
#   - cap    — trim the code-less span to the interval-complement of the union of
#              overlapping coded windows (delete if nothing residual; split into a
#              code-less twin per residual span on an interior gap).
#   - drop   — delete the code-less state outright.
#   - extend — absorb the code-less span into the named coded vintage's window: the
#              coded state on the same key whose `value_set_version_label` matches
#              `extend` grows to cover the code-less span, and the code-less state
#              is deleted.
#
# Slugs are register-scoped-unique and human-readable; `column` matches a state's
# `delivery_column_name` after case-folding, so casing is cosmetic. Omit `column`
# to match a state whose `delivery_column_name` is NULL.
#
# Policy (epic #858): a code-less gap beside a VINTAGED classification (LKF
# geography, country lists, survey strata, year/week enumerations) is `cap` — the
# truthful "no value set recorded for these years"; extending a single vintage
# across the gap would fabricate codes the source never delivered. A gap beside a
# tiny TIME-STABLE flag/categorical (binary [0,1], [J], fixed small sets — HDI,
# Kvartal, ersättnings-/föräldrapenning-typ) is `extend` — the coding genuinely
# spans the gap. The extend inferences are to be verified against real data (#876).

# aku/arsektor col=ArSektor  ::  vs3338 'Sektor2001'
[[resolve]]
register = "aku"
variable = "arsektor"
column = "ArSektor"
resolution = "cap"

