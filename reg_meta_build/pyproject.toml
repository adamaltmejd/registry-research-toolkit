[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-meta-build"
version = "0.27.0"
description = "Builder for the reg_meta SQLite databases (main + docs)"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "reg-meta>=0.31.0",
    "openpyxl>=3.1",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[project.scripts]
reg-meta-build = "reg_meta_build.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_meta_build"]

# Curated TOMLs (fqid_slugs/, classifications.toml) and source CSVs
# (input_data/) live in this package directory as maintainer-edited assets.
# They are NOT bundled into the wheel — end users consume the prebuilt
# reg_meta.db downloaded via `reg-meta update`.
