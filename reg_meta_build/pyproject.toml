[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-meta-build"
version = "0.49.0"
description = "Builder for the reg_meta SQLite databases (main + docs)"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.13.4",
    "reg-core-py",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[project.scripts]
reg-meta-build = "reg_meta_build.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_meta_build"]

# Maintainer inputs (curation/, fqid_slugs/) live in this package directory but are
# intentionally excluded from the wheel; third-party source data lives in the private
# inputs repo. This package builds databases but does not ship its source corpus — end
# users consume the prebuilt reg_meta.db release asset.

[tool.uv.sources]
reg-core-py = { workspace = true }
