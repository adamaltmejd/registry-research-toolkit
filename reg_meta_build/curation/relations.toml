# ── SUN 1996 → 2000 nomenclature split (#579) ──
#    The 1996 SUN (Svensk utbildningsnomenklatur) was restructured in 2000 into
#    all three SUN 2000 dimensions (nivå / inriktning / grupp) — so the lone
#    `sun1996` classification is succeeded by all three of `sun2000-niva`,
#    `sun2000-inriktning`, and `sun2000-grupp`, giving `group:sun`'s three members
#    a consistent lineage. This 1→many split across DIFFERENT dimensions is exactly
#    what the #571 same-stem auto rule cannot produce, hence the curated set.
#    (The within-dimension edition chain `sun2000-niva` → `sun2020-niva` etc. is
#    still AUTO-derived: a SUN-scoped override in `classification_slug_stem` (#747)
#    teaches the vintage rule that SUN bakes the year MID-slug — `sun2020-niva`
#    mirrors the short_name `SUN2020-NIVA` — so the editions still bucket by stem.)
#    Classification grain → `class/<slug>`.
#
#    Transition reason (no longer stored — `note` is provenance-only, the build
#    stamps `curated:slug_toml`): "1996 nomenclature restructured into the
#    three-dimensional nivå / inriktning / grupp model (SUN 2000)".
[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun2000-niva"
effective_year = 2000

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun2000-inriktning"
effective_year = 2000

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun2000-grupp"
effective_year = 2000

