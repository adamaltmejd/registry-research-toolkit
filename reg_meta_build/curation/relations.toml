# ── SUN 1996 → 2000 nomenclature split (#579) ──
#    The 1996 SUN (Svensk utbildningsnomenklatur) was restructured in 2000 into
#    all three SUN 2000 dimensions (nivå / inriktning / grupp) — so the lone
#    `sun1996` classification is succeeded by all three of `sun2000-niva`,
#    `sun2000-inriktning`, and `sun2000-grupp`, giving `group:sun`'s three members
#    a consistent lineage. This 1→many split across DIFFERENT dimensions is exactly
#    what the #571 same-stem auto rule cannot produce, hence the curated set.
#    (The within-dimension edition chain `sun2000-niva` → `sun2020-niva` etc. is
#    still AUTO-derived: a SUN-scoped override in `classification_slug_stem` (#747)
#    teaches the vintage rule that SUN bakes the year MID-slug — `sun2020-niva`
#    mirrors the short_name `SUN2020-NIVA` — so the editions still bucket by stem.)
#    Classification grain → `class/<slug>`.
#
#    Transition reason (no longer stored — `note` is provenance-only, the build
#    stamps `curated:slug_toml`): "1996 nomenclature restructured into the
#    three-dimensional nivå / inriktning / grupp model (SUN 2000)".
[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun2000-niva"
effective_year = 2000

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun2000-inriktning"
effective_year = 2000

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun2000-grupp"
effective_year = 2000

# ── ICD / KS disease-classification succession (#770/#768) ──
#    Sweden's disease classifications form a one-dimensional, linear succession:
#      icd-8-ks68 (1969–1986) → icd-9-ks87 (1987–1996) →
#      icd-10-se (1997–2026) → icd-11-se (2027–).
#    Modeled as classification-grain `replaced_by` so the chain collapses to its
#    terminal in the classification-root browse, like SSYK/LKF/SNI/SUN.
#    The trunk is kept strictly linear (no split nodes): the read-side terminal
#    walk stops at any split, so a fork would collapse the chain to the wrong head.
#    Classification grain → `class/<slug>`; `effective_year` = the successor's
#    valid_from. `note` is provenance-only (build stamps `curated:slug_toml`).
#    The icd-10-se → icd-11-se edge is future-dated because Socialstyrelsen's first
#    stated register transition is death causes from 2027. Read-side currentness and
#    the terminal that classification search follows use the DB manifest's succession as-of year,
#    so a 2026 DB keeps ICD-10-SE current while still exposing the upcoming edge.
#    ks87-p (the contemporaneous primary-care variant of KS87) is modeled below as
#    `derived_from`, not `replaced_by`: it is a setting variant, not a temporal
#    successor, and must not fork the trunk terminal walk or mint variable-vintage
#    succession.
[[edge]]
type = "replaced_by"
from = "class/icd-8-ks68"
to = "class/icd-9-ks87"
effective_year = 1987

[[edge]]
type = "replaced_by"
from = "class/icd-9-ks87"
to = "class/icd-10-se"
effective_year = 1997

[[edge]]
type = "replaced_by"
from = "class/icd-10-se"
to = "class/icd-11-se"
effective_year = 2027

[[edge]]
type = "derived_from"
derived = "class/ks87-p"
source = "class/icd-9-ks87"
note = "Primary-care setting variant of ICD-9-KS87"

