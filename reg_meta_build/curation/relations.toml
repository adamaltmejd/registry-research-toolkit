# ── RTB subject personnummer: column-era rename PNR → PersonNr (#846/#196) ──
#    Representation-grain succession (`from_column`/`to_column`, #843). var 57
#    ("Personnummer", RTB) delivered the subject key as the legacy `PNR` header in
#    the early `familjer-1990-1997` variant (1990–1997) and as `PersonNr` from the
#    `familjer-fran-1998` successor variant onward. The two headers NEVER co-occur
#    (verified against the raw SCB Registerinformation.csv: `PNR` appears only in
#    the 1990–1997 family variant, `PersonNr` in every other RTB variant). With the
#    RTB `column_merge` entry retired (#846), removing the by-fiat union splits
#    the subject key into the sparse legacy `pnr` sibling + the dense `personnr`;
#    this edge records the rename as overlay navigation. The `panel_entity_key`
#    pin needs no edge-walk: the dense `personnr` sibling keeps the `personnr` slug
#    every RTB variant already pins, so the pin lands on the materialized successor
#    directly. The
#    co-delivered relation columns of var 57 (`PersonNrMor`/`PersonNrAnkn`/
#    `PersonNrSamh`) are different ROLES and correctly stay split, untouched here.
[[edge]]
type = "replaced_by"
from = "scb/rtb/pnr"
to = "scb/rtb/personnr"
from_column = "PNR"
to_column = "PersonNr"
effective_year = 1998
note = "RTB subject personnummer delivery column renamed PNR → PersonNr (era rename, never co-occurring; replaces the retired column_merge entry, #846)"

# ── FRIDA firm key: variant-local gap-fill borgnr → persorgnr → borgnr (#846) ──
#    Reg 121 var 56 ("Person-/organisationsnummer"). In the punktskatter-for-energi
#    variant ONLY, the firm key is delivered as `borgnr` (2007–13), `PERSORGNR`
#    (2014–17), then `borgnr` again (2018–23) — verified one-column-per-year disjoint
#    against the raw Registerinformation. 15 other variants deliver `borgnr`
#    continuously, so the succession is VARIANT-SCOPED (`variant = ...`); modeled at
#    variable grain it would be a false global rename + an illegal cycle. The two
#    edges form a time-monotone round-trip (2014 < 2018), permitted by the
#    variant-scoped time-aware cycle check (#846 mechanism). Replaces the retired
#    `column_merge` fiat union (which fused persorgnr into the firm-key variable).
[[edge]]
type = "replaced_by"
from = "scb/frida/person-orgnr"
to = "scb/frida/persorgnr"
from_column = "borgnr"
to_column = "PERSORGNR"
variant = "punktskatter-for-energi"
effective_year = 2014
note = "FRIDA firm key delivered as PERSORGNR for 2014–2017 in the punktskatter-for-energi variant (gap-fill; borgnr resumes 2018)"

