a = "scb/ekonomiskt-bistand/antmanad" # Månader med bistånd
b = "sos/ekb/ekbantmanad"             # Månader med ekonomiskt bistånd
relation_kind = "similar_concept"
note = "curated:cross_register"

# Cross-register earned-income siblings within SCB: LISA's tax-aggregate earned
