# ── SUN 1996 → 2000 nomenclature split (#579) ──
#    The 1996 SUN (Svensk utbildningsnomenklatur) was restructured in 2000 into
#    all three SUN 2000 dimensions (nivå / inriktning / grupp) — so the lone
#    `sun1996` classification is succeeded by all three of `sun-niva2000`,
#    `sun-inriktning2000`, and `sun-grupp2000`, giving `group:sun`'s three members
#    a consistent lineage. This 1→many split across DIFFERENT stems is exactly
#    what the #571 same-stem year-tail auto rule (sun-niva2000 → sun-niva2020)
#    cannot produce, hence the curated set. Classification grain → `class/<slug>`.
#
#    Transition reason (no longer stored — `note` is provenance-only, the build
#    stamps `curated:slug_toml`): "1996 nomenclature restructured into the
#    three-dimensional nivå / inriktning / grupp model (SUN 2000)".
[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun-niva2000"
effective_year = 2000

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun-inriktning2000"
effective_year = 2000

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun-grupp2000"
effective_year = 2000

# ── Curated "see also" edges (#403) ──
# Each pair is a DISTINCT-but-related concept — a weak "see also", NOT an
# identity (identity is a `type = "same_as"` edge). Slugs verified against a real
# scb,sos build.

# Cross-provider economic-assistance counterparts: SCB's ekonomiskt-bistånd
# register vs Socialstyrelsen's authority register (`ekb`). Same real-world
# concept, two providers' distinct data products.
