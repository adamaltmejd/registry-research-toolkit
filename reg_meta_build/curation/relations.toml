# ── SUN 1996 → 2000 nomenclature split (#579) ──
#    The 1996 SUN (Svensk utbildningsnomenklatur) was restructured in 2000 into a
#    two-dimensional model — nivå (level) + inriktning (field of study) — so the
#    lone `sun1996` classification is succeeded by BOTH `sun-niva2000` and
#    `sun-inriktning2000`. This 1→many split across DIFFERENT stems is exactly
#    what the #571 same-stem year-tail auto rule (sun-niva2000 → sun-niva2020)
#    cannot produce, hence the curated dual. Classification grain → `class/<slug>`.
[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun-niva2000"
effective_year = 2000
note = "1996 nomenclature restructured into the two-dimensional nivå/inriktning model (SUN 2000)"

[[edge]]
type = "replaced_by"
from = "class/sun1996"
to = "class/sun-inriktning2000"
effective_year = 2000
note = "1996 nomenclature restructured into the two-dimensional nivå/inriktning model (SUN 2000)"

# ── Curated "see also" edges (#403) ──
# Each pair is a DISTINCT-but-related concept — a weak "see also", NOT an
# identity (identity is a `type = "same_as"` edge). Slugs verified against a real
# scb,sos build.

# Cross-provider economic-assistance counterparts: SCB's ekonomiskt-bistånd
# register vs Socialstyrelsen's authority register (`ekb`). Same real-world
# concept, two providers' distinct data products.
[[edge]]
type = "related_to"
a = "scb/ekonomiskt-bistand/belopp"   # Utbetalt belopp till hushållet
b = "sos/ekb/ekbbelopp"               # Ekonomiskt bistånd
relation_kind = "similar_concept"
note = "curated:cross_register"

[[edge]]
type = "related_to"
a = "scb/ekonomiskt-bistand/antmanad" # Månader med bistånd
b = "sos/ekb/ekbantmanad"             # Månader med ekonomiskt bistånd
relation_kind = "similar_concept"
note = "curated:cross_register"

# Cross-register earned-income siblings within SCB: LISA's tax-aggregate earned
# income vs RAMS's labour-income measure — related but DIFFERENT definitions
# (förvärvsinkomst is broader than RAMS arbetsinkomst), so a weak see-also, not
# a fold.
[[edge]]
type = "related_to"
a = "scb/lisa/csfvi"                  # Sammanräknad förvärvsinkomst
b = "scb/rams/arbink"                 # Arbetsinkomst i RAMS
relation_kind = "similar_concept"
note = "curated:cross_register"
