# ── #508 tier-1 same_as: auto-curated canonical-family identities ──
# Reproducible derivation (re-runnable for the deferred follow-up):
#  1. `reg-meta-build same-as-candidates --max-tier 1` on a real scb,sos build
#     (tier 1 = shared classification + shared ≥15-code value set + exact
#     normalized name agreement, cross-register).
#  2. KEEP a pair iff the variable's name maps to its canonical SCB
#     classification family AND the observed shared classification is that
#     same family (drops code-coincidence noise, e.g. civilstånd/employee-
#     size-class spuriously tagged SSYK). Name→family map: kommun / län /
#     församling / landsting / nuts / valkrets / säteskommun / säteslän → LKF;
#     näringsgren / bransch → SNI; utbildning* / skolform / gymnasieprogram →
#     SUN; juridisk form → JURFORM; sektor* → SEKTOR; yrke* → SSYK.
#  3. Group the kept pairs into connected identity components, then DROP a
#     component if it has >32 FQIDs (the _SAME_AS_MAX_COMPONENT guard — the
#     oversized standards kommun/län/näringsgren/utbildning/juridisk form)
#     OR >1 variable in a single register (a transitive merge of distinct
#     same-register columns — the generator excludes within-register pairs,
#     but their cross-register closure can reintroduce them; these are NOT
#     one identity and are left for manual curation).
#  4. Author the FULL pairwise clique of each surviving component: the build
#     stores only listed pairs (no transitive closure) and Catalog reads
#     DIRECT `variable_same_as` rows, so each member must edge every other
#     for the complete equivalence listing.
# Result: 62 components, 249 variables, 615 edges (max component 13 FQIDs).
# Deferred to the manual curation pass: the >32 oversized standards, the >1-
# per-register components, and tiers 2-4.

