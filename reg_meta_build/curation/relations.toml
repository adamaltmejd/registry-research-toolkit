# ── #508 tier-1 same_as: auto-curated canonical-family identities (≤32-FQID components) ──
#   Generated by `reg-meta-build same-as-candidates --max-tier 1` on a real scb,sos
#   build, then filtered to the SAFE subset: the variable's exact name maps to its
#   canonical SCB classification family AND the observed shared classification is that
#   same family (drops code-coincidence noise — e.g. civilstånd/employee-size tagged
#   SSYK), AND the merged identity component is ≤32 FQIDs (the _SAME_AS_MAX_COMPONENT
#   guard). Each group is one connected identity component (one concept, one value-set
#   family); a SPANNING subset of the generator's pairs is authored — the build closes
#   the rest transitively. The oversized standards (kommun/län/näringsgren/utbildning/
#   juridisk form, >32 FQIDs) + tiers 2–4 are left for the manual curation pass (#508).

