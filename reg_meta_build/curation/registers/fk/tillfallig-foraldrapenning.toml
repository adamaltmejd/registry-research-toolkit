source = "steward-holdings"
evidence = "SWECOV's FK_TFP_DELFALL_lev4 (edition 2015-2024) holds DELFORMAN_KOD beside its plain-text label DELFORMAN. FK documents only the positional DELFORMAN_KOD_1..3 on delfall1-1-8 (definition adapted from those). An aggregate check on MONA, reported as a conclusion only, found the codes 1:1 with their DELFORMAN labels, one row per occurrence. data_type from SWECOV's storage type (text). #1603 batch-e; maintainer decision 2026-10-16 (#1556)."
noted = "2026-10-17"
