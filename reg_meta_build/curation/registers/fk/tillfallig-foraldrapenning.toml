column = "DELFORMAN_KOD"
data_warning = "Undocumented column: FK documents only the positional DELFORMAN_KOD_1..3, not this one-row-per-occurrence DELFORMAN_KOD. The meaning is adapted from those columns; its delivered codes match the DELFORMAN labels one to one."
