[register]
provider = "sos"
slug = "lmed"
native_id = "7661979173609203267"
name = "Läkemedelsregistret"

# Batch 1 (#496): numbered specialist-training codes are repeated instances of
# one code concept, presented by ordinal position.

[[group]]
register = "sos/lmed"
key = "specialistutbildningskod"
label = "Specialistutbildningskod"
axis = "ordinal"
members = [{ variable = "specialistutbildningskod-1", value = "1", label = "1" }, { variable = "specialistutbildningskod-2", value = "2", label = "2" }, { variable = "specialistutbildningskod-3", value = "3", label = "3" }]

# sos.py DELDATAMANGD_TOKEN_MAP at 43599863^ (L1562-1591, #211): FDDD ships in
