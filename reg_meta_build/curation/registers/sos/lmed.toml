# v18: accepted-sos-routes:lmed:FDDD = 1 case, 1 effect with 2 variant keys
# (scopes/67b44b59563b830b0a6a.json.gz).

[[identity.route]]
deldatamangd = "LMED VARA/LMED"
variants = ["LMED", "LMED VARA"] # v18: 1 row (FDDD)

[[variant]]
