# sos.py DELDATAMANGD_TOKEN_MAP at 43599863^ (L1562-1591, #211): the Covid-19
# Hermes view's variable rows use the token 'DORS-COV'.
# v18: accepted-sos-routes:dors:* = 26 cases, 26 variant effects
# (scopes/fe7ae9ba5856a4e656de.json.gz).

[[identity.route]]
deldatamangd = "DORS-COV"
variants = ["COV_DORS_HERMES"] # v18: 26 rows

[[variant]]
native_id = "5369119272181688462.7577027114532436818"
slug = "dors-avi"
display_group = "DORS_AVI"
panel_entity_key = "personnr"
panel_time_key = "dodsdatum"
panel_time_grain = "row"


[[variant]]
native_id = "5369119272181688462.7117668989275245835"
slug = "dors"
display_group = "DORS"
panel_entity_key = "personnr"
panel_time_key = "dodsdatum"
panel_time_grain = "row"

# Event register like its dors/dors-avi siblings (#211: the DORS-COV token map
# gave the variant real states, so the row date column resolves here).

[[variant]]
native_id = "5369119272181688462.5309929884760526431"
slug = "cov-dors-hermes"
display_group = "COV_DORS_HERMES"
panel_entity_key = "personnr"
panel_time_key = "dodsdatum"
panel_time_grain = "row"

# Legitimerade omsorgs- och vårdyrkesgruppers arbetsmarknadsstatus (LOVA) (LOVA)
#
# #211: the A_LOVA* token map gave every variant real states, so the LOPNR
# column resolves per variant (auto slug flipped name-derived
# `lopnummer-som-ersatter-personnummer` -> column-derived `lopnr`). The data
# variants are stacked multi-year extractions, so the time axis is the
# per-row year/date column (row grain), not the delivery period. The
# styrtabell tokens (A_LOVA_STYR_*) are no longer minted as variants (#373):
# they are value-set decode tables (kod->klartext), bound to the coded
# variables' value sets — so there are no styrtabell variants here to slug.

[[variable]]
native_id = "5369119272181688462.PNR"
slug = "personnr"


