[register]
provider = "sos"
slug = "dors"
native_id = "5369119272181688462"
name = "Dödsorsaksregistret"

# Batch 1 (#496): DORS's numbered cause and substance slots are repeated
# occurrences of one medical concept, not distinct dimensions. The literal groups
# keep each source variable and expose its numbered ordinal position.

