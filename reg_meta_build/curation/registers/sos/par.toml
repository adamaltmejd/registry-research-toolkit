label = "Anestesikod"
axis = "ordinal"
members = [{ variable = "anestesikod-1", value = "1", label = "1" }, { variable = "anestesikod-2", value = "2", label = "2" }]

# ATC ships twice in PAR_OV and PAR_SV: a text ATC code and an integer flag
# "Tillhörande DIA- eller YO-kod är en ATC-kod". sos.py KNOWN_SPLIT_ALLOWLIST
# (L1477-1479, #362).
# v18: accepted-sos-identity:par:ATC = 1 case, 4 identity effects (2 subsets x
# 2 types), conditioned on data_type (scopes/2c2b7f487010017c6218.json.gz).

[[identity.split]]
variable = "ATC"
by = "data_type"
parts = [
  { data_type = "integer", owner = "5891427617861710725.ATC.atc" },  # slug dia-yo-kod-ar-atc-kod
  { data_type = "text", owner = "5891427617861710725.ATC.atc-1" },   # slug atc-komplement-diagnos
]

# AR, INDATUM and INDATUMA are each reused as a native name across PAR subsets
# while the delivered source concept differs per subset. Split by Deldatamängd
# so each source-basis keeps its own owner instead of collapsing onto one
# canonical text: AR is visit year (PAR_OV), discharge year / last delivered
# period (PAR_SV) or end-of-compulsory-care year / last delivered period
# (PAR_TV); INDATUM is a SAS visit date, a SAS admission date, or a text
# admission date (PAR_TV, 2010-2014); INDATUMA is an alphanumeric visit or
# admission date.

[[identity.split]]
variable = "AR"
by = "deldatamangd"
parts = [
  { deldatamangd = "PAR_OV", owner = "5891427617861710725.AR.besoksar" },
  { deldatamangd = "PAR_SV", owner = "5891427617861710725.AR.utskrivningsar" },
  { deldatamangd = "PAR_TV", owner = "5891427617861710725.AR.ar-avslutad-psykiatrisk-vardform" },
]

[[identity.split]]
variable = "INDATUM"
by = "deldatamangd"
parts = [
  { deldatamangd = "PAR_OV", owner = "5891427617861710725.INDATUM.besoksdatum" },
  { deldatamangd = "PAR_SV", owner = "5891427617861710725.INDATUM.inskrivningsdatum-slutenvard" },
  { deldatamangd = "PAR_TV", owner = "5891427617861710725.INDATUM.inskrivningsdatum-psykiatrisk-vardform" },
]

[[identity.split]]
variable = "INDATUMA"
by = "deldatamangd"
parts = [
  { deldatamangd = "PAR_OV", owner = "5891427617861710725.INDATUMA.besoksdatum-alfanumeriskt" },
  { deldatamangd = "PAR_SV", owner = "5891427617861710725.INDATUMA.inskrivningsdatum-alfanumeriskt" },
]

[[variant]]
native_id = "5891427617861710725.6299896919770839454"
slug = "par-sv"
display_group = "PAR_SV"
panel_entity_key = "personnr"
panel_time_key = "inskrivningsdatum-slutenvard"
panel_time_grain = "row"


[[variant]]
native_id = "5891427617861710725.5623677195158740599"
slug = "par-ov"
display_group = "PAR_OV"
panel_entity_key = "personnr"
panel_time_key = "besoksdatum"
panel_time_grain = "row"


[[variant]]
native_id = "5891427617861710725.6508659120530331974"
slug = "par-tv"
display_group = "PAR_TV"
panel_entity_key = "personnr"
panel_time_key = "inskrivningsdatum-psykiatrisk-vardform"
panel_time_grain = "row"

# Registret över tvångsvård enligt lagen om vård av missbrukare i vissa fall, LVM (LVM)
