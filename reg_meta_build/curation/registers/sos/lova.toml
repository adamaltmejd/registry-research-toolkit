[register]
provider = "sos"
slug = "lova"
native_id = "7847722537922273761"
name = "Legitimerade omsorgs- och vårdyrkesgruppers arbetsmarknadsstatus (LOVA)"

# LOVA repeated-event ordinal families (#374; spun out of #362.4). LOVA records
# up to nine immigration/emigration events per person, each as a numbered series.
# The Nth occurrence is a DISTINCT variable — correctly NOT merged (each holds a
# different event) — but the flat 1..9 rows surface as N near-identical browse
# rows. These fold the human-readable date and country series into one
# presentation group each, under an `ordinal` facet. Members are an exact
# hand-listed vocabulary (the standing curation rule forbids regex name-patterns),
# attached as plain `variable =` members because the series carries no month/edge
# token group. Slugs are SOS column names (INVDATUM/INVLAND/UTVDATUM/UTVLAND).
# The parallel NUMERIC date representation (columns INVARN/UTVARN → slugs
# invarn*/utvarn*, "… N numerisk") is folded the same way below, in its own
# invarn/utvarn families (#420).

[[group]]
register = "sos/lova"
key = "invandringsdatum"
label = "Invandringsdatum (per invandringstillfälle)"
axis = "ordinal"
members = [{ variable = "invandringsdatum-1", value = "1", label = "1:a" }, { variable = "invandringsdatum-2", value = "2", label = "2:a" }, { variable = "invandringsdatum-3", value = "3", label = "3:e" }, { variable = "invandringsdatum-4", value = "4", label = "4:e" }, { variable = "invandringsdatum-5", value = "5", label = "5:e" }, { variable = "invandringsdatum-6", value = "6", label = "6:e" }, { variable = "invandringsdatum-7", value = "7", label = "7:e" }, { variable = "invandringsdatum-8", value = "8", label = "8:e" }, { variable = "invandringsdatum-9", value = "9", label = "9:e" }]

