# Upstream typo: the 9th immigration date ships as a second INVARN8 in
# A_LOVA_PERSON; only the etikett (the record's `name`) tells them apart.
# sos.py VARIABLE_NAME_CORRECTIONS (L1505-1507, #362).
# v18: accepted-sos-identity:lova:INVARN8 = 1 case, 1 field effect
# (column_name -> INVARN9) + 1 identity effect (-> accepted-name INVARN9), both
# conditioned on name == the etikett below. Naming: 7847722537922273761.INVARN9
# -> slug invandringsdatum-9-numerisk (already tracked, fqid_slugs/sos.toml).
[[identity.rename]]
deldatamangd = "A_LOVA_PERSON"
variable = "INVARN8"
name = "Invandringsdatum 9 numerisk"
column = "INVARN9"

# Rows 32/34 concern the current degree; row 33 concerns the highest degree.
# Their delivered integer/text types select these meanings without changing either type.
[[identity.split]]
variable = "EXAMAR"
by = "data_type"
parts = [
  { data_type = "integer", owner = "7847722537922273761.EXAMAR.examar" },
  { data_type = "text", owner = "7847722537922273761.EXAMAR.exam-ar-hogsta-examen" },
]

# Rows 26/27 distinguish the actual CFAR number from its replacement identifier.
[[identity.split]]
variable = "CFARNR"
by = "deldatamangd"
parts = [
  { deldatamangd = "A_LOVA", owner = "7847722537922273761.CFARNR.cfarnr" },
  { deldatamangd = "A_LOVA_LISA", owner = "7847722537922273761.CFARNR.cfarnr-lopnummer" },
]

# Main rows include EXAM; HOSP and its lookup key both restrict the domain to LEG/SPEC.
[[identity.split]]
variable = "KATEGORI"
by = "deldatamangd"
parts = [
  { deldatamangd = "A_LOVA", owner = "7847722537922273761.KATEGORI.kategori" },
  { deldatamangd = "A_LOVA_HOSP", owner = "7847722537922273761.KATEGORI.kategori-legitimation-specialitet" },
  { deldatamangd = "A_LOVA_STYR_LEG_SPEC_EXAM_KOD", owner = "7847722537922273761.KATEGORI.kategori-legitimation-specialitet" },
]

