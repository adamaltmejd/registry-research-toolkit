# Variable-sheet Deldatamängd token -> Deldatamängder-sheet row name(s).
# sos.py DELDATAMANGD_TOKEN_MAP (L1562-1591, #211). Tokens never equal a sheet
# name, so without this bridge the rows have no variant.
# v18: accepted-sos-routes:lova:* = 135 cases, 175 variant effects.

[[identity.route]]
deldatamangd = "A_LOVA"
variants = ["LOVA"] # v18: 43 rows

[[identity.route]]
deldatamangd = "A_LOVA_LISA"
variants = ["LOVA"] # v18: 30 rows; the workbook's second 'LOVA' row (LISA-derived ekonomi subset)

[[identity.route]]
