# Batch 2 (#496): these guardian and other-person identifier pairs name ordinal
# roles for one person concept; their source variables remain distinct.
[[group]]
register = "scb/rtb"
key = "personnrvard"
label = "Personnummer vårdnadshavare"
axis = "ordinal"
members = [{ variable = "personnrvard1", value = "1", label = "1" }, { variable = "personnrvard2", value = "2", label = "2" }]

# This paired identifier family uses the same ordinal role axis.
[[group]]
register = "scb/rtb"
key = "personnrap"
label = "Personnummer annan person"
axis = "ordinal"
members = [{ variable = "personnrap1", value = "1", label = "1" }, { variable = "personnrap2", value = "2", label = "2" }]

# Source: archive/.../2026-09-16-goal-run/convert_relation_owned_partitions.py:34.
# v18: accepted-column-partitions:scb-registerinformation:2.57 = 616 identity
# effects (PersonNr 487, PersonNrSamh 93, PersonNrAnkn 10, PersonNrMor 10,
# PNR 8, PersonNrsamh 8); Personnr (9 rows, all variant 2.66) stays unassigned
# (scopes/026034a273c136a8b30d.json.gz).

[[identity.partition]]
variable = "2.57"
columns = { PNR = "2.57.pnr", PersonNr = "2.57.personnr", PersonNrAnkn = "2.57.personnrankn", PersonNrMor = "2.57.personnrmor", PersonNrSamh = "2.57.personnrsamh", PersonNrsamh = "2.57.personnrsamh" }
unassigned_columns = ["Personnr"]
columns_ref = "curation/relations.toml replaced_by edge scb/rtb/pnr -> scb/rtb/personnr (PNR -> PersonNr, 1998); fqid_slugs/scb.toml comment on 2.57.personnr: PersonNrSamh/PersonNrsamh is case-wobble of one column. Personnr has no ownership declaration."

[[variable]]
native_id = "2.57.personnr"
slug = "personnr"


