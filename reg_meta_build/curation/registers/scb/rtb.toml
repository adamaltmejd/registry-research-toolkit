columns = { GFB_FFB_Grupp = "2.24851.gfb-grupp-ffb", GFB_FFB_KlassGrupp = "2.24851.gfb-klassgruppering-ffb" }
columns_ref = "Y-317 2026-09-29: SCB VarId 24851 GFB FFB has two explicitly named delivered coding representations. GFB_FFB_Grupp carries the old text categories (2 annual originals 2009-2010, variant 66; 26 associations in 2009 including repeated NULL associations and 13 in 2010); GFB_FFB_KlassGrupp carries the current 19 two-digit text codes (15 annual originals 2011-2025). The original descriptors date the new grouping to 2011 and distinguish decisions before population registration (FFB); the old and current lists are never converted or crosswalked."

