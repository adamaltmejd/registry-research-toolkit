# ── Delivery-column aliases (#365 PR1c) ───────────────────────────────────────
# Record SWECOV's delivery column name as an additional variable_alias for an
# EXISTING variable (its delivered header DIFFERS from the SCB metadata header).
# GENERATED from build_catalog.py `globals` alias_candidates (normalized name ==
# existing column/slug; human-confirmed), grounded against a fresh reg_meta.db:
# an alias whose delivery_column already equals one of the variable's own
# variable_state columns is dropped (redundant no-op, not an alternate name).
# The apply pass attaches each to every register_variant where the variable has
# a state; INSERT OR IGNORE so an already-known column is a no-op.
# 45 aliases across 5 registers.

