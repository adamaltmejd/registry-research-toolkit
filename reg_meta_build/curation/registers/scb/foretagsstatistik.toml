terande variabler skattas. De mindre företagen undersöks via administrativt material från Skatteverket. Uppgifter för företag som saknas i det administrativa materialet, eller vars lämnade uppgifter är oanvändbara, skattas med hjälp av medelvärden för företagets bransch och storleksklass. I målpopulationen ingår samtliga företag som bedrivit verksamhet under referensåret exklusive finansiella företag." }, { name = "name", status = "value", value = "2002" }] }] }] }]
