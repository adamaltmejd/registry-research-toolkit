n företagsenhet bedriver en eller flera verksamheter vid en eller flera platser. Dessutom har företagsenhet en fullständig bokföring, om inte ska det vara möjligt och meningsfullt, både från ekonomisk och juridisk synpunkt, att sammanställa en fullständig bokföring om så krävs." }, { name = "name", status = "value", value = "Företagsenhet" }] }, { kind = "population", coordinate = { status = "value", name = "Samtliga företag i Sverige" }, register = { status = "value", native_id = 375, name = "Företagsstatistik för industri-, bygg och tjänstesektorn" }, variant = { status = "value", native_id = 1369, name = "FS Slutdata (företagsenhet)" }, edition = { status = "value", native_id = 12416, name = "1997" }, fields = [{ name = "name", status = "value", value = "Samtliga företag i Sverige" }, { name = "population_comment", status = "unknown" }, { name = "population_date", status = "value", value = "1997-01-01 - 1997-12-31" }, { name = "population_definition", status = "value", value = "Samtliga aktiva företagsenheter. Varje juridisk person och enskild näringsidkare tillhör en företagsenhet (FE). Dessutom icke aktiva företagsenheter med större anläggningstillgångar." }] }, { kind = "variant", coordinate = { status = "value", native_id = 1369, name = "FS Slutdata (företagsenhet)" }, register = { status = "value", native_id = 375, name = "Företagsstatistik för industri-, bygg och tjänstesektorn" }, variant = { status = "value", native_id = 1369, name = "FS Slutdata (företagsenhet)" }, fields = [{ name = "description", status = "value", value = "Statistikens syfte är att belysa näringslivets struktur med avseende på  lönsamhet, tillväxt, utveckling, finansiering och produktion mm. Strukturstatistiken används främst som underlag för beräkning av national- och finansräkenskaper. Resultaten redovisas per företagsenhet." }, { name = "name", status = "value", value = "FS Slutdata (företagsenhet)" }] }, { kind = "edition", coordinate = { status = "value", native_id = 12416, name = "1997" }, register = { status = "value", native_id = 375, name = "Företagsstatistik för industri-, bygg och tjänstesektorn" }, variant = { status = "value", native_id = 1369, name = "FS Slutdata (företagsenhet)" }, edition = { status = "value", native_id = 12416, name = "1997" }, fields = [{ name = "description", status = "value", value = "Syftet med statistiken är att belysa näringslivets struktur (exklusive den finansiella sektorn) med avseende på exempelvis lönsamhet, tillväxt, utveckling, finansiering och produktion under år 1997. Resultaten redovisas per företagsenhet." }, { name = "documentation_status", status = "value", value = "Offentlig" }, { name = "first_approved_at", status = "unknown" }, { name = "last_approved_at", status = "value", value = "2018-08-16" }, { name = "measurement_information", status = "value", value = "Företagsstatistiken är en årlig totalundersökning. Samtliga företag med minst 50 anställda enligt SCB:s företagsdatabas (FDB) samt vissa företag med färre anställda, men med betydande verksamhet undersöks via frågeformulär s.k. postenkät. För frågeformulären föreligger uppgiftslämnarskyldighet. De uppgifter som samlas in utgörs till stor del av information som återfinns i företagens årsredovisningar. Utöver dessa officiella uppgifter efterfrågas dock även mer specificerad information. För frågeformulärer som inte kommer in hämtas möjliga uppgifter från företagets årsredovisning. Resterande variabler skattas. De mindre företagen undersöks via administrativt material från Skatteverket. Uppgifter för företag som saknas i det administrativa materialet, eller vars lämnade uppgifter är oanvändbara, skattas med hjälp av medelvärden för företagets bransch och storleksklass. I målpopulationen ingår samtliga företag som bedrivit verksamhet under referensåret exklusive finansiella företag." }, { name = "name", status = "value", value = "1997" }] }, { kind = "register", coordinate = { status = "value", native_id = 375, name = "Företagsstatistik för industri-, bygg och tjänstesektorn" }, register = { status = "value", native_id = 375, name = "Företagsstatistik för industri-, bygg och tjänstesektorn" }, fields = [{ name = "name", status = "value", value = "Företagsstatistik för industri-, bygg och tjänstesektorn" }, { name = "purpose", status = "value", value = "Statistikens syfte är att belysa näringslivets struktur med avseende på  lönsamhet, tillväxt, utveckling, finansiering och produktion mm. Statistiken redovisas på nationell nivå, branschmässigt avgränsad samt för tillverkningsindustrin även på regional nivå. Strukturstatistiken används främst som underlag för beräkning av national- och finansräkenskaper." }] }] }] }]
