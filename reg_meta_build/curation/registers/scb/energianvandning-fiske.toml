[register]
provider = "scb"
slug = "energianvandning-fiske"
native_id = "196"

# Batch 3 (#496): the four `signal` columns identify one fishing enterprise by
# vessel number; the ordinal facet exposes each vessel's position.
[[group]]
register = "scb/energianvandning-fiske"
key = "signal"
label = "Fartygets identitetssnummer"
axis = "ordinal"
members = [{ variable = "signal1", value = "1", label = "1" }, { variable = "signal2", value = "2", label = "2" }, { variable = "signal3", value = "3", label = "3" }, { variable = "signal4", value = "4", label = "4" }]

[[variant]]
native_id = "196.276"
slug = "_default"
display_group = "Energianvändningen inom fiskesektorn"
panel_entity_key = "personnr"
panel_time_key = "period"
panel_time_grain = "delivery"

