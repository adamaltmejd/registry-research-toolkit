# ── #1603 D5: SWECOV Kursprov_gymn HT2011–VT2015 TERMIN ──

[[errata.delivered]]
variant = "_default"
column = "TERMIN"
versions = ["Hösttermin 2011", "Vårtermin 2012", "Hösttermin 2012", "Vårtermin 2013", "Hösttermin 2013", "Vårtermin 2014", "Hösttermin 2014", "Vårtermin 2015"]
upstream = "omitted-column-in-version"
expected_evidence_sha256 = "48dba7be4b9ea6474d694b4d24f219e323903a2a850453bd4e099ff8dd753d13"
evidence = "SWECOV holds TERMIN in Kursprov_gymn_HT2011–Kursprov_gymn_VT2015; SCB documents it on this variant from Hösttermin 2015, where the operational definition is the term label of the edition (\"HT15\", \"VT16\"). The aggregate check found every value the bare term label (HT or VT) matching the table's own term, so the column carries the same term label, without the year suffix; it is not an ordinal term number. (#1603; maintainer ruling 2026-10-15: a SWECOV delivery is evidence SCB had the variable that edition when meaning-continuity is evidenced; the maintainer's aggregate check on MONA, reported as a conclusion only)."
noted = "2026-10-15"

# ── #1619: TERMIN carries the term label, not the shared concept's ordinal term number (HT2015–VT2025) ──

[[errata.field]]
variable = "342.1579"
variant = "342.1133"
column = "TERMIN"
editions = ["7471"]
expected_fields = [{ name = "definition", status = "value", value = "Anger det ordningsnummer som aktuell termin har i elevens utbildning." }, { name = "description", status = "absent" }, { name = "name", status = "value", value = "Termin" }, { name = "operational_definition", status = "value", value = "Endast värdet \"HT15\" vilket innebär höstterminen 2015." }]
expected_period_text = { 7471 = "Hösttermin 2015" }
field = "definition"
value = "Anger vilken termin uppgifterna avser."
evidence = "SCB's own operational definitions for this column name the term label of the edition (Hösttermin 2015: 'Endast värdet \"HT15\" vilket innebär höstterminen 2015.'; Vårtermin 2016 likewise), and the maintainer ruling of 2026-10-15 (#1603 D5, errata.delivered above) found the column carries the term label, not an ordinal term number; the shared SCB concept definition does not apply here. The replacement is SCB's own wording, from the operational definition of scb/fritidshem/termin. Maintainer decision on #1619 (2026-10-19)."
noted = "2026-10-19"

