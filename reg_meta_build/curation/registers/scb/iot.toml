# Y-315 2026-09-29: eight household-only IoT native families deliver two
# distinct calculation bases under the same native household variant 25.1153
# ('Bostadshushåll'): an ordinary household column XHB from the annual
# 'YYYY, slutlig version' editions 2011-2024, and a modelled shared-residence
# column XVXHB from the 'YYYYVX, slutlig version' editions 2021-2024. SCB's
# Mikrodata Aktuellt correction item dated 2025-10-10 names the VX tables
# växelvis boende; the 2024 IoT register documentation
# (he0101_dokstar_2024_20260120.pdf) K2.2.5 pp.21-25 describes the modelled
# shared-residence household basis (household type, equivalence weight and
# children's income allocation, method updated from 2022); the HE0110 microdata
# tree lists the ordinary and VX editions separately (paired 2021-2024). These
# are separate delivered bases, not spelling aliases, and no numerical
# comparability is claimed. The ordinary owner keeps the existing
# household-native slug; the VX owner adds the explicit -vaxelvis-boende suffix
# (VX is not an individual branch and no individual branch exists). The unsplit
# native naming is retained; every original scope, interval, label, unit,
# source attribution and formula revision is preserved.

[[identity.partition]]
