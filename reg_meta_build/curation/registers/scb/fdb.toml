[register]
provider = "scb"
slug = "fdb"
native_id = "1"

# SWECOV existing-register holdings for scb/fdb use pooled dataset-grain
# `holdings_period` ranges; each entry preserves its delivery source in
# `evidence`, and holdings lists do not supply a source data type.

[[errata.column]]
variant = "arbetsstalleenheter"
column = "avregdatktid"
name = "Avregistreringsår"
definition = "Avregistreringsår"
holdings_period = "1990-2024"
source = "steward-holdings"
evidence = "SWECOV's delivery lists hold the column on this variant (input_data/swecov/build_catalog.py grafts); SCB's Registerinformation export carries no row for it. holdings_period from maintainer dataset range (Y-213)."
noted = "2026-06-14"

[[enrichment.description]]
register = "scb/fdb"
variable = "aststat"
description = "AST-status"
provenance = "Utkast_P1105_Variabellista_uppd2025_v5.xlsx"

[[identity.partition]]
variable = "1.830"
columns = { GatuRest = "1.830.gaturest", Gaturest = "1.830.gaturest", PGaturest = "1.830.pgaturest" }
columns_ref = "Y-167 2026-09-18: FDB 1.830 keeps {GatuRest, Gaturest} on gaturest and {PGaturest} on pgaturest (variants 424/427, 1999-2025); counter-evidence retained: AE variable-dict row 31477 reads GatuRest as PGaturest, JE GatuRest row 12814 matches PGaturest row 6139; register 383 out of scope"

[[variant]]
native_id = "1.424"
slug = "arbetsstalleenheter"
display_group = "Arbetsställeenheter"
panel_entity_key = "cfar-nummer"
panel_time_key = "period"
panel_time_grain = "delivery"


[[variant]]
native_id = "1.425"
slug = "administrativa"
display_group = "Administrativa arbetsställen"
panel_entity_key = "cfar-nummer"
panel_time_key = "period"
panel_time_grain = "delivery"


[[variant]]
native_id = "1.426"
slug = "foretagsenheter"
display_group = "Företagsenheter"
panel_entity_key = "fenr"
panel_time_key = "period"
panel_time_grain = "delivery"


[[variant]]
native_id = "1.427"
slug = "juridiska-enheter"
display_group = "Juridiska enheter"
panel_entity_key = "person-orgnr"
panel_time_key = "period"
panel_time_grain = "delivery"


[[variant]]
native_id = "1.428"
slug = "lokala-verksamhetsenheter"
display_group = "Lokala verksamhetsenheter"
panel_entity_key = "lvenr"
panel_time_key = "period"
panel_time_grain = "delivery"


[[variant]]
native_id = "1.429"
slug = "verksamhetsenheter"
display_group = "Verksamhetsenheter"
panel_entity_key = "venr"
panel_time_key = "period"
panel_time_grain = "delivery"

# Y-167 (maintainer decision 2026-09-18): FDB VarId 830 literal column ownership.
# Native VarId 830 delivers three literal spellings across FDB variants
# Arbetsställeenheter (424) and Juridiska enheter (427), 1999–2025: GatuRest and
# Gaturest share one identity (slug gaturest), PGaturest keeps its own (slug
# pgaturest) — mirroring the accepted 1.828 Gata/PGata and 1.537 PostNr/PPostNr
# partitions. The auto file keeps both slugs; this authored entry only adds the
# tracked ownership map the converter reads (no slug pin). Register 383
# (Utförarregistret) rows are out of scope. Counter-evidence retained, not
# resolved away: AE variable-dict row 31477 documents GatuRest→PGaturest as one
# variable, and JE GatuRest also carries row 12814 whose text matches
# PGaturest's row 6139.

