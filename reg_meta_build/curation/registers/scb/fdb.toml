# Y-167 (maintainer decision 2026-09-18): FDB VarId 830 literal column ownership.
# Native VarId 830 delivers three literal spellings across FDB variants
# Arbetsställeenheter (424) and Juridiska enheter (427), 1999–2025: GatuRest and
# Gaturest share one identity (slug gaturest), PGaturest keeps its own (slug
# pgaturest) — mirroring the accepted 1.828 Gata/PGata and 1.537 PostNr/PPostNr
# partitions. The auto file keeps both slugs; this authored entry only adds the
# tracked ownership map the converter reads (no slug pin). Register 383
