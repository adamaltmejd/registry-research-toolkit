e", "value" = "Huvudsyftet är att för år 2013 framställa statistik om intäkter, drifts- och underhållskostnader för framställande av driftnetton avseende flerbostadshus ägda av allmännyttiga bostadsföretag." }, { "name" = "documentation_status", "status" = "value", "value" = "Offentlig" }, { "name" = "first_approved_at", "status" = "value", "value" = "2015-06-22" }, { "name" = "last_approved_at", "status" = "value", "value" = "2015-06-24" }, { "name" = "measurement_information", "status" = "value", "value" = "Uppgifterna inhämtas via frågeformulär. För företag anslutna till SABO (majoriteten) görs insamling och databredning av SABO centralt (elektronisk enkät), för övriga företag av SCB (elektronisk enkät)." }, { "name" = "name", "status" = "value", "value" = "2013" }] }, { "kind" = "population", "coordinate" = { "status" = "value", "name" = "Allmännyttiga bostadsföretag" }, "register" = { "status" = "value", "native_id" = 197, "name" = "Intäkts- och kostnadsundersökning för flerbostadshus (IKU)" }, "variant" = { "status" = "value", "native_id" = 395, "name" = "Allmännyttiga bostadsföretag" }, "edition" = { "status" = "value", "native_id" = 6078, "name" = "2013" }, "fields" = [{ "name" = "name", "status" = "value", "value" = "Allmännyttiga bostadsföretag" }, { "name" = "population_comment", "status" = "unknown" }, { "name" = "population_date", "status" = "value", "value" = "2013-01-01 - 2013-12-31" }, { "name" = "population_definition", "status" = "value", "value" = "Med allmännyttiga bostadsföretag avses i denna redovisning aktiebolag, ekonomisk förening eller stiftelse som i sin verksamhet huvudsakligen förvaltar fastigheter med bostadslägenheter upplåtna med hyresrätt och som tidigare godkänts som allmännyttigt bostadsföretag. Företaget ska vara fristående från den kommunala förvaltningen, ha mer bostadsyta än lokalyta och inte huvudsakligen bestå av kategoribostäder eller huvudsakligen hyra ut möblerade lägenheter." }] }] }] }]
