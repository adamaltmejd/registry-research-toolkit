opulation_definition", status = "value", value = "Ftg JE/AE med > 5 anst., 18-66 år. Pop. definieras med att den institutionella sektorskoden motsvarar ftg inom icke-finansiell företagssektor, finansiell företagssektor, kyrkokommunal sektor, hushåll, icke vinstdrivande hushållsorg. samt aktiebolag utom bank och försäkring hänförliga till landstingskommunal-, primärkommunal- och statlig sektor. Offentligt ägda aktiebolag samt statliga affärsverk och Sveriges Riksbank. Ej personer i ams-åtgärder, ombordsanst. i utrikes sjöfart samt betingsanst." }] }, { kind = "object_type", coordinate = { status = "value", name = "Företagsenhet" }, register = { status = "value", native_id = 91, name = "Konjunkturstatistik, löner för privat sektor (KLP)" }, variant = { status = "value", native_id = 166, name = "Konjunkturstatistik, löner för privat sektor" }, edition = { status = "value", native_id = 205, name = "2004" }, fields = [{ name = "definition", status = "value", value = "En företagsenhet (FE) är en organisatorisk enhet som producerar varor eller tjänster. Enheten har själv beslutanderätt, särskilt för hur den fördelar sina produktionsresurser. En företagsenhet bedriver en eller flera verksamheter vid en eller flera platser. Dessutom har företagsenhet en fullständig bokföring, om inte ska det vara möjligt och meningsfullt, både från ekonomisk och juridisk synpunkt, att sammanställa en fullständig bokföring om så krävs." }, { name = "name", status = "value", value = "Företagsenhet" }] }] }, { fields = [{ name = "access_rights", status = "absent" }, { name = "access_url", status = "absent" }, { name = "aggregation_level", status = "absent" }, { name = "availability", status = "value", value = true }, { name = "base_register", status = "absent" }, { name = "classification_declared", status = "absent" }, { name = "column_name", status = "value", value = "REAktu" }, { name = "conditional_sensitivity", status = "absent" }, { name = "coverage", status = "absent" }, { name = "coverag