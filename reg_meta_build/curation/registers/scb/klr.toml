[[variant]]
native_id = "90.165"
slug = "_default"
display_group = "Konjunkturstatistik, löner för regioner"
# Sub-annual aggregate panel (#730, follow-up to #577): one row per region per
# year (ar) × month (manad). The subject is an aggregate geography, so
# panel_entity_key = "region" (cf. register_variant."115.1227", which keys on the
# aggregate geography "kommun"). The composite time key addresses one delivered
# month, so grain = "row".
panel_entity_key = "region"
panel_time_key = ["ar", "manad"]
panel_time_grain = "row"

