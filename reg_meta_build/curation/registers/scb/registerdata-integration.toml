[register]
provider = "scb"
slug = "registerdata-integration"
native_id = "396"

# regso (RegSO) and regso_namn are area names; regso_varde and RegSOkod are the
# coded RegSO (#1790). Group the codes so no name sits beside them.
[[group]]
register = "scb/registerdata-integration"
key = "regsokod"
label = "Regionala statistikområden (kod)"
axes = []
members = [{ variable = "regso-varde" }, { variable = "regsokod" }]

# regso (RegSO, "Anger namnet på området") and regso_namn are the same name under
# two spellings. Grouped so the `_` strip does not read them as a code~label pair.
[[group]]
register = "scb/registerdata-integration"
key = "regso"
label = "Regionala statistikområden (namn)"
axes = []
members = [{ variable = "regso" }, { variable = "regso-namn" }]

[[variant]]
native_id = "396.1531"
slug = "_default"
display_group = "Registerdata för integration"
panel_entity_key = "personnr"
panel_time_key = "period"
panel_time_grain = "delivery"

[variable]
# Studieförbundsstatistik
"396.57" = "personnr"
"396.241" = "alder-31-12"
"396.1573" = "aldersgruppering-31-12"
"396.6556" = "fodelseland-varldsdel"
"396.17256" = "vistelsetid"
"396.1573.ald1" = "ald1"
"396.1573.ald2" = "ald2"
"396.1573.ald3" = "ald3"
"396.1573.ald4" = "ald4"

# register 397

[[identity.partition]]
data_warning = "Catalog components follow literal exported physical fields. Shared source-native descriptions do not independently establish component roles or ordinal meanings; every original description and own coding association remains available."
variable = "396.1573"
