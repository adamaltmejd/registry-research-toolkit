[register]
provider = "scb"
slug = "innovation-foretag"
native_id = "257"

# CIS matrix columns CO11..CO85 are activated per wave by [[representation.matrix]].
# 2010–2016 declare every answer. 2002–2004 declares all seven partner rows, whose
# meaning its seven-row questionnaire fixes by position. 2004–2010 questionnaires have
# eight partner rows for seven co row groups. 2004–2006 and 2006–2008 declare all
# seven, read on the 7-category partner list their documentation carries over from
# 2002–2004, with that caveat in each definition (#1603 batch-e D4). 2008–2010
# has no such list; its co6x/co7x carry the 2004–2008 meaning under the same-name
# rule, with an assumed-meaning caveat in each definition (#1603 batch-e D4).

# #1603 batch-e: CIS2002 (2000-2002) cooperation matrix. SCB documents no 2000-2002 edition,
# so the matrix cannot be activated (#1571); each delivered cell is its own variable. The partner
# row carries the CIS2004 meaning and location column 1 is read as Sweden, both assumed; columns
# 2-5 are undocumented (CIS2002 has five location columns, 2004/2006 four). Operator under
# maintainer delegation 2026-10-16.

[[errata.version]]
variant = "_default"
name = "2000 - 2002"
evidence = "SWECOV holds CIS2002, the 2000-2002 innovation survey delivery; SCB's Registerinformation export documents innovation-foretag only from 2002 - 2004, so this round has no native edition. Added so the CIS2002 cooperation-matrix cells can be declared (#1603 batch-e; Operator under maintainer delegation 2026-10-16; #1571)."
noted = "2026-10-16"

[[errata.column]]
variant = "_default"
column = "co11"
data_type = "decimal"
name = "Samarbete om innovation med andra företag inom koncernen, Sverige (CIS 2000–2002)"
definition = "Samarbete om innovationsverksamhet med partner 1 (Andra företag inom koncernen) i Sverige under 2000–2002, enligt leverans. Betydelsen är antagen: partnerraden följer 2002–2004 års enkät (fråga 13) och platskolumn 1 antas vara Sverige som i alla dokumenterade omgångar; SCB dokumenterar ingen enkät för 2000–2002."
data_warning = "The partner (row 1, other group enterprises) is assumed from the CIS2004 questionnaire, and location column 1 is assumed to be Sweden as in every documented wave; SCB documents no 2000-2002 questionnaire for this delivery."
is_sensitive = false
is_identifier = false
versions = ["2000 - 2002"]
source = "steward-holdings"
evidence = "SWECOV holds co11 in CIS2002 (storage float). SCB documents no 2000-2002 innovation survey edition or questionnaire; the nearest documented wave, 2002-2004 (UF0315 Dokumentation av statistikens framtagning 2002-2004, questionnaire question 13), has the same seven partner rows but four location columns, so the partner row is carried with an assumed-meaning warning and location column 1 is read as Sweden. No code list is asserted. (#1603 batch-e; Operator under maintainer delegation 2026-10-16; #1571.)"
noted = "2026-10-16"

