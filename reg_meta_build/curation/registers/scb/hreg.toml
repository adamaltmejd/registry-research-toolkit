# Omgang (three variables, VarId 39310/39311/39312, one column) and PersonNr
# (VarId 1346) first appear in SCB's export in Vårterminen 2016; Hreg_Sok_2015_2022
# holds both from edition 2015. In the 2015 versions SCB carries VarId 1346 with a
# BLANK Kolumnnamn (CVIDs 352072 VT2015, 390073 HT2015), which is why the build
# split it into `personnr-motsvarande` (no column) and `personnr-motsvarande-2`
# (PersonNr, 2016+). Clone source for both columns: Höstterminen 2016 (regver
# 9855). If the maintainer confirms Hreg_Sok_2015_2022 starts in autumn 2015 (see
# the commented [[edition]] in proposed_overlay.toml), drop "Vårterminen 2015".

[[errata.delivered]]
variant = "sokande-grund-avancerad"
column = "Omgang"
versions = ["Vårterminen 2015", "Höstterminen 2015"]
upstream = "omitted-column-in-version"
evidence = "SWECOV holds Omgang in Hreg_Sok_2015_2022 (edition 2015..2021); SCB's Registerinformation export documents the Vårterminen 2015 and Höstterminen 2015 versions of sokande-grund-avancerad without a Omgang column and carries it from Vårterminen 2016 onwards."
noted = "2026-09-12"

[[errata.delivered]]
variant = "sokande-grund-avancerad"
column = "PersonNr"
versions = ["Vårterminen 2015", "Höstterminen 2015"]
upstream = "omitted-column-in-version"
evidence = "SWECOV holds PersonNr in Hreg_Sok_2015_2022 (edition 2015..2021); SCB's Registerinformation export documents the Vårterminen 2015 and Höstterminen 2015 versions of sokande-grund-avancerad without a PersonNr column and carries it from Vårterminen 2016 onwards."
noted = "2026-09-12"

