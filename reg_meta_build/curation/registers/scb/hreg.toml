columns_ref = "SCB Registerinformation native 47.1537: reviewed all 2 original occurrences. Both originals name the calendar year for the examination certificate; Kar explicitly derives it from the issue date. Preserve both pooled delivery scopes and original year coding. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

