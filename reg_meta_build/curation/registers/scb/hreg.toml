columns_ref = "SCB Registerinformation native 47.1280: reviewed all 2 original occurrences. Pomf belongs to completed basic-level course credits and explicitly retains the autumn-2007 transition from 40 points to 60 higher-education credits per full-time year. Omfattning explicitly measures credited doctoral-level higher-education credits. Do not convert values, split or narrow the pooled Pomf period, or relabel the entire pooled vintage as old points. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

