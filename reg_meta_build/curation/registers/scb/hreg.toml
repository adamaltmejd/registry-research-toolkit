# Reviewed original operational meanings distinguish event anchors and credit
# constructs; spelling aliases retain their source coding and pooled scopes.

[[identity.partition]]
variable = "47.44"
columns = { "Kon" = "47.44.kon", "Kon2" = "47.44.kon", "kon" = "47.44.kon" }
columns_ref = "SCB Registerinformation native 47.44: reviewed all 174 original occurrences. Original operational descriptions derive the same person sex from the penultimate personal-number digit. Keep numeric 0/1/2 and alphabetical M/K source coding versions as delivered; the literals do not establish separate constructs. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

[[identity.partition]]
variable = "47.73"
columns = { "Ar" = "47.73.ar", "KAr" = "47.73.ar-for-tillgodoraknande" }
columns_ref = "SCB Registerinformation native 47.73: reviewed all 7 original occurrences. Ar is explicitly the single reference-year value in the staff delivery; KAr is explicitly the calendar year when doctoral training was credited. Distinct event anchors, not a variant-only split. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

[[identity.partition]]
variable = "47.326"
columns = { "Namn" = "47.326.namn", "FSLNamn" = "47.326.namn" }
columns_ref = "SCB Registerinformation native 47.326: reviewed all 7 original occurrences. Every original operational definition explicitly names the doctoral student at the latest reporting occasion, surname plus first name; FSLNamn does not name a doctoral school. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

[[identity.partition]]
variable = "47.1280"
columns = { "Pomf" = "47.1280.poangomfattning", "Omfattning" = "47.1280.tillgodoraknad-omfattning-forskarniva" }
columns_ref = "SCB Registerinformation native 47.1280: reviewed all 2 original occurrences. Pomf belongs to completed basic-level course credits and explicitly retains the autumn-2007 transition from 40 points to 60 higher-education credits per full-time year. Omfattning explicitly measures credited doctoral-level higher-education credits. Do not convert values, split or narrow the pooled Pomf period, or relabel the entire pooled vintage as old points. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

[[identity.partition]]
variable = "47.1375"
columns = { "ExDatum" = "47.1375.examensdatum", "Datum" = "47.1375.examensdatum" }
columns_ref = "SCB Registerinformation native 47.1375: reviewed all 2 original occurrences. Both original definitions explicitly identify the date the examination certificate was issued. Retain ExDatum source prose that before autumn 1998 only year and term were stored; no precision upgrade or availability repair. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

[[identity.partition]]
variable = "47.1465"
columns = { "UtbytStud" = "47.1465.utbytesstudier", "Typ" = "47.1465.typ-av-utlandsstudier-csn" }
columns_ref = "SCB Registerinformation native 47.1465: reviewed all 49 original occurrences. UtbytStud retains the six-code Utbytesstudent source classification for university registrations. Typ is explicitly the evaluated outgoing-study type for CSN-funded foreign studies, with a separate three-code Utresande student classification and original CSN education-group derivation. No code equivalence or category transfer. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged."

