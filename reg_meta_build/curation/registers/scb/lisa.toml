# Y-302 2026-10-01: LISA employment/source KU-to-AGI source-basis partitions.
# SCB `lisa-bakgrundsfakta-1990-2017` docs/lisa/_changelog-2019.md documents that
# the monthly employer declarations at individual level (AGI) replace the annual
# control statements (KU) from reference year 2019 and lists the new AGI-based
# employment/source variables. Each family below has one KU literal (through 2018)
# and one AGI literal (from 2019); the two are distinct source bases and get
# distinct catalog owners. This is a source-basis distinction, NOT a claim that the
# concept changed, a harmonized equivalent rename, or a succession edge. The exact
# prepared v28 physical periods are the only availability claim.
#
# Five SSYK source/age/status families (34.1933, 34.16227, 34.16237, 34.16244,
# 34.18911) begin 2001, not 1990. Three occupational-position AGI branches
# (AGI2YrkStalln 34.4911, AGI1YrkStalln 34.4948, AGI3YrkStalln 34.31294) end 2021.
# Three SektorKod AGI branches (AGI1SektorKod 34.25621, AGI2SektorKod 34.31118,
# AGI3SektorKod 34.31299) have only four records 2019-2023: the missing 2022
# occurrence is preserved, never filled from the min/max envelope. All other AGI
# branches have five records 2019-2023. Excluded are the seven KU/AGI families
