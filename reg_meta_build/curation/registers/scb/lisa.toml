provider = "scb"
slug = "lisa"
native_id = "34"

# ══ LISA doc coverage (Y-116, was scb_canonical/lisa_canonical.toml) ══
# Columns documented in SCB's own doc library (lisa-bakgrundsfakta-1990-2017) but
# absent from the machine-export catalog. Each entry mirrors one column's doc at
# inputs:catalog/docs/markdown/lisa/<Column>.md — name, definition, documented coverage and
# (for categorical columns) the EXISTING catalog classification it links. A
# doc-coverage diagnostic, not a value-set source: no codes are minted here.
#
# Curation notes:
#  * variant follows the DOCUMENTED YEARS, not the column's closest sibling: LISA's
#    individual frame is `individer-16plus` through 2009 and `individer-15plus` from
#    2010 (curation/relations.toml), so `versions` on the wrong one names editions
#    the variant does not have. FastBet and MedbLandNamn span the change and are
#    therefore one entry per variant — still one variable, keyed (register, column).
#  * data_type uses the canonical vocabulary text|decimal|integer|date
#    (codes/identifiers -> text; *_Belopp_*/lön/ersättning -> decimal;
#    *_Bdag_*/*_Ndag_* day-counts -> integer), cross-checked against the sibling's
#    catalog data_type where one exists.
#  * classification linked ONLY where an existing catalog short_name matches the
#    column's code system (verified present in the built catalog): Ssyk3/4_J16 ->
#    SSYK96; AstSNI2002(B/G)J -> SNI2002; SektorKodJ -> SEKTORKOD (Y-170: same
#    RAMS/LISA ownership-sector family as scb/lisa/sektorkod). InstKod7J's
#    10-position institutional sector code has no catalog classification (omitted);
#    YSEG_J16/MedbLandNamn have no matching catalog classification (omitted).
#  * Column flags follow Q5 (curation triage 2026-09-27): copy the resolved
#    documented sibling where one exists (the same measure under another LISA
#    column — the J / _J16 stem, the FortPens_*/SjukBidr_* benefit family, or the
#    same payment under another delivery rule); otherwise apply the LISA
#    person-level default is_sensitive = true. is_identifier = true ONLY where that
#    sibling already carries it (so an identifier column is NOT published as
#    ordinary text, weakening the PII guard): CfarNrSregJ (sibling CFARNrSreg),
#    PeOrgNrSregJ (sibling PeOrgNrSreg), ArbstIdJ (linkage id; sibling ArbstId).
#    FastBet and MedbLandNamn have no same-measure sibling, so both take the
#    person-level default; neither is a curated identifier (FastBet's property
#    identity is the pre-1998 fastlopnr, a different variable).
#  * "justerad metod" (J) columns are SCB's single backcast year 2003, produced to
#    bridge the 2004 RAMS method change.
#  * `noted` is the date lisa_canonical.toml recorded the omission; git carries the
#    per-entry history from there.


