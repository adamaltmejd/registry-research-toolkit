# Y-313 2026-09-29: seven LISA classification-edition and KU/AGI source-basis
# partitions. Four SSYK first/second income-source families separate the delivered
# SSYK96 edition (KU literal), the delivered SSYK2012 edition (KU _2012 literal)
# and the SSYK2012 AGI source basis (the two AGI spellings are one delivered
# descriptor). Three institutional-sector families separate the 1968 (unsuffixed),
# 1999 (InstKod6), 2000 (InstKod7) and 2014 (InstKod10) Enhetsindelning coding
# editions plus the 2014 AGI source basis. This is a delivered-edition/source-basis
# distinction, NOT a sequential synonym rename, a succession edge or a claim that
# codes have identical meanings across revisions. The exact prepared v28 physical
# periods are the only availability claim; every original keeps its source variant,
# member, fields, coding and provenance.

[[identity.partition]]
variable = "34.1842"
columns = { KU1Ssyk3_2012 = "34.1842.ssyk3-storsta-2012", KU1Ssyk3 = "34.1842.ssyk3-storsta", AGI1SSYK3_2012 = "34.1842.ssyk3-storsta-2012-agi", AGI1Ssyk3_2012 = "34.1842.ssyk3-storsta-2012-agi" }
columns_ref = "Reviewed classification-edition and source-basis split; SCB docs/lisa/KU1Ssyk3.md identifies KU1Ssyk3 as Standard för svensk yrkesklassificering 1996 at Yrkesgrupp level and docs/lisa/KU1Ssyk3_2012.md identifies KU1Ssyk3_2012 as Standard för svensk yrkesklassificering 2012 at Yrkesgrupp level; docs/lisa/_changelog-2019.md documents the monthly AGI declarations replacing the annual KU from reference year 2019, and both AGI1SSYK3_2012 and AGI1Ssyk3_2012 carry that same delivered SSYK 2012 descriptor and are one source-basis owner; prepared v28 native family 34.1842: KU1Ssyk3 2001-2013, KU1Ssyk3_2012 2014-2018, AGI1Ssyk3_2012 2019 and AGI1SSYK3_2012 2020-2023. Distinct delivered classification editions and source bases, not a sequential synonym rename; no claim that codes are identical across editions."

