# LISA's AGI monthly-income family: one concept ("Löne- eller
# företagarinkomst i {månad}") × a rank axis (agi1/agi2/agi3 = största / näst
# största / tredje största förvärvskälla). #319 merged each rank's 12 month
# columns into ONE variable (slug agi1lonfink / agi2lonfink / agi3lonfink — the
# family stem), so the per-rank month-token groups no longer derive. The members
# are now plain `variable =` attachments carrying only the rank facet; the
# per-month dimension lives in `variable_alias_window` (read-time via resolve_at),
# not a concept group. The family merge runs BEFORE concept groups, so these
# merged-variable slugs resolve.

[[group]]
register = "scb/lisa"
key = "agilonfink"
label = "Löne- eller företagarinkomst per månad (AGI)"
axis = "rank"
members = [{ variable = "agi1lonfink", value = "1", label = "största förvärvskällan" }, { variable = "agi2lonfink", value = "2", label = "näst största förvärvskällan" }, { variable = "agi3lonfink", value = "3", label = "tredje största förvärvskällan" }]

# LISA ranked income-source families (#958). The AGI1/2/3 rows below are the same
# concept observed at the largest / second-largest / third-largest income source;
# the rank lives in source labels and operational definitions, so curate it as a
# real facet instead of leaving three loose browse rows.

[[group]]
register = "scb/lisa"
key = "agijobbyrk"
label = "Jobbets yrkesställning (AGI)"
axes = [{ axis = "rank", label = "Förvärvskälla" }]
members = [{ variable = "agi1jobbyrk", value = "1", label = "största förvärvskällan" }, { variable = "agi2jobbyrk", value = "2", label = "näst största förvärvskällan" }, { variable = "agi3jobbyrk", value = "3", label = "tredje största förvärvskällan" }]

[[group]]
register = "scb/lisa"
key = "agilongarant"
label = "Markering av erhållen lönegaranti (AGI)"
axes = [{ axis = "rank", label = "Förvärvskälla" }]
members = [{ variable = "agi1longarant", value = "1", label = "största förvärvskällan" }, { variable = "agi2longarant", value = "2", label = "näst största förvärvskällan" }, { variable = "agi3longarant", value = "3", label = "tredje största förvärvskällan" }]

[[group]]
register = "scb/lisa"
key = "agisektorgrp"
label = "Institutionell sektor (AGI)"
axes = [{ axis = "rank", label = "Förvärvskälla" }]
members = [{ variable = "agi1sektorgrp", value = "1", label = "största förvärvskällan" }, { variable = "agi2sektorgrp", value = "2", label = "näst största förvärvskällan" }, { variable = "agi3sektorgrp", value = "3", label = "tredje största förvärvskällan" }]

# AGI/KU FÅMANS rows share one concept and three rank levels. KU→AGI is a
# temporal source succession (see curation/relations.toml #1122); source coords
# remain on members so the folded history labels the KU/AGI handoff and each
# member has a unique coordinate.

[[group]]
register = "scb/lisa"
key = "faman"
label = "Förekomst av delägarskap i fåmansaktiebolag"
axes = [{ axis = "kalla", label = "Källa" }, { axis = "rank", label = "Förvärvskälla" }]
members = [{ variable = "agi1faman", delivery_column = "AGI1FAman", coords = [{ axis = "kalla", value = "agi", label = "AGI" }, { axis = "rank", value = "1", label = "största förvärvskällan" }] }, { variable = "agi2faman", delivery_column = "AGI2FAman", coords = [{ axis = "kalla", value = "agi", label = "AGI" }, { axis = "rank", value = "2", label = "näst största förvärvskällan" }] }, { variable = "agi3faman", delivery_column = "AGI3FAman", coords = [{ axis = "kalla", value = "agi", label = "AGI" }, { axis = "rank", value = "3", label = "tredje största förvärvskällan" }] }, { variable = "ku1faman", delivery_column = "KU1FAman", coords = [{ axis = "kalla", value = "ku", label = "KU" }, { axis = "rank", value = "1", label = "största förvärvskällan" }] }, { variable = "ku2faman", delivery_column = "KU2FAman", coords = [{ axis = "kalla", value = "ku", label = "KU" }, { axis = "rank", value = "2", label = "näst största förvärvskällan" }] }, { variable = "ku3faman", delivery_column = "KU3FAman", coords = [{ axis = "kalla", value = "ku", label = "KU" }, { axis = "rank", value = "3", label = "tredje största förvärvskällan" }] }]

# LISA `Antal barn` is a count by the child's age bucket, not an ordinal slot
# battery. The checked-in auto worklist still shows the old `barn0`...`barn21`
# slugs; the curated group pins the current variable slugs, plus the legacy
# interval/open-ended buckets from older deliveries, and names the axis semantically.

[[group]]
register = "scb/lisa"
key = "antal-barn"
label = "Antal hemmavarande barn per ålder"
axes = [{ axis = "alder", label = "Barnets ålder" }]
members = [{ variable = "antal-barn-0-ar", value = "00", label = "0 år" }, { variable = "antal-barn-1-ar", value = "01", label = "1 år" }, { variable = "antal-barn-2-ar", value = "02", label = "2 år" }, { variable = "antal-barn-3-ar", value = "03", label = "3 år" }, { variable = "antal-barn-4-ar", value = "04", label = "4 år" }, { variable = "antal-barn-5-ar", value = "05", label = "5 år" }, { variable = "antal-barn-6-ar", value = "06", label = "6 år" }, { variable = "antal-barn-7-ar", value = "07", label = "7 år" }, { variable = "antal-barn-8-ar", value = "08", label = "8 år" }, { variable = "antal-barn-9-ar", value = "09", label = "9 år" }, { variable = "antal-barn-10-ar", value = "10", label = "10 år" }, { variable = "antal-barn-11-ar", value = "11", label = "11 år" }, { variable = "antal-barn-12-ar", value = "12", label = "12 år" }, { variable = "antal-barn-13-ar", value = "13", label = "13 år" }, { variable = "antal-barn-14-ar", value = "14", label = "14 år" }, { variable = "antal-barn-15-ar", value = "15", label = "15 år" }, { variable = "antal-barn-16-ar", value = "16", label = "16 år" }, { variable = "antal-barn-17-ar", value = "17", label = "17 år" }, { variable = "antal-barn-18-ar", value = "18", label = "18 år" }, { variable = "antal-barn-19-ar", value = "19", label = "19 år" }, { variable = "antal-barn-20-ar", value = "20", label = "20 år" }, { variable = "antal-barn-21-ar", value = "21", label = "21 år" }, { variable = "barn0-3", value = "00-03", label = "0-3 år" }, { variable = "barn4-6", value = "04-06", label = "4-6 år" }, { variable = "barn7-10", value = "07-10", label = "7-10 år" }, { variable = "barn11-15", value = "11-15", label = "11-15 år" }, { variable = "barn-16-17-ar", value = "16-17", label = "16-17 år" }, { variable = "barn-18-19-ar", value = "18-19", label = "18-19 år" }, { variable = "barn18plus", value = "18-plus", label = "18 år och äldre" }, { variable = "barn20plus", value = "20-plus", label = "20 år och äldre" }]

# LISA näringsgren (#488/#931): one register-local concept group. Population is a
# facet (individ / arbetsställe / företag), not a group split; the ranked
# förvärvskälla variables share the same group under the `Källa` axis. SNI edition
# changes are temporal succession edges in curation/relations.toml, not a picker
# facet. `Metod` separates the adjusted 2003 workplace variables from their standard
# SNI2002 counterparts without overloading population/source/level. Multi-axis
# groups are representation-grained, so multi-column variables list one member per
# delivered column while keeping SNI out of the facet coordinates.

[[group]]
register = "scb/lisa"
key = "naringsgren"
