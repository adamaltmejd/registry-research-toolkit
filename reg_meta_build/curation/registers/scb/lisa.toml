# #400: canonical-attach LISA variable slugs. The 32 doc-coverage columns minted
# onto register 34 (scb/lisa) by the #400 attach loader land with auto slugs derived
# from the cryptic delivery column (`peorgnrsregj`, `astkommunj`, `aluamk`, …), which
# violate the leaf-slug canonical-form rules (DESIGN.md "Leaf-slug curation
# conventions"). Curate each to the NAME-derived canonical leaf, aligned to its
# existing register-34 sibling — exactly as #471/#747 did for every other SCB slug.
#
# Most are "enligt justerad metod" (J): SCB's single 2003 RAMS-method backcast. Each
# takes a `-justerad` role suffix off its sibling's base concept (AstKommun
# `kommun-for-arbetsstalle` → `kommun-for-arbetsstalle-justerad`, …). The MiDAS
# pension day-counts have no exact sibling (catalog siblings are MONTHS, `*-bman`/
# `*-nman`) so they take the catalog day-count convention `*-bruttodagar`/
# `*-nettodagar` on the established `fortpens-`/`sjukbidr-` stem; the MiDAS belopp
# columns share a NAME with the existing `fortpens-belopp`/`sjukbidr-belopp` rows but
# are a different measurement basis (MiDAS source/window) → default-to-distinct, a
# `-midas` discriminator keeps the join keys from conflating. The three SSYK/YSEG J16
# härledd columns keep their already-clean code-style J16-family slugs (matching the
# successors `ssyk{3,4}-2012-j16` / `eseg-j16`): `ssyk3-j16`/`ssyk4-j16` are the
# `from` endpoints of the relations.toml succession edges, so they are pinned here to
# rest those refs on a curated (not auto) basis. Every value is collision-free within
# register 34.

