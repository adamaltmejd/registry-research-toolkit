# Y-299 2026-09-30: LISA individual-pension KU-to-AGI source-basis partition.
# SCB `lisa-bakgrundsfakta-1990-2017` docs/lisa/_changelog-2019.md Tjanstepension
# documents the information disappearing from the control statements with the 2019
# AGI transition and maps KUPens (2018) to AGIPens (2019). docs/lisa/KUPens.md
# documents the amount in hundreds of kronor and that 1990 cannot be reported.
# KUPens and AGIPens share the individual employer/employee pension-agreement
# concept but are distinct source bases; this is a source-basis distinction, NOT a
# claim that the concept changed, a harmonized equivalent rename, or a succession
# edge. PTjP and SumTjp stay separate. The exact prepared v28 physical periods are
# the only availability claim.

