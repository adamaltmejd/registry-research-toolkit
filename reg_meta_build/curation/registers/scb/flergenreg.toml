[register]
provider = "scb"
slug = "flergenreg"
native_id = "349"

# Batch 2 (#496): the numbered person identifiers are repeated roles for one
# person concept, presented by ordinal position.
[[group]]
register = "scb/flergenreg"
key = "personnrf"
label = "Personnummer förälder"
axis = "ordinal"
members = [{ variable = "personnrf1", value = "1", label = "1" }, { variable = "personnrf2", value = "2", label = "2" }]

[[variant]]
native_id = "349.1177"
slug = "folkbokforda-biologiska"
display_group = "Folkbokförda personer med kopplingar till biologiska föräldrar"
panel_entity_key = "personnr"
panel_time_key = "period"
panel_time_grain = "delivery"


[[variant]]
native_id = "349.1178"
