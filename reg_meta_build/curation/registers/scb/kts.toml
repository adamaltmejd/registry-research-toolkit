[register]
provider = "scb"
slug = "kts"
native_id = "116"

[[variant]]
native_id = "116.131"
slug = "_default"
display_group = "Kommunernas och regionernas finansiella tillgångar och skulder"
# Sub-annual aggregate time series (#730, follow-up to #577): year (ar) × quarter
# (kvartal), grain = "row". MIXED population (Codex review): this variant covers BOTH
# kommuner AND regioner/landsting (separate kommun `116.36` and landsting `116.5059`
# columns), so no single panel_entity_key identifies every row — left unkeyed, a time
# series over a mixed aggregate (like byggproduktionsindex). The kvartalsutfall
# kommuner/regioner panels below ARE keyed because each is split to one population.
panel_time_key = ["ar", "kvartal"]
panel_time_grain = "row"

# Kommunalekonomisk utjämning och utjämning av LSS-kostnader mellan kommuner

