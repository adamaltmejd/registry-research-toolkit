columns = { MetLev = "135.3307.metlev", MetLev2 = "135.3307.metlev2", MetTot = "135.3307.mettot", MetTot2 = "135.3307.mettot2" }
columns_ref = "2026-10-01 SWECOV restoration, accepted prepared commit 1924eb7f3cfb00d047b0b30522758e7e8bc2f7cc. Complete accepted source family: 36 originals, four simultaneous physical columns in 2016-2024. Operational definitions distinguish delivered versus total production and quantity units 1/2. Exact literal owners retain conflicting yearly operational definitions instead of merging independently delivered fields."
data_warning = "Some source operational definitions for MetLev and MetTot change the stated quantity unit while the same physical column remains. Literal ownership preserves these conflicting descriptions; historical quantity-unit equivalence is unverified."

[[identity.partition]]
