columns_ref = "2026-10-01 SWECOV restoration, accepted prepared commit 1924eb7f3cfb00d047b0b30522758e7e8bc2f7cc. Complete accepted source family: 42 originals, NgNr (2003), Ngnr (2004), and co-delivered ASNgnr/VeNgnr (2005-2024). Later operational definitions explicitly distinguish workplace and activity-unit NR industries. The earlier NR spelling has no supplied unit attribution and remains a separate historical identity. Do not infer continuity with either later unit."

