# KSju (reg 195) näringsgren (#845): KSju has ONE register variant whose unit of
# observation is the PERSON (population: sick employees), so every näringsgren
# column is the SAME concept — the employee's workplace SNI. SCB ships several of
# these columns IN PARALLEL in the same edition (e.g. 2019–2023: Ksjusni + NGS1
# together), which the `variable_state` uniqueness index (one delivery column per
# variable × variant × period) cannot hold in one variable, so the build splits
# them into siblings. This group is the single addressable näringsgren; the
# co-delivered columns are its parallel REPRESENTATIONS, faceted only by detail
# level (`nivo`). There is NO entity axis (all are the person's workplace SNI), and
# vintage spellings ride each variable's own state timeline / `replaced_by`
# succession rather than a facet. Representation-grained (one member per live
# delivery column), like the IoT family below. Retires #261 fold_override, which
# could only "fold" by dropping all-but-one co-delivered column per period (lossy).

# 5-siffrig SNI — two parallel current deliveries (FDB- vs RAMS-derived); the
# `naringsgren` variable's earlier `NG1_2007` (2006–08) rides its own timeline.

# Grupperad SNI — lgrp (2009) is the representation-grain predecessor of NgGr1
# (2010–11); the succession edge is authored in curation/relations.toml.

# 2-siffrig SNI

[[group]]
register = "scb/ksju"
key = "naringsgren"
label = "Näringsgren"
axes = [{ axis = "nivo", label = "Detaljnivå" }]
members = [{ variable = "naringsgren", delivery_column = "NGS1", coords = [{ axis = "nivo", value = "5-siffer", label = "5-siffrig SNI (FDB)" }] }, { variable = "naringsgren-rams", delivery_column = "Ksjusni", coords = [{ axis = "nivo", value = "5-siffer", label = "5-siffrig SNI (RAMS)" }] }, { variable = "naringsgren", delivery_column = "NgGr1", coords = [{ axis = "nivo", value = "grupperad", label = "Grupperad SNI" }] }, { variable = "naringsgren-grupperad-2009", delivery_column = "lgrp", coords = [{ axis = "nivo", value = "grupperad", label = "Grupperad SNI (2009)" }] }, { variable = "naringsgren-2siffer", delivery_column = "bransch", coords = [{ axis = "nivo", value = "2-siffer", label = "2-siffrig SNI" }] }]

# Five owned literals come from concept_groups.toml group scb/ksju/naringsgren
# members 0..4 (tracked); NG1_2007 -> ng1-2007 was read from the fqid_slugs/scb.toml
# comment "NG1_2007/NgGr1/NGS1" and is script-only:
# archive/.../2026-09-16-goal-run/convert_partial_owned_partition.py:35,39.
# v18: accepted-column-partitions:scb-registerinformation:195.4027 = 31 identity
# effects (Ksjusni 13, NGS1 10, NgGr1 5, NG1_2007 1, bransch 1, lgrp 1); the 19
# columns below keep their native identity (scopes/8944ed66f8e31afa3c25.json.gz).

[[identity.partition]]
variable = "195.4027"
columns = { Ksjusni = "195.4027.ksjusni", NG1_2007 = "195.4027.ng1-2007", NGS1 = "195.4027.ng1-2007", NgGr1 = "195.4027.ng1-2007", bransch = "195.4027.bransch", lgrp = "195.4027.lgrp" }
unassigned_columns = ["NG1", "NgGr1_2002", "NgGr2", "NgS1", "NgS1_2002", "Sni1", "Sni2", "SniA", "bgr98", "bgr98n", "bgr98t", "bgr98u", "bgr98x", "ng1", "nggr2_2002", "ngs1", "ngs1_2002", "sni2", "snigrupp"]
columns_ref = "curation/concept_groups.toml group scb/ksju/naringsgren members 0..4; fqid_slugs/scb.toml comment on 195.4027.ng1-2007 names the NG1_2007/NgGr1/NGS1 alias chain. Other columns have no ownership declaration."
