[classification]
short_name = "ISCED-F2013"
slug = "isced-f2013"
name = "ISCED Fields of Education and Training 2013"
name_en = "ISCED Fields of Education and Training 2013"
publisher = "UNESCO"
valid_from = 2013
url = "https://uis.unesco.org/en/topic/international-standard-classification-education-isced"
codes_file = "isced-f2013.csv"

[binding]
value_set_labels = [
  "ISCED-F 2013 - Inriktning",
  # Mixed source label: AES 2016/`utbildningsinriktning-isced` 2022 use the
  # real ISCED-F broad value set, while AES 2022 `fedfield`/`nfefield` use a
  # Swedish 1-20 recode under the same label. Keep the label here so the real
  # states link; the classification-conformance gate severs the recode states.
  "ISCED F 2013",
]

# Education (ISCED) — the variable slug itself names the classification; the codes
# coincide with other numeric families but the labels are the ISCED level / field
# names verbatim.
[[binding.variable]]
variable = "scb/ureg/isced-f-2013"
note = "curated:#494 ISCED-F 2013 field-of-education labels"
