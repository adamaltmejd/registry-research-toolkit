# KVÅ is published upstream as two disjoint code spaces — KMÅ (medical) and
# KKÅ (surgical) — but SOS registers reference it as ONE åtgärd field mixing
# both. Merged into a single classification (kva.csv = KMÅ ∪ KKÅ). The ~50
# 1–2-character codes that appear in both TSVs are organizational chapter/section
# headers (e.g. KMÅ "A" = "Utredning, anatomiskt perspektiv"; KKÅ "A" =
# "Operationer på nervsystemet") — cross-space collisions, not shared semantics.
# These headers are never leaf åtgärd codes referenced by registers, so keeping
# the KMÅ label on collisions is a cosmetic choice; all disjoint 5-char leaf
# codes are preserved with correct labels. See
# scripts/fetch_sos_classifications.py for the upstream fetch+merge.

[classification]
short_name = "KVA"
aliases = [
  "Klassifikation av vårdåtgärder (KVÅ) - Socialstyrelsen",
  "https://www.socialstyrelsen.se/statistik-och-data/klassifikationer-och-koder/kva/",
]
slug = "kva"
name = "Klassifikation av vårdåtgärder (KVÅ)"
name_en = "Swedish Classification of Health Interventions (KVÅ)"
publisher = "Socialstyrelsen"
url = "https://samarbetsyta.ehalsomyndigheten.se/download/attachments/451267009/kva-medicinska-atgarder-kma.tsv?version=2&modificationDate=1779616677863&api=v2"
codes_file = "sos/kva.csv"

[binding]
label_source = "sos"
