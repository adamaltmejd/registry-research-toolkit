# Curated period column-family merges (#319) — at curation/period_family_merges.toml;
# see period_family_merges.py.
#
# Each [[period_family]] folds the period-named delivery columns under a
# `family_stem` (today the 12 month-named columns) into ONE variable
# (slug = family_stem), keeping an ANNUAL variable_state per delivery year. Each
# column's validity window lands in `variable_alias_window` so
# resolve_at("YYYY-MM") picks that period's column. The merge runs BEFORE variable
# slugs (members are matched by delivery_column_name, folded to slug form, ending
# in a period token); a stem that resolves to no coherent period family FAILS the
# build (EXIT_CONFIG).
#
# This is NOT an era-RENAME of never-co-occurring columns (the retired
# [[column_merge]] surface, #846): a period family is deliberately PARALLEL
# columns, the opposite. Era renames are now representation-grain replaced_by
# succession edges (curation/relations.toml).
#
# Scope (#383, follow-up to #319): the 4 LISA families plus the 4 non-LISA
# monthly families the corpus actually carries (scb bas/jobbink,
# ekonomiskt-bistand/ibel, ekonomiskt-bistand/sbel, rams/lonfink) — all
# enumerated against the real corpus, all 12-month and bounded-delivery-year.
# HSL was checked and carries no ≥3-month family (no SOS register surfaces a
# monthly family), so it is intentionally absent.

[[period_family]]
register = "scb/lisa"
family_stem = "lonfink"
label = "Löne- eller företagarinkomst per månad"

[[period_family]]
register = "scb/lisa"
family_stem = "agi1lonfink"
label = "Löne- eller företagarinkomst per månad (största förvärvskällan)"

[[period_family]]
register = "scb/lisa"
family_stem = "agi2lonfink"
label = "Löne- eller företagarinkomst per månad (näst största förvärvskällan)"

[[period_family]]
register = "scb/lisa"
family_stem = "agi3lonfink"
label = "Löne- eller företagarinkomst per månad (tredje största förvärvskällan)"

[[period_family]]
register = "scb/bas"
family_stem = "jobbink"
label = "Löne- eller företagarinkomst per månad"

[[period_family]]
register = "scb/ekonomiskt-bistand"
family_stem = "ibel"
label = "Introduktionsersättning per månad"

[[period_family]]
register = "scb/ekonomiskt-bistand"
family_stem = "sbel"
label = "Socialbidrag per månad"

[[period_family]]
register = "scb/rams"
family_stem = "lonfink"
label = "Löne- eller företagarinkomst per månad"
