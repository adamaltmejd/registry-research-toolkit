# Scope follows what the fact is about: these are global SCB survey columns, not
# steward-local flavor rows. Columns already carrying a delivery alias in
# curation/delivery_enrichment.generated.toml are excluded upstream, so a delivered column resolves to
# ONE catalog variable. `holdings_period` throughout (Y-213): each entry dates the
# holdings list at dataset grain as one pooled range, since naming every edition
# would rot the next time SCB ships one. A holdings list names no type, so these
# carry no `data_type`; the survey delivery lists document most residual wave items
# by code only, so `name`/`definition` repeat the orderable code until richer public
# labels exist. `noted` is the date variable_grafts.toml recorded the omission.

