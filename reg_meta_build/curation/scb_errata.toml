# investigation established from reg_webapp/stewards/swecov/inventory.toml and
# SCB's Registerinformation.csv (2026-03-09 export). Grammar: curation/scb_errata.toml
# header. NOT included: the coalescer-defect misses (HREG sokande
# KursOrt/ProgOrt/YProg) — see report.md.

# ── scb/agi — SCB documents AGI as two annual stream versions per year
# ("<year>, löne- och förmånsutbetalningar" / "<year>, sociala ersättningar")
# and stops at 2020; SWECOV holds the monthly Arb_/Soc_ tables through 2023-12.
# Three annual löne-stream versions cover every held month edition (the
# coalescer reads "2021, …" as the whole of 2021). All 40 columns are present in
# the clone source "2020, löne- och förmånsutb" (regver 17967), which is the
# nearest documented edition for every one of them.

[[version]]
register = "scb/agi"
variant = "individuppgifter-agi"
name = "2021, löne- och förmånsutbetalningar"
evidence = "SWECOV holds Arb_AGIIndivid202101_Def … Arb_AGIIndivid202112_Def (12 monthly tables, 62 columns each, partition arb) and Soc_AGIIndivid202101_Def … Soc_AGIIndivid202112_Def (12 monthly tables, 16 columns, partition soc) for 2021-01..2021-12; SCB's Registerinformation export documents individuppgifter-agi only as the 2019 and 2020 löne-/sociala-stream versions. Named in SCB's own löne-stream token convention (its 2019 spelling) so that `scb_errata_now_present` retires it when SCB ships the version."
noted = "2026-09-12"

