# SCB export errata (Y-114, Y-116) — the running log of what SCB's
# `Registerinformation.csv` does not say about SCB's own delivery.
#
# An entry states "SCB delivered this, but its own machine metadata does not say
# so", with the evidence that establishes it. The build replays each entry as a
# synthetic Registerinformation row INSIDE the SCB adapter, before coalescing, so
# the correction is made at SCB's own grain: windows, gaps, fusing, alias
# windows, types, value sets and classification backfill all fall out of the
# existing passes. This is NOT a `variable_state` override surface — see
# reg_meta_build/DESIGN.md → Curation surface taxonomy.
#
# Three typed entry kinds:
#
#   [[version]]    register = "<provider>/<register>"   # 2-segment FQID
#                  variant  = "<variant-slug>"
#                  name     = "<Registerversionnamn>"   # SCB's token, verbatim
#                  evidence = "..."                     # why we know it exists
#                  noted    = "YYYY-MM-DD"
#     Adds any register version SCB has not documented. Era order follows the
#     maximum year an edition claims; a declared historical version therefore
#     does not replace a newer documented edition's latest spelling or type.
#     The name must contain a parseable four-digit year
#     (`scb_errata_version_year_unknown`).
#
#   [[delivered]]  register = "<provider>/<register>"
#                  variant  = "<variant-slug>"
#                  column   = "<Kolumnnamn>"            # SCB's spelling
#                  versions = ["<name>", ...]           # SCB's tokens, verbatim
#                  evidence = "..."
#                  noted    = "YYYY-MM-DD"
#                  upstream = "..."                     # optional error class
#     Adds the column-in-version rows SCB omitted for a column it documents
#     ELSEWHERE on the variant — the entry CLONES that real row. The column must
#     already have one (`scb_errata_no_source_row`); a column SCB documents
#     nowhere is a [[column]]. Name each version once; one entry carries every
#     omitted version of its column.
#
#   [[column]]     register = "<provider>/<register>"
#                  variant  = "<variant-slug>"
#                  column   = "<Kolumnnamn>"            # SCB's spelling
#                  name     = "..."                     # the variable's own
#                  definition = "..."                   #   identity — there is
#                  data_type  = "text|decimal|integer|date"   # optional
#                  classification = "<short_name>"      # optional catalog link
#                  is_identifier  = true                # optional, default false
#                  is_sensitive   = true                # optional, default false
#                  versions = ["<name>", ...]  OR  holdings_period = "YYYY-YYYY"
#                  source   = "scb-docs" | "steward-holdings"
#                  evidence = "..."
#                  noted    = "YYYY-MM-DD"
#     Adds a column SCB documents NOWHERE on the variant. There is no row to
#     clone, so the entry carries the variable identity and the build MINTS it:
#     one `variable` (`provider_key` = the delivery column) plus one synthetic
#     row per version. `holdings_period` dates a holdings list at dataset grain as
#     one pooled range; the loader still accepts the legacy undated `all_versions`
#     reading.
#     The variable is keyed on (register, column), NOT the variant: a column
#     delivered on two variants of one register is ONE variable with a state per
#     variant, so those two entries must describe the same variable.
#     `source` records the evidence CLASS, not a behavior — the build mints the
#     same rows either way.
#
# [[delivered]] and [[column]] partition one question exactly: the first refuses
# a column with no real row on the variant, the second refuses a column that HAS
# one. One column of one variant is one entry of one kind.
#
# Versions are named, never dated: the version name is the coordinate SCB itself
# publishes, and the build already parses its period.
#
# RETIRING AN ENTRY: the build FAILS with `scb_errata_now_present` once SCB ships
# the row, and names the version it fixed. Retire exactly that much — drop the
# version from `versions` when the entry's other versions are still omitted,
# delete the entry when it was the last one. Git keeps the record of the upstream
# error. Never edit an entry to keep a failing build green.

[[delivered]]
register = "scb/lisa"
variant = "individer-15plus"
column = "DispInkKE"
versions = ["2010", "2011", "2012"]
upstream = "omitted-column-in-version"
evidence = """SCB's own LISA documentation gives DispInkKE as delivered from 1998 \
onwards, and SWECOV's holdings list the column in Individ_2010, Individ_2011 and \
Individ_2012; SCB's Registerinformation export documents those three versions but \
carries no row for the column. See reg_meta_build/docs/lisa/DispInkKE.md."""
noted = "2026-09-11"

[[delivered]]
register = "scb/lisa"
variant = "individer-15plus"
column = "DispInkKE04"
versions = ["2010", "2011", "2012"]
upstream = "omitted-column-in-version"
evidence = """The 2004-definition twin of DispInkKE, co-delivered with it: SWECOV's \
holdings list DispInkKE04 in Individ_2010, Individ_2011 and Individ_2012, and SCB's \
Registerinformation export documents those three versions but carries no row for the \
column. See reg_meta_build/docs/lisa/DispInkKE.md for the family's delivery span."""
noted = "2026-09-11"

