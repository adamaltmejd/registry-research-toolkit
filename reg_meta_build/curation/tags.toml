# Curated thematic tags (#311).
#
# Tags are broad, cross-register and search-only (#1794): a topic a researcher types
# before knowing the register, with members in several registers. One concept's variants
# within a register are a concept group, not a tag. Comparing one concept across
# registers goes through the broad tag with one starred member per register, whose note
# says how it differs. References are exact FQIDs; no pattern inference.

