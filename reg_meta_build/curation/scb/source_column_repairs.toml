# SCB pre-state source-column repairs (see reg_meta_build/DESIGN.md →
# Build-time triage (SCB)) — see reg_meta_build/source_column_repairs.py.
#
# The [[column_merge]] maintainer surface repairs a var_id's SCB delivery columns
# BEFORE the coalescer/triage emits states. It is keyed on (register_id, var_id)
# — the stable SCB source ids (RegisterId + VarId == variable.provider_key) — and
# case-folds its columns to the rule-2 connectivity key at load, so TOML casing
# is cosmetic.
#
#   [[column_merge]] — assert that NEVER-co-occurring delivery columns of one
#     var_id are the SAME concept, so the coalescer's rule-2 union-find treats
#     them as ONE node-col from the start (upstream of triage). The case for an
#     era RENAME (`PNR` → `PersonNr`): the two headers never share an edition, so
#     they form separate union-find components — and once the var_id is a split
#     container (other columns DO co-deliver), each component shards into its own
#     sibling variable, splitting one identity's history across fragments.
#
# NOT this surface:
#   - case/diacritic twins (`PersonNr`/`Personnr`, `Kon`/`Kön`) — collapsed
#     automatically (the connectivity key is case-folded);
#   - two value-set codings on ONE column in one period — codelivery.toml;
#   - the same column attributed to SEVERAL var_ids (#197) — cross-var_id
#     sharing is unrepresentable here by construction (the key is per-var).
#
# One [[column_merge]] is ONE group for one (register, var); a var with two
# independent groups gets two entries with that same key. A group spanning
# MULTIPLE var_ids is unrepresentable by construction (good — the key is per-var).
#
# The build FAILS (EXIT_CONFIG) on bad curation: a named column never observed as
# a delivery column of the var, a typo, a stale entry, or a duplicate /
# overlapping group. An empty file is a no-op — connectivity stays exactly as the
# case-folded rule-2 intersection decides.

# ── [[column_merge]] entries ────────────────────────────────────────────────
# Every entry below is verified against the raw SCB Registerinformation source:
# the named columns NEVER share a (variant, edition) bucket and carry the SAME
# role (never merge a subject key with a relation column — RTB's
# personnrmor/personnrsamh CO-occur with personnr and correctly stay split
# siblings).

# ── RTB (reg 2) subject personnummer: era rename `pnr` → `personnr` ──
#    The #196 canonical case: var 57 ("Personnummer") delivered as the legacy
#    `pnr` header in early editions and `personnr` later, never co-occurring.
#    Without the merge the var (a split container via the co-delivered
#    relation-pnr columns) shards the subject key into a sparse legacy `pnr`
#    fragment + the well-materialized `personnr` — and the A4.4d panel keys
#    ended up pinned to the sparse fragment.
[[column_merge]]
register_id = 2
var_id = 57
columns = ["pnr", "personnr"]

# ── FRIDA (reg 121) firm key: era rename `borgnr` → `persorgnr` → `borgnr` ──
#    var 56 ("Person-/organisationsnummer"): the Punktskatter variant delivers
#    the firm key as `persorgnr` for 2014-2017, exactly filling the gap in
#    `borgnr`'s 2007-2023 coverage there; the two never co-occur. The variant's
#    OTHER var-56 columns are different ROLES and stay split: `bpnr` (the
#    person-side key) and `borgnr_bolag` (N3B's referenced partnership) both
#    CO-occur with `borgnr`. See #197 for the full FRIDA borgnr resolution.
[[column_merge]]
register_id = 121
var_id = 56
columns = ["borgnr", "persorgnr"]
