# Delivery-list enrichment overlay — global build (#365 PR1a).
#
# GENERATED, do not hand-sort. Source: SWECOV delivery / variable lists
# (untracked input_data/swecov/) -> build_catalog.py `globals` ->
# derived/global_enrichment.json -> projected here against a fresh reg_meta.db.
#
# [[description]] gap-fills an EMPTY variable.description only. Generation guards:
#  1. exact column grounding — the delivery column (pseudonym P1105_LopNr_ prefix
#     stripped) must equal one of the variable's real delivery columns; no fuzzy
#     grounding.
#  2. generic survey/helper codes excluded (^F\d+ / ^FR\d+ / ^help\d*) — they
#     collide across surveys and mis-ground (e.g. utbildningsanalyser F-items).
#  3. version-axis SUN slugs (^sun\d{4}) deferred to the version-axis fold (#375).
#  4. grade (betyg-) variables never take a participation (deltar) description —
#     the SVA column is overloaded (grade vs participation flag).
# Projection also: whitespace collapsed, trailing footnote "*" stripped, and
# (register, variable) pairs with conflicting cross-vintage descriptions dropped.
# 366 backfills across 27 registers.

