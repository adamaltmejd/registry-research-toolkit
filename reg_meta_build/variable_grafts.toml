# Variable grafts (#365 PR1d, #856) — mint catalog variables reg_meta lacks but the
# steward delivers, onto an EXISTING (register, variant). GENERATED from
# maintainer-local SWECOV review artifacts under input_data/swecov/derived/:
# build_catalog.py `grafts` for the original #405 curated set, plus the #856
# survey-wave residue in steward_coverage.json (FOU/CIS/IT).
#
# Scope follows what the fact is about: these are global SCB survey columns,
# not steward-local flavor rows. Slug auto-derives from the delivery column at
# build time (the pass runs before populate_variable_slugs);
# source_label="swecov-graft"; data_type absent ⇒ NULL.
#
# 1889 grafts total. The #856 survey-wave block contributes 1809 unique
# (register, variant, column) grafts after collapsing 1992 physical unresolved
# SWECOV holdings across duplicate IT Mikro/Stora delivery columns. The survey
# delivery lists document most residual wave items by code only, so those
# entries deliberately use description=<column> to keep the orderable code as
# the variable name until richer public labels exist.

