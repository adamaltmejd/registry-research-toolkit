# Markdown formatter + linter. Run through `scripts/gate.py lint`, which pins the
# panache-cli version (uvx otherwise grabs the latest, drifting local runs from CI).
# gfm flavor uniformly: GitHub-rendered hand-written docs and the generated LISA docs both
# use standard markdown links (the parser emits [X](X.md), not Obsidian [[wiki-links]]).
# gfm keeps `smart` off → no quote/dash rewriting of the Swedish register text.
flavor = "gfm"

# _raw is untracked marker output; AGENTS.md is agent config, not a rendered doc.
extend-exclude = [
  "reg_meta_build/docs/_raw/",
  "AGENTS.md",
]

[extensions]
# gfm enables bare-URI autolinking, which misfires on `word:` inside emphasis
# (reads it as a `scheme:` URI and rewrites valid text into a broken link).
# GitHub autolinks on render anyway, and the LISA parser wraps real URLs in <>.
autolink-bare-uris = false

[format]
wrap = "reflow"
line-width = 88  # match ruff's default line-length for one project-wide width
