# The SCB metadata export, byte-exact as received: a release asset of the inputs
# repository, fetched with `gh release download scb-raw-2026-03` into `<assets>/`.
[[input]]
name = "scb-export"
reader = "scb"
release = "scb-raw-2026-03"
path = "current-scb-inputs.zip"
sha256 = "a1e081e94e966af9d21cc68bfc7e1968c120c924f3f692a79bfef2366d94d2ff"
provider = "scb"

# The LISA workbook is attached to r34 through ordinary curation (D-8), generated in
# D by scripts/rebuild_attach_lisa.py from the lisa reader's frames and section map
# (both since deleted). Its standalone register is retired.

# scb/moa (Registret över migrations- och asylstatistik) is transcribed from SCB's
# "Migrationsstatistik i Sverige" (2014), Bilaga 6,
# https://regeringen.se/contentassets/416ba8f3128347d3a8625b664250ae83/b3f83850.pdf, with
# field names from the STATIV 2022 and 2024 documentation; all three are pinned under
# catalog/evidence/scb-moa/ in the inputs repository. No licence stated.
[[input]]
name = "scb-transcription"
reader = "transcription"
path = "catalog/source/transcriptions/scb"
provider = "scb"

# Parsed LISA documents. markdown.toml translates workbook subjects through the same
# reviewed attachment map; names without a match remain unresolved and searchable.
[[input]]
name = "lisa-docs"
reader = "markdown"
path = "catalog/docs/markdown/lisa"
provider = "scb"
register = "r34"

# PDFs pinned by hash in related_documents.toml; their subjects are the list's register keys.
[[input]]
name = "related-docs"
reader = "pdf-list"
path = "catalog/docs/related"
provider = "scb"

