# as catalog/evidence/IAF/astatdokumentation.pdf in the inputs repository. No licence
# stated.
[[provider]]
pid = "iaf"
name = "Inspektionen för arbetslöshetsförsäkringen"

# Source: the UGU codebooks ("Codebook for UGU <year>", 11 cohorts),
# https://www.gu.se/utvardering-genom-uppfoljning/kodbocker, pinned byte-exact as the
# inputs repository release gu-ugu-codebooks-2026-11-06 (hashes in
# catalog/evidence/gu/ugu-codebooks.json). No licence stated.
[[provider]]
pid = "gu"
name = "Göteborgs universitet"

[[provider]]
pid = "sos"
name = "Socialstyrelsen"

# Source: UHR's documentation of its statistics database ("Framställande av sökande- och
# antagningsstatistik för VHS", 2009–2013) and the ASTA_STATISTIK table list, pinned under
# catalog/evidence/uhr/ in the inputs repository. No licence stated.
[[provider]]
