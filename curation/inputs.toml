name = "Universitets- och högskolerådet"

# The fk MiDAS registers foraldrapenning and sjukpenning also follow two FK
# publications, pinned under catalog/evidence/fk/ in the inputs repository: PM 2020:2
# "MiDAS föräldrapenning" (dnr 007188-2020),
# https://www.forsakringskassan.se/download/18.5b8b0bec183b9d817dc11e/1666183907826/midas-foraldrapenning-pm-2020-2.pdf,
# and "MiDAS Sjukpenning och rehabiliteringspenning", version 1.02 (2011),
# https://www.forsakringskassan.se/download/18.5b8b0bec183b9d817dc11f/1666183936381/dokumentation-av-midas-sjukpenning-och-rehabiliteringspenning.pdf.
# No licence stated.
[[input]]
name = "fk-transcription"
reader = "transcription"
path = "catalog/source/transcriptions/fk"
