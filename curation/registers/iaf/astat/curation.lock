{"objects":{"370e40706a2e021890ff3972f6a57ad5eb3b91b11b79ad5de917308fb09ce53d":{"fields":{"cadence":null,"coverage":["0001-01-01","9999-12-31"],"description":"Tabellens uppgifter visar hur lång tid som vederbörande haft arbetslöshetsersättning i annat EU-/EES-land och i vilket land. Arbetslöshetskassornas administrerar inte utbetalningarna av ersättning till dem som under begränsad tid har rätt att vistas i annat EU-/EES-land och söka arbete med bibehållen svensk arbetslöshetsersättning (beviljade enligt intyg e303). Ersättningen bygger dock på svenska arbetslöshetsförsäkringens regelverk och finansieras via samma regelverk i statens budget. Arbetslöshetskassornas ska därför registrera och bokföra kostnaderna. Ersättningen utbetalas av sökandelandet och Arbetsförmedlingen ersätter i efterhand sökandelandet. IAF ger arbetslöshetskassornas i uppdrag att registrera vissa uppgifter. Begreppet Eesutbetalning härrör från det mellan länderna träffade Eesavtalet 1994.","from":null,"kind":"table","locator":{"at":"row=10","input":"catalog/source/transcriptions/iaf/tables.csv"},"name":"Eesutbet","period":["0001-01-01","9999-12-31"],"provider":"iaf","register":"astat","table":"eesutbet","table_slug":"eesutbet","to":null},"locator":{"at":"row=10","input":"catalog/source/transcriptions/iaf/tables.csv"}},"9ebff5c7e5c433f39809f7f0cf02be01ca9af09f93fb043629293c39f67ae2f8":{"fields":{"cadence":null,"coverage":["2000-01-01","9999-12-31"],"description":"Databasen ASTAT hos Inspektionen för arbetslöshetsförsäkringen (IAF) med individuppgifter från arbetslöshetskassorna om arbetslöshetsersättning: utbetalningar, ersättningsperioder, beslut, spärrar, medlemskap, återkrav och återbetalningar, kassakort, studier, deltidsveckor, aktivitetsstödsdagar, EU/EES-utbetalningar och underrättelser från Arbetsförmedlingen.","from":"2000-01-01","kind":"register","locator":{"at":"row=2","input":"catalog/source/transcriptions/iaf/registers.csv"},"name":"ASTAT","period":["2000-01-01","9999-12-31"],"provi