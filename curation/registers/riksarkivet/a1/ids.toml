# Public ids of riksarkivet/a1. A variable's id is the slug of its latest label where that slug is
# unique in the register, else the label slug with its column appended (the column alone where
# the label slug is longer than 40 characters; a label equal to its column is no label).
# personnr: a1 keeps one personnr-<column> per record type, as arpost holds two personnummer
# columns. A column whose meaning changes over time inside one table (antbt, antbt_1, ar_023,
# aleh, ort2, alt_sekt, vaga*_vaga1), a filler, and the atb and motsv parts (they also change
# over time) take their column, with the table appended on atb and motsv.
# A column that means different things in different tables is split in curation.toml; each
# part takes the label slug of its own table. Written with the provider's onboarding, 2026-11-13.
[tables]
"arpost" = "arpost"
"alpost" = "alpost"
"btpost" = "btpost"
"smpost" = "smpost"
"aepost" = "aepost"
"fupost" = "fupost"
"sopost" = "sopost"

