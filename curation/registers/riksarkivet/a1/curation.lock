{"objects":{"04409f6f55b1471dc207e0f047ee4e0f3894fa64dd6e3bece00a0c02289a428d":{"fields":{"cadence":null,"coverage":["1977-07-01","1992-06-30"],"description":"Centralt antagningssystem för anmälan och antagning till grundläggande högskoleutbildning: omfattar samtliga som sökt utbildning centralt (anmälningstid 1 april respektive 1 oktober). Antagningsresultat efter avslutad antagning vid UHÄ finns registrerat; antagningar på grund av lokala beslut finns inte registrerat. Levereras som en fil per posttyp och termin: ansökan, sökalternativ, betyg, ämnesmeriter, arbetslivserfarenhet, föreningsmeriter (HT1977–VT1982) och ämnen för särskild behörighet (HT1982–VT1992). Upprättat av Universitets- och högskoleämbetet (UHÄ); levererat till och konverterat av Riksarkivet. Höstterminen 1992 täcks varken av A1 eller av H97.","from":"1977-07-01","kind":"register","locator":{"at":"row=3","input":"catalog/source/transcriptions/riksarkivet/registers.csv"},"name":"Antagningsregistret A1 (UHÄ), HT1977–VT1992","period":["1977-07-01","1992-06-30"],"provider":"riksarkivet","register":"a1","table":null,"table_slug":null,"to":"1992-06-30"},"locator":{"at":"row=3","input":"catalog/source/transcriptions/riksarkivet/registers.csv"}},"2640605dc5fcbc9669a68a898347eb12bef21ce3f6c70a9db0968268a201ae87":{"fields":{"cadence":null,"coverage":["1977-07-01","1992-06-30"],"description":"Sökalternativ: en post per sökalternativ (högst 12 per anmälan) med urvalsgrupper (kvotgrupper), status, poäng och reservplats per urvalsgrupp. Riksarkivet har lagt till en räknare 1-12 som anger prioritetsordningen. Fil HT_yy_ALPOST / VT_yy_ALPOST.","from":"1977-07-01","kind":"table","locator":{"at":"row=3","input":"catalog/source/transcriptions/riksarkivet/tables.csv"},"name":"Sökalternativ (ALPOST)","period":["1977-07-01","1992-06-30"],"provider":"riksarkivet","register":"a1","table":"alpost","table_slug":"alpost","to":"1992-06-30"},"locator":{"at":"row=3","input":"catalog/source/transcriptions/riksarkivet/tables.cs