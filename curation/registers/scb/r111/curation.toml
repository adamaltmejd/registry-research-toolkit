evidence = "Källkolumnen har en annan ägare för ett annat begrepp. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0299: Båda anger avsaknad av arbeten inom utbildningsområdet som orsak till bristande matchning. membership-0300: Samtliga är namngivna orsaker till bristande utbildningsmatchning, även alternativet om pandemiförändrade arbetsuppgifter. membership-0301: Variablerna anger en orsak eller fritext om varför arbetet inte överensstämmer med utbildningen. membership-0302: Aktuella etiketter anger alternativ till frågan om orsaker till bristande matchning, inklusive annan anledning och vet inte. Den äldre periodkonflikten för f5-6 ändrar inte stödet i aktuell etikett. membership-0303: Fr12 mäter enligt aktuell etikett bristande överensstämmelse, inte dess orsaker. Övriga valda matchningsvariabler mäter också graden eller förekomsten av matchning. membership-0304: Ingen vald variabel anger orsaker till bristande utbildningsmatchning; valda matchningsmått anger graden av överensstämmelse. membership-0305: Etiketterna anger orsaker till bristande utbildningsmatchning och deras alternativ. Stud skäl i andra perioder bedöms separat efter sina egna etiketter. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0299: Valda matchningsvariabler mäter orsaker till avvikelse, medan variabler med relaterad kolumnhistorik mäter andra begrepp. membership-0300: Samtliga mäter utbildningens överensstämmelse med arbetet. Svårighet att få matchat arbete och orsaker till avvikelse är andra begrepp. membership-0301: Ingen vald variabel mäter graden av ämnesmatchning. Valda orsaksvariabler och förberedelsebedömningen mäter andra begrepp. membership-0302: Aktuella etiketter anger överensstämmelse mellan utbildning och arbete. Orsaksalternativen mäter ett annat begrepp. membership-0303: Variablerna mäter överensstämmelse mellan utbildning och arbete. Fr12 inkluderas eftersom fast definition uttryckligen omfattar omvänd kodning av bristande matchning. membership-0304: De aktuella etiketterna och beskrivningarna anger överensstämmelse mellan utbildning och arbete. Återanvändning av F22 i en annan period ändrar inte detta stöd. membership-0305: Båda mäter arbetets överensstämmelse med utbildningens område. Orsaker till bristande matchning och förändrade arbetsuppgifter ingår inte.\ncatalog:occurrence:249776\ncatalog:occurrence:249872\ncatalog:variable_text:29358:17167:17348\ncatalog:variable_text:29367:19174:19358\ncatalog:variable_text:29423:15796:15826\ncatalog:variable_text:29486:12478:12509\ncatalog:variable_text:29499:19358:19539\ncatalog:variable_text:29549:19174:19358\ncatalog:variable_text:29552:17167:17348\ncatalog:variable_text:29612:17167:17348\ncatalog:variable_text:29618:17167:17348\ncatalog:variable_text:29621:19358:19539\ncatalog:variable_text:29635:18078:18262\ncatalog:variable_text:29641:18628:18809\ncatalog:variable_text:29715:11017:11048\ncatalog:variable_text:29834:19174:19358\ncatalog:variable_text:29920:18628:18809\ncatalog:variable_text:29995:17167:17348\ncatalog:variable_text:29996:17167:17348\ncatalog:variable_text:29997:17167:17348\ncatalog:variable_text:29998:17167:17348\ncatalog:variable_text:29999:17167:17348\ncatalog:variable_text:30000:18628:18809\ncatalog:variable_text:30001:18628:18809\ncatalog:variable_text:30002:18628:18809\ncatalog:variable_text:30003:18628:18809\ncatalog:variable_text:30004:18628:18809\ncatalog:variable_text:30005:18628:18809\ncatalog:variable_text:30006:13208:13239\ncatalog:variable_text:30007:19358:19539\ncatalog:variable_text:30008:11747:11778\ncatalog:variable_text:30009:19174:19358\ncatalog:variable_text:30010:12478:12509\ncatalog:variable_text:30035:18078:18262\ncatalog:variable_text:30050:17167:17348\ncatalog:variable_text:30051:17167:17348\ncatalog:variable_text:30052:17167:17348\ncatalog:variable_text:30053:17167:17348\ncatalog:variable_text:30054:17167:17348\