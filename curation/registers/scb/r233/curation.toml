[[statement]]
kind = "set"
subject = "set:svensk-utlandsk-bakgrund"
fields = { "description" = "Om eleven har svensk eller utländsk bakgrund, i tre eller fyra kategorier, härlett från elevens och de biologiska föräldrarnas födelseland enligt Befolkningsregistret. Svensk bakgrund har elever födda i Sverige med minst en svenskfödd förälder; utländsk bakgrund har elever födda utomlands och elever födda i Sverige med båda föräldrarna födda utomlands. I UtlBakGr och den fyrdelade varianten antas en förälder med saknat födelseland vara född inrikes om eleven är inrikes född och utrikes om eleven är utrikes född. Elever med okänd bakgrund räknas i Utl_BakG till svensk bakgrund, i den fyrdelade varianten räknas elever utan uppgift om eget födelseland till svensk bakgrund, och i UtlBakGr anges uppgift saknas när födelseland saknas för både eleven och föräldrarna." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nAntagandet om saknat föräldrafödelseland står bara i OP för utlbakgr och utlsvbakg; hanteringen av okänd bakgrund skiljer sig per variant.\ncatalog:variable_text:29987:10879:10880\ncatalog:variable_text:29987:13801:13802\ncatalog:variable_text:29987:15628:15629\ncatalog:variable_text:29987:15993:15994\ncatalog:variable_text:29988:16358:16359\ncatalog:variable_text:29989:16358:16359\ncatalog:variable_text:29989:18184:18185"

