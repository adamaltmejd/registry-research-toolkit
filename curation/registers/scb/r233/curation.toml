[[statement]]
kind = "set"
subject = "set:gymnasieutbildning"
fields = { "description" = "Det program, den utbildning eller det anknytningsprogram som eleven studerar vid, härlett ur studievägskoden i gymnasieskolan (i vissa år även programbidrag och huvudman). Varianterna avser nuvarande utbildning, utbildningen vid start, korrigerade värden för utbildningar rapporterade enligt Lpf94, gymnasieprogrammet (studievägskodens två första positioner) och programbidraget, som anger vilket nationellt program enligt Lpf94 en utbildning vid fristående skola hänförs till i bidragssammanhang." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF och OP anger härledning ur studieväg, programbidrag och huvudman och skiljer nuvarande, vid start, korrigerat Lpf94, programnivå och programbidrag.\ncatalog:variable_text:29914:9418:9419\ncatalog:variable_text:29914:16358:16359\ncatalog:variable_text:29941:9418:9419\ncatalog:variable_text:29941:15993:15994\ncatalog:variable_text:29984:10879:10880\ncatalog:variable_text:29984:15993:15994\ncatalog:variable_text:29985:17089:17090\ncatalog:variable_text:29986:15993:15994"

[[statement]]
kind = "set"
subject = "set:skola-och-skolenhet"
fields = { "description" = "Den skola eller skolenhet eleven är knuten till, som skolkod, skolans identitetsnummer, skolenhetskod, skolenhetens namn eller CSN:s identitetsnummer för skolan. Varianterna avser skolan eleven studerar vid, skolan där eleven påbörjade gymnasieutbildningen och skolan där eleven fick sitt slutbetyg från grundskolan. Skolkoden består av kommunkod, kod för rektorsområde och löpnummer för skola; skolidentitet vid start och i årskurs 9 saknas för skolenheter som tillkommit efter vårterminen 2013." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF skiljer kodtyp (skola, skolid, skolenhet, namn, CSN-löpnummer); OP skiljer nuvarande, vid start och årskurs 9, beskriver skolkodens delar och att inga nya skolidentiteter skapas från hösten 2013.\ncatalog:variable_text:29899:8323:8324\ncatalog:variable_text:29949:10879:10880\ncatalog:variable_text:29950:15993:15994\ncatalog:variable_text:29951:15993:15994\ncatalog:variable_text:29951:17454:17455\ncatalog:variable_text:29952:17089:17090\ncatalog:variable_text:29952:17454:17455\ncatalog:variable_text:29953:17089:17090\ncatalog:variable_text:29953:17454:17455\ncatalog:variable_text:29955:17089:17090\ncatalog:variable_text:29956:17089:17090\ncatalog:variable_text:29957:8323:8324\ncatalog:variable_text:29958:17089:17090\ncatalog:variable_text:29959:17089:17090"

[[statement]]
