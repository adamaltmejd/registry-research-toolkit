fields = { "description" = "Personens ålder i antal år vid årets slut, härledd från personnumret, och grupperingar av den: tre grupper (0–19, 20–64 och 65 år och äldre; 2023 i en av variablerna 0–19, 20–65 och 66 år och äldre) och fem klasser för personer i arbetsför ålder (20–24, 25–34, 35–44, 45–54 och 55–64 år; 2023 i en av variablerna 55–65 år)." }
