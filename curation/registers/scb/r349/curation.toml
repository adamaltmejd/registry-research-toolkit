[[statement]]
kind = "set"
subject = "set:fodelseland"
fields = { "description" = "Födelseland för personen och för personens anhöriga: biologisk mor och far, adoptivmor och adoptivfar, maka eller make och barn. För personen och föräldrarna hämtas uppgifterna från Registret över totalbefolkningen och äldre folkbokföringsmaterial, för personen och de biologiska föräldrarna även från registret över födda 1961–1997, FoB60 och FoB70; om födelselän finns sätts födelselandet till Sverige. Variablerna för den avlidne personen och dennes far, mor, maka eller make och barn kommer från personakter som pastorsämbetena upprättade 1947–1967; en version av den avlidnes eget födelseland innehåller inga värden." }
