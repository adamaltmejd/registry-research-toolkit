fields = { "description" = "Personnummer för personens föräldrar: mor och far, adoptivmor och adoptivfar, och i personakterna 1947–1967 förälder 2 (den förälder personakten avser) och förälder 1 (den andra föräldern). I versionen från 1961 hämtas mor och far i prioritetsordning från Registret över totalbefolkningen, personakter över avlidna 1961–1967 och SCB:s register över födda 1961–1997, adoptivföräldrarna från de två första, och folkbokförd förälder väljs före ej folkbokförd; mor och far med ofullständigt födelsedatum eller orimlig ålder (far under 14 eller över 80 år, mor under 13 eller över 60 år) tas bort. I versionen från 1947 hämtas uppgifterna ur personakterna. Förälder 1 innehåller en del felaktiga personnummer som slutar på 0000." }
