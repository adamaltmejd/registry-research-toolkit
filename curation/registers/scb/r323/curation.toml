fields = { "description" = "Anger i vilken enhet instrumentets variabler uttrycks. Kodlistan har tolv koder: CCY valuta per enhet, PCL och PDT procent av nominellt värde (exklusive respektive inklusive upplupen ränta), PCT procent, PNT poäng, UNT enhet, YLD och YAN avkastning (årlig för YAN) och DCL, DDT, DAC och DAD diskonto (exklusive respektive inklusive upplupen ränta; DAC och DAD årligt)." }
evidence = "Värdemängd 9280 (2013-2026) med tolv koder; definitionen nämner bara CCY och PCL.\n0.74.0 catalog, key v28768, releases r11140, r11833, r13379, r13826...; reg_meta.db:occurrence:462345,462400,462455"

[[statement]]
kind = "set"
subject = "set:forfallobelopp"
fields = { "description" = "Belopp som återbetalas när värdepappret förfaller: det nominella beloppet som förfaller på förfallodagen och det beräknade totala belopp som återbetalas vid förfall." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF och OP skiljer nominellt förfallobelopp från beräknat totalt återbetalt belopp.\ncatalog:variable_text:51632:19723:20089\ncatalog:variable_text:51632:20089:20454\ncatalog:variable_text:51635:19723:20089\ncatalog:variable_text:51635:20089:20454"

[[statement]]
kind = "set"
subject = "set:loptid"
fields = { "description" = "Värdepapprets löptid i antal dagar, antingen ursprunglig löptid från första räntedag till förfallodag eller återstående löptid från observationstidpunkten till förfallet." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF och OP ger dagar mellan första räntedag och förfall respektive från uttagsdatum till förfall.\ncatalog:variable_text:51628:19723:20089\ncatalog:variable_text:51628:20089:20454\ncatalog:variable_text:51636:19723:20454"

[[statement]]
kind = "set"
subject = "set:upplupen-ranta"
fields = { "description" = "Ränta som löpt upp under perioden på ett räntebärande värdepapper: som räntekostnad från innehavarens eller emittentens perspektiv, eller som den del av marknadspriset som består av periodens upplupna ränta. Emittentens upplupna ränta beräknas 2025 från kupongräntan och antalet dagar sedan senaste kupongdag, och den upplupna räntan i marknadspriset från avkastningen till förfall och antalet dagar sedan periodens start, båda delat med antal dagar per år enligt dagräkningskonventionen." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF ger de tre perspektiven; formel anges bara i OP för emittenten 2025 och för upplupen ränta, inte för innehavaren.\ncatalog:variable_text:51591:19723:20089\ncatalog:variable_text:51591:20089:20454\ncatalog:variable_text:51592:19723:20089\ncatalog:variable_text:51592:20089:20454\ncatalog:variable_text:51593:19723:20454"

