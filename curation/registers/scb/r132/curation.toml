evidence = "SCB Registerinformation, Industrins energianvändning 2004-2024 documents column Varde under two VarIds in every release: 2606 \"Värdet av elförbrukningen och bränsleförbrukning för transporter\" and 2607 \"Inköpta värdet av förbrukningen av inköpta kvantiteten\" (2004-2005), 16418 \"Inköpsvärdet av den inköpta kvantiteten\" (\"alla bränsleslag\") and 16432 \"Inköpsvärde av el\" (2006-2008), 16418 and 22805 \"Inköpsvärde av elenergi\" (2009-2024). All are a value in 1000-tal kronor of energy bought, bränsle in one VarId and el in the other, in the one column of the one table, so they are one concept for different row kinds (maintainer 2026-11-14: variants of one concept for different row kinds are merged). 16418 is the generic claimant and survives."

