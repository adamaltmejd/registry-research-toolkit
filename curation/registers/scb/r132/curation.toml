fields = { "variable" = "none" }
evidence = "SCB Registerinformation, Industrins energianvändning 2004 and 2005 (RegVerID 362, 619) documents column Varde under VarId 2606 \"Värdet av elförbrukningen och bränsleförbrukning för transporter\" and VarId 2607 \"Inköpta värdet av förbrukningen av inköpta kvantiteten\". 2606 is the consumption value of electricity and transport fuel, a different measure from the purchase value that Varde carries from 2006 (16418); in 2005 (and, as Elvärde, 2007) the same VarId is also documented under its own column Elvärde. The source does not settle which owns Varde in 2004-2005; 2607 is the more plausible owner because it is the purchase value the column carries from 2006 (maintainer 2026-11-14: place under the more plausible owner). The 2606 row is withheld.\n\nCVID 5148 (2004) and 10801 (2005)."

