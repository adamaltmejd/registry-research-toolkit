subject = "set:alder"
fields = { "description" = "Ålder härledd från personnumret, i år eller i dagar, vid årets slut (31/12, mätåret minus födelseåret) eller vid en händelse: barnets födelse, civilståndsändring (vigsel, partnerskap, skilsmässa, änkeskap), dödsfall, flytt, in- och utvandring och medborgarskapsändring. Åldern avser personen själv eller en annan person, till exempel relationsperson, partner, samhörighetsperson (make eller maka, eller förälder för barn), far och mor vid barnets födelse samt det yngsta hemmaboende barnet. Därtill finns ålder i femårsklasser (1968–1997) och uppnådd ålder vid registrets referenstidpunkt (från 2011). För asylsökande är åldern den som personen uppger vid registrering, och Migrationsverket kan utreda den vid misstanke om annan ålder." }
