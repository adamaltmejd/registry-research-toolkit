evidence = "reg_meta_build/curation/registers/scb/rtb.toml:202\n\nY-317 2026-09-29: SCB VarId 24 'Familjeställning' has two explicitly named delivered coding representations. The eight year-specific historical literals FST90-FST97 each have exactly one prepared v28 snapshot dated December 31 of that literal's year (1990-1997), nativevariant 1524 'Familjer 1990-1997'; the two later case spellings Famstall (nine December 31 snapshots 1998-2006) and FamStall (nineteen 2007-2025) carry nativevariant 54 'Familjer från 1998-'. The historical 28 code/label pairs differ from the current three-digit representation in eleven tokens (11/110, 12/120, 13/130, 14/140, 15/150, 16/160, 21/210, 22/220, 23/230, 24/240, 40/400) while labels match; SCB BE0101_DO_2002 printed pp43-45 corroborates the current three-digit form. Distinct delivered classification bases, not a conversion or bridge; no annual coverage is synthesized outside the originals."

