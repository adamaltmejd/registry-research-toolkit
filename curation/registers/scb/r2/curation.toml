[[statement]]
kind = "set"
subject = "set:antal-barn"
fields = { "description" = "Antal hemmaboende barn, oavsett ålder eller under en åldersgräns: under 6, 18, 22 och (från 2011) 25 år. Som barn i familjen räknas ogift person, oavsett ålder, som är folkbokförd på samma fastighet som sin förälder eller vårdnadshavare; den definitionen anges för alla utom barn under 25 år. Från 2011 anges för alla utom barn under 22 år även en definition per hushåll: som barn räknas personer i hushållet som är kopplade till en eller flera vuxna i hushållet genom relationen biologisk, adoptiv, vårdnadshavare eller annan person, och okänd uppgift ger blankt värde. Uppgifterna kommer från Skatteverket." }
