subject = "set:postadress"
fields = { "description" = "Enhetens postadress, hel eller uppdelad på c/o-adress, gatudel, gatunummer, ytterligare specificering av gatudelen, postnummer och postort. För juridiska enheter med ett enda arbetsställe hämtas adressen från Skatteverket (postorten även från Svensk Adressändring AB); för företag med flera arbetsställen samlas den in genom SCB:s kontroll av uppgifter i Företagsdatabasen." }
