fields = { "tags" = ["employment"] }
evidence = "Samma källkolumn har överlappande ägare. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Frågorna anger samlade söksätt eller sökaktiviteter. Al4soksatts motstridiga kanalangivelser gäller båda söksätt och ändrar därför inte medlemskapet. membership-0009: Frågan anger ett sätt att söka arbete; den noterade identitetsfrågan ändrar inte det dokumenterade begreppet. membership-0010: Frågorna om hur nuvarande jobb erhölls avser rekryteringskanal, inte aktiviteter för att söka arbete. membership-0011: Ingen vald variabel mäter söksätt; huanvaf gäller hur nuvarande arbete erhölls. membership-0012: Variablerna mäter söksätt, ytterligare söksätt eller komponenter och svarskoder i söksättskodningen. membership-0013: Kodningar, komponenter och fritext mäter söksätt. Identitetsosäkerhet för syssoksatt8 ändrar inte dess dokumenterade söksättsinnehåll. membership-0014: Ingen vald variabel mäter sätt att söka arbete. membership-0015: Hur nuvarande arbete erhölls är uttryckligen undantaget från söksätt. membership-0016: Frågan anger vad personen gjorde för att hitta arbete under referensperioden. membership-0017: Medlemmarna mäter konkreta sökaktiviteter för sysselsatta och personer utan arbete. SYSSOKT4 frågar enligt beskrivningen om förekomst av sökande. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Frågorna anger sökande efter mer arbete hos nuvarande respektive annan arbetsgivare, vilket ryms i den fasta definitionen. membership-0009: Ingen vald variabel avgränsar sysselsattas sökande efter annat arbete. membership-0010: Inga valda variabler mäter sysselsattas sökande efter annat arbete eller extraarbete. membership-0011: Ingen vald variabel mäter sysselsattas sökande efter annat arbete eller extraarbete. membership-0012: Variablerna klassificerar sysselsattas sökande efter annat arbete eller extraarbete, inklusive vet-ej-svar. membership-0013: Variablerna kodar om sysselsatta sökt annat arbete, inklusive nekande svar, vet ej och bortfall. Den fasta placeringen av syssoksatt88 stöds av etiketten. membership-0014: Ingen vald variabel mäter sysselsattas sökande efter annat arbete. membership-0015: Den valda pandemifrågan mäter en anledning till uteblivet sökande, inte sysselsattas förekomst av annat arbetssökande. membership-0016: Extraarbetsfrågorna gäller innehav och identitet, inte sökande efter annat arbete eller extraarbete. membership-0017: Variablerna anger sysselsattas sökande efter annat arbete hos nuvarande eller annan arbetsgivare, inklusive extrajobb och företagsförberedelser i den samlade frågan.\ncatalog:occurrence:3014\ncatalog:occurrence:3165\ncatalog:occurrence:5850\ncatalog:occurrence:5851\ncatalog:variable_text:1440:8035:12874\ncatalog:variable_text:1441:8035:12874\ncatalog:variable_text:1442:8035:12874\ncatalog:variable_text:1443:8035:12874\ncatalog:variable_text:1444:8035:12874\ncatalog:variable_text:1445:8035:12874\ncatalog:variable_text:1446:8035:12874\ncatalog:variable_text:1456:6209:12874\ncatalog:variable_text:1457:6209:12874\ncatalog:variable_text:1458:6209:12874\ncatalog:variable_text:1459:6209:12874\ncatalog:variable_text:1460:8035:12874\ncatalog:variable_text:1561:6209:7670\ncatalog:variable_text:1772:18628:19358\ncatalog:variable_text:1784:12874:20819\ncatalog:variable_text:1789:12874:18628\ncatalog:variable_text:1823:18628:20819\ncatalog:variable_text:2038:12874:18628\ncatalog:variable_text:2197:18628:20819\ncatalog:variable_text:2207:18628:20819\ncatalog:variable_text:2209:18628:20819\ncatalog:variable_text:2212:18628:20819\ncatalog:variable_text:2213:18628:20819\ncatalog:variable_text:2339:18628:20819\ncatalog:variable_text:2398:12874:18628\ncatalog:variable_text:2400:14245:15706\ncatalog:variable_text:2401:18628:20819\ncatalog:variable_text:2402:6209:12874\ncatalog:variable_text:2403:18628:20819\ncatalog:variable_text:2472:12874:18628\ncatalog:variab