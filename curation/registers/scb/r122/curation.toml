[[statement]]
kind = "set"
subject = "var:vanligen-tid-bisyssla-aldre"
fields = { "tags" = ["employment"] }
evidence = "Vanligen arbetad tid. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Det enda möjliga måttet har motstridiga begreppsangivelser och saknar avgörande stöd för medlemskap i denna kandidat. membership-0009: Beskrivningen frågar uttryckligen efter överenskomna timmar i bisysslan. Huvudsysslans motsvarighet är uttryckligen ett genomsnittsmått. membership-0010: Bioktim mäter uttryckligen överenskomna veckotimmar. Bivanltim är ett sammansatt mått på vanligen arbetad tid. membership-0011: Frågan mäter överenskomna veckoarbetstimmar i huvudsysslan. membership-0012: KHU30 kontrollerar endast oförändrad överenskommen arbetstid och utesluts uttryckligen. membership-0013: Det valda blandmåttet är uttryckligen vanligen arbetad tid och kombinerar överenskommen med genomsnittlig tid; det behandlas inte som ett separat mått på överenskomna timmar. membership-0014: BI-VANLTIM-2021 mäter vanlig, inte överenskommen, arbetstid. membership-0015: Inga valda variabler mäter överenskommen arbetstid. membership-0016: Båda frågorna mäter timmar enligt avtal, schema eller överenskommelse. membership-0017: KHS35 kontrollerar oförändrad arbetstid och TIM2-frågorna mäter arbete utöver den; båda ligger utanför definitionen. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Etiketten och den tidigare bedömningen anger vanligen arbetad tid föregående gång. Detta stöd behålls trots frågetextens överenskomna tid. membership-0009: Etiketter och granskade bedömningar stöder vanligen arbetad tid totalt, grupperat och per syssla. Bisysslans motstridiga frågetext kräver granskning. membership-0010: Variablerna mäter genomsnittlig eller vanligen arbetad tid i bisysslan; bivanltim omfattar olika underlag beroende på yrkesställning. membership-0011: Frågan mäter genomsnittliga veckoarbetstimmar i huvudsysslan. membership-0012: KHU31 kontrollerar samma genomsnittliga timantal och anger inte själva timantalet. membership-0013: Variablerna mäter vanligen arbetad tid totalt, grupperat och i huvudsysslan. Huvudsysslans mått använder överenskommen eller genomsnittlig tid för olika personkategorier. membership-0014: Frågan mäter vanligen arbetade timmar per vecka i bisysslan. membership-0015: Inga valda variabler mäter vanligen arbetad tid. membership-0016: Variablerna mäter eller bekräftar vanligen arbetad tid i huvudsysslan för olika yrkesställningar och anställningsförhållanden. membership-0017: TIM2-frågorna använder vanlig arbetstid som jämförelse men mäter förekomst av merarbete.\ncatalog:variable_text:1614:18628:20819\ncatalog:variable_text:1654:18993:19358\ncatalog:variable_text:1675:12874:18628\ncatalog:variable_text:1690:17167:18628\ncatalog:variable_text:1822:7305:12874\ncatalog:variable_text:1984:18628:20819\ncatalog:variable_text:1985:18628:20819\ncatalog:variable_text:1986:18993:20819\ncatalog:variable_text:1987:18628:20819\ncatalog:variable_text:1988:18628:20819\ncatalog:variable_text:2018:18628:20819\ncatalog:variable_text:2111:18628:20819\ncatalog:variable_text:2133:12874:18628\ncatalog:variable_text:2266:18628:20819\ncatalog:variable_text:2276:12874:18628\ncatalog:variable_text:2277:12874:18628\ncatalog:variable_text:2520:6209:12874\ncatalog:variable_text:2539:18628:20819\ncatalog:variable_text:2540:18628:20819\ncatalog:variable_text:2541:18628:20819\ncatalog:variable_text:2542:18628:20819\ncatalog:variable_text:2550:18628:20819\ncatalog:variable_text:2551:17167:18628\ncatalog:variable_text:2730:12874:18628\ncatalog:variable_text:2731:6209:12874\ncatalog:variable_text:2732:6209:12874\ncatalog:variable_text:2733:6209:12874\nregisters/scb/r122/curation.toml:158"

