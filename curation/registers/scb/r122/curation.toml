[[statement]]
kind = "set"
subject = "var:fortfarande-arbetssokande"
fields = { "tags" = ["employment"] }
evidence = "K2UA är en ogenomskinlig frågekod. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Frågan anger om personer utan arbete sökt arbete hela tiden och mäter därmed förekomst under perioden. membership-0009: Soktid kodar om och när arbete söktes. Soktidmv gäller däremot hypotetiskt sökande och uppfyller inte definitionens krav på förekomst av arbetssökande. membership-0010: Inga valda variabler mäter förekomst av arbetssökande för personer utan arbete som eget mått. membership-0011: Frågorna följer upp fortsatt arbetssökande och sökande sedan föregående intervju. membership-0012: Sektionens förekomstmått avser sysselsattas sökande efter annat arbete. membership-0013: Frågan mäter förekomst av arbetssökande bland personer utan arbete. membership-0014: De valda pandemifrågorna mäter skäl, inte förekomst av arbetssökande. membership-0015: Estimeringshjälpen med AMS-status mäter inte den definierade förekomsten av arbetssökande under angivna perioder. membership-0016: Den valda sökfrågan gäller sökaktiviteter, inte separat förekomst av arbetssökande. membership-0017: Frågan mäter fortsatt arbetssökande sedan föregående intervju. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Ingen vald variabel anger avvaktan på nytt arbete. membership-0009: Ingen vald variabel anger avvaktan på nytt arbete. membership-0010: Frågan gäller överenskommelse under referensveckan om att börja ett nytt arbete. membership-0011: Frågan omfattar uttryckligen fortsatt väntan på att börja ett arbete, jämte fortsatt arbetssökande. membership-0012: Ingen vald variabel mäter avvaktan på nytt arbete. membership-0013: Frågan mäter överenskommelse om nytt arbete; starttidpunkten utesluts enligt definitionen. membership-0014: Ingen vald variabel mäter överenskommelse om eller avvaktan på nytt arbete. membership-0015: Inga valda variabler mäter avvaktan på nytt arbete. membership-0016: Ingen vald fråga anger överenskommelse om eller avvaktan på nytt arbete. membership-0017: Frågorna om sökveckor före arbetsbesked mäter söktid, inte avvaktan på nytt arbete.\ncatalog:valueset:9352\ncatalog:variable_text:1473:9131:12874\ncatalog:variable_text:1546:12874:18628\ncatalog:variable_text:1696:18628:19358\ncatalog:variable_text:1698:18628:19358\ncatalog:variable_text:1937:18628:20819\ncatalog:variable_text:1957:18628:20819\ncatalog:variable_text:1958:18628:20819\ncatalog:variable_text:2168:18628:20819\ncatalog:variable_text:2197:18628:20819\ncatalog:variable_text:2202:12874:18628\ncatalog:variable_text:2203:17167:18628\ncatalog:variable_text:2284:18628:20819\ncatalog:variable_text:2286:18628:20819\ncatalog:variable_text:2339:18628:20819\ncatalog:variable_text:2400:14245:15706\ncatalog:variable_text:2403:18628:20819\ncatalog:variable_text:2405:6209:12874\ncatalog:variable_text:2406:6209:9496\ncatalog:variable_text:2561:18628:20819\ncatalog:variable_text:2588:12874:20819\ncatalog:variable_text:2589:12874:20819\ncatalog:variable_text:2620:12874:20819"

