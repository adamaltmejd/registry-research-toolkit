evidence = "Samma källkolumn har överlappande ägare och en mellanliggande mapping med motstridigt timmått. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Bimertim är ett skillnadsmått mellan faktisk och överenskommen tid, inte ett belagt mått på arbete utöver ordinarie tid. membership-0009: Valda mertimmesmått hör till den särskilda mertimmesgruppen och anger inte separat arbete utöver ordinarie tid. membership-0010: Inga valda variabler mäter arbete utöver vanlig eller överenskommen arbetstid. membership-0011: Obetald övertid är uttryckligen en inkluderad komponent. Både förekomst och timmar omfattas, även där timetikett och svarskoder skiljer sig. membership-0012: Frågorna mäter förekomst av obetald övertid, en uttryckligen inkluderad komponent. membership-0013: Ingen vald variabel mäter arbete utöver ordinarie tid; pandemifrågan gäller minskat arbete. membership-0014: Ingen vald variabel mäter arbete utöver ordinarie tid. membership-0015: Inga valda variabler mäter arbete utöver ordinarie tid. membership-0016: Variablerna mäter förekomst och timmar av arbete utöver vanlig tid samt obetald övertid som uttryckligen ingående komponent. membership-0017: Frågorna mäter arbete utöver överenskommen eller vanlig arbetstid. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Ingen vald variabel anger uttryckligen övertid; bimertim anger allmänna mertimmar. membership-0009: Valda mertimmesmått är inte uttryckliga övertidsmått. membership-0010: Inga valda variabler mäter förekomst eller timmar av övertid. membership-0011: Variablerna mäter förekomst eller timmar av övertid med eller utan ersättning. Konflikten mellan timetikett och svarskoder ligger inom kandidatens båda måttformer. membership-0012: Variablerna mäter övertidens förekomst eller timmar totalt och med eller utan ersättning. membership-0013: Ingen vald variabel mäter övertid. membership-0014: Ingen vald variabel mäter övertidsarbete. membership-0015: Inga valda variabler mäter övertidsarbete. membership-0016: Variabeln mäter obetalda övertidstimmar i huvudsysslan. Allmänt merarbete utesluts. membership-0017: TIM2-frågorna mäter allmänt arbete utöver överenskommen eller vanlig tid, utan särskild övertidsavgränsning.\ncatalog:occurrence:10078\ncatalog:occurrence:5657\ncatalog:occurrence:5658\ncatalog:occurrence:6181\ncatalog:occurrence:6182\ncatalog:occurrence:6708\ncatalog:occurrence:6709\ncatalog:variable_text:1653:6209:12874\ncatalog:variable_text:2004:18628:20819\ncatalog:variable_text:2005:18628:20819\ncatalog:variable_text:2006:18628:20819\ncatalog:variable_text:2022:15706:16071\ncatalog:variable_text:2110:6209:12874\ncatalog:variable_text:2117:17167:18628\ncatalog:variable_text:2118:12874:18628\ncatalog:variable_text:2119:18628:20819\ncatalog:variable_text:2346:12874:18628\ncatalog:variable_text:2347:12874:18628\ncatalog:variable_text:2348:14610:15706\ncatalog:variable_text:2349:14245:14610\ncatalog:variable_text:2350:18628:20819\ncatalog:variable_text:2539:18628:20819\ncatalog:variable_text:2540:18628:20819\ncatalog:variable_text:2541:18628:20819\ncatalog:variable_text:2542:18628:20819\ncatalog:variable_text:2549:6209:12874\ncatalog:variable_text:2673:18262:18628"

