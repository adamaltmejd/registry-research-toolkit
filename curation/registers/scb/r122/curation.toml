evidence = "Mertimmar ingår i kandidatgruppen. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Bimertim är ett skillnadsmått mellan faktisk och överenskommen tid, inte ett belagt mått på arbete utöver ordinarie tid. membership-0009: Valda mertimmesmått hör till den särskilda mertimmesgruppen och anger inte separat arbete utöver ordinarie tid. membership-0010: Inga valda variabler mäter arbete utöver vanlig eller överenskommen arbetstid. membership-0011: Obetald övertid är uttryckligen en inkluderad komponent. Både förekomst och timmar omfattas, även där timetikett och svarskoder skiljer sig. membership-0012: Frågorna mäter förekomst av obetald övertid, en uttryckligen inkluderad komponent. membership-0013: Ingen vald variabel mäter arbete utöver ordinarie tid; pandemifrågan gäller minskat arbete. membership-0014: Ingen vald variabel mäter arbete utöver ordinarie tid. membership-0015: Inga valda variabler mäter arbete utöver ordinarie tid. membership-0016: Variablerna mäter förekomst och timmar av arbete utöver vanlig tid samt obetald övertid som uttryckligen ingående komponent. membership-0017: Frågorna mäter arbete utöver överenskommen eller vanlig arbetstid. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0008: Variabeln anger mertimmar som skillnad mellan faktisk och överenskommen arbetstid i bisysslan. membership-0009: Variablerna mäter mertimmar i huvudsysslan och totalt. membership-0010: Inga valda variabler mäter mertimmar. membership-0011: Valda övertidsfrågor gäller övertid med eller utan ersättning, inte de särskilda mertimsmåtten. membership-0012: De valda övertidsmåtten särredovisar inte mertimmar som eget mått. membership-0013: Ingen vald variabel mäter mertimmar. membership-0014: Ingen vald variabel mäter mertimmar. membership-0015: Inga valda variabler mäter mertimmar. membership-0016: Variabeln mäter antal timmar mer än vanligt i huvudsysslan. membership-0017: TIM2-frågorna anger förekomst av merarbete, inte antal mertimmar per syssla eller totalt.\ncatalog:variable_text:1653:6209:12874\ncatalog:variable_text:2004:18628:20819\ncatalog:variable_text:2005:18628:20819\ncatalog:variable_text:2006:18628:20819\ncatalog:variable_text:2022:15706:16071\ncatalog:variable_text:2110:6209:12874\ncatalog:variable_text:2117:17167:18628\ncatalog:variable_text:2118:12874:18628\ncatalog:variable_text:2119:18628:20819\ncatalog:variable_text:2347:12874:18628\ncatalog:variable_text:2348:14610:15706\ncatalog:variable_text:2349:14245:14610\ncatalog:variable_text:2350:18628:20819\ncatalog:variable_text:2539:18628:20819\ncatalog:variable_text:2540:18628:20819\ncatalog:variable_text:2541:18628:20819\ncatalog:variable_text:2542:18628:20819\ncatalog:variable_text:2549:6209:12874\ncatalog:variable_text:2673:18262:18628"

