subject = "var:nya-eller-vasentligt-forbattrade-processer-pa-foretagets"
fields = { "sets" = [] }
evidence = "Källkolumnens kod är ogenomskinlig och etiketten anger processinnovationens nyhetsgrad. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0290: Sektionens nyhetsgradsuppgifter gäller omsättningsandelar, vilka definitionen uttryckligen utesluter. membership-0291: Produktvariablerna anger utvecklare och anpassning, inte nyhetsgrad. membership-0292: De valda koderna saknar tolkning; produktinnovationens nyhetsgrad är inte belagd. membership-0293: FWTURN mäter omsättningsandel efter nyhetsgrad, vilket definitionen utesluter; ingen annan vald variabel dokumenterar själva nyhetsgraden. membership-0294: Tre variabler anger produktinnovationers nyhet för Sverige, Europa och världen. INPSNM utesluts enligt den fasta definitionens uttryckliga avgränsning till produkter. membership-0295: Variablerna skiljer produktinnovationer nya endast för företaget från sådana som är nya för marknaden. De odefinierade NEWFRM_O och NEWMKT_O ger inte stöd för fler medlemskap. membership-0296: Variablerna anger om produktinnovationer är nya endast för företaget eller för dess marknad. membership-0297: Valda nyhetsgradsrelaterade mått avser omsättning, vilket definitionen utesluter.\ncatalog:variable_text:27852:11688:13514\ncatalog:variable_text:27853:16071:17167\ncatalog:variable_text:27854:11688:13514\ncatalog:variable_text:27855:16801:19358\ncatalog:variable_text:27856:16071:17167\ncatalog:variable_text:27857:16801:19358\ncatalog:variable_text:28059:18262:20089\ncatalog:variable_text:28060:18262:20089\ncatalog:variable_text:28061:18262:20089\ncatalog:variable_text:28062:18262:20089\ncatalog:variable_text:28297:11688:18628\ncatalog:variable_text:28312:11688:18628\ncatalog:variable_text:28313:11688:18628\ncatalog:variable_text:28417:16071:17167\ncatalog:variable_text:28655:16071:17167\ncatalog:variable_text:28656:16071:17167\ncatalog:variable_text:28657:16071:17167\ncatalog:variable_text:28679:16071:1716