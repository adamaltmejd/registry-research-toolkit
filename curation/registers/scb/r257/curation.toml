[[statement]]
kind = "set"
subject = "var:innovationshinder-ide-eller-planeringsstadiet"
fields = { "sets" = [] }
evidence = "Frågekoden är opak; etiketten anger skedet. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0290: Uppskjuten eller avbruten innovationsaktivitet mäter aktivitetsutfall, inte i vilket skede ett innovationshinder inträffade. membership-0291: Inga valda variabler har belagt innehåll inom definitionen i denna sektion. membership-0292: De valda koderna saknar definitioner; de belägger inte när innovationshinder inträffar. membership-0293: Ingen vald variabel har dokumenterat innehåll om hindrets skede. HBEG-, HCON- och HDLAY-koderna saknar tolkning. membership-0294: Ingen vald variabel i denna sektion har belagt skede för innovationshinder. membership-0295: Logistikhindren anger orsaker, inte innovationshindrets skede. membership-0296: Variablerna mäter nedläggning i olika skeden och allvarlig försening, vilket definitionen omfattar. membership-0297: Uppskjuten eller avbruten aktivitet är en aktivitetskodning, inte en kodning av innovationshindrets skede. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0290: Beskrivningen anger uttryckligen aktivitet som skjutits upp eller avbrutits innan den slutförts. Medlemmen behålls oberoende av sektionsgränsen. membership-0291: Inga valda variabler har belagt innehåll inom definitionen i denna sektion. membership-0292: FInaba saknar definition; uppskjuten eller avbruten aktivitet är inte belagd. membership-0293: Ingen vald variabel dokumenterar uppskjuten eller avbruten innovationsaktivitet. HDLAY-koderna saknar tolkning. membership-0294: INONAB och INONAB_O saknar definition och kan inte beläggas som uppskjuten eller avbruten innovationsaktivitet. membership-0295: Logistikhindren mäter anledningar till uteblivna innovationer, inte kodning av uppskjuten eller avbruten innovationsaktivitet. membership-0296: Båda kodar uttryckligen nedlagd innovationsverksamhet. Allvarlig försening i q16c belägger inte uppskjutande, och q9 skiljer inte avbruten från enbart pågående verksamhet. membership-0297: Båda definitionerna avser innovationsaktivitet som skjutits upp eller avbrutits före slutförande. De skyddade medlemskapen behålls.\ncatalog:variable_text:27868:13149:14245\ncatalog:variable_text:28267:11688:18628\ncatalog:variable_text:28268:11688:18628\ncatalog:variable_text:28269:11688:18628\ncatalog:variable_text:28270:11688:18628\ncatalog:variable_text:28274:11688:18628\ncatalog:variable_text:28285:11688:18628\ncatalog:variable_text:28500:11688:18628\ncatalog:variable_text:28501:11688:18628\ncatalog:variable_text:28505:11688:18628\ncatalog:variable_text:28506:11688:18628\ncatalog:variable_text:28512:11688:18628\ncatalog:variable_text:28513:11688:18628\ncatalog:variable_text:28647:11688:18628\ncatalog:variable_text:28648:11688:18628\ncatalog:variable_text:28774:16071:17167\ncatalog:variable_text:28775:16071:17167\ncatalog:variable_text:28776:16071:17167\ncatalog:variable_text:28777:16071:17167\ncatalog:variable_text:28778:16071:17167\ncatalog:variable_text:28938:11688:13514\ncatalog:variable_text:28939:11688:13514\ncatalog:variable_text:28940:11688:13514\ncatalog:variable_text:28952:11688:13514\ncatalog:variable_text:29162:16071:17167\ncatalog:variable_text:29163:18993:20089"

