[[statement]]
kind = "assert"
subject = "innovation-i-foretagssektorn: COOP_NO @2020..2020"
fact = { "entity" = "occurrence", "fields" = { "type" = "decimal", "label" = "COOP_NO (enligt leverans)", "definition" = "I CIS2020 finns både COOP_NO och COOP_OTH. SCB:s dokumentation för 2020 knyter fråga 39102 till COOP_OTH, medan COOP_NO 2016–2018 användes för samma fråga. Kandidaterna är (1) SCB-variabel 39102, \"Samarbete inom övriga aktiviteter\" (samarbete med andra företag eller organisationer inom andra affärsrelaterade aktiviteter än innovation och FoU); (2) svarsalternativet om inget samarbete i 2020 års frågeblankett (saknar egen variabel i SCB:s export). Vilken av dessa betydelser den levererade kolumnen har är inte fastställd. Lagringstypen är float; SCB dokumenterar fråga 39102 som text, så variabeln anges här som decimal efter lagringen.", "sensitive" = false, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/innovation-foretag.toml:13305\n\nSWECOV holds COOP_NO in CIS2020. Previously unmapped because COOP_NO and COOP_OTH both exist in CIS2020; source question 39102 names COOP_OTH, and the questionnaire separately includes a no-cooperation option, so the meaning of the delivered COOP_NO is not established. Minted as its own variable with the candidate meanings named in data_warning; no candidate is chosen and no code set is borrowed. data_type follows SWECOV's SQL Server storage schema; flags follow the candidates' documented flags (non-sensitive, non-identifier). Operator under maintainer delegation 2026-10-16 (#1603 batch-e: ambiguity is not a hold reason)."
caveat = "Den levererade kolumnen COOP_NO kan avse samarbete inom övriga aktiviteter (39102) eller frågeblankettens alternativ om inget samarbete; vilken betydelse den har är inte fastställd."

[[statement]]
kind = "assert"
subject = "innovation-i-foretagssektorn: STRAT @2002..2002"
fact = { "entity" = "occurrence", "fields" = { "type" = "decimal", "label" = "STRAT (enligt leverans)", "definition" = "SCB:s källmetadata för 2002–2004 knyter inte kolumnnamnet STRAT till någon fråga eller produktionsårgång. Det enda kandidatbegreppet i SCB:s export är SCB-variabel 462, \"Stratum\" (det stratum ett element tillhör vid stratifierat urval, under namnet STRAT i 2022–2024 års leveranser); att den levererade kolumnen har samma betydelse är inte fastställt. Lagringstypen är float; SCB dokumenterar senare omgångars STRAT som text, så variabeln anges här som decimal efter lagringen.", "sensitive" = false, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/innovation-foretag.toml:13319\n\nSWECOV holds STRAT in CIS2002. Previously unmapped because the supplied 2002–2004 source metadata do not establish this column's native question or production vintage; questionnaire concepts alone do not identify its delivery role, and the name is documented only from 2022. Minted as its own variable with the candidate meanings named in data_warning; no candidate is chosen and no code set is borrowed. data_type follows SWECOV's SQL Server storage schema; flags follow the candidates' documented flags (non-sensitive, non-identifier). Operator under maintainer delegation 2026-10-16 (#1603 batch-e: ambiguity is not a hold reason)."
caveat = "Den levererade kolumnen STRAT i CIS2002 kan avse urvalsstratum (462), som kolumnnamnet betyder från 2022, men det är inte fastställt att kolumnen har den betydelsen eller vilken stratifiering värdet följer."

