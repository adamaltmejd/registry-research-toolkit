[[statement]]
kind = "set"
subject = "set:fritidshusens-varde"
fields = { "description" = "Värdet av ägda fritidshus (typkod 213 och 221). Taxeringsvärdet summeras per person för den ägda andelen ur Skatteverkets fastighetstaxeringsregister, för samtliga fritidshus och för fritidshus exklusive tomt vid tomträttsavgäld (hyrd tomtmark). Marknadsvärdet beräknas genom att taxeringsvärdet räknas upp med köpeskillingskoefficienter per kommun, baserade på regional statistik över överlåtelsepriser. Taxeringsunderlaget för fastighetsskatt avser, ej andelsberäknat, det fritidshus som har högst respektive näst högst taxeringsvärde om flera ägs. Åren 2003–2004 avses det odämpade taxeringsvärdet och 2006–2007 det dämpade." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar bygger på fritidshusens taxeringsvärde; axlarna är värdebegrepp (taxeringsvärde, marknadsvärde, skatteunderlag), tomträtt och rangordning av fastigheter, med dämpningen som angiven mätändring.\ncatalog:variable_text:19640:10956:10957\ncatalog:variable_text:19640:12417:12418\ncatalog:variable_text:19640:13513:13514\ncatalog:variable_text:19641:10956:10957\ncatalog:variable_text:19642:10956:10957\ncatalog:variable_text:19642:12417:12418\ncatalog:variable_text:19642:13513:13514\ncatalog:variable_text:19730:10956:10957\ncatalog:variable_text:19730:12417:12418\ncatalog:variable_text:19730:13513:13514\ncatalog:variable_text:19731:10956:10957\ncatalog:variable_text:19731:12417:12418\ncatalog:variable_text:19731:13513:13514"

[[statement]]
kind = "set"
subject = "set:hyreshusens-varde"
fields = { "description" = "Värdet av ägda hyreshus. Taxeringsvärdet summeras per person för den ägda andelen ur Skatteverkets fastighetstaxeringsregister, för hyreshus totalt och uppdelat på bostadshus (typkod 300, 301, 311, 320, 321), affärslokaler (typkod 322–326) och ej skattepliktiga hyresfastigheter (typkod 380, 381). Marknadsvärdet beräknas genom att taxeringsvärdet räknas upp med köpeskillingskoefficienter per län, baserade på regional statistik över överlåtelsepriser. Taxeringsunderlaget för fastighetsskatt avser den hyresfastighet som har högst respektive näst högst taxeringsvärde om flera ägs; det är taxeringsvärdet dividerat med andelen av årets dagar som fastigheten ägdes och inte andelsberäknat efter ägd andel." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar bygger på hyresfastigheters taxeringsvärde; axlarna är fastighetsslag (typkod), värdebegrepp och rangordning av fastigheter.\ncatalog:variable_text:19647:10956:10957\ncatalog:variable_text:19648:10956:10957\ncatalog:variable_text:19649:10956:10957\ncatalog:variable_text:19650:10956:10957\ncatalog:variable_text:19651:10956:10957\ncatalog:variable_text:19732:10956:10957\ncatalog:variable_text:19733:10956:10957\ncatalog:variable_text:19733:12052:12053"

