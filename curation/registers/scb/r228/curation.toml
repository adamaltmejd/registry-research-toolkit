kind = "set"
subject = "set:tomtmarkens-varde"
fields = { "description" = "Värdet av den ägda andelen av tomtmark, för tomtmark totalt, tomter till småhus (eget hem, typkod 210, 310, 399) och tomter till fritidshus (typkod 211, 212, 299). Taxeringsvärdet summeras per person ur Skatteverkets fastighetstaxeringsregister; marknadsvärdet för småhus- och fritidshustomter räknas schablonmässigt fram genom att taxeringsvärdet divideras med 0,75. Åren 1999–2004 avses det odämpade taxeringsvärdet och 2006 det dämpade; 2007 summeras för småhus- och fritidshustomter dämpade värden, medan tomtmark totalt och marknadsvärdena bygger på det fulla, odämpade taxeringsvärdet." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar värderar ägd tomtmark; axlarna är tomtslag (typkod) och värdebegrepp, och dämpningen är en angiven mätändring som skiljer sig mellan medlemmarna 2007.\ncatalog:variable_text:19643:10956:10957\ncatalog:variable_text:19643:13148:13149\ncatalog:variable_text:19643:13513:13514\ncatalog:variable_text:19643:13878:13879\ncatalog:variable_text:19739:10956:10957\ncatalog:variable_text:19739:13878:13879\ncatalog:variable_text:19740:10956:10957\ncatalog:variable_text:19740:13878:13879\ncatalog:variable_text:19741:10956:10957\ncatalog:variable_text:19741:13148:13149\ncatalog:variable_text:19741:13513:13514\ncatalog:variable_text:19741:13878:13879\ncatalog:variable_text:19742:10956:10957\ncatalog:variable_text:19742:13148:13149\ncatalog:variable_text:19742:13513:13514\ncatalog:variable_text:19742:13878:13879"

