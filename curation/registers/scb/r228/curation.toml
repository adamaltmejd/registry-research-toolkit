[[statement]]
kind = "set"
subject = "set:aktie-och-blandfondernas-varde"
fields = { "description" = "Värdet av innehavda aktie- och blandfonder, dels som deklarationsvärde, dels som marknadsvärde (marknadskurs sista bankdagen respektive år). Värdena härleds ur Skatteverkets kontrolluppgifter om fondandelar (KU31) och kursuppgifter från Fondbolagens förening; i vissa versioner avser värdet summan för hushållsmedlemmarna. Åren 1999–2001 redovisas aktiefonder och blandfonder var för sig, med utländska aktie- respektive blandfonder inräknade och från 2000 även som egna delmängder; 2002–2007 redovisas de sammanslaget, och till och med 2005 ingår då även utländska räntefonder. För de sammanslagna fonderna är deklarationsvärdet normalt 80 procent av marknadsvärdet." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar är deklarations- eller marknadsvärden på fondandelar ur KU31; axlarna är värdebegrepp, fondtyp och utländsk delmängd, med uppdelningen 1999–2001 och sammanslagningen från 2002.\ncatalog:variable_text:19581:12052:12053\ncatalog:variable_text:19582:12052:12053\ncatalog:variable_text:19583:10956:10957\ncatalog:variable_text:19584:10956:10957\ncatalog:variable_text:19607:10956:10957\ncatalog:variable_text:19608:10956:10957\ncatalog:variable_text:19769:11322:11323\ncatalog:variable_text:19770:11322:11323\ncatalog:variable_text:19776:11322:11323\ncatalog:variable_text:19777:11322:11323"

[[statement]]
kind = "set"
subject = "set:aktieinnehavets-varde"
fields = { "description" = "Värdet av innehavda aktier, som deklarationsvärde (normalt 80 procent av marknadsvärdet) och som marknadsvärde (marknadskurs sista bankdagen respektive år), härlett ur Skatteverkets kontrolluppgifter om antalet aktier (KU31, för inregistrerade aktier även KU21) och kursuppgifter från OMX. Aktierna delas upp efter lista: A-listan, O-listan och andra listor (endast marknadsvärde), 2007 i stället inregistrerade aktier (tidigare A-listan) och noterade aktier (tidigare O-listan); 2000–2001 redovisas också Teliaaktier och utländska aktier på respektive lista som egna delmängder. Åren 1999–2001 ingår utländska aktier i listvärdena. Från 2006 används för andra listor även kursuppgifter från Nordic Growth Market (NGM), vars aktier tidigare inte ingick. I vissa versioner avser marknadsvärdet summan för hushållsmedlemmarna." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar är deklarations- eller marknadsvärden på aktier ur KU31 och OMX-kurser; axlarna är värdebegrepp, lista (med namnbytet 2007) och utländsk delmängd, och NGM-tillägget 2006 är en mätändring.\ncatalog:variable_text:19585:10956:10957\ncatalog:variable_text:19585:12052:12053\ncatalog:variable_text:19586:10956:10957\ncatalog:variable_text:19586:12052:12053\ncatalog:variable_text:19587:10956:10957\ncatalog:variable_text:19587:12052:12053\ncatalog:variable_text:19587:13513:13514\ncatalog:variable_text:19588:10956:10957\ncatalog:variable_text:19588:12052:12053\ncatalog:variable_text:19589:10956:10957\ncatalog:variable_text:19589:12052:12053\ncatalog:variable_text:19658:13878:13879\ncatalog:variable_text:19659:13878:13879\ncatalog:variable_text:19683:13878:13879\ncatalog:variable_text:19684:13878:13879\ncatalog:variable_text:19737:11322:11323\ncatalog:variable_text:19738:11322:11323\ncatalog:variable_text:19771:11322:11323\ncatalog:variable_text:19772:11322:11323\ncatalog:variable_text:19773:11322:11323\ncatalog:variable_text:19774:11322:11323\ncatalog:variable_text:19775:11322:11323"

