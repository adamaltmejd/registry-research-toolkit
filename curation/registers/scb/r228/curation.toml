kind = "set"
subject = "set:skuldbelopp"
fields = { "description" = "Personens skulder: sammanlagd skuld vid årets utgång enligt Skatteverkets kontrolluppgift (KU25), ackumulerad studieskuld per 31/12 på studielån inom studiemedel och vuxenstudiestöd, värdet av utfärdade optionskontrakt (marknadskurs sista bankdagen, ur KU33 och kursuppgifter från OMX), samt en restpost för övrig skuld, skillnaden mellan taxerad skuld och skuld enligt kontrolluppgift, som kan innehålla skulder mellan privatpersoner (1999–2006). Summa skuld är summan av skuld enligt kontrolluppgift, utfärdade optionskontrakt, studieskuld och övriga skulder i deklarationen; skuldbeloppet för beskattningsbar förmögenhet redovisas huvudsakligen för personer vars nettoförmögenhet överstiger fribeloppet för förmögenhetsskatt, övriga har 0. I vissa versioner avser värdet summan för hushållsmedlemmarna." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar är skuldbelopp per person; axeln är skuldslag och summeringsnivå, med summa skuld uttryckligen sammansatt av de övriga posterna.\ncatalog:variable_text:19576:10956:10957\ncatalog:variable_text:19604:10956:10957\ncatalog:variable_text:19709:10956:10957\ncatalog:variable_text:19717:10956:10957\ncatalog:variable_text:19726:10956:10957\ncatalog:variable_text:19726:13148:13149\ncatalog:variable_text:19764:10956:10957"

[[statement]]
kind = "set"
subject = "set:smahusens-varde"
fields = { "description" = "Värdet av ägda småhus (eget hem). Taxeringsvärdet för den ägda andelen hämtas ur Skatteverkets fastighetstaxeringsregister och summeras per person eller, i vissa versioner, för hushållsmedlemmarna: för småhus (typkod 200, 201, 220, 222, 223), för småhus exklusive tomt vid tomträttsavgäld (hyrd tomt), för småhus på lantbruksfastighet (typkod 120) och för ej skattepliktiga småhus (typkod 280, 281). Marknadsvärdet, för småhus och för småhus på lantbruksfastighet, beräknas genom att taxeringsvärdet räknas upp med köpeskillingskoefficienter per kommun, baserade på regional statistik över överlåtelsepriser, och avser i vissa versioner summan av hushållsmedlemmarnas andelar. Taxeringsunderlaget för fastighetsskatt avser, ej andelsberäknat, det småhus som har högst respektive näst högst taxeringsvärde om flera ägs. Taxeringsvärdet är odämpat 2003–2004 (för samtliga småhus 2003–2005) och dämpat 2006–2007 (för ej skattepliktiga småhus bara 2007)." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nHushållssummering för taxeringsvärde (W1) och marknadsvärde (W10, W12) tillagd; dämpat värde för ej skattepliktiga småhus begränsat till 2007 (W3); ägd andel flyttad till taxeringsvärdet så att den inte krockar med det ej andelsberäknade taxeringsunderlaget.\ncatalog:variable_text:19718:10956:10957\ncatalog:variable_text:19718:12417:12418\ncatalog:variable_text:19718:13878:13879\ncatalog:variable_text:19719:10956:10957\ncatalog:variable_text:19719:12417:12418\ncatalog:variable_text:19719:13513:13514\ncatalog:variable_text:19720:10956:10957\ncatalog:variable_text:19720:12417:12418\ncatalog:variable_text:19720:13513:13514\ncatalog:variable_text:19721:10956:10957\ncatalog:variable_text:19722:10956:10957\ncatalog:variable_text:19723:10956:10957\ncatalog:variable_text:19723:12417:12418\ncatalog:variable_text:19723:13513:13514\ncatalog:variable_text:19734:10956:10957\ncatalog:variable_text:19734:12417:12418\ncatalog:variable_text:19734:13513:13514\ncatalog:variable_text:19735:10956:10957\ncatalog:variable_text:19735:12417:12418\ncatalog:variable_text:19735:13513:13514"

