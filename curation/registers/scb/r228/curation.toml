evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nBåda medlemmarna mäter ålder vid årets slut; axeln är vems ålder (individen eller hushållsföreståndaren), och beräkningsregeln anges bara för hushållsföreståndaren.\ncatalog:variable_text:19590:10956:10957\ncatalog:variable_text:19590:11687:11688\ncatalog:variable_text:19590:12052:12053\ncatalog:variable_text:19590:12417:12418\ncatalog:variable_text:19590:12783:12784\ncatalog:variable_text:19590:13148:13149\ncatalog:variable_text:19590:13513:13514\ncatalog:variable_text:19590:13878:13879\ncatalog:variable_text:19591:10956:10957"

[[statement]]
kind = "set"
subject = "set:bostadsrattens-varde"
fields = { "description" = "Värdet av ägda bostadsrätter, summerat över samtliga bostadsrätter om flera ägs: förmögenhetsvärdet som personens andel av bostadsrättsföreningens förmögenhetsvärde (kontrolluppgift KU56, 2002–2007), och marknadsvärdet, för personens andel och per familj. Från 2004 beräknas marknadsvärdet med en ny, förbättrad metod (FBORMNY och FBORMHNY); marknadsvärdet enligt den äldre beräkningen (FBORM) finns för 1999–2004. Familjen bildas av personer som är folkbokförda på samma fastighet och har relationer med varandra, enligt registret över totalbefolkningen (RTB)." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar värderar innehav av bostadsrätt; axlarna är värdebegrepp (förmögenhets- eller marknadsvärde), enhet (person eller familj) och beräkningsmetod före och från 2004.\ncatalog:variable_text:19610:12052:12053\ncatalog:variable_text:19614:12783:12784\ncatalog:variable_text:19615:12783:12784\ncatalog:variable_text:19616:10956:10957"

