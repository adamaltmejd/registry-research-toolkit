fields = { "description" = "Bidrag och kostnadsersättningar som kommuner och regioner fått till driften, redovisade per konto i respektive kontoplan. För kommunerna (Kommun-Bas): driftbidrag från staten, statliga myndigheter och AMS för var och en av verksamheterna (konto 351 motpart 81; till och med 2021 konto 351 och 352), driftbidrag från andra kommuner, landsting och kommunalförbund (konto 351 motpart 82–84), ersättning från Försäkringskassan för personlig assistans två år före utjämningsåret (konto 354), momsbidrag vid köp av ej skattepliktig verksamhet (6, 5 respektive 18 procent, konto 356) och EU-bidrag som tillfaller kommunen (konto 358). För regionerna (R-Bas): erhållna bidrag (konto 38), därav trafikrelaterade, därav riktade statsbidrag och kostnadsersättningar som inte är investeringsbidrag, inklusive personalanknutna bidrag och 6-procentig ersättning (konto 381–383), med varav trafik och varav ALF-medel (avtal om läkarutbildning och forskning)." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nLägger till referensperioden för ersättningen för personlig assistans, två år före utjämningsåret (W7).\ncatalog:variable_text:41893:16801:18993\ncatalog:variable_text:41893:18993:20454\ncatalog:variable_text:41895:17897:20454\ncatalog:variable_text:41896:17897:20454\ncatalog:variable_text:41897:17897:20454\ncatalog:variable_text:41898:17897:20454\ncatalog:variable_text:41899:17897:20454\ncatalog:variable_text:41900:16801:20454\ncatalog:variable_text:41901:16801:20454\ncatalog:variable_text:41964:16801:18993\ncatalog:variable_text:41964:18993:20454\ncatalog:variable_text:41981:16801:20089"

