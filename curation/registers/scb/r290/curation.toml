[[statement]]
kind = "set"
subject = "set:investeringsutgifter"
fields = { "description" = "Kommuners och regioners investeringsutgifter, i summor och delposter per konto i respektive kontoplan. För kommunerna (Kommun-Bas): investeringsutgifterna summerade från driftredovisningen per verksamhet, med delposterna entreprenader och konsulter (konto 617, 618, 74 och 75), inköp av maskiner och inventarier (konto 402) och inköp av mark, byggnader och tekniska anläggningar (konto 403), samt investeringar i affärsverksamhet totalt och varav maskiner och inventarier. För regionerna (R-Bas): summa investeringsutgifter utom finansiella (konto 990), materiella tillgångar med byggnader och mark (konto 910, till och med 2021 med varav trafik), inventarier, medicintekniska inventarier (konto 920) och övriga materiella tillgångar (konto 930), immateriella tillgångar (konto 940) med förvärvade och internt upparbetade, samt därav leasing (konto 991), köpt mark och byggnader (konto 992) och medicintekniska informationssystem (konto 993). Från 2024 avser konto 940 immateriella tillgångar; före 2024 avsåg det övriga investeringsutgifter, dock ej finansiella." }
