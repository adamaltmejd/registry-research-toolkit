fields = { "description" = "Sjukfrånvaro i samband med besvär till följd av arbetet. 2001–2016 anges om personen under de senaste 12 månaderna varit sjukskriven eller haft sjukbidrag eller förtidspension på hel- eller deltid till följd av besvären, och om personen varit sjukfrånvarande helt eller delvis 4 veckor eller mer i en följd och/eller sjukskriven vid sex eller fler tillfällen. Gruppen anger också om frånvaro från arbetet under referensveckan (mätveckan) berodde på besvären, totalt och efter orsak: arbetsolycksfall, olycka på väg till eller från arbetet och andra förhållanden i arbetet än arbetsolycksfall. 2014–2016 finns också en variabel, härledd från AKU och AOB, om personen har besvär och/eller var frånvarande under referensveckan." }
