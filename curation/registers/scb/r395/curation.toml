subject = "var:vinst-fondandelar-skattefri"
fields = { "sets" = [] }
evidence = "KVNFOTSF är en källkod för skattefri vinst. Coordinator group membership: Medlemmarna mäter kapital- och realisationsvinster som brutto-, netto- eller skattepliktiga belopp, tillgångskomponenter eller restposter. Vinstmått där återfört uppskov ingår behålls; separata uppskovsåterföringar utesluts. KVNFOTSF hålls utanför eftersom dess uttryckligen skattefria belopp inte omfattas av den fasta uppräkningen. KFRREST tillförs inte som vinstmått eftersom etikett och beskrivning motsäger varandra.\ncatalog:variable_text:33901:12784:13514\ncatalog:variable_text:33902:13514:14610\ncatalog:variable_text:33903:13514:18262\ncatalog:variable_text:33904:13514:18262\ncatalog:variable_text:33905:12784:13514\ncatalog:variable_text:33906:17897:18262\ncatalog:variable_text:33907:13514:18262\ncatalog:variable_text:33908:12784:13514\ncatalog:variable_text:33909:12784:13514\ncatalog:variable_text:33910:12784:14610\ncatalog:variable_text:33911:12784:13514\ncatalog:variable_text:33926:13514:18262\ncatalog:variable_text:33934:13514:18262\ncatalog:variable_text:33935:12784:13514\ncatalog:variable_text:33936:13514:18262\ncatalog:variable_text:33937:12784:13514\ncatalog:variable_text:33938:13514:18262\ncatalog:variable_text:33939:13514:18262\ncatalog:variable_text:33940:13514:18262\ncatalog:variable_text:33941:16801:18262\ncatalog:variable_text:33942:13514:18262\ncatalog:variable_text:33943:12784:13514\ncatalog:variable_text:33944:12784:13514\ncatalog:variable_text:33945:13514:18262\ncatalog:variable_text:33946:13514:18262\ncatalog:variable_text:33947:13514:14610\ncatalog:variable_text:33952:12784:18262\ncatalog:variable_text:33953:13514:18262\ncatalog:variable_text:33956:17897:18262"

