[[statement]]
kind = "set"
subject = "sjukfranvaro-sjukloneperioden: delantdagar @2015"
fields = { "sensitive" = true, "identifier" = false }
evidence = "python-builder-pre-cutover:curation/registers/scb/ksju.toml:1379\n\nSCB states neither flag for scb/ksju/delantdagar-2015 and no auxiliary join supplies one, so unresolved_flag withheld it. Every flagged same-register sibling of this quantity family (the KSJU näringsgren and sjukdagar variables) is a sensitive non-identifier; sensitivity takes the ratchet value and the identifier flag stays false because no sibling carries it (AGENTS.md PII rule). Replaces the unresolved_flag acknowledgement (#1603; maintainer decision 2026-10-15, KSJU S1/D1; #1621)."

