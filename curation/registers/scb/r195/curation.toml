[[statement]]
kind = "set"
subject = "set:sjukdagar"
fields = { "description" = "Antal sjukdagar i ett sjukfall: alla kalenderdagar i sjukfallet, från 2011 räknat från sjuklöneperiodens första dag (karensdagen, från 2022 dagen med karensavdrag) till dess sista dag, inklusive lördagar, söndagar och helgdagar. Gruppen innehåller det totala antalet, antalet för kvinnor och för män (uppräknat till kvartalssiffra och oviktat), antalet heldagar och deldagar och antalet glappdagar: dagar då individen kommit tillbaka till arbetet efter en sjukfrånvaro och sedan insjuknar igen i samma symptom inom fem arbetsdagar, så att det räknas till samma sjukfrånvaro. Den innehåller också sjukfallets längd för dagarna 1–14, beräknad från sjukperiodens start- och slutdatum." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar räknar dagar i ett sjukfall, totalt eller uppdelat efter kön, vikt och typ av dag.\ncatalog:variable_text:41744:16436:19723\ncatalog:variable_text:41745:16436:19723\ncatalog:variable_text:41747:15065:19723\ncatalog:variable_text:41748:15065:19723\ncatalog:variable_text:41749:13149:15065\ncatalog:variable_text:41749:15065:18993\ncatalog:variable_text:41749:18993:19723\ncatalog:variable_text:41764:13149:15065\ncatalog:variable_text:41765:15706:16801\ncatalog:variable_text:41769:15065:16801\ncatalog:variable_text:41770:16436:19723\ncatalog:variable_text:41817:13149:15065\ncatalog:variable_text:41818:14245:15065\ncatalog:variable_text:41818:15065:18993\ncatalog:variable_text:41818:19358:19723"

