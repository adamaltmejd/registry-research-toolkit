
[[statement]]
kind = "assert"
subject = "sjukfranvaro-sjukloneperioden: fallk1 @2015..2023"
fact = { "entity" = "occurrence", "fields" = { "type" = "decimal", "label" = "Markering för sjukfall, kvinna, oviktade", "definition" = "Markering för sjukfall där individen är en kvinna, oviktade", "sensitive" = true, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/ksju.toml:65\n\nSCB's P1105 delivery variable list (Bilaga 2 - Variabellista.xlsx, sheet KSju, row 19) lists fallk1 as \"Vikt som justerar för ej inkomna månader, för kvinna (0 för man), oviktade\", the unweighted (oviktade) counterpart of fallk (row 18); that label contradicts the sibling's Registerinformation name \"Markering för sjukfall, kvinna\", which the name follows. SWECOV holds the column as float in every KSju quarterly table, KSju_20151 through KSju_20234 (registry-catalog-inputs swecov/swecov/derived/swecov_column_types.csv), and SCB's delivery report (Bilaga 1 Leveransrapport uppd 2023-2024.xlsx, sheet Postbeskrivning uppd 2023-2024) types it float; SCB's Registerinformation export carries no row for it. holdings_period is the span of SWECOV's held tables, which SCB's P1105 variable lists cover together with the same wording: P1105_Variabellista 2022.xlsx 20151-20204, Bilaga 2 20151-20224, Utkast_P1105_Variabellista_uppd2025_v5.xlsx 20231-20234. is_sensitive/is_identifier follow sibling fallk (is_sensitive=true, is_identifier=false)."
caveat = "SCB's P1105 delivery variable lists (2022, 2023-2024, 2025) label this column as a weight adjusting for months not received, which contradicts its weighted sibling fallk, documented by SCB's Registerinformation as a sick-case marker. The name follows the sibling."

