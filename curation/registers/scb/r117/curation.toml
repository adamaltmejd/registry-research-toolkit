[[statement]]
kind = "set"
subject = "lss-utjamning: Utfall @2015..2023 where key = 'v23833'"
fields = { "variable" = "lss-utjamningsavgift-kr" }
evidence = "SCB Registerinformation, Utjämning av LSS-kostnader mellan kommuner 2015-2023 documents column Utfall under VarId 23832 \"LSS-utjämningsavgift enligt utjämningssystemet, kr\" and VarId 23833 \"LSS-utjämningsbidrag enligt utjämningssystemet, kr\" in every release, both float and both \"produkten av ... i kronor per invånare och folkmängden den 1 november året före utjämningsåret\". A kommun pays an avgift or receives a bidrag, so the one column holds the avgift on one kind of row and the bidrag on the other: one concept for two row kinds (maintainer 2026-11-14: variants of one concept for different row kinds are merged). Neither claimant is generic; lss-utjamningsavgift-kr survives. 2008-2014 (UtjAvgift, UtjBidrag) and 2024-2026 (UtfallAvg, UtfallBid) give them separate columns."

[[statement]]
kind = "set"
subject = "var:lss-utjamningsavgift-kr"
fields = { "label" = "LSS-utjämningsavgift, kr", "description" = "Kommunens avgift till LSS-utjämningen i kronor, beräknad som beloppet per invånare multiplicerat med folkmängden den 1 november året före utjämningsåret. Kolumnen Utfall innehåller 2015–2023 både avgift och bidrag (en rad gäller antingen avgift eller bidrag); övriga år (2008–2014 och från 2024) redovisas avgift och bidrag i separata kolumner, och variabeln gäller då bara avgiften." }
evidence = "Maintainer ruling 2026-11-14: variants of one concept for different row kinds are merged and the variable carries a label and description covering both kinds.\nVarId 23832 (\"Avgift till LSS-utjämningen, i kronor\") and VarId 23833 (\"Bidrag till LSS-utjämningen, i kronor\") share the column Utfall in 2015-2023."
