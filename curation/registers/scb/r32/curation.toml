[[statement]]
kind = "set"
subject = "set:utrymmesstandard"
fields = { "description" = "Hushållets utrymmesstandard: trångboddhet enligt fyra normer, utrymmesnivå (1990) och antal rum per person (1980–1990). Enligt norm 1 är hushållet trångbott om det bor fler än två personer per bostadsrum, köket oräknat; en- och tvåpersonshushåll räknas inte som trångbodda. Enligt norm 2 gäller fler än två boende per rum, kök och ett rum oräknat; enpersonshushåll räknas inte som trångbodda. Enligt norm 3 (1985–1990) gäller fler än en boende per rum, i hushåll med gifta eller sambo köket oräknat och i övriga hushåll kök och ett rum oräknat; enpersonshushåll räknas som ej trångbodda. Enligt norm 4 (1985–1990) gäller fler än en boende per rum, kök och ett rum oräknat. Hög utrymmesnivå är mer än ett rum per boende, kök och ett rum oräknat. 1980 bygger måtten även på allmänna fastighetstaxeringen 1981." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar mäter hur rymligt hushållet bor; de skiljer sig i norm och mått.\ncatalog:variable_text:18467:-1826:-1461\ncatalog:variable_text:18467:0:365\ncatalog:variable_text:18468:-1826:-1461\ncatalog:variable_text:18468:3652:4018\ncatalog:variable_text:18468:5479:5844\ncatalog:variable_text:18469:5479:5844\ncatalog:variable_text:18470:5479:5844\ncatalog:variable_text:18471:-3653:-3287\ncatalog:variable_text:18499:7305:7670\ncatalog:variable_text:18500:3652:4018\ncatalog:variable_text:18500:5479:5844"

