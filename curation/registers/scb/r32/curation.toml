fields = { "description" = "Personens yrke som yrkeskod på 3-siffernivå enligt årets yrkesschema i folk- och bostadsräkningen (FoB60, FoB70, FoB75 och FoB80), 1985–1990 på 3-siffernivå enligt FoB80:s schema och på 5-siffernivå enligt FoB85:s schema, samt som yrkesbeskrivning i klartext (1980–1990). Yrke finns också för bostads- eller hushållsföreståndaren och dennes maka eller sammanboende (1960–1975), 1970 som 3-siffrig kod enligt FoB70:s schema. 1970 finns dessutom Yrke - inkomst, en teknisk variabel för tabellframställning." }
