subject = "set:yrkesstallning"
fields = { "description" = "Om personen är företagare eller anställd, för personen och, 1960–1965, för bostadsföreståndaren och dennes maka. 1960 får ej förvärvsarbetande familjemedlemmar (gifta eller sammanboende kvinnor och barn födda 1945–1960) huvudmannens kod; huvudman är en gift eller sammanboende man eller föräldern i en ofullständig familj, och om mannen inte förvärvsarbetar men makan gör det är makan huvudman för barnen men inte för mannen." }
