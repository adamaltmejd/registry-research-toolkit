[[statement]]
kind = "set"
subject = "set:sammanraknad-nettoinkomst"
fields = { "description" = "Den sammanräknade nettoinkomsten för personen, hushållet, makan, maken eller makan, makarna tillsammans, bostads- eller hushållsföreståndaren och föreståndaren och makarna tillsammans, flera av dem även inklusive underskott. 1970 är den summan av de inkomster av skilda förvärvskällor som uppskattats enligt förordningen om statlig inkomstskatt, efter avdrag för underskott i förvärvskälla; inkomster som inte är skattepliktiga (till exempel sjukkasseersättning, arbetslöshetsunderstöd, allmänna barnbidrag och socialunderstöd) eller som beskattas i annan ordning ingår inte. Måttet inklusive underskott är nettoinkomsten plus avdraget för underskott, det vill säga den sammanräknade inkomsten. 1990 är den sammanräknad inkomst minus underskott av en- eller tvåfamiljsfastighet och övriga underskott i förvärvskälla, och personens anges i hundratals kronor." }
