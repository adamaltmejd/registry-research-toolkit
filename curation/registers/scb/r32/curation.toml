[[statement]]
kind = "set"
subject = "set:socioekonomisk-indelning"
fields = { "description" = "Socioekonomisk grupp (SEI), som anger den förvärvsarbetandes position på arbetsmarknaden, för personen, familjeföreståndaren, bostads- eller hushållsföreståndaren och hushållet. 1980–1990 bygger klassificeringen huvudsakligen på uppgiften om individens yrke. 1960–1970 kan även personer som inte förvärvsarbetar ha en SEI-kod, och då har de familjeföreståndarens kod; familjemåttet 1970 ger alla i familjen familjeföreståndarens kod, och hushållet får 1985–1990 samma kod som en av de vuxna i hushållet." }
