fields = { "description" = "Personers ålder, för de flesta mått vid årets slut, för personen själv och för personer med en viss roll i hushållet eller familjen: hushålls- eller bostadsföreståndaren och dennes maka eller sammanboende, familjeföreståndaren (den äldste i familjen) och dennes make, maka eller sambo, referenspersonen, den sammanboende kvinnan och mannen, samt den äldsta och den yngsta personen i hushållet. Hushålls- eller bostadsföreståndaren är den av de boende som hyr, äger eller på annat sätt förfogar över lägenheten; i bestående äktenskap räknades generellt mannen. Referenspersonen (1980–1990) är den äldste av dem som på blanketten uppgetts vara gifta eller sambo, i hushåll utan sådana den äldste i hushållet. Åldern härleds från FoB-blanketten och folkbokföringsuppgifter (mantalslängden, länsdatakontorens kameralband, från 1975 Registret över totalbefolkningen)." }
