[[statement]]
kind = "set"
subject = "set:sysselsattning"
fields = { "description" = "Om en person är förvärvsarbetande, för personen själv och för personer med en viss roll i hushållet eller familjen: bostads- eller hushållsföreståndaren och dennes maka eller sammanboende, make eller maka, familjeföreståndaren och dennes make, maka eller sambo, referenspersonen, sammanboende och ej sammanboende kvinna och man, och personen 18 år eller äldre i hushåll utan gifta eller sambo där endast en person är 18 år eller äldre. 1970–1980 innehåller flera mått även antal arbetade timmar per vecka. Förvärvsarbetande avgränsas olika mellan åren: 1960 och 1965 de som under en vecka i oktober utförde inkomstgivande arbete motsvarande minst halv normal arbetstid; 1970–1980 de som under en vecka i september eller oktober utförde inkomstbringande arbete i minst en timme; 1985 de som enligt kontrolluppgiften hade anställning i november med en beräknad genomsnittlig månadslön över 200 kr; 1990 personer 16 år eller äldre som bedöms ha haft inkomstbringande arbete i genomsnitt minst en timme per vecka under oktober. Gruppen innehåller också personens huvudsakliga sysselsättning under året jämfört med folkräkningsveckan (1960), svaret på personblanketten om förvärvsarbete (1985) och en sysselsättningskombination, en kod bildad av svaren på tre frågor på personblanketten (1975–1980)." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar beskriver förvärvsarbete eller sysselsättning; de skiljer sig i person och i hur sysselsättningen anges, och definitionen ändras mellan åren.\ncatalog:variable_text:18248:3652:4018\ncatalog:variable_text:18250:3652:4018\ncatalog:variable_text:18258:7305:7670\ncatalog:variable_text:18278:5479:5844\ncatalog:variable_text:18281:-3653:-3287\ncatalog:variable_text:18284:-3653:-3287\ncatalog:variable_text:18285:-3653:-3287\ncatalog:variable_text:18286:-1826:-1461\ncatalog:variable_text:18310:-3653:-3287\ncatalog:variable_text:18356:0:365\ncatalog:variable_text:18356:1826:2191\ncatalog:variable_text:18397:5479:5844\ncatalog:variable_text:18406:5479:5844\ncatalog:variable_text:18414:3652:4018\ncatalog:variable_text:18414:7305:7670\ncatalog:variable_text:18416:5479:5844\ncatalog:variable_text:18424:3652:4018\ncatalog:variable_text:18424:5479:5844\ncatalog:variable_text:18424:7305:7670\ncatalog:variable_text:18426:1826:2191\ncatalog:variable_text:18426:3652:4018\ncatalog:variable_text:18426:5479:5844\ncatalog:variable_text:18426:7305:7670\ncatalog:variable_text:18451:-3653:-3287\ncatalog:variable_text:18451:-1826:-1461\ncatalog:variable_text:18451:0:365\ncatalog:variable_text:18451:1826:2191\ncatalog:variable_text:18451:3652:4018\ncatalog:variable_text:18451:5479:5844\ncatalog:variable_text:18451:7305:7670\ncatalog:variable_text:18452:3652:4018\ncatalog:variable_text:18453:-3653:-3287\ncatalog:variable_text:18453:-1826:-1461\ncatalog:variable_text:18453:0:365\ncatalog:variable_text:18454:-3653:-3287\ncatalog:variable_text:18454:-1826:-1461\ncatalog:variable_text:18454:0:365\ncatalog:variable_text:18455:1826:2191\ncatalog:variable_text:18456:1826:2191\ncatalog:variable_text:18457:3652:4018\ncatalog:variable_text:18457:5479:5844\ncatalog:variabl