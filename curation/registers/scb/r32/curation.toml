[[statement]]
kind = "set"
subject = "set:tatort"
fields = { "description" = "Den tätort, det vill säga sammanhängande bebyggelse med minst 200 invånare, som gäller bostaden respektive arbetsstället. 1960 räknas som tätort hussamlingar med minst 200 invånare där avståndet mellan husen normalt inte överstiger 200 meter. Bostadens tätort avser 1960–1965 mantalsskrivet boende (1965 även faktiskt), 1970–1985 kyrkobokfört eller faktiskt boende och 1990 faktiskt boende; 1980–1990 avses för obebodda lägenheter den tätort där lägenheten ligger. 1985 används tätortskoderna från 1980. Gruppen innehåller också tätortslöpnummer, ett unikt löpnummer för tätorten inom riket (1960 och 1970), som 1970 användes för sortering vid statistikproduktionen." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nRegeln för obebodda lägenheter begränsas till 1980–1990 (W15, W17, W19) och sorteringsanvändningen till 1970 (W5, W6).\ncatalog:variable_text:18192:0:365\ncatalog:variable_text:18192:1826:2191\ncatalog:variable_text:18192:3652:4018\ncatalog:variable_text:18192:5479:5844\ncatalog:variable_text:18192:7305:7670\ncatalog:variable_text:18459:0:365\ncatalog:variable_text:18460:-3653:-3287\ncatalog:variable_text:18461:-3653:-3287\ncatalog:variable_text:18462:-1826:-1461\ncatalog:variable_text:18462:0:365\ncatalog:variable_text:18462:1826:2191\ncatalog:variable_text:18462:3652:4018\ncatalog:variable_text:18462:5479:5844\ncatalog:variable_text:18462:7305:7670"

[[statement]]
kind = "set"
subject = "set:uppvarmningssatt"
fields = { "description" = "Husets uppvärmning: förekomst av centralvärme (1960–1975), det uppvärmningssystem som normalt används för byggnaden och alternativ uppvärmning (1980, från allmänna fastighetstaxeringen 1981), antal uppvärmningssystem i huset (1985–1990) och, 1985–1990, om huset är utrustat med respektive har använt vart och ett av ett antal uppvärmningssätt: olja, ved och andra fasta bränslen, el (även uppdelad på direktverkande, luftburen och vattenburen), fjärrvärme, annan panncentral eller närvärme (panncentraler som försörjer mer än ett hus och inte räknas som fjärrvärme), naturgas eller stadsgas, luft-luftvärmepump, annan centralvärme och annat uppvärmningssätt." }
