[[statement]]
kind = "set"
subject = "kommuner: Fr10a @2020 where key = 'v29350'"
fields = { "spelling" = "Fr39_4" }
evidence = "SCB Registerinformation, Lokal demokrati Kommuner 2020 (RegVerID 16180) documents column Fr10a under VarId 28630 \"Folkinitiativ till folkomröstning\" and VarId 29350 \"Fastställande i fullmäktige av ek.- och verksamh.mål för kommunens bolag\". The same release has Fr10a_text and Fr10b_text on 28630, and documents 29350 on Fr39_1, Fr39_2, Fr39_3, Fr39_5, Fr39_6 and Fr39_7, so the series has no Fr39_4; Regioner 2024 documents Fr10a on 28630. SCB attached the wrong column name to the 29350 row; it is the missing Fr39_4 and is respelled to it."

[[statement]]
kind = "set"
subject = "kommuner: Fr32_7 @2016 where key = 'v28625'"
fields = { "variable" = "none" }
evidence = "SCB Registerinformation, Lokal demokrati Kommuner 2016 (RegVerID 11133) documents column Fr32_7 under VarId 35984 \"Webbplats med information om det politiska styret\" and VarId 28625 \"Webbplats med möjlighet att skicka meddelanden\" and has no Fr32_8 (Fr32_1-Fr32_10 otherwise). The item order of the website block is the same in Regioner 2016 (Fr30_7 info om det politiska styret 35984, Fr30_8 meddelanden 28625) and Kommuner 2020 (Fr45_3 35984, Fr45_4 28625), so 35984 is Fr32_7 and 28625 is the missing Fr32_8. SCB attached the wrong column name to the 28625 row. Respelling it to Fr32_8 would join the variable that holds Fr32_7, so the 28625 row is withheld."

[[statement]]
kind = "set"
subject = "regioner: Fr45_5 @2020 where key = 'v28626'"
fields = { "variable" = "none" }
evidence = "SCB Registerinformation, Lokal demokrati Regioner 2020 (RegVerID 16181) documents column Fr45_5 under VarId 29353 \"Användande av sociala medier\" and VarId 28626 \"Webbplats med medborgarförslag\". Fr45_1-Fr45_5 all carry 29353 (a five-part social-media question); 28626 belongs to the website block (Kommuner 2020 Fr45_4 28625, Fr45_5 28626; Regioner 2016 Fr30_8 28625, Fr30_9 28626), whose Regioner 2020 column the source does not name, so the 28626 row is withheld."

[[statement]]
kind = "set"
subject = "regioner: Fr7 @2016 where key = 'v28656'"
fields = { "spelling" = "Fr14a" }
evidence = "SCB Registerinformation, Lokal demokrati Regioner 2016 (RegVerID 11181) documents column Fr7 under VarId 28631 \"Möjlighet att lämna medborgarförslag\" and VarId 28656 \"Offentlig utfrågning (hearing)\". Fr7 sits between Fr6a (folkinitiativ) and Fr8a (inkomna medborgarförslag), which fits 28631. VarId 28656 is the hearing item and 29420 \"Offentlig utfrågning (hearing) via webbplatsen\" is Fr14b in the same release; in Kommuner 2016 the same pair is Fr16a (28656) and Fr16b (29420). The release has no Fr14a, so SCB attached the wrong column name to the 28656 row; it is respelled to Fr14a."

