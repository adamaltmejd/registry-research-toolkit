evidence = "reg_meta_build/curation/registers/scb/it-anvandning.toml:5944\n\nSCB official IT-use 2024 questionnaire question26(b)/(c) distinguishes commercial AI software/systems modified by own staff from open-source software/systems modified by own staff (including parent/affiliate staff): https://www.scb.se/contentassets/9cfc4627e5954d109ab39dda9df1ba69/nv0116_staf_2024.pdf. Eurostat official 2023 compilers manual model question E3b/E3c and indicator table explicitly map E_AI_AMOWN to the commercial construct and E_AI_AOS to the open-source construct, with source2021: https://ec.europa.eu/eurostat/documents/3859598/18369750/KS-GQ-23-012-EN-N.pdf/20fb6a79-2c43-df3d-1551-7366c72f5f8c?t=1706102581439&version=2.0. The exported commercial prose on E_AI_AOS contradicts those primary question/code definitions. Keep both constructs independent, and correct only effective AOS name/definition at the exact reviewed editions. Preserve every erroneous original, operational omission, SCB response code, unit/type, period, provenance and separate native44743 commercial peers. No code normalization, inferred annual questionnaire equivalence or statistical comparability."

