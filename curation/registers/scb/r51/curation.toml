subject = "var:osys"
fields = { "description" = "Sysselsättningsgrad. För 2013-2017 härleds den ur överenskommen sysselsättningsgrad, där även timavlönade får en beräknad grad. Från 2018 är den faktisk sysselsättningsgrad, härledd ur överenskommen sysselsättningsgrad och tjänstledighetsomfattning. För åren före 2013 saknar SCB:s metadata beskrivning." }
evidence = "Operationell definition r5346-r11907 (2013-2017): härleds från överenskommen sysselsättningsgrad för månadsavlönade, timavlönade får en beräknad grad. r13128-r19908 (2018-2024): härleds från överenskommen sysselsättningsgrad och tjänstledighetsomfattning, resultatet blir faktisk sysselsättningsgrad. Årgångarna r1569-r4677 (1996-2012) har ingen operationell definition.\n0.74.0 catalog, key v5717, releases r1088, r11166, r11907, r13128...; reg_meta.db:occurrence:446377,446417,446457"
