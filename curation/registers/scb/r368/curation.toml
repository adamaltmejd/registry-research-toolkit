[[statement]]
kind = "set"
subject = "var:utlbakgr"
fields = { "description" = "Om personen har utländsk eller svensk bakgrund. Svensk bakgrund har den som är född i Sverige och har högst en förälder född utrikes; utländsk bakgrund har den som är född utrikes eller vars båda föräldrar är födda utrikes. Saknas förälderns födelseland antas föräldern vara född i samma land som personen (inrikes eller utrikes). Saknas födelseland för både personen och föräldrarna anges Uppgift saknas. Uppgiften hämtas från Befolkningsregistret vid närmaste tillgängliga tidpunkt kring mätåret (årsskiftet, halvårsskiftet eller ett kvartalsskifte); vilka tidpunkter som används och i vilken ordning har ändrats mellan åren." }
