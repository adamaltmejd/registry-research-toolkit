[[statement]]
kind = "set"
subject = "var:flyttat"
fields = { "description" = "Anger om eleven bytt skola under läsåret och när. 2002-2007 anges tidpunkten för flytten (2002-2005 som ÅÅMM, 2006 som MMDD). Från 2008 anges i stället en kod för när flytten skedde, till exempel före läsårets start eller före respektive efter en gränsdag under året. Kodlistan och gränsdagarna skiljer sig mellan tabellerna, se värdemängden för respektive tabell." }
evidence = "Opdef per table: elevpanel-6 2002-2005 'flyttidpunkt enligt ÅÅMM', 2006 'i form av MMDD'; elevpanel-7 2008-2012 'Härleds från insamlad flyttidpunkt' with value set #5857 (before school start, before/after 1 Feb, after school year); elevpanel-6 2008 #10829 and elevpanel-8 2015-2020 #5851 use 1 Jan/31 Mar boundaries. The categories are a coarser coding of the same fact (when the pupil left the school), so one variable with a dated description."

[[statement]]
kind = "set"
subject = "set:atgardsprogram"
fields = { "description" = "Om eleven har haft åtgärdsprogram, det vill säga program för pedagogiskt stöd som enligt grundskoleförordningen ska upprättas för elever som bedöms behöva stöd för att klara undervisningsmålen. Uppgiften gäller elever som enligt svarskoden ingick i insamlingen; en version avser den aktuella vårterminen." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nBåda delar definitionen; OP skiljer förekomst enligt grundskoleförordningen kap 5 från förekomst den aktuella vårterminen.\ncatalog:variable_text:14418:13149:13330\ncatalog:variable_text:14418:13879:14061\ncatalog:variable_text:14419:13879:14061\ncatalog:variable_text:14419:16436:16617"

[[statement]]
kind = "set"
subject = "set:fodelseland"
fields = { "description" = "Elevens födelseland enligt Registret över totalbefolkningen (RTB), och en gruppering i född i Sverige eller född utomlands som härleds därifrån. Eleven identifieras via personnummer från de klasslistor över elever i årskurs 3 våren 2002 som utvalda rektorsområden skickade in." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nFödelseland och inrikes/utrikes född delar OP om klasslistorna; grupperingen härleds ur RTB:s födelseland.\ncatalog:variable_text:14447:11688:11869\ncatalog:variable_text:14447:13879:14061\ncatalog:variable_text:14447:15706:15887\ncatalog:variable_text:14447:16436:16617\ncatalog:variable_text:14448:11688:11869"

[[statement]]
kind = "set"
subject = "set:skolkommun"
fields = { "description" = "Kommunen där elevens skola eller skolenhet ligger: skolkommunen under den aktuella vårterminen och, vid flytt, kommunen för den skola eleven flyttat eller ska flytta till. I vissa insamlingar kommer uppgiften om flytt från blanketten eller från uppföljande kontakt med skolan eller kommunen." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nKällan för flyttuppgiften anges i en av fyra texter för nykommun och knyts därför till vissa insamlingar.\ncatalog:variable_text:14461:11688:11869\ncatalog:variable_text:14461:13879:14061\ncatalog:variable_text:14461:15706:15887\ncatalog:variable_text:14461:16071:16252\ncatalog:variable_text:14472:16436:16617"

[[statement]]
kind = "set"
subject = "set:skoltillhorighet"
fields = { "description" = "Elevens skola, angiven som skolkod, skolenhetskod eller skolans identitetsnummer, dels för den aktuella skolan, dels för skolan eleven flyttat till. Skola och skolenhet är administrativa enheter med lärare eller elever på en adress, inte byggnader. Aktuell skola avser oftast skolan den aktuella vårterminen, i vissa insamlingar skolenheten eleven fanns vid den 15 oktober 2013 (urvalets skola), och hämtas ur urvalet, grundskolans elevregister, individ- eller gruppregistret, tidigare insamlingar eller den aktuella insamlingen; skolkod och skolidentitet efter flytt kommer från blanketten eller uppföljande kontakt med skolan eller kommunen. I en insamling anges skolkoden för skolenheter där den nuvarande skolenhetskoden kan kopplas till en tidigare skolkod." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nKällan blankett eller uppföljande kontakt anges bara för skolkod och skolidentitet efter flytt, inte för skolenhet efter flytt.\ncatalog:variable_text:14460:16071:16252\ncatalog:variable_text:14462:12784:12965\ncatalog:variable_text:14462:13879:14061\ncatalog:variable_text:14463:11688:11869\ncatalog:variable_text:14468:12784:12965\ncatalog:variable_text:14468:13879:14061\ncatalog:variable_text:14469:15706:15887\ncatalog:variable_text:14470:16071:16252\ncatalog:variable_text:14470:16436:16617\ncatalog:variable_text:14471:11688:11869\ncatalog:variable_text:14471:14975:15156\ncatalog:variable_text:14471:16071:16252\nRegisterinformation.csv:row=673644\nRegisterinformation.csv:row=967038"

