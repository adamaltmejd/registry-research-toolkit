[[statement]]
kind = "set"
subject = "set:utlandska-aktier-och-andelar"
fields = { "description" = "Innehav av aktier och andelar i företag med säte utanför Sverige, per kvartal: ställningen för aktuellt kvartal, transaktionerna under kvartalet och omvärderingarna under kvartalet. Indelningen har ändrats: 1997–1999 totalt och därav börsnoterade aktier; 2000–2009 noterade aktier och övriga aktier och andelar, till marknadsvärde; 2010–2011 noterade aktier, onoterade aktier (därav i koncern- och intresseföretag) och andra andelar, det vill säga andelar i private equity-fonder, riskkapitalfonder, andra fonder och stiftelser samt i handelsbolag, kommanditbolag och ekonomiska föreningar. 2010–2011 är transaktionerna nettot av köpta och sålda aktier eller andelar, för aktier inklusive nyteckning, inlösen och aktieägartillskott, och omvärderingarna orealiserade värdeförändringar genom kursförändringar, ned- eller uppskrivning av bokfört värde eller valutakursförändringar." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording. #2322 group description: the set reads as one variable; it says what the members measure together and the axes that tell them apart.\n\nMedlemmarna skiljer sig i ställning, transaktion och omvärdering och i slag av aktier; indelningen byts 2000 och 2010.\ncatalog:variable_text:12970:14610:15340\ncatalog:variable_text:12971:14610:15340\ncatalog:variable_text:12972:14610:15340\ncatalog:variable_text:12974:14610:15340\ncatalog:variable_text:12975:14610:15340\ncatalog:variable_text:12984:14610:15340\ncatalog:variable_text:13139:9862:10957\ncatalog:variable_text:13149:10957:14610\ncatalog:variable_text:13150:10957:14610\ncatalog:variable_text:13151:10957:14610\ncatalog:variable_text:13180:9862:10957\ncatalog:variable_text:13182:14610:15340\ncatalog:variable_text:13206:9862:10957\ncatalog:variable_text:13225:9862:10957\ncatalog:variable_text:13226:9862:10957\ncatalog:variable_text:13227:9862:10957\ncatalog:variable_text:13231:10957:14610\ncatalog:variable_text:13231:14610:15340\ncatalog:variable_text:13232:10957:14610\ncatalog:variable_text:13232:14610:15340\ncatalog:variable_text:13233:10957:14610\ncatalog:variable_text:13233:14610:15340"

[[statement]]
kind = "set"
subject = "set:svenska-aktier-och-andelar"
fields = { "description" = "Innehav av aktier och andelar i svenska företag, per kvartal: ställningen för aktuellt kvartal, transaktionerna under kvartalet och omvärderingarna under kvartalet. Indelningen har ändrats: 1997–2009 noterade aktier och övriga aktier och andelar, till marknadsvärde, med därav finansiella företag och, 1997–2001, transaktioner där motparten har utländsk adress; 2010–2011 noterade aktier, onoterade aktier (därav i koncern- och intresseföretag) och andra andelar, det vill säga andelar i private equity-fonder, riskkapitalfonder, andra fonder och stiftelser samt i handelsbolag, kommanditbolag och ekonomiska föreningar. 2010–2011 är transaktionerna nettot av köpta och sålda aktier eller andelar, för aktier inklusive nyteckning, inlösen och aktieägartillskott, och omvärderingarna orealiserade värdeförändringar genom kursförändringar (noterade aktier) eller ned- eller uppskrivning av bokfört värde." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording. #2322 group description: the set reads as one variable; it says what the members measure together and the axes that tell them apart.\n\nMedlemmarna skiljer sig i ställning, transaktion och omvärdering och i slag av aktier; indelningen byts 2010.\ncatalog:variable_text:12961:14610:15340\ncatalog:variable_text:12962:14610:15340\ncatalog:variable_text:12963:14610:15340\ncatalog:variable_text:12964:14610:15340\ncatalog:variable_text:12965:14610:15340\ncatalog:variable_text:12966:14610:15340\ncatalog:variable_text:12967:14610:15340\ncatalog:variable_text:12968:14610:15340\ncatalog:variable_text:12982:14610:15340\ncatalog:variable_text:13142:9862:10227\ncatalog:variable_text:13142:10227:11688\ncatalog:variable_text:13143:9862:14610\ncatalog:variable_text:13144:9862:14610\ncatalog:variable_text:13145:9862:14610\ncatalog:variable_text:13146:9862:14610\ncatalog:variable_text:13147:9862:14610\ncatalog:variable_text:13148:9862:14610\ncatalog:variable_text:13181:14610:15340\ncatalog:variable_text:13187:9862:14610\ncatalog:variable_text:13192:9862:14610\ncatalog:variable_text:13193:9862:14610\ncatalog:variable_text:13195:9862:14610\ncatalog:variable_text:13196:9862:14610\ncatalog:variable_text:13197:9862:14610"

