fields = { "variable" = "none" }
evidence = "SCB Registerinformation, Månatlig bränsle-, gas och lagerstatistik 2008-2017 (RegVerID 2604 for 2008) documents column OVRLEV under VarId 16705 \"Leveranser av olika bränslen till övriga\" (\"till övriga kategorier\") and VarId 20673 \"Övriga levererade kvantiteter av olika bränslen\" (\"t.ex. försäljning till utländskt företag med lager beläget i Sverige\") in every release. The source does not settle which; 20673 is the more plausible owner because OVRLEV is the delivery counterpart of OVRMOT (VarId 16703 \"Övriga mottagna kvantiteter av olika bränslen\"), and 20673 is the VarId whose name says \"övriga levererade kvantiteter\" (maintainer 2026-11-14: place under the more plausible owner). The 16705 rows are withheld; 16705 is documented under no other column."

