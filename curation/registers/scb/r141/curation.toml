[[statement]]
kind = "set"
subject = "manatlig-bransle-gas-och-lagerstatistik: CIF @2008..2017 where key = 'v20488'"
fields = { "variable" = "exportpris-cif" }
evidence = "SCB Registerinformation, Månatlig bränsle-, gas och lagerstatistik 2008-2017 (RegVerID 2604 for 2008) documents column CIF under VarId 20487 \"Exportpris, Cif, kostnad försäkring frakt\" and VarId 20488 \"Importpris, Cif, kostnad försäkring frakt\" in every release, both in 1000-tal kronor. The table has one row per fuel code (KOD) and country (IEKOD, \"Land för import/export\") with the quantity in IMPORT or EXPORT, so the price column holds the export price on export rows and the import price on import rows: one concept for two row kinds (maintainer 2026-11-14: variants of one concept for different row kinds are merged). Neither claimant is generic; exportpris-cif survives."

