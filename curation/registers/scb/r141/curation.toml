fields = { "variable" = "leveranser-egna-aterforsaljare" }
evidence = "SCB Registerinformation, Månatlig bränsle-, gas och lagerstatistik 2008-2017 (RegVerID 2604 for 2008) documents column ATERFORS under VarId 20671 \"Leveranser av olika bränslen till egna återförsäljare\" (kubikmeter/ton) and VarId 20672 \"Leveranser av kol och koks till återförsäljare\" (ton) in every release. The table has one row per fuel code (KOD); coal and coke rows are counted in ton and the other fuels in kubikmeter or ton, so the claimants are one delivery quantity for two row kinds (maintainer 2026-11-14: variants of one concept for different row kinds are merged). 20671 is the generic claimant and survives."

[[statement]]
kind = "set"
