subject = "var:forbrukningsvarde"
fields = { "description" = "Förbrukningsvärdet redovisas som ett negativt belopp, så att förädlingsvärde = produktionsvärde + förbrukningsvärde. Teckenkonventionen är kontrollerad på aggregerad nivå för FEK 2010 och 2015. Underlaget är SRU eller blankettuppgifter om råvarukostnader, övriga externa kostnader och övriga personalkostnader; uppgifterna kan vara imputerade och LVE-uppgifter modellaggregeras." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description.\n\nreg_meta_build/curation/registers/scb/fek.toml:129\n\nMaintainer MONA aggregate check (2026-10-12), whole-register sums only: FE2010 Förädlingsvärde 1.96e12, Produktionsvärde 5.09e12, Förbrukningsvärde -3.13e12 kronor; FE2015 2.34e12, 5.89e12, -3.54e12 kronor. In both years Förädlingsvärde = Produktionsvärde + Förbrukningsvärde, so Förbrukningsvärde is stored negative (#1302).\n\nDescription measurement review 2026-11-02: rel070-base/reg_meta.db:occurrence:94741:opdef_text; rel070-base/reg_meta.db:occurrence:91214:opdef_text; rel070-base/reg_meta.db:occurrence:91518:opdef_text; rel070-base/reg_meta.db:occurrence:88887:opdef_text; rel070-base/reg_meta.db:occurrence:89029:opdef_text; rel070-base/reg_meta.db:occurrence:94933:opdef_text; rel070-base/reg_meta.db:occurrence:94700:opdef_text. One variable, one description."

