evidence = "Variabeln är en imputeringsmarkör för ett värde. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0117: Den skyddade fasta inkluderingen behålls trots att r110 beskriver imputering av ett variabelvärde. Övriga valda variabler är inte imputeringsmarkörer. membership-0118: Ingen vald post är en imputeringsmarkör. Det valda imputerade råvarukostnadsvärdet är ett sakvärde och utesluts uttryckligen. membership-0119: Båda variablerna markerar imputering av företag eller ingående juridiska enheter. membership-0120: Det valda imputerade värdet mäter pensionskostnader, inte imputeringsstatus. membership-0121: Ingen sektionsvariabel är en markör för imputerat företag eller juridisk enhet. membership-0122: Ingen vald variabel i sektionen är en markör för imputerat företag eller juridisk enhet. membership-0123: Det valda imputerade personalkostnadsvärdet är ett sakbelopp, inte en markör för imputerat företag.\ncatalog:variable_text:10590:12053:18628\ncatalog:variable_text:10591:12053:17167\ncatalog:variable_text:10682:12053:13514\ncatalog:variable_text:10697:12053:18628\ncatalog:variable_text:10698:13514:13879\ncatalog:variable_text:10699:12053:13514\ncatalog:variable_text:10700:12053:18628\ncatalog:variable_text:10701:7305:20089\ncatalog:variable_text:10702:19358:19723\ncatalog:variable_text:10703:12053:18993\ncatalog:variable_text:10706:18993:19723\ncatalog:variable_text:10707:18993:19723\ncatalog:variable_text:10708:18993:19723\ncatalog:variable_text:10739:18262:18628\ncatalog:variable_text:10748:12053:13514\ncatalog:variable_text:10761:13149:13514\ncatalog:variable_text:10833:12053:13514\ncatalog:variable_text:10836:12053:19723\ncatalog:variable_text:10860:12053:18628\ncatalog:variable_text:10886:18628:18993\ncatalog:variable_text:10888:18993:19723\ncatalog:variable_text:10890:12053:18628\ncatalog:variable_text:10900:14610:18628\ncatalog:variable_text:10902:12053:18628\ncatalog:varia