evidence = "Källkoden är ogenomskinlig och etiketten anger imputerade övriga personalkostnader. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0117: Sektionens valda variabler anger inte sociala avgifter eller sociala och andra personalkostnader. membership-0118: Övriga sociala avgifter och det sammanslagna måttet omfattas. Enbart övriga personalkostnader är inte ett belagt socialt eller sammanslaget mått enligt definitionen. membership-0119: Den historiska kolumnen anger övriga sociala avgifter tillsammans med pensionskostnader, vilket definitionen omfattar. membership-0120: Det valda pensionskostnadsvärdet mäter enbart pensioner, inte sociala avgifter eller ett sammanslaget socialt personalkostnadsmått. membership-0121: Övriga sociala avgifter ingår uttryckligen. Separat pensionskostnad och totala personalkostnader motsvarar inte gruppens sammanslagna mått. membership-0122: Etiketten och beskrivningen anger övriga sociala avgifter, som uttryckligen ingår i kandidaten. membership-0123: Övriga sociala avgifter och det imputerade värdet för övriga personalkostnader stöds av kandidatens fasta omfattning; imputering ändrar inte sakbegreppet.\ncatalog:variable_text:10697:12053:18628\ncatalog:variable_text:10698:13514:13879\ncatalog:variable_text:10699:12053:13514\ncatalog:variable_text:10700:12053:18628\ncatalog:variable_text:10739:18262:18628\ncatalog:variable_text:10748:12053:13514\ncatalog:variable_text:10749:12053:13514\ncatalog:variable_text:10756:12053:13514\ncatalog:variable_text:10757:9862:12053\ncatalog:variable_text:10765:12784:13514\ncatalog:variable_text:10827:12053:13514\ncatalog:variable_text:10833:12053:13514\ncatalog:variable_text:10836:12053:19723\ncatalog:variable_text:10859:18993:19723\ncatalog:variable_text:10860:12053:18628\ncatalog:variable_text:10890:12053:18628\ncatalog:variable_text:10900:14610:18628\ncatalog:variable_text:10902:12053:18628"

