fields = { "description" = "Antal anställda i företaget: aktuellt antal vid mättillfället (anställda med A-skatt och beräknad årsinkomst över ett prisbasbelopp), samma mått inklusive ombordanställda och säsongsarbetare, medelantal anställda omräknat till heltidspersoner på årsbasis, och storleksklass efter antal anställda. 2023 finns antalet även för företagsenhet, lokal och verksamhetsenhet. Från 2023 är arbetsgivardeklarationer på individnivå huvudkälla för medelantalet, 2020–2022 kom det från årsredovisningar." }
