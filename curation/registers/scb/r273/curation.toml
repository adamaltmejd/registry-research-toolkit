subject = "set:utbildningsniva"
fields = { "description" = "Nivån för personens högsta genomförda utbildning, och för moderns eller faderns, enligt Svensk utbildningsnomenklatur (SUN), som fullständig tresiffrig nivåkod eller aggregerad till sju nivåer jämförbara med den äldre nivåindelningen. Personens nivå anges enligt SUN 2000 1997–2018 och enligt SUN 2020 2019–2023, föräldrarnas enligt SUN 2000 2000–2014 och enligt SUN 2020 2022–2023. 2000–2021 härleds föräldrarnas nivå från Utbildningsregistret och Befolkningsregistret, med adoptivföräldern i första hand och annars den biologiska. 2010–2023 finns även utbildningsnivån per 31/12 för nyinvandrade som skrivs in på Arbetsförmedlingen och ingår i etableringen." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nSUN-versionen och åren följer av medlemmarnas namn och DEF-år; adoptivregeln och källorna anges 2000–2021.\ncatalog:variable_text:51117:14610:19723\ncatalog:variable_text:51123:16436:18993\ncatalog:variable_text:51301:16436:18993\ncatalog:variable_text:51302:16801:17897\ncatalog:variable_text:51303:9862:12053\ncatalog:variable_text:51303:12053:16801\ncatalog:variable_text:51303:16801:17897\ncatalog:variable_text:51304:10957:16436\ncatalog:variable_text:51305:10957:16436\ncatalog:variable_text:51307:18993:19723\ncatalog:variable_text:51309:18993:19358\ncatalog:variable_text:51331:9862:12053\ncatalog:variable_text:51331:12053:16801"

