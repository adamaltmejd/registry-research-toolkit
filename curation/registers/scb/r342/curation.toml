[[statement]]
kind = "set"
subject = "set:provversion"
fields = { "description" = "Vilket nationellt prov eleven genomfört och i vilken version. För elever enligt Lpf 94 (2011–2013) anges provversionen för delprovet skriva (svenska, svenska som andraspråk och engelska), för delproven läsa och lyssna och muntligt i engelska, för matematikkurserna A–D och sammanlagt. Den sammanlagda versionen är för svenska och engelska ordinarie prov när alla delprov var ordinarie, ersättningsprov när minst ett delprov var ett ersättningsprov, annars tidigare termins prov när minst ett delprov var ett tidigare prov, och ej deltagit när eleven inte deltagit i ett eller flera delprov. Från 2012 anges det prov, inklusive eventuella delprov, som eleven genomfört i kurserna i svenska, svenska som andraspråk, engelska och matematik (2012–2014 för elever enligt Gy 2011). Vilken kurs som avses anges i en separat uppgift om kurs." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nMedlemmarna anger vilket prov eller vilken provversion eleven skrivit, per delprov, ämne eller sammanlagt.\ncatalog:variable_text:30034:15340:15522\ncatalog:variable_text:30034:15706:16071\ncatalog:variable_text:30034:16071:16252\ncatalog:variable_text:30039:15156:15887\ncatalog:variable_text:30040:15156:15887\ncatalog:variable_text:30041:15156:15887\ncatalog:variable_text:30042:15156:15887\ncatalog:variable_text:30043:15156:15340"

[[statement]]
kind = "set"
subject = "set:svensk-och-utlandsk-bakgrund"
fields = { "description" = "Om eleven har utländsk eller svensk bakgrund, härlett från elevens, faderns och moderns födelseland; tre kategorier, från 2018 också fyra kategorier. När uppgift om elevens födelseland saknas antas eleven i en version vara född i Sverige, medan den andra versionen lämnar värdet tomt; att födelseland saknas beror ofta på att eleven inte finns i Befolkningsregistret." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nMedlemmarna har samma härledning och skiljer sig i antal kategorier och i hur saknat födelseland behandlas.\ncatalog:variable_text:30072:15156:15522\ncatalog:variable_text:30073:15522:16801\ncatalog:variable_text:30073:16801:16983\ncatalog:variable_text:30074:15522:16801\ncatalog:variable_text:30075:17532:17713\ncatalog:variable_text:30075:17713:18262"

[[statement]]
kind = "set"
subject = "set:utbildningsniva"
fields = { "description" = "Föräldrarnas utbildningsnivå enligt Svensk utbildningsnomenklatur (SUN): för biologisk mor, för biologisk far och för föräldrarna, då den högsta nivån av biologisk far och mor. Uppgifterna om föräldrar hämtas från Befolkningsregistret och om utbildning från Utbildningsregistret. Nivån finns detaljerad och grupperad, enligt SUN 2000 till och med 2019 och enligt SUN 2020 från 2020 (grupperad i sex nivåer); 2012–2014 finns också moderns och faderns högsta utbildning som SUN 2000:s ensiffriga nivå och grupperad i tre grupper." }
