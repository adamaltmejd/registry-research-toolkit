[[statement]]
kind = "set"
subject = "set:nationella-prov-betyg"
fields = { "description" = "Elevens betyg på det nationella provet i gymnasieskolan, för provet som helhet och för delproven muntlig framställning, läsa och lyssna (läsförståelse och hörförståelse) och skriftlig framställning. Muntlig och skriftlig framställning gäller för elever enligt Lpf 94 Svenska B, Svenska som andraspråk B, Engelska A och B (muntlig framställning 2011 även Matematik A) och för elever enligt Gy 2011 Svenska 1 och 3, Svenska som andraspråk 1 och 3, Engelska 5 och 6. Läsa och lyssna gäller för Lpf 94-elever Engelska A och B och för Gy 2011-elever Svenska 1, Svenska som andraspråk 1, Engelska 5 och 6. Betyget på hela provet omfattar för Lpf 94-elever även Matematik A–D. Vilken kurs provet gäller anges i en separat uppgift om kurs." }
