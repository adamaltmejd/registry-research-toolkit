[[statement]]
kind = "set"
subject = "set:nationella-prov-resultatpoang"
fields = { "description" = "Antal poäng eleven fått på det nationella provet i gymnasieskolan (2023–2025), för provet som helhet och för delproven läsa och lyssna, skriva och tala. För delproven är skalan 0–9 delprovspoäng i Svenska 1 och Svenska som andraspråk 1, 0–24 (skriva) respektive 0–16 (tala) i Svenska 3 och Svenska som andraspråk 3, och 1–9 sammanvägningspoäng i Engelska 5 och 6. Helprovspoängen är i matematik 1–4 summan av råpoängen på alla delprov, i engelska summan av sammanvägningspoängen med läsa och lyssna räknat dubbelt (4–36), i Svenska 1 och Svenska som andraspråk 1 summan av delprovspoängen (0–27) och i Svenska 3 och Svenska som andraspråk 3 densamma (0–40). Värdet 999 betyder att eleven inte deltagit (i helprovet: i hela provet eller i vissa delprov), och tomt värde att måttet inte är aktuellt för kursen." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla medlemmar är poäng på nationellt prov 2023–2025 med angivna skalor per kurs; helprovet och delproven skiljer sig bara i vad som räknas.\ncatalog:variable_text:30003:19539:19905\ncatalog:variable_text:30003:19905:20089\ncatalog:variable_text:30004:19539:19905\ncatalog:variable_text:30033:19539:19905\ncatalog:variable_text:30037:19539:19905\ncatalog:variable_text:30037:19905:20089"

