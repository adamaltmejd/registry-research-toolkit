evidence = "reg_meta_build/curation/registers/scb/gymnasieskola-prov.toml:129\n\nSCB's own operational definitions for this column name the term label of the edition (Hösttermin 2015: 'Endast värdet \"HT15\" vilket innebär höstterminen 2015.'; Vårtermin 2016 likewise), and the maintainer ruling of 2026-10-15 (#1603 D5, errata.delivered above) found the column carries the term label, not an ordinal term number; the shared SCB concept definition does not apply here. The replacement is SCB's own wording, from the operational definition of scb/fritidshem/termin. Maintainer decision on #1619 (2026-10-19)."

