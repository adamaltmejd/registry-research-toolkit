{"objects":{"59b8d80153cc745a15cf33ef5d010dfbd4ff6e2dbfad8974838a4fdf9a45754a":{"fields":{"cadence":null,"coverage":["0001-01-01","9999-12-31"],"description":"PIAAC riktas mot vuxna personer i åldern 16–65 år som är folkbokförda i Sverige. Från registret över totalbefolkningen (RTB) drogs ett slumpmässigt urval på 10 000 personer i åldern 16–65 år. Urvalet representerar den vuxna befolkningens sammansättning vilket exempelvis innebär att andelen yngre och äldre och andelen utrikes och inrikes födda motsvarar andelarna i hela Sveriges vuxna befolkning. Den här dokumentationen omfattar i första hand de frågor som ställdes vid intervjutillfället och resultaten på övningarna. Däremot är de härledda variabler inte dokumenterade här, exempelvis är ålder dokumenterad men inte åldersklasser.","edition":null,"from":null,"grain":null,"kind":"table","locator":{"at":"row=65792","input":"current-scb-inputs.zip/Registerinformation.csv"},"name":"Den internationella undersökningen av vuxnas färdigheter (PIAAC)","period":["0001-01-01","9999-12-31"],"populations":null,"provider":"scb","qualifier":null,"register":"r351","release":null,"table":"Den internationella undersökningen av vuxnas färdigheter (PIAAC)","table_slug":"den-internationella-undersokningen-av-vuxnas-fardigheter-piaac","to":null},"locator":{"at":"row=65792","input":"current-scb-inputs.zip/Registerinformation.csv"}},"7f0b9d34aec17b1038aa15856c9475d07b9e4330c332a6736b4b51783e851a19":{"fields":{"cadence":null,"coverage":["2012-01-01","2012-12-31"],"description":"Innehåller uppgifter om den vuxna befolkningens  färdigheter att läsa, räkna och lösa problem med hjälp av informationsteknologi för 2012.","edition":"unstated","from":"2012-01-01","grain":"year","kind":"release","locator":{"at":"row=65792","input":"current-scb-inputs.zip/Registerinformation.csv"},"name":"2012","period":["2012-01-01","2012-12-31"],"populations":[{"day":"2011-12-15","definition":"Folkbokförda personer i Sverige 16-65 år","name":"Folkbokförda person