evidence = "Mått benämnt tjänstgöringsomfattning. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0373: Faktisk tjänstgöringstid i förhållande till heltid är tjänstgöringsomfattning. Det skyddade medlemskapet behålls. membership-0374: Ingen vald variabel mäter tjänstgöringsomfattning. Tjänstgöringsnivå och tjänstledighet är skilda begrepp. membership-0375: Samtliga är benämnda tjänstgöringsomfattning och omfattas av definitionens skolformskomponenter och olika enheter. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0373: Den valda närliggande variabeln mäter relativ tjänstgöringsomfattning i procent, inte redovisad tjänstgöringstid eller dess komponenter. membership-0374: Ingen vald variabel anger tjänstgöringstid eller dess komponenter; tjänstledighet är uttryckligen undantagen. membership-0375: Variablerna mäter redovisad tjänstgöringstid, tillfälliga timmar eller totalsummor. Tjomft anger uttryckligen summan tjänstgöringstimmar; Tjomfn är däremot en heltidsreferens. Sfatims enhetsosäkerhet ändrar inte det dokumenterade tidsbegreppet.\ncatalog:variable_text:35380:3103:10408\ncatalog:variable_text:35414:15887:20270\ncatalog:variable_text:35415:14791:15156\ncatalog:variable_text:35416:14791:15156\ncatalog:variable_text:35417:9312:10408\ncatalog:variable_text:35418:15706:18628\ncatalog:variable_text:35419:9312:10408\ncatalog:variable_text:35420:9312:10408\ncatalog:variable_text:35421:9312:10408\ncatalog:variable_text:35422:9312:10408\ncatalog:variable_text:35423:10408:10773\ncatalog:variable_text:35424:9312:9678\ncatalog:variable_text:35489:15887:20270\ncatalog:variable_text:35493:14791:20270\ncatalog:variable_text:35499:8947:9312\ncatalog:variable_text:35499:9312:10408\ncatalog:variable_text:35521:3834:8217\ncatalog:variable_text:35530:3103:8947\ncatalog:variable_text:35531:3103:8947\ncatalog:variable_text:35532:3103:8947\ncatalog:vari