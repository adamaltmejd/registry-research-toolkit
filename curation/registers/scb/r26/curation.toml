[[statement]]
kind = "set"
subject = "var:aktuellt-antal-anstallda"
fields = { "sets" = ["antal-anstallda"] }
evidence = "Maintainer ruling 2026-11-12 (#2322): every level of one measure (person or employment, company, workplace, municipality, household) belongs in one group; different meaning stays out. Operator in/out test: an additive amount or count whose higher-level text defines it as the sum or count of the lower one, or the same definition with only the unit changed.\n\nPairs by source: FDB aktuellt-antal-anstallda (workplace) / antal-anstallda-enligt-fdb (company); syssreg antalanstc (workplace, 'summera antalet anställda … enligt sysselsättningsregistret') / antal-anstallda-ftg-syssreg and its 1985 predecessor antal-anstallda-foretaget (company). Riders from the company group: antal-anstallda-ku (KU-based, no workplace twin) and anstallda-storleksklass (a size-class code; caller may prefer to drop it from the group). set:antal-anstallda-pa-arbetsstallet merges into set:antal-anstallda."

