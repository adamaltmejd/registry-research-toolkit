evidence = "reg_meta_build/curation/registers/scb/rams.toml:371\n\nFull source-native family and full register physical-peer census reviewed. Distinct literal source fields, including sequential and different-variant histories, remain finite components; only case-equivalent literal spellings share a component key. Common source definition remains source evidence, not proof of semantic equivalence between different components. No ordinal slot meaning, equal values or co-delivery assertion. Batch53-hard-family-source-review.json and Batch53-hard-physical-peer-review.json. Exception (#1620): AstSni, documented only on jobbregistret 1996, shares the 26.19053.astsni92 component. It fills that variant's 1996 gap between the AstSni92 editions 1993-1995 and 1997-1999 with the same name, definition, operational definition, storage width and SNI92 value set as 1993-1995; LISA bakgrundsfakta 1990-2017 dates AstSNI92 to 1990-2001, and SWECOV holds the 1996 column as AstSni92 (maintainer ruling 2026-10-15, reg_webapp/stewards/swecov/series/jobb.toml)."
