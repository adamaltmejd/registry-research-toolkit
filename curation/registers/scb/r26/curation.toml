fields = { "description" = "Kontant bruttolön från anställning eller nettoinkomst av näringsverksamhet för egenföretagare. Per jobb finns årsvärdet (1985–2021) och månadsvärden (2019–2021). Per person finns årsvärdet (1985–2021) och novemberlönen (2019–2021), från alla anställningar utan företagarinkomst eller från det arbetsställe som valts för personen inklusive företagarinkomst (från 2003). Per arbetsställe finns inkomsten summerad över året för alla med anknytning till arbetsstället (1985–2021). Lönen kommer per jobb 1997–1999 och per arbetsställe till 2002 från Kontrolluppgiftsregistret, per jobb, per arbetsställe och för personens valda arbetsställe därefter till 2018 från Lönesummestatistik och per jobb och per arbetsställe från 2019 från arbetsgivardeklarationer på individnivå (AGI) eller kontrolluppgifter (KU). Personens lön från alla anställningar är till 2018 summan enligt kontrolluppgifter. Företagarinkomsten kommer från Inkomst- och taxeringsregistret per jobb 1997–2003 och per arbetsställe till 2002, och därefter från Räkenskapsutdrag (SRU). Månadsvärdena 2019–2021 är för KU-lön årslönen delad med antalet arbetade månader och för företagarinkomst årsinkomsten delad med tolv. Per jobb finns även summan av förmåner, bilförmåner och drivmedelsersättning (1997–2021), och företagarinkomsten i november (2019–2021) uppräknad med faktorn 1,6, så att företagande prioriteras före anställning vid val av arbetsställe." }
