evidence = "Maintainer ruling 2026-11-12 (#2322): every level of one measure (person or employment, company, workplace, municipality, household) belongs in one group; different meaning stays out. Operator in/out test: an additive amount or count whose higher-level text defines it as the sum or count of the lower one, or the same definition with only the unit changed.\n\nCompany antal-sysselsatta is defined as 'Summeras utifrån antal sysselsatta enligt RAMS, Arbetsställen'; every company member (syssreg, RAMS Individer, FAD år 1/år 2, 1985) has a workplace twin with the same definition and only the unit changed. Riders from the workplace group: the sex and sex × education sub-counts (antal-kvinnor-*, antal-man-*, antal-kv-*), which have no company counterpart but are already grouped with the workplace total. set:antal-sysselsatta-pa-foretaget merges into set:antal-sysselsatta."

