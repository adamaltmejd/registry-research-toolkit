subject = "set:kursklassificering"
fields = { "description" = "Den kurs inom svenskundervisning för invandrare (sfi) som personen var registrerad på, och kurskategori eller typ av kurs (2007–2008). Från 2002 gäller en ny kursplan; deltagare som börjat enligt den gamla fortsatte enligt den. För 2012–2016 finns också kurstypen: om kursen ges enligt den gamla skollagen (startad före den 1 juli 2012) eller den nya, härledd ur betyget (G eller VG ger gammal skollag, A–F ny)." }
