[[statement]]
kind = "set"
subject = "var:land"
fields = { "description" = "Partnerland (export: bestämmelseland, import: avsändningsland). Tvåställig bokstavskod enligt landnomenklaturen (EU) 2020/1470." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description.\n\nreg_meta_build/curation/registers/scb/utrikeshandel.toml:756\n\nSCB concept 45 'Land' carries the NABS 2007 socio-economic-objective description of an R&D variable; on this register the column is the trade partner country (the record's own definition is 'Indelning i länder.'). First sentence: SCB HA0201 Kvalitetsdeklaration version 1, 2026-02-27, §1.2.2 Variabler, p. 4 (https://www.scb.se/contentassets/4584f3f1df19400a885428aaa914d06e/ha0201_kd_2026_260227.pdf). Second sentence: the same document, p. 16 (country nomenclature (EU) 2020/1470), and SCBDOK 3.2 HA0201 2014, pp. 18-19 (two-letter code) (https://www.scb.se/contentassets/4584f3f1df19400a885428aaa914d06e/ha0201_do_2014_ma_140521.pdf). Applies from reference year 1996: import was by country of origin until 1995. Maintainer decision on #1617 (2026-10-19).\n\nreg_meta_build/curation/registers/scb/utrikeshandel.toml:768\n\nSCB concept 45 'Land' carries the NABS 2007 socio-economic-objective description of an R&D variable; on this register the column is the trade partner country (the record's own definition is 'Indelning i länder.'). First sentence: SCB HA0201 Kvalitetsdeklaration version 1, 2026-02-27, §1.2.2 Variabler, p. 4 (https://www.scb.se/contentassets/4584f3f1df19400a885428aaa914d06e/ha0201_kd_2026_260227.pdf). Second sentence: the same document, p. 16 (country nomenclature (EU) 2020/1470), and SCBDOK 3.2 HA0201 2014, pp. 18-19 (two-letter code) (https://www.scb.se/contentassets/4584f3f1df19400a885428aaa914d06e/ha0201_do_2014_ma_140521.pdf). Applies from reference year 1996: import was by country of origin until 1995. Maintainer decision on #1617 (2026-10-19)."
