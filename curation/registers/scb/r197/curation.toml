fields = { "sets" = ["rantekostnader"] }
evidence = "OFININK är en källmnemonik som inte uttrycker etikettens kapitalkostnader. Coordinator group membership: V2050 avser övriga kapitalkostnader i form av uppläggningskostnader och dylikt. OFININK avser uttryckligen räntekostnader och utesluts enligt den fasta definitionen. Den stödda medlemmen behålls inför sammanläggning av sektionerna. Samtliga poster beskriver räntekostnader. Definitionen begränsar inte medlemskap till fastighetsanknutna lån och omfattar därför även OFININK:s räntor utanför fastighetsförvaltningen.\ncatalog:variable_text:27473:16436:16801\ncatalog:variable_text:27481:16436:16801\ncatalog:variable_text:27482:16436:16801\ncatalog:variable_text:27517:16436:16801"

