evidence = "reg_meta_build/curation/registers/scb/fou.toml:234\n\nSWECOV holds SIZE_CLASS in FTG_FOU_2019 and FTG_FOU_2021. SCB's Statistikens framställning for FoU i Sverige 2021 (uf0301_staf_2021_v2.pdf, PDF p. 28, Tabell 4) reports the business-sector sample by Storleksklass 10-49, 50-249 and 250-, the delivered spellings. The aggregate check found exactly these three classes in each year, with the top class spelled 250+ in 2019 and 250- in 2021. SCB's Registerinformation export carries no row for it on this variant. (#1603, #1509; maintainer decision 2026-10-16; aggregate check on MONA, reported as a conclusion only)."

