[[statement]]
kind = "set"
subject = "foretagssektorn: v0401 where key = 'v3335'"
fields = { "spelling" = "v0205" }
evidence = "reg_meta_build/curation/registers/scb/fou.toml:3320\n\nSCB UF0302 Beskrivning av statistiken 2003 (FoU i företagssektorn, variable list) places 'Därav driftkostnader för forskning: Driftkostnader för grundforskning och tillämpad forskning' in the operating-cost block after Programvarurelaterad FoU (v0204) and before the 2004 budget item (v0206), i.e. column v0205; the product-group item ('FoU-verksamhetens inriktning på produktgrupper') is the separate block v040x/v0401/v0402 per product. SCB's own 2003 metadata names v0411-v0471 'Driftkostnader för FoU avs. produkt 2-8', and native 4372 'Driftkostnader för FoU avs. produkt 1' is the v0401 column at the same edition. Native 3335's v0401 column name contradicts that layout; this corrects its column name to v0205 for this edition only. Name, definition, unit, type and coding are unchanged. (#1603 batch-e; Operator under maintainer delegation 2026-10-16)."

