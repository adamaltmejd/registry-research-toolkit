[[statement]]
kind = "assert"
subject = "foretagssektorn: V601 @1999"
fact = { "entity" = "occurrence", "fields" = { "type" = "integer", "label" = "V601 (enligt leverans)", "definition" = "Odokumenterad kolumn i FTG_FOU_1999. Enligt kodmönstret skulle den motsvara v0601 (FoU-årsverken i Östergötland), men värdena ser ut som ett belopp och inte som årsverken, så betydelsen är inte fastställd.", "sensitive" = false, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/fou.toml:3392\n\nSWECOV holds V601 in FTG_FOU_1999 (storage int). The 1999 form is not available online (SCBDOK 2007 p. 7: paper forms are in SCB's archive). An aggregate check on MONA, reported as a conclusion only, found values that look like an amount, not person-years, which contradicts the v0601 reading, so this is minted as its own variable rather than carried (#1603 batch-e, #1509; Operator under maintainer delegation 2026-10-16)."
caveat = "Undocumented column: by code pattern it would be FoU person-years in Östergötland (v0601), but its values look like an amount, so its meaning is not established."

[[statement]]
kind = "assert"
subject = "foretagssektorn: VIKT @1999,2001,2003,2005,2007,2012,2014"
fact = { "entity" = "occurrence", "fields" = { "type" = "decimal", "label" = "VIKT (enligt leverans)", "definition" = "Vikt i FoU-tabellerna för 1999, 2001, 2003, 2005, 2007, 2012 och 2014. SCB dokumenterar inte vilken vikt som levererats i dessa omgångar; viktmetoden är okänd och kan skilja sig mellan omgångarna. Från 2009 (2011 och 2013–2017 udda år) levereras i stället den bortfallsjusterade vikten ViktRev.", "sensitive" = false, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/fou.toml:3350\n\nSWECOV holds VIKT in FTG_FOU_1999-2007 and Vikt in FTG_FOU_2012/2014 (storage float). SCBDOK documents the nonresponse-adjusted weight N_h/m_h (ViktRev) only from 2009/2011 on; 2003 documents three weights (urvalsvikt, viktU, ViktRev) without saying which VIKT is; SCB publishes no SCBDOK for 2003/2005; SCBDOK 2007 p. 75 is internally inconsistent; 2012/2014 are off-year forecast rounds with no documentation. Minted as its own undocumented variable rather than viktrev (#1603 batch-e, #1509; Operator under maintainer delegation 2026-10-16; supersedes the 9b hold)."
caveat = "Undocumented weight: SCB does not document which weight these rounds deliver; the weighting method may differ by round and is not confirmed as the nonresponse-adjusted ViktRev."

