evidence = "reg_meta_build/curation/registers/scb/fou.toml:3563\n\nSWECOV holds v0402_4 in FTG_FOU_2017 (storage varchar). SCB's Registerinformation carries no row for it; earlier rounds document the product block per product as separate variables (v0402 = investment expenditure for own R&D for product group 1 (native 3425, KSEK in 2003); v0412..v0472 = product groups 2-8). The 2017 suffix numbering and unit are not documented, so the column is minted as its own variable with the candidate meaning named in data_warning; no candidate is chosen and no unit or code list is carried. Flags follow the documented product-block variables (non-sensitive, non-identifier). Operator under maintainer delegation 2026-10-16 (#1603 batch-e, #1495)."
caveat = "Undocumented column: SCB documents no v0402_4 for 2017. Candidate meaning: the v0402 form row (investment expenditure for own R&D) for product group 4, by the name's suffix; whether it holds an amount, a share or another variant of that row is not established."

