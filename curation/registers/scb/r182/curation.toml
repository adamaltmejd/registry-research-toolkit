fact = { "entity" = "occurrence", "fields" = { "type" = "decimal", "label" = "Andel av driftkostnaderna för egen FoU, produktgrupp 1", "definition" = "Produktgrupp 1:s andel (%) av företagets driftkostnader för egen FoU (rad 040, kolumn Driftkostnader, i blankettens tablå om egen FoU fördelad på produktgrupper; driftkostnader = arbetskraftskostnader, konsultarvoden och övriga driftkostnader). Inte samma variabel som 2003 års v0401.", "sensitive" = false, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/fou.toml:12\n\nSWECOV holds V0401/v0401 in FTG_FOU_2007, 2009, 2011, 2013 and 2015. The FoU forms of these rounds have no row 0401; the item is row 040, column 1 (Andel (%), Driftkostnader = rows 200+203+201) of tablå B4 'Utgifter för egen FoU fördelade på produktgrupper' (SCBDOK uf0301_do_2007.pdf PDF pp. 21–24; uf0301_do_2011.pdf PDF p. 18; tablå B5 in uf0301_do_2013.pdf PDF p. 22 and uf0301_do_2015.pdf PDF p. 20; 2009 inferred from the identical 2007 and 2011 forms). SCB's Registerinformation documents the literal v0401 on this variant only in 2003 (edition 394), as native 4372 Driftkostnader för FoU avs. produkt 1 in 1000-tal kronor (KSEK); its second 2003 claim (native 3335) is re-homed to v0205 by errata.field. The 2007-2015 item is a percentage, a unit that contradicts the 2003 amount, so it is minted as its own variable rather than carried from 2003 (same-name rule exception for contradicting evidence; #1621). Flags follow the documented 2003 v0401 variables (non-sensitive, non-identifier). (#1603, #1509; Operator under maintainer delegation 2026-10-16, batch-e B2)."

