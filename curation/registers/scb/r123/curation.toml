[[statement]]
kind = "set"
subject = "var:hjalp-vid-svara-uppgifter"
fields = { "tags" = ["employment"] }
evidence = "Mäter möjlighet till råd vid svåra uppgifter. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0026: Krävande problemlösning omfattas av kandidatens fasta inkludering. Tillgång till hjälp mäter stöd, inte arbetsuppgiftens svårighet eller behov av råd. membership-0027: Mäter svårighetsgrad, behov av råd och tid med svåra arbetsuppgifter. membership-0028: Ingen vald variabel mäter uppgifternas svårighet eller behov av råd vid svåra uppgifter. membership-0029: Inga valda variabler i denna sektion mäter arbetsuppgifternas svårighetsgrad. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0026: Mäter möjlighet till stöd, uppmuntran eller hjälp i besvärliga, svåra eller kritiska situationer, enligt fasta inkluderingar. membership-0027: Mäter sammanvägt stöd samt upplevt stöd och hjälp från chefer och arbetskamrater. membership-0028: Valda chefsfrågor gäller förutsättningar och prioritering, inte allmänt stöd eller praktisk hjälp enligt kandidaten. membership-0029: Mäter hjälp och stöd från arbetskollegor; saknat socialt stöd är en svarskategori om arbetsförutsättningar.\ncatalog:variable_text:3490:18628:18993\ncatalog:variable_text:3491:19723:20089\ncatalog:variable_text:3579:18628:18993\ncatalog:variable_text:3580:19723:20089\ncatalog:variable_text:3612:18628:18993\ncatalog:variable_text:3641:18628:18993\ncatalog:variable_text:3642:12784:13149\ncatalog:variable_text:3764:19723:20089\ncatalog:variable_text:3829:18628:18993\ncatalog:variable_text:3830:19723:20089\ncatalog:variable_text:3831:15706:16071\ncatalog:variable_text:3842:12053:12418\ncatalog:variable_text:3843:12053:12418\ncatalog:variable_text:3844:18628:18993"

