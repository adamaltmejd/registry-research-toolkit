[[statement]]
kind = "set"
subject = "var:verktygs"
fields = { "tags" = ["employment"] }
evidence = "Användning av verktygsmaskin. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0026: Handhållna maskiner omfattas. Datoransluten kassa och datoriserad kontrollutrustning hör enligt den fasta avgränsningen till datorutrustning. membership-0027: Rörliga och stationära maskiner omfattas. Datoriserad produktionsutrustning placeras enligt den fasta datorutrustningsdefinitionen; manuellt maskinarbetes tidsandel och övervakningskrav mäter andra egenskaper. membership-0028: Gemensam fråga kodar användning av arbetsutrustning, inklusive svaret inget av ovanstående. membership-0029: Den valda utrustningsfrågan gäller utbildning eller instruktion, vilket definitionen exkluderar. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0026: Mäter användning och typer av datorutrustning, inklusive bildskärm, datoransluten kassa och datoriserad kontrollapparatur. membership-0027: Omfattar datoriserad produktionsutrustning och fritext om annan använd datautrustning. Informationssökning är en arbetsuppgift och undantas. membership-0028: Valda digitala frågor mäter tid, kunnande eller systemegenskaper, inte användning av utrustningstyper. membership-0029: Mäter användning av surfplatta eller smartphone i arbetet.\ncatalog:variable_text:3392:12053:12418\ncatalog:variable_text:3410:18628:18993\ncatalog:variable_text:3433:18628:18993\ncatalog:variable_text:3449:19723:20089\ncatalog:variable_text:3450:19723:20089\ncatalog:variable_text:3451:19723:20089\ncatalog:variable_text:3452:19723:20089\ncatalog:variable_text:3453:19723:20089\ncatalog:variable_text:3454:19723:20089\ncatalog:variable_text:3455:19723:20089\ncatalog:variable_text:3456:19723:20089\ncatalog:variable_text:3467:12053:12418\ncatalog:variable_text:3482:12053:12418\ncatalog:variable_text:3497:12053:12418\ncatalog:variable_text:3501:19723:20089\ncatalog:variable_text:3502:19723:20089\ncatalog: