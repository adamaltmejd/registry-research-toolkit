evidence = "reg_meta_build/curation/registers/scb/hreg.toml:841\nreg_meta_build/curation/registers/scb/hreg.toml:921\n\nSCB Registerinformation native 47.38118: reviewed all 2 original occurrences. Both originals explicitly name a university participating in a doctoral school and share the operational translation from external university name codes to SCB internal codes for universities with doctoral degree rights; preserve the complete 135-code classification and both pooled delivery scopes. Source audit pinned to prepared commit ac1cb5c03ac99fe7334fd4e31664c7d9a50b2fba; preserve original types, units, coding associations, validity and provenance. These maps are native-scoped; reused literals in other natives remain unchanged.\n\nAccepted prepared SCB export native 47.38118: both columns explicitly identify a university participating in a doctoral school, with identical operational translation from external university name codes to SCB internal codes. Both original names, definitions, type text, length 3 and complete supplied university coding and validity agree. Admit the two literal representations only in their exact pooled-edition intersection; retain the full original 2001–2008 and 2008–2022 scopes, all coding associations and provenance."

