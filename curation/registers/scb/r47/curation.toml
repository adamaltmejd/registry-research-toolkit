[[statement]]
kind = "set"
subject = "doktorander-examina: artermin"
fields = { "variable" = "ar-och-termin-for-examen" }
evidence = "reg_meta_build/curation/registers/scb/hreg.toml:916\n\nSCB HREG native 47.1715: all three originals explicitly measure year and semester (calendar half-year) for the issued examination certificate. ExArTermin specifies a doctoral certificate, LicArTermin identifies a completed licentiate certificate, and ArTermin covers the examination event in the mixed doctoral/licentiate examination variant. This is one generic certificate-issued-semester question, not an assertion that degree types or observations are equivalent. All three retain text length 5, Termin unit and Tal nonmembership coding. Preserve the pre-autumn-1998 paper-report caveat and every pooled source scope, including the LicArTermin January period versus July context discrepancy. ArTermin on other native variables is outside this mapping."

