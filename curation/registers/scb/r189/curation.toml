[[statement]]
kind = "set"
subject = "set:antal-amnen-och-betyg"
fields = { "description" = "Antal ämnen eller betyg för eleven i årskurs 9: antal ämnen där eleven inte nått kunskapskraven, dels som antal ämnen med betyget F (även kodat i fyra grupper), dels som summan av ämnen utan godkänt betyg; antal ämnen med minst godkänt betyg (G eller E beroende på betygsskala); antal betyg; och antal betyg som saknas. Antal betyg och saknade betyg beräknas ur de insamlade betygen. För det ogrupperade antalet ämnen med F och för antal ämnen med minst godkänt betyder blankt värde att eleven inte betygsatts enligt det mål- och kunskapsrelaterade betygssystemet i Grundskoleförordningen, eller enligt Skolförordningen; för antal betyg att eleven inte betygsatts enligt Grundskoleförordningen." }
