[[statement]]
kind = "set"
subject = "set:foraldrars-utbildningsniva"
fields = { "description" = "Elevens biologiska moders, biologiska faders eller föräldrarnas utbildningsnivå enligt Svensk utbildningsnomenklatur (SUN), där föräldern hämtas från Befolkningsregistret och utbildningsnivån från Utbildningsregistret. Föräldrarnas utbildningsnivå är den högsta av moderns och faderns. Variablerna skiljer sig i förälder, i SUN-version (SUN 2000 till och med 2019, SUN 2020 från 2020) och i indelning: fullständig nivå, första positionen, grupperad, grupperad i tre nivåer eller den äldre indelningen i sju nivåer. I indelningarna i sju nivåer innebär blankt värde att föräldern saknas i Befolkningsregistret och kod 9 (i den äldre indelningen kod *) att uppgift om utbildning saknas." }
