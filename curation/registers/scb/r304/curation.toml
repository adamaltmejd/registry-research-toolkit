evidence = "Kursplansuppgifterna hör till samma kandidatgrupp. Coordinator group membership: r32 anger uttryckligen att eleven läser enligt grundsärskolans kursplan. r13 avser grundskolans kursplan inom anpassad grundskola och uppfyller därför inte den fasta definitionen. Övriga valda variabler ger inget ytterligare stöd för medlemskap; integrerad placering, träningsskoleinriktning och allmän utbildningsform är andra uppgifter. Medlemmen behålls oavsett sektionens medlemsantal.\ncatalog:variable_text:21093:20011:20012\ncatalog:variable_text:21107:20011:20012\ncatalog:variable_text:21112:20011:20012\ncatalog:variable_text:21148:19280:19281\ncatalog:variable_text:21149:20011:20012"

