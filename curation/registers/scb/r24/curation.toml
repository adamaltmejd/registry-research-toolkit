[[statement]]
kind = "set"
subject = "set:utbildningsinriktning"
fields = { "description" = "Inriktningen för personens högsta utbildning till och med vårterminen aktuellt år, kopplad till den utbildningsnivå som valts som högsta enligt Utbildningsregistrets prioriteringsregler. Inriktningen anges enligt Svensk utbildningsnomenklatur (SUN) som den fullständiga fyrställiga inriktningskoden och som dess första, två första och tre första positioner: enligt SUN 2000 för 2000–2021 och enligt SUN 2020, där positionerna finns från 2019 och den fullständiga koden för 1988–2024. 1997–1999 anges första siffran i SUN-koden. Inriktningen anges också enligt ISCED-F 2013, fullständigt och som tvåställig kod (från 2010), en klassificering som bara används i den internationella redovisningen. Gruppen innehåller också den utbildningsinriktning som har flest avklarade poäng bland personens yrkesinriktade kurser." }
