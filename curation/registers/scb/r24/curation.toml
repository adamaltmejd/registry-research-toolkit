[[statement]]
kind = "set"
subject = "set:utbildningsniva"
fields = { "description" = "Nivån för personens högsta utbildning enligt Svensk utbildningsnomenklatur (SUN). Avser personens högsta utbildning till och med vårterminen aktuellt år, vald enligt Utbildningsregistrets prioriteringsregler, som bygger på antaganden om kvaliteten i de olika källregistren. Nivån anges som den fullständiga treställiga nivåkoden, som dess första och två första positioner, som ett aggregat till sju värden (dels det mest använda, jämförbart bakåt med den äldre SUN-kodens nivåindelning, dels ett aggregat av de knappt 50 nivåkoderna) och som ett grovt aggregat till fyra värden, enligt SUN 2000 (2000–2018) och SUN 2020 (från 2019). 1997–1999 anges nivån som andra siffran i den äldre SUN-koden och grovt i fyra nivåer. Nivån anges också enligt ISCED 2011 (från 2010), fullständigt och som ensiffrig kod, som bara används i den internationella redovisningen. Gruppen innehåller även nivån enligt föregående års Utbildningsregister, som fullständig SUN 2020-kod, som dess två första positioner och i tre grupper: förgymnasial, gymnasial och eftergymnasial utbildningsnivå." }
