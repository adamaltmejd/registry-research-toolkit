[[statement]]
kind = "set"
subject = "set:prisindexniva"
fields = { "description" = "Prisnivå i förhållande till en referenstidpunkt, som indexserier med olika bas och valuta. Basen är ett fast år (till exempel 1980, 2005, 2010, 2015, 2020 eller 2021 = 100), föregående år, december eller fjärde kvartalet föregående år, eller två år tillbaka för år-till-årindex och år-till-månadsindex; några serier beräknas i euro i stället för kronor, och reviderat index räknas med priskorrigeringar och uppdaterade vikter. Index med bas 1980 är det kedjeindex som utgör konsumentprisindex; sedan 2004 beräknas det som produkten av alla år-till-årindex från 2003 och det senaste år-till-månadsindexet. Varuindex (2001–2012) är ett produkterbjudandes valutajusterade pris delat med baspriset i december föregående år, gånger 100." }
