subject = "set:kvalitetsjusteringsmetod"
fields = { "description" = "Hur kvalitetsskillnaden mellan den gamla och den nya produkten vid ett produktbyte justerar baspriset, för konsumentprisindex respektive producentprisindex. I konsumentprisindex (från 2014) används hedonisk regression för kläder och skor, MCR för datorer, datortillbehör och mobiltelefoner, och för övriga produkter subjektiv kvalitetsvärdering, direkt jämförelse utan kvalitetsjustering eller inget produktbyte alls när produkten är slutsåld. I producentprisindex (2001–2012) anges metoden av handläggaren efter information från uppgiftslämnaren." }
