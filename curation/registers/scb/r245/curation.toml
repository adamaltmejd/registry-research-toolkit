[[statement]]
kind = "set"
subject = "set:upprakningsvikt"
fields = { "description" = "Vikter som räknar upp urvalet, som designvikt och som kalibrerad vikt, för AKU-urvalet och för RTB-urvalet. AKU-vikterna räknar upp till svenska medborgare folkbokförda i Sverige 18–74 år och är 0 för personer i andra urval; RTB-vikterna räknar upp till de röstberättigade, den kalibrerade till de röstberättigade i Europaparlamentsvalet. De kalibrerade vikterna tar hänsyn till urvalssannolikheter i olika strata och till hjälpinformation om röstberättigade efter åldersgrupp och kön; AKU-vikten tar även hänsyn till svarsfrekvenser och kompenserar för bortfall, och RTB-vikten använder även rösträttsgrupper och antal röstande." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF och OP för kvikt-aku nämner svarsfrekvenser och bortfall, för kvikt-rtb rösträttsgrupper och antal röstande; dvikt-rtb räknar upp till röstberättigad befolkning, kvikt-rtb till Europaparlamentsvalet.\ncatalog:variable_text:14800:10592:10957\ncatalog:variable_text:14800:14245:14610\ncatalog:variable_text:14801:10592:10957\ncatalog:variable_text:14801:14245:14610\ncatalog:variable_text:14829:10592:10957\ncatalog:variable_text:14829:14245:14610\ncatalog:variable_text:14830:10592:10957\ncatalog:variable_text:14830:14245:14610"

