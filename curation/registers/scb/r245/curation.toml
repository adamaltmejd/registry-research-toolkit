fields = { "description" = "Personens födelseland enligt Registret över totalbefolkningen (RTB), och födelselandet grupperat i världsdelar eller landgrupper, som kod och som klartext. 2004, 2014, 2019 och 2024 kompletteras uppgifterna med Flergenerationsregistret för att täcka så många personer som möjligt; 1999 kompletteras födelselandet med RTB 1998 för poster som inte matchat mot RTB 1999." }
