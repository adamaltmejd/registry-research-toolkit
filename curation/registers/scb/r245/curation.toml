[[statement]]
kind = "set"
subject = "set:kommungrupp"
fields = { "description" = "Kommungrupp för personens kommun enligt Sveriges Kommuner och Regioners indelning av kommuner i nio grupper efter bland annat befolkningsstorlek, pendlingsmönster och näringslivsstruktur. 2004 och 2009 används 2005 års indelning, 2014 2011 års, 2019 2017 års och 2024 2023 års. 2004–2014 avses kommunen där personen är röstberättigad enligt röstlängden som fastställs 30 dagar före valdagen, och grupperna anges som kod och som namn; 2019 och 2024 anges de med namn eller klartext." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description; a group reads as one bigger variable. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nDEF ger nio grupper; OP anger version per år och röstlängden bara för 2005- och 2011-versionerna; kod finns bara 2004–2014.\ncatalog:variable_text:14819:16071:16436\ncatalog:variable_text:14820:16071:16436\ncatalog:variable_text:14822:17897:18262\ncatalog:variable_text:14822:19723:20089\ncatalog:variable_text:14823:17897:18262\ncatalog:variable_text:14824:19723:20089\ncatalog:variable_text:14825:12418:12784\ncatalog:variable_text:14826:12418:12784"

