evidence = "Den operationella definitionen växlar mellan tröskning och grönfoder. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0438: De valda obärgade arealerna avser grönfoder enligt den granskade begreppsbeskrivningen. De omfattas därför inte av kärn- och frögruppens definition; ingen annan vald variabel stöder medlemskap här. membership-0439: Grödvisa obärgade kärn- och fröarealer omfattas, inklusive ekologiska och särskilt namngivna redovisningar. Majs och vårrybs stöds av etiketter och källbedömning trots identitetsöverlapp. Det etikettstödda medlemskapet för dar-23 behålls med granskningsgap.\ncatalog:variable_text:42328:19723:20089\ncatalog:variable_text:42330:19723:20089\ncatalog:variable_text:42348:17897:18628\ncatalog:variable_text:42353:16801:18628\ncatalog:variable_text:42365:19723:20089\ncatalog:variable_text:42366:16801:18628\ncatalog:variable_text:42524:19723:20089\ncatalog:variable_text:42525:19723:20089\ncatalog:variable_text:42526:19723:20089\ncatalog:variable_text:42527:19723:20089\ncatalog:variable_text:42528:19723:20089\ncatalog:variable_text:42529:19723:20089\ncatalog:variable_text:42530:19723:20089\ncatalog:variable_text:42531:19723:20089\ncatalog:variable_text:42532:19723:20089\ncatalog:variable_text:42533:19723:20089\ncatalog:variable_text:42534:19723:20089\ncatalog:variable_text:42535:19723:20089\ncatalog:variable_text:42536:19723:20089\ncatalog:variable_text:42537:19723:20089\ncatalog:variable_text:42538:19723:20089\ncatalog:variable_text:42539:19723:20089\ncatalog:variable_text:42540:19723:20089\ncatalog:variable_text:42541:19723:20089\ncatalog:variable_text:42542:19723:20089\ncatalog:variable_text:42543:19723:20089\ncatalog:variable_text:42544:19723:20089\ncatalog:variable_text:42545:19723:20089\ncatalog:variable_text:42546:16801:18628\ncatalog:variable_text:42547:16801:19358\ncatalog:variable_text:42548:17532:17897\ncatalog:variable_text:42548:17897:1826