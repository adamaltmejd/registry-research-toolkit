fields = { "description" = "Tillhörighet till småort enligt SCB:s regionala indelning i småorter: sammanhängande bebyggelse med högst 150 meter mellan husen och 50–199 invånare. SCB avgränsar småorterna med registret över totalbefolkningen samkört med koordinatsatta fastigheter eller adresser och Lantmäteriets fastighetskarta. Till och med 2017 kodas glesbygd 0000 och tätort 9999; från 2018 har koderna prefixet S, med en delvis ny definition och metod från 2015 års småorter." }
