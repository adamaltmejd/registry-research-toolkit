evidence = "Maintainer ruling 2026-11-02: one variable, one description.\n\nSvarskoderna omfattar även andra fackföreningar och icke-medlemskap.\ncatalog:occurrence:405947\ncatalog:valueset:8602\n\nDescription measurement review 2026-11-02: rel070-base/reg_meta.db:occurrence:401567:opdef_text. One variable, one description.\n\nOccurrence-scope review 2026-11-02: Question number and routing code are documented only through May 2015; do not impose that questionnaire-specific routing on later waves. Evidence: rel070-base/reg_meta.db occurrences 401567, 404355, 404837.\n\nFaithfulness review 2026-11-02: Specify the last supported survey wave (May 2015); November 2015 has no routing instruction. Source: 401567 (rel070-base/reg_meta.db:opdef_text).\n\nMaintainer ruling 2026-11-02: one description states facts about the variable, never its documentation. Undocumented periods do not establish measurement changes. State the measurement rule directly for the variable; silence or less detailed wording in other periods is not a measurement change. Evidence: rel070-base/reg_meta.db occurrences 401567, 404355."

