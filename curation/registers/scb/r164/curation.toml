fields = { "description" = "Om personen deltog i det senaste riksdagsvalet: svaret på fråga 5, ställd till den som var röstberättigad i det senaste riksdagsvalet (ungdomar som inte fyllt 18 på valdagen får inte frågan), och en härledd variabel från fråga 5, en kod för förstagångsväljare och resultatet av kontakten (kod 100 om resultat av kontakt är 6, 101 om det är 4 eller 5 och 3 för förstagångsväljare)." }
