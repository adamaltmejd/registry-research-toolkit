fields = { "description" = "Anger vilket röstalternativ personen valde i folkomröstningen om euron, med svarsalternativen ja, nej och blankt." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description.\n\nDen befintliga beskrivningen anger deltagande, men svarskoderna anger röstalternativ.\ncatalog:valueset:11772\ncatalog:variable_text:40973:12904:12935\n\nDescription measurement review 2026-11-02: rel070-base/reg_meta.db:occurrence:402345:opdef_text; rel070-base/reg_meta.db:occurrence:402434:opdef_text; rel070-base/reg_meta.db:occurrence:402527:opdef_text. One variable, one description.\n\nMaintainer ruling 2026-11-02: one description states facts about the variable, never its documentation. Undocumented periods do not establish measurement changes. Remove the questionnaire/event year; retain the referendum and response meaning without a calendar date. Evidence: rel070-base/reg_meta.db occurrences 402345, 402434, 402527."

