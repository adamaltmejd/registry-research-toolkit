[[statement]]
kind = "assert"
subject = "industrins-varuproduktion: Typkod @1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007"
fact = { "entity" = "occurrence", "fields" = { "type" = "text", "label" = "IVP, Typkod 1996–2007", "definition" = "Typkod i leveranserna 1996–2007. SCB dokumenterar inte dess innebörd för dessa år. Den har inte innebörden från 2008 (lönbearbetning på KN-nummer): före 2008 redovisades lönbearbetning på varunummer som börjar med 993.", "sensitive" = false, "identifier" = false } }
evidence = "reg_meta_build/curation/registers/scb/ivp.toml:239\n\nSWECOV holds Typkod in IVP_1996–IVP_2007; SCB's Registerinformation documents the literal on this variant only from 2008, as typkod-lonbearbetning. NV0119 BS 2012 p. 10 states that before 2008 lönbearbetning was collected on varunummer starting with 993, and SSD IVPKNAr shows 'Lönbearbetning, Leveranser tkr' zero or suppressed 1996–2007, so the pre-2008 column cannot carry the 2008+ meaning; it is minted as its own variable and never joins typkod-lonbearbetning (#1621). The coding.documented entry below labels its values (0 ordinary production, 1 lönbearbetning). The versions 1996–2001 are the accepted (errata.version) editions. Flags follow the documented typkod-lonbearbetning (non-sensitive, non-identifier). (#1603; maintainer ruling 2026-10-15)."

