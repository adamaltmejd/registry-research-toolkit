[[statement]]
kind = "set"
subject = "set:koldioxidutslapp"
fields = { "description" = "Fordonets koldioxidutsläpp i g/km, mätt enligt NEDC (New European Driving Cycle) eller, från 2017, enligt WLTP (Worldwide Harmonised Light Vehicles Test Procedure). Ett mått per drivmedel (drivmedel 1 är fordonets huvudsakliga drivmedel, därtill drivmedel 2 och 3) och körsätt: blandad körning och, för NEDC från 2017, stads- och landsvägskörning; därtill viktade värden vid blandad körning, enligt NEDC och enligt WLTP per drivmedel. Gruppen innehåller också specifikt koldioxidutsläpp för tunga fordon som omfattas av kraven i 2017/2400/EU (från 2019): ett beräknat värde från EU-kommissionens verktyg VECTO som bygger på bland annat en genomsnittlig nyttolast och avser grundfordonet om fordonet är byggt i flera steg." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nTexterna skiljer sig i mätmetod, drivmedel, körsätt och viktning; det specifika utsläppet för tunga fordon beskrivs separat eftersom det är beräknat och saknar angiven enhet.\ncatalog:variable_text:18824:14244:14245\ncatalog:variable_text:18824:14974:14975\ncatalog:variable_text:18825:15705:15706\ncatalog:variable_text:18825:16070:16071\ncatalog:variable_text:18826:17531:17532\ncatalog:variable_text:18826:18992:18993\ncatalog:variable_text:18889:17531:17532\ncatalog:variable_text:18890:17531:17532\ncatalog:variable_text:18891:17531:17532\ncatalog:variable_text:18892:17531:17532\ncatalog:variable_text:18893:14244:14245\ncatalog:variable_text:18893:14974:14975\ncatalog:variable_text:18894:16070:16071\ncatalog:variable_text:18895:17531:17532\ncatalog:variable_text:18896:17531:17532\ncatalog:variable_text:18897:17531:17532\ncatalog:variable_text:18898:17531:17532\ncatalog:variable_text:18899:17531:17532\ncatalog:variable_text:18899:18992:18993\ncatalog:variable_text:18900:17531:17532\ncatalog:variable_text:18901:17531:17532\ncatalog:variable_text:18901:18992:18993\ncatalog:variable_text:18966:18261:18262"

