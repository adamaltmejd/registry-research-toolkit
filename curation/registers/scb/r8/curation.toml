evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nSamma definition i alla texter; de skiljer sig bara i ägarled.\ncatalog:variable_text:18789:4017:4018\ncatalog:variable_text:18789:14974:14975\ncatalog:variable_text:18790:10591:10592\ncatalog:variable_text:18791:10591:10592\ncatalog:variable_text:18791:14974:14975\ncatalog:variable_text:18796:17166:17167"

[[statement]]
kind = "set"
subject = "set:bransleforbrukning"
fields = { "description" = "Fordonets bränsleförbrukning vid blandad körning, mätt enligt NEDC eller, från 2017, enligt WLTP (Worldwide Harmonised Light Vehicle Test Procedure). Ett mått per drivmedel (drivmedel 1 är fordonets huvudsakliga drivmedel, därtill drivmedel 2 och 3) samt viktade värden: ett viktat NEDC-värde och viktade WLTP-värden per drivmedel. NEDC-värdena anges i m3/10 km för metan, kg/10 km för vätgas och liter/10 km (liter/mil) för övriga drivmedel, WLTP-värdena i liter/100 km." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nTexterna skiljer sig i mätmetod, drivmedel och viktning; enheterna liter/mil och l/10 km är samma enhet, och 1/10km är en felskrivning för l/10 km.\ncatalog:variable_text:18809:13148:13149\ncatalog:variable_text:18810:14244:14245\ncatalog:variable_text:18810:17531:17532\ncatalog:variable_text:18811:16070:16071\ncatalog:variable_text:18811:19357:19358\ncatalog:variable_text:18812:15705:15706\ncatalog:variable_text:18812:20453:20454\ncatalog:variable_text:18813:17531:17532\ncatalog:variable_text:18814:17531:17532\ncatalog:variable_text:18815:17531:17532\ncatalog:variable_text:18816:17531:17532\ncatalog:variable_text:18817:17531:17532\ncatalog:variable_text:18818:17531:17532\ncatalog:variable_text:18819:14244:14245\ncatalog:variable_text:18819:17531:17532\ncatalog:variable_text:18819:18992:18993"

