evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla texter har samma definition och skiljer sig bara i vilket ägarled de avser.\ncatalog:variable_text:18828:4017:4018\ncatalog:variable_text:18829:15705:15706\ncatalog:variable_text:18831:4017:4018\ncatalog:variable_text:18831:16800:16801\ncatalog:variable_text:18832:4017:4018\ncatalog:variable_text:18832:16800:16801"

[[statement]]
kind = "set"
subject = "set:agarens-naringsgren"
fields = { "description" = "Bransch som fordonets ägare är verksam inom, när ägaren är en juridisk person, klassificerad enligt SNI. Ett mått per ägarled (ägare, föregående ägare, nästföregående ägare och, enligt SNI 2007 från 2016, administrativ ägare) och per SNI-version (SNI 69, SNI 92, SNI 2002 och SNI 2007)." }
