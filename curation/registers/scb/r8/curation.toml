evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nSamma variabel; övriga fordonsslag och terränghjulingar saknar bara tillägget om imputering, som även gäller dem (Årsmodell imputerad finns för terränghjulingar).\ncatalog:variable_text:18802:4017:4018\ncatalog:variable_text:18802:10956:10957\ncatalog:variable_text:18802:17896:17897"

[[statement]]
