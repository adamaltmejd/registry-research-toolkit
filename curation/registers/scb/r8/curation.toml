subject = "set:miljobilsklassning"
fields = { "description" = "Om fordonet uppfyller kraven i olika miljöklassningar: miljöbilsklassning (från 2008), supermiljöbil enligt förordning (2011:1590) (från 2015) och klimatbonusbil enligt förordning (2017:1334) om klimatbonusbilar (från 2018). Klimatbonusbil omfattar nya personbilar registrerade från och med den 1 juli 2018 som har inga eller mycket låga koldioxidutsläpp, upp till 60 g/km 2018–2019 och upp till 70 g/km från 2020, eller kan drivas med annat gasbränsle än gasol, till exempel vätgas, metangas eller gengas; bilen får inte ha varit påställd tidigare, i Sverige eller utomlands, och ska uppfylla utsläppskraven för Euro 5 eller Euro 6." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nMedlemmarna anger var sin miljöklassning av fordonet; gränsen för klimatbonusbil ändrades från 60 till 70 g/km 2020.\ncatalog:variable_text:18888:17896:17897\ncatalog:variable_text:18888:18627:18628\ncatalog:variable_text:18925:14244:14245\ncatalog:variable_text:18969:16800:16801"

