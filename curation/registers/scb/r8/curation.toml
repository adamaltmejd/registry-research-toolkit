evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording.\n\nSamma markering; terränghjulingarnas text ”enkätsvar, förekomst” beskriver inte variabeln och tas inte med.\ncatalog:variable_text:18803:4017:4018\ncatalog:variable_text:18803:17896:17897"

