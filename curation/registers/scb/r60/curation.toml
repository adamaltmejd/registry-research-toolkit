[[statement]]
kind = "set"
subject = "set:lon"
fields = { "description" = "Belopp för anställningens olika lönedelar under mätmånaden: grundlön (den fasta månadslönen, eller tim-, dag- eller veckolön för månaden för timanställda; från 2020 anges att den är exklusive tillägg och avdrag, utan retroaktiva utbetalningar och avgångsvederlag, och motsvarar tjänstgöringens omfattning), fasta tillägg, rörliga tillägg och övertidstillägg, jour- och beredskapsersättning, naturaförmåner, bonus eller lönedel som utgår på grundval av prestation eller resultat (från september 2006), föräldrapenningtillägg och semestertillägg (från 2008), sjuklön (som inte beräknades 2000–2013) och retroaktiv lön för den senaste 6- respektive 12-månadersperioden, fördelad på högst 6 respektive 12 månader bakåt, som påverkar den definitiva genomsnittliga månadslönen. Tilläggen, ersättningarna och förmånerna härleds ur myndighetens lönesystem." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nMedlemmarna är lönedelarna för samma anställning och mätmånad.\ncatalog:variable_text:40942:13149:18262\ncatalog:variable_text:40942:18262:20454\ncatalog:variable_text:40947:10957:17167\ncatalog:variable_text:40947:20089:20454\ncatalog:variable_text:40948:13879:20454\ncatalog:variable_text:40949:10957:16071\ncatalog:variable_text:40949:18262:20454\ncatalog:variable_text:40950:10957:16071\ncatalog:variable_text:40966:10957:16071\ncatalog:variable_text:40966:18262:20454\ncatalog:variable_text:40968:10957:16071\ncatalog:variable_text:40971:10957:15706\ncatalog:variable_text:40971:15706:16071\ncatalog:variable_text:40972:10957:15706\ncatalog:variable_text:40972:15706:16071\ncatalog:variable_text:40973:10957:16071\ncatalog:variable_text:40976:13879:20454\ncatalog:variable_text:40977:10957:16071\ncatalog:variable_text:40977:16071:20454"

[[statement]]
kind = "set"
subject = "set:lonepopulation"
fields = { "description" = "Om anställningen ingår i lönepopulationen, för alla anställda och för månadsavlönade. Populationen består av sysselsatta inom statlig förvaltning och vid institutioner hänförliga till statlig sektor och delas upp i en sysselsättnings- och en lönepopulation. I lönepopulationen ingår alla som var anställda med lön under mätmånaden, utom helt tjänstlediga, anställda i utlandet och de som är yngre än 18 år eller äldre än 64 år (från 2023 äldre än 68 år); lönepopulationen för månadsavlönade undantar också den som inte är månadsavlönad eller har en tjänstgöringsomfattning under 40 procent, och har till 2022 den övre åldersgränsen 66 år. Till och med 2017 härleds tillhörigheten ur bland annat lönebeteckning eller löneform, tjänstgöringsomfattning och ålder." }
evidence = "Maintainer ruling 2026-11-02: one variable, one description. Maintainer ruling 2026-11-11: the description may be reformulated to fix errors, typos and wording; a group reads as one bigger variable (#2322).\n\nAlla texter definierar tillhörighet till lönepopulationen; åldersgränsen och avgränsningen för månadsavlönade anges med år.\ncatalog:variable_text:40957:15340:15706\ncatalog:variable_text:40957:15706:16071\ncatalog:variable_text:40957:16071:16436\ncatalog:variable_text:40957:16436:16801\ncatalog:variable_text:40958:10957:14975\ncatalog:variable_text:40958:14975:15340\ncatalog:variable_text:40958:15706:16071\ncatalog:variable_text:40958:16071:16436\ncatalog:variable_text:40958:16436:16801\ncatalog:variable_text:40958:17532:18993\ncatalog:variable_text:40958:18993:19358\ncatalog:variable_text:40958:19358:19723\ncatalog:variable_text:40958:19723:20454\ncatalog:variable_text:40959:17532:17897\ncatalog:variable_text:40959:17897:18993\ncatalog:variable_text:40959:18993:19358\ncatalog:variable_text:40959:19358:20454"

