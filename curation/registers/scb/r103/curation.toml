evidence = "Id:t använder igenkännbara delar av SUN, nivå och vårtermin; variabeln mäter nivån på utbildning som personen deltagit i. Coordinator group membership: Variablerna anger nivån på studier eller studiemedelsanknuten utbildning. Den särskilda källbedömningen för sunniva-vt anger nivån på utbildning personen deltagit i. Variablerna klassificerar personens utbildningsnivå i olika detaljeringsgrader. Det skyddade medlemskapet för sunniva-vt behålls trots den motstridiga tidigare källbedömningen.\ncatalog:occurrence:423095\ncatalog:valueset:1159\ncatalog:valueset:7130\ncatalog:variable_text:41508:11323:20089\ncatalog:variable_text:41509:11323:11688\ncatalog:variable_text:41510:11323:11688\ncatalog:variable_text:41553:11323:11688\ncatalog:variable_text:41564:10227:17897\ncatalog:variable_text:41565:15706:17897\ncatalog:variable_text:41566:11323:11688\ncatalog:variable_text:41578:17897:20089\ncatalog:variable_text:41580:17897:20089\ncatalog:variable_text:41583:19723:20089\ncatalog:variable_text:41585:19723:20089\ncatalog:variable_text:41592:9496:10227"

