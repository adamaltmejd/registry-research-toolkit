[[statement]]
kind = "set"
subject = "aktivitetsstod: var:utbetalningsmanad"
fields.row_key = true
evidence = "Row key: utbetalningsmanad (UTTAGET_MANAD) is the period of a row; one delivered file holds several months, so the unit id repeats per period and the key is id plus time (maintainer ruling 2026-11-14)."

[[statement]]
kind = "set"
subject = "aktivitetsstod: var:utbetalningsperiod-from"
fields.row_key = true
evidence = "Row key: utbetalningsperiod-from is the first day of the period a payment covers, distinct from the payment month (utbetalningsmanad); a retroactive or corrected payment pays an earlier period in a later month, so one person can have several rows per payment month. Key: person, payment month, period start (COS ruling on the #2479 review, 2026-11-14)."
