# Public ids of uhr/nya. A variable's id is the slug of its latest label where that slug is
# unique in the register, else the label slug with its column appended (the column alone where
# the label slug is longer than 40 characters; a label equal to its column is no label).
# personnr follows the identifier canon. sel_criterion takes -2: its slug is the id of
# the sel-criterion table.
# A column that means different things in different tables is split in curation.toml; each
# part takes the label slug of its own table. Written with the provider's onboarding, 2026-11-13.
[tables]
"sok-adm" = "sok-adm"
"sok-am" = "sok-am"
