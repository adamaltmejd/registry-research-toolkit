[[statement]]
kind = "set"
subject = "var:antsokbarn"
fields = { "sets" = [] }
evidence = "Antal sökande i hushållet; etikett och definition skiljer sig. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0501: Åldersvisa barnantal och intervallantal mäter samma begrepp. Den aktuella beskrivningen av antsokbarn anger också ett antal personer 0–17 år, men etiketten behöver klarläggas. membership-0502: Inga valda variabler i denna sektion mäter antal barn. membership-0503: Samtliga valda barnantal mäter antal barn inom angiven ålder eller åldersintervall. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0501: Antpers mäter hushållets personantal och övriga personer 18–21 år är en uttrycklig personkomponent. Antsokbarn utesluts enligt den aktuella beskrivningen av ett separat antal personer 0–17 år. membership-0502: Hushållstyp och ordningsnummer mäter inte antal personer eller personkomponenter i hushållet. membership-0503: Sektionens valda antal avser barn inom angivna åldrar, vilka uttryckligen undantas från denna kandidat. Inga andra valda uppgifter mäter hushållsstorlek.\ncatalog:variable_text:56091:15340:16071\ncatalog:variable_text:56092:7305:2932897\ncatalog:variable_text:56093:7305:2932897\ncatalog:variable_text:56094:7305:2932897\ncatalog:variable_text:56095:7305:2932897\ncatalog:variable_text:56096:7305:2932897\ncatalog:variable_text:56097:7305:2932897\ncatalog:variable_text:56098:7305:2932897\ncatalog:variable_text:56099:7305:2932897\ncatalog:variable_text:56100:7305:2932897\ncatalog:variable_text:56101:7305:2932897\ncatalog:variable_text:56102:15340:16071\ncatalog:variable_text:56103:7305:2932897\ncatalog:variable_text:56104:7305:2932897\ncatalog:variable_text:56105:7305:2932897\ncatalog:variable_text:56106:7305:2932897\ncatalog:variable_text:56107:7305:2932897\ncatalog:variable_text:56108:7305:2932897\ncatalog:variable_text:56109:7305:2932897\ncatalog:variable_text:56110:7305:2932897\ncatalog:variable_text: