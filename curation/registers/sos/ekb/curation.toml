[[statement]]
kind = "set"
subject = "var:utlanskt-hushall"
fields = { "tags" = ["demographics"] }
evidence = "Etiketten står i konflikt med definition och värdekoder. Coordinator group membership: Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0501: Ingen vald variabel i denna sektion kodar medborgarskap eller uttryckligen utländskt hushåll. membership-0502: Det skyddade medlemskapet och kandidatens fasta inkludering behålls trots källkonflikten. De entydiga utrikesfödelsevariablerna omfattas inte. membership-0503: Etiketten utländskt hushåll omfattas uttryckligen av den fasta kandidaten och behålls trots den dokumenterade konflikten med beskrivning och värdekoder. Union of complete disjoint source-table decisions; no singleton judgement before union. membership-0501: Ingen vald variabel kodar inrikes eller utrikes födelse. Flyktingstatus och födelsetid uppfyller inte definitionen. membership-0502: Variablerna kodar utrikes födelse för hushåll respektive person. Den motstridigt dokumenterade medborgarskapsvariabeln tilldelas inget ytterligare medlemskap utan avgörande källstöd. membership-0503: Båda beskrivningarna anger om sökande eller medsökande är utrikesfödd. För utländskt hushåll kvarstår konflikten med etiketten och den andra fasta kandidatens inkludering.\ncatalog:valueset:12410\ncatalog:valueset:12534\ncatalog:variable_text:56273:7305:17167\ncatalog:variable_text:56274:7305:2932897\ncatalog:variable_text:56275:7305:2932897\ncatalog:variable_text:56276:7305:2932897\ncatalog:variable_text:56277:7305:2932897\ncatalog:variable_text:56434:10227:15340\ncatalog:variable_text:56577:15340:16071\ncatalog:variable_text:56578:15340:16071\ncatalog:variable_text:56579:7305:2932897\ncatalog:variable_text:56580:7305:2932897"

