{"objects":{"03d6306a53d300df5bc6edb5abe2ef540fd32bf35114833f2397bfa6dafc1225":{"fields":{"cadence":"month","coverage":["2010-01-01","9999-12-31"],"description":"Register över vårdtillfällen i tvångsvård (tvångsvårdstillfällen), 2010-2014. Innehåller diagnoser, åtgärder, psykiatrisk vårdform mm. Efter 2015 ingår uppgifterna istället i PAR_SV. Från 2024 ingår uppgifterna återigen i deldatamängd Tvångsvård. Då finns enbart uppgiter om psykiatrisk vårdform, medan diagnoser och åtgärder mm finns i PAR_SV och PAR_OV","from":"2010-01-01","kind":"table","locator":{"at":"Deldatamängder och datavyer!4","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"},"name":"Tvångsvård","period":["2010-01-01","9999-12-31"],"provider":"sos","register":"par","table":"PAR_TV","table_slug":"par-tv","to":null},"locator":{"at":"Deldatamängder och datavyer!4","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"}},"2856d16af10ee1fa40003fdc32e3b89feb026bc9b8da3e346c8131dfd655317e":{"fields":{"cadence":null,"coverage":["0001-01-01","9999-12-31"],"description":"Patientregistret är ett nationellt register som innehåller uppgifter om patienter som har vårdats inom den slutna hälso- och sjukvården samt de som har behandlats av läkare inom den specialiserade öppenvården (den del av den öppna hälso- och sjukvården som inte är primärvård). För varje vårdkontakt ska uppgift om patientens personnummer, huvuddiagnos, relevanta bidiagnoser, vårdåtgärder, i vissa fall yttre orsaker samt andra medicinska och administrativa uppgifter finnas.","from":null,"kind":"register","locator":{"at":"Metadata-Datamängd (DCAT-AP) !","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"},"name":"Patientregistret","period":["0001-01-01","9999-12-31"],"provider":"sos","register":"par","table":null,"table_slug":null,"to":null},"locator":{"at":"Metadata-Datamängd (DCAT-AP) !","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret