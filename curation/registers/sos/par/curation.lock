{"objects":{"03d6306a53d300df5bc6edb5abe2ef540fd32bf35114833f2397bfa6dafc1225":{"fields":{"cadence":"month","coverage":["2010-01-01","9999-12-31"],"description":"Register över vårdtillfällen i tvångsvård (tvångsvårdstillfällen), 2010-2014. Innehåller diagnoser, åtgärder, psykiatrisk vårdform mm. Efter 2015 ingår uppgifterna istället i PAR_SV. Från 2024 ingår uppgifterna återigen i deldatamängd Tvångsvård. Då finns enbart uppgiter om psykiatrisk vårdform, medan diagnoser och åtgärder mm finns i PAR_SV och PAR_OV","from":"2010-01-01","kind":"table","locator":{"at":"Deldatamängder och datavyer!4","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"},"name":"Tvångsvård","period":["2010-01-01","9999-12-31"],"provider":"sos","register":"par","table":"PAR_TV","table_slug":"par-tv","to":null},"locator":{"at":"Deldatamängder och datavyer!4","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"}},"2856d16af10ee1fa40003fdc32e3b89feb026bc9b8da3e346c8131dfd655317e":{"fields":{"cadence":null,"coverage":["0001-01-01","9999-12-31"],"description":"Patientregistret är ett nationellt register som innehåller uppgifter om patienter som har vårdats inom den slutna hälso- och sjukvården samt de som har behandlats av läkare inom den specialiserade öppenvården (den del av den öppna hälso- och sjukvården som inte är primärvård). För varje vårdkontakt ska uppgift om patientens personnummer, huvuddiagnos, relevanta bidiagnoser, vårdåtgärder, i vissa fall yttre orsaker samt andra medicinska och administrativa uppgifter finnas.","from":null,"kind":"register","locator":{"at":"Metadata-Datamängd (DCAT-AP) !","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"},"name":"Patientregistret","period":["0001-01-01","9999-12-31"],"provider":"sos","register":"par","table":null,"table_slug":null,"to":null},"locator":{"at":"Metadata-Datamängd (DCAT-AP) !","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"}},"a99dfd3709a48b762845b38f8eb16f128cba6326830e821c14aae9a974272f74":{"fields":{"cadence":"month","coverage":["1964-01-01","9999-12-31"],"description":"Register över vårdkontakter i sluten vård (slutenvårdstillfällen). Från 1964 försöksverksamhet i vissa landsting. Från 1987 ingår hela riket. Till och med 2014 endast utskrivna patienter men med inventering av inneliggande patienter i psykiatri och geriatrik vid varje årsskifte. Från och med 2015 även inneliggande patienter. Från 2015 även uppgift om psykiatrisk vårdform vid tvångsvård.","from":"1964-01-01","kind":"table","locator":{"at":"Deldatamängder och datavyer!2","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"},"name":"Sluten vård","period":["1964-01-01","9999-12-31"],"provider":"sos","register":"par","table":"PAR_SV","table_slug":"par-sv","to":null},"locator":{"at":"Deldatamängder och datavyer!2","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"}},"d5138885422eff1f23c9bdbe9b8400999cee6cc36f871ebf30a0bb555b6f06db":{"fields":{"cadence":"month","coverage":["1997-01-01","9999-12-31"],"description":"Register över vårdkontakter i öppen vård som ej är primärvård. 1997-2000 samlades besök i öppenvården där operationer som tidigare gjordes i slutenvård in, kallades dagkirugi. Från 2001 fram till och med 2023 alla vårdkontakter med läkare. Från 2024 även vårdkontakter med annan hälso- och sjukvårdspersonal inom psykiatrisk öppen vård.","from":"1997-01-01","kind":"table","locator":{"at":"Deldatamängder och datavyer!3","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"},"name":"Öppen vård","period":["1997-01-01","9999-12-31"],"provider":"sos","register":"par","table":"PAR_OV","table_slug":"par-ov","to":null},"locator":{"at":"Deldatamängder och datavyer!3","input":"catalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx"}}},"statements":{"0180e4a8f4c517a76a82e3a176f1b384a1044760edebeadd088f