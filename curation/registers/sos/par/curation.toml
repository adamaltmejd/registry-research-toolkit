[[statement]]
kind = "set"
subject = "par-sv: hdia where key = 'n:hdia' and label = 'Huvuddiagnoskod'"
fields = { "variable" = "huvuddiagnoskod" }
evidence = "The n:hdia source key conflates two different fields. In the flat files (plattfil) HDIA is the main diagnosis code: PAR_SV from 1964 (row 107), PAR_OV from 1997 (row 36), label 'Huvuddiagnoskod'. In the multi-files (flerfil) from 2015 (PAR_SV row 106, PAR_OV row 35) and in PAR_TV 2011-2012 (row 199) it is the 0/1 marker 'Typ av diagnos' whether the code in DIA is the main diagnosis. PAR_SV row 107 says so itself: 'I flerfilen DI är HDIA endast en binär variabel'. Exact source-label guards separate the two as for ATC.\ncatalog/source/Socialstyrelsen/Metadata_Patientregistret (PAR)_webb.xlsx: 'Metadata - Variabelnivå' rows 35, 36, 106, 107, 199."

