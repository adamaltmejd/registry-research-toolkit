evidence = "Kodningen specificerar matdistribution inom hemtjänstens service. Coordinator group membership: Variablerna kodar hemtjänst, dess timomfattning eller uttryckligen namngivet innehåll. Förenklat beslutsfattande beskriver beslutsförfarandet och separat beslutade insatser saknar den erforderliga hemtjänstanknytningen. Alla tre variablerna anger uttryckligen matdistribution, genom hemtjänst eller separat beslut. SERVMATD specificerar matdistribution inom hemtjänstens service. Variablerna kodar service inom hemtjänsten, inklusive matdistribution som uttryckligen specificerad del av denna service.\ncatalog:valueset:10879\ncatalog:variable_text:57400:19144:2932897\ncatalog:variable_text:57402:15522:2932897\ncatalog:variable_text:57403:13787:15615\ncatalog:variable_text:57404:15522:2932897\ncatalog:variable_text:57405:13787:15615\ncatalog:variable_text:57406:13787:15615\ncatalog:variable_text:57407:15522:2932897\ncatalog:variable_text:57408:13787:15615\ncatalog:variable_text:57409:15522:2932897\ncatalog:variable_text:57410:13787:15615\ncatalog:variable_text:57411:15522:2932897\ncatalog:variable_text:57412:15522:2932897\ncatalog:variable_text:57423:15522:2932897\ncatalog:variable_text:57428:15522:2932897\ncatalog:variable_text:57431:14244:14610\ncatalog:variable_text:57432:15522:2932897\n\nSingle-group ruling 2026-11-02: The definition explicitly specifies meal distribution within home-help service."

