[[statement]]
kind = "set"
subject = "var:sarskilt-boende-hemtjanst-dygnet-runt"
fields = { "sets" = ["boendeform", "hemtjanst"] }
evidence = "Kodningen anger uttryckligen hemtjänst och ingår i kandidatgruppen. Coordinator group membership: Variablerna kodar boendeform eller namngivna boendeformer. Detta omfattar även annat biståndsbeslutat boende och särskilt boende med hemtjänst dygnet runt samt boendeform vid verkställan och avslut. Variablerna kodar hemtjänst, dess timomfattning eller uttryckligen namngivet innehåll. Förenklat beslutsfattande beskriver beslutsförfarandet och separat beslutade insatser saknar den erforderliga hemtjänstanknytningen.\ncatalog:variable_text:57372:15522:2932897\ncatalog:variable_text:57376:13787:15615\ncatalog:variable_text:57378:13787:15615\ncatalog:variable_text:57388:15522:2932897\ncatalog:variable_text:57400:19144:2932897\ncatalog:variable_text:57402:15522:2932897\ncatalog:variable_text:57403:13787:15615\ncatalog:variable_text:57404:15522:2932897\ncatalog:variable_text:57405:13787:15615\ncatalog:variable_text:57406:13787:15615\ncatalog:variable_text:57407:15522:2932897\ncatalog:variable_text:57408:13787:15615\ncatalog:variable_text:57409:15522:2932897\ncatalog:variable_text:57410:13787:15615\ncatalog:variable_text:57411:15522:2932897\ncatalog:variable_text:57412:15522:2932897\ncatalog:variable_text:57424:13787:15615\ncatalog:variable_text:57428:15522:2932897\ncatalog:variable_text:57430:15522:2932897\ncatalog:variable_text:57431:14244:14610\ncatalog:variable_text:57432:15522:2932897\ncatalog:variable_text:57435:15522:2932897"

