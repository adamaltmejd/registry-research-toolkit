# #2607: the register's two vaccination programmes as tables of their own. The parent
# (the register's implicit table) keeps every documented column and stays orderable as
# the union. The new tables document no columns: FoHM documents the register as one
# table. A data steward that holds each programme as its own file places the canonical
# variables on these tables with reference occurrences (crates/DESIGN.md, "Steward-
# attested occurrences"), which require only that the table exists, dated, in this
# register.

[[statement]]
kind = "assert"
subject = "table:covid-19"
fact = { entity = "table", fields = { name = "Vaccinationer mot covid-19", description = "Vaccinationer mot covid-19 som registrerats i Nationella vaccinationsregistret, från 2021.", coverage = "2021.." } }
evidence = "#2607 (long-COVID order trial, 2026-11-20): a project cannot order only the COVID-19 vaccinations, because the register is one table and a steward holds them as their own file. FoHM's register description: 'Täckning: barnvaccinationer fr.o.m. 2013, covid-19 fr.o.m. 2021'.\ncatalog/source/transcriptions/fohm/registers.csv: nvr"

