[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-meta"
version = "0.39.1"
description = "Search and query SCB registry metadata"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# `reg-schema` is the dependency REFACTOR_SPEC.md §12 sanctions: the shared order
# materializer (`order.py`) consumes `ProjectData`, and the decision was to take
# this edge rather than create a third package for one function. It resolves via
# [tool.uv.sources] in the workspace root, so the floor is a convention pin
# (cf. reg_webapp), not a PyPI resolution.
dependencies = [
    "pydantic>=2.13.4",
    "reg-schema>=2.0.0",
    "zstandard>=0.23",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[project.scripts]
reg-meta = "reg_meta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_meta"]

# Docs are shipped separately as the `reg_meta_docs.db.zst` release asset
# (see doc_db.py and .claude/skills/release/SKILL.md); they are NOT bundled
# in the wheel. The markdown under reg_meta_build/docs/ is for maintainers
# to edit and contribute; users get the built doc DB via `reg-meta update`.
# xlsx parsing (openpyxl) is a build-only concern and now lives in
# reg_meta_build's dependencies.
