# Steward pin registry: each steward id selects its dedicated repository, an exact commit
# and the relative path of its config. No branch, no implicit latest. The holdings
# compiler verifies the supplied checkout and every consumed input against this pin.
# It sits outside curation/ so a re-pin does not move the base catalog's curation_digest
# (and generation), which the steward lock binds.

[swecov]
repo = "git@github.com:adamaltmejd/swecov-steward.git"
commit = "7bdda77772e49e03fabe552c6f1e42b779b2a16b"
config = "steward.toml"
