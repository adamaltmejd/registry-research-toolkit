[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-schema"
version = "0.1.0"
description = "project_data.json schema and structural validator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Intentionally no runtime deps — reg_schema's structural layer is pure
# stdlib so it can be amalgamated into the reg_monabundle MONA bundle and
# consumed by reg_mockdata (post-rename of mock_data_wizard) after its
# reg_meta dependency is deleted in §15 step 9.
dependencies = []

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_schema"]
