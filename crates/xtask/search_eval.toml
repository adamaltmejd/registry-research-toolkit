# Search-relevance eval set (#393 item 10).
#
# ~20 real `(query -> intended result)` pairs (steward-confirmed 2026-06-17; grow as
# needed) that define "smarter search" for this bounded, curated catalog, so ranking
# changes
# become MEASURABLE (the precondition #393 calls out; it gates the ranking items
# 2/5/6/7). Run with:
#
#     cargo xtask search-eval [--url URL] [--limit N]
#
# against a `reg-meta serve` over a real catalog — it reports, per case, whether
# `intended` appears in its group and at what rank.
#
# STEWARD-CONFIRMED 2026-06-17. The `intended` answers below are the steward's ground
# truth (`confirmed = true`). An `expect = gap` case has a confirmed-correct intended
# that does NOT surface today (a curation / concept-group target); the runner flags it
# "closed!" once a fix lands.
#
# Fields:
#   query     - the omnibox input.
#   group     - which result group the intended result should land in
#               (register | variable).
#   intended  - the navigable target: an FQID (scb/iot, scb/lisa/civilstand).
#   expect    - "hit": should rank well today (regression guard).
#               "gap": the steward-wanted answer does NOT surface today — a curation /
#               concept-group target (e.g. golden-boost #311). A gap that turns into a hit is progress,
#               flagged "closed!".
#   note      - what the case exercises / why the intended is what it is.
#   confirmed - steward has signed off on this (query -> intended) pair (all true here).
#
# OUT OF SCOPE (deliberately): English<->Swedish query expansion / synonyms — a separate
# POST-FREEZE topic (#393 item 8). No English-query cases here.

# ── Exact register acronym -> that register ──────────────────────────────────
[[case]]
query = "LISA"
group = "register"
intended = "scb/lisa"
expect = "hit"
confirmed = true
note = "Exact acronym -> register, rank 1."

[[case]]
query = "HEK"
group = "register"
intended = "scb/hek"
expect = "hit"
confirmed = true
note = "Exact acronym -> register, rank 1. (RAMS deliberately NOT used as an example — it is stale, superseded by BAS = scb/bas.)"

# ── Topical term -> canonical register ───────────────────────────────────────
[[case]]
query = "inkomst"
group = "register"
intended = "scb/iot"
expect = "hit"
confirmed = true
note = "Income+taxation register. HEK ranks first today — is IoT or HEK the canonical answer? Steward decides."

[[case]]
query = "utbildning"
group = "register"
intended = "scb/ureg"
expect = "hit"
confirmed = true
note = "Befolkningens utbildning (Utbildningsregistret)."

[[case]]
query = "sysselsättning"
group = "register"
intended = "scb/lisa"
expect = "hit"
confirmed = true
note = "Steer employment queries to LISA. RAMS (ranks ~3 today) is stale, superseded by BAS (scb/bas); LISA does NOT surface for 'sysselsättning' via FTS. The retired Python builder pinned it to the top of the register group with a golden-boost (#311 / #393 item 4); the Rust builder has no such pin."

[[case]]
query = "diagnos"
group = "register"
intended = "sos/par"
expect = "hit"
confirmed = true
note = "Patientregistret is the broad diagnosis register but does NOT surface for 'diagnos' via FTS (only Cancerregistret does, via its purpose text). The retired Python builder pinned it to the top of the register group with a golden-boost (#311 / #393 item 4); the Rust builder has no such pin."

[[case]]
query = "läkemedel"
group = "register"
intended = "sos/lmed"
expect = "hit"
confirmed = true
note = "Medicine -> Läkemedelsregistret, rank 1."

[[case]]
query = "cancer"
group = "register"
intended = "sos/can"
expect = "hit"
confirmed = true
note = "cancer -> Cancerregistret, rank 1."

[[case]]
query = "cancerregistret"
group = "register"
intended = "sos/can"
expect = "hit"
confirmed = true
note = "Full register name -> register."

# ── Topical term -> a variable (no single owning register) ───────────────────
[[case]]
query = "civilstånd"
group = "variable"
intended = "scb/lisa/civilstand"
expect = "hit"
confirmed = true
note = "Marital status. Exact names lead (#1180, maintainer-accepted): ~60 variables named exactly Civilstånd fill the page, so the guard is LISA's plain Civilstånd, not RTB's civilgrel (Civilstånd tidigare relationsperson)."
