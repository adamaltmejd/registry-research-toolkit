# The carry adds `carry_scope` beside the guarded original on the same table and column,
# so the member's period is the added coverage and there is no donor.
[[errata.delivered]]
legacy = { ref = "curation/registers/sos/par.toml#/errata.occurrence_carry/1", head = "errata:occurrence_carry" }
member = { table = "par-ov", column = "DIA", period = { kind = "intervals", intervals = [{ start = "2005", end = "2014" }] } }
data_warning = "Before 2015 Socialstyrelsen reported diagnosis codes only inside the DIAGNOS string, so the per-position codes for 2005–2014 were derived from it. Their meaning is assumed to match the documented DIA."
evidence = "The SoS PAR metadata (Metadata_Patientregistret (PAR)_webb.xlsx) documents DIA as a row-wise column on PAR_OV and PAR_SV only from 2015. Earlier, diagnosis codes exist only inside DIAGNOS (PAR_OV from 1997, PAR_SV from 1964). #1603 batch-e; maintainer same-name rule 2026-10-16."
noted = "2026-10-17"

[errata.delivered.guard]
expected_fields = [{ name = "definition", status = "absent" }, { name = "description", status = "value", value = "Diagnoskod som haft klinisk relevans för vårdkontakten. Om tillståndet\när orsakat av eller relaterat\ntill läkemedel kan värdet vara en ATC-kod för läkemedlet i fråga" }, { name = "name", status = "value", value = "Diagnoskod eller ATC-kod vid skada eller förgiftning" }, { name = "operational_definition", status = "absent" }, { name = "coverage_from", status = "value", value = "2015" }, { name = "coverage_to", status = "unknown" }]
expected_scope = { kind = "intervals", intervals = [{ start = "2015" }] }
expected_period = { kind = "not_applicable", intervals = [] }
