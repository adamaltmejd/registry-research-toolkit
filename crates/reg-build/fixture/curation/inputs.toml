# The CI fixture: a synthetic provider, built twice and compared byte for byte
# (scripts/gate.py, `rust`). Each input exercises one default rule: a case-only
# spelling change (ALDER/Alder), a rename (Inkomst/DispInk), an ambiguous window (Typ),
# a T1 clamp (Typ beyond hushall's end), a key in two tables (LopNr) and a timeless
# table (kod). The SCB export (an asset zip under assets/) exercises releases: a final and a preliminary
# edition of 2020 (Kon shadowed and typed differently, PrelInk only preliminary), a
# collision (two 2021 deliveries), an unparsed name, a population collapse (2022), gap
# markers (Alder in 2021; Utbildning, never a column) and a hole (Alder in 2020),
# the summary's flags (Kon sometimes sensitive; LopNr an identifier), Timeseries (a
# table notice, a mirrored variable succession, a release succession as a notice, an
# unmapped Entitet and an unknown id) and two source registers (Hushållsregistret and an
# unknown one). The LISA list
# exercises a multi-range year cell (Kon), a blank one (Alder), section headings and
# footnotes, the sensitivity vocabulary, and Grundregister cells (Alder's names
# Hushållsregistret and RTB in one cell; the other abbreviations match no register). The frame input is written by hand: two
# keys on one spelling (Del), final and preliminary editions of one key (Mat), a
# preliminary-only table, populations with their own value sets, and the link stage: a
# continues, a derived_from by register name, a release notice and an unknown key.
repo = "fixture"
commit = "fixture"

[[provider]]
pid = "demo"
name = "Demoleverantören"

[[input]]
name = "demo"
reader = "transcription"
path = "demo"
provider = "demo"

[[input]]
name = "classifications"
reader = "classification-csv"
path = "classifications"

[[input]]
name = "scb"
reader = "scb"
release = "fixture"
path = "scb.zip"
sha256 = "1ed91ca1d8b69b7f49146ccd7059cc1a08bcbc72ed92779a94e11bb3784fed7a"
provider = "demo"

[[input]]
name = "lisa"
reader = "lisa"
path = "lisa/variabellista.xlsx"
provider = "demo"
register = "lisa-workbook"

[[input]]
name = "frame"
reader = "frame"
path = "frame"
