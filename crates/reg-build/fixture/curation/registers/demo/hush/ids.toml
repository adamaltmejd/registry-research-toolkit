# Public ids of demo/hush. `gammal` anchors nothing (reported unplaced); DispInk, Kod
# and Text have none (reported unminted). The register's public name differs from its
# handle `hush`.
public = "hushall"
[tables]
individ = "individ"
hushall = "hushall"

[variables]
alder = ["individ: ALDER"]
gammal = ["individ: Gammal"]
inkomst = ["individ: Inkomst"]
kon = ["individ: Kon"]
lopnr = ["individ: LopNr"]
typ = ["hushall: Typ"]
