[package]
name = "reg-core-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "reg_core_wasm"
crate-type = ["cdylib"]
# No Rust tests: the SPA's unit suite runs the exports through the built module
# (`reg_webapp/frontend/src/lib/reg_core.test.ts`).
test = false
doctest = false

[dependencies]
reg-core = { path = "../reg-core" }
serde_json = "1.0.151"
# Pinned exactly: `wasm-bindgen-cli` must be the same version (CI installs that pin;
# `reg_webapp/frontend/package.json` `gen:wasm` runs it).
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
