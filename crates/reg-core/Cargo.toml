[package]
name = "reg-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Must stay on the Unicode version of `src/case_folding.rs` and Rust std (18.0.0);
# the `unicode_version` test pins them together. Held exactly: a newer release may move
# to the next Unicode version before the toolchain does.
unicode-properties = { version = "=0.1.5", default-features = false, features = ["general-category"] }
utoipa = { version = "6.0.0", optional = true }

[features]
# The project types' OpenAPI schemas, published by `reg-catalog` and used to
# generate the plugin's project JSON Schema.
openapi = ["dep:utoipa"]

[lints]
workspace = true
