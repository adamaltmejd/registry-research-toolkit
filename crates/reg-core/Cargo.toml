[package]
name = "reg-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Must stay on the Unicode version of `src/case_folding.rs` and Rust std (17.0.0);
# the `unicode_version` test pins them together. Held exactly: 0.1.5 is Unicode 18.
# Revisit when the toolchain's `char::UNICODE_VERSION` reaches 18 (bump all three,
# then drop the `renovate.json` hold).
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
utoipa = { version = "6.0.0", optional = true }

[features]
# The project types' OpenAPI schemas, published by `reg-catalog` and used to
# generate the plugin's project JSON Schema.
openapi = ["dep:utoipa"]

[lints]
workspace = true
