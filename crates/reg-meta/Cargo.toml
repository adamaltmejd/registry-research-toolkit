[package]
name = "reg-meta"
version = "0.42.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
reg-catalog = { path = "../reg-catalog" }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
