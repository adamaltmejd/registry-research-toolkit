[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "reg-core-py"
version = "0.0.0"
description = "Python bindings to reg-core for the reg_meta build"
requires-python = ">=3.14"

[tool.maturin]
module-name = "reg_core_py"

[tool.uv]
# uv keys a path build on pyproject.toml alone, so without these a Rust edit would
# leave the installed extension stale. The keys of every cache of builder output hash
# the same paths: scripts/keyed_cache.py reads them from here (`NATIVE_SOURCES`) and
# accepts only a path or `<dir>/**` per entry.
cache-keys = [
  { file = "**" },
  { file = "../reg-core/**" },
  { file = "../../Cargo.toml" },
  { file = "../../Cargo.lock" },
]
