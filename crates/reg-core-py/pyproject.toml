[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "reg-core-py"
version = "0.0.0"
description = "Python bindings to reg-core for the reg_meta build"
requires-python = ">=3.15"

[tool.maturin]
module-name = "reg_core_py"

[tool.uv]
# uv keys a path build on pyproject.toml alone, so without these a Rust edit would
# leave the installed extension stale. The keys of every cache of builder output and
# the builder's source-record pin hash the same paths, less their Markdown:
# reg_meta_build/src/reg_meta_build/native_sources.py reads them from here and accepts
# only a path or `<dir>/**` per entry.
cache-keys = [
  { file = "**" },
  { file = "../reg-core/**" },
  { file = "../../Cargo.toml" },
  { file = "../../Cargo.lock" },
]
