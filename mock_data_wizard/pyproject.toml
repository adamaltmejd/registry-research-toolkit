[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-data-wizard"
version = "0.8.0"
description = "SCB MONA mock-data generation workflows"
requires-python = ">=3.13"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "reg-meta",
  # >=0.4 required for `reg_monabundle.runtime.*`, hard-imported by
  # `mock_data_wizard.{cli,stats,enrich}` after the runtime extraction
  # relocated classify/sql_emit/sources/summarize/spec/extract out of
  # mdw and into the runtime subpackage.
  "reg-monabundle>=0.4",
  "reg-schema",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[project.scripts]
mock-data-wizard = "mock_data_wizard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_data_wizard"]
