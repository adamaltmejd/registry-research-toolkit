name: Publish reg_meta to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    if: startsWith(github.event.release.tag_name, 'reg_meta/v')
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0

      # Smoke-test the release's DB assets before pushing to PyPI. There is no
      # pypi-environment approval pause; the release must stay draft until
      # reg_meta.db.zst and reg_meta_docs.db.zst have been uploaded or copied
      # forward per the release skill.
      #
      # download_db and download_docs_db each validate the asset's schema
      # before install, so an incompatible asset fails here instead of in
      # users' terminals. `reg_meta update` resolves the most recent release
      # carrying each asset via the walker, so a doc-less package release
      # still serves a prior-release doc DB — if no release in the walker's
      # window has a usable doc asset, the update fails and the workflow
      # exits non-zero.
      #
      # The smoke queries exercise the exact code paths that broke silently
      # in issue #8 (get schema → v.source_label) and confirm that the doc
      # search index is populated and schema-compatible.
      - name: Verify release DB assets are usable
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --frozen
          uv run reg-meta update --force -y
          uv run reg-meta get schema --register LISA --summary --format json > /dev/null
          # `docs search` must return at least one result — exit 0 with an
          # empty result set would mean the doc DB shipped empty. Use
          # `// 0` so a missing field coerces to a valid integer for -lt.
          docs_total=$(uv run reg-meta docs search lisa --limit 1 --format json | jq '.total_count // 0')
          if [ "$docs_total" -lt 1 ]; then
            echo "::error::Doc DB appears empty: docs search returned total_count=${docs_total}"
            exit 1
          fi

      - run: uv build reg_meta/ --out-dir dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.0

  # Post-release end-to-end smoke: install reg_meta into a clean Docker container
  # and run the full install → `reg-meta update` (downloads this release's DB) →
  # query pipeline. Stronger than the `publish` job's in-runner verify above
  # (clean container, only the package installed — the real user path). Inherits
  # the reg_meta/v* gate via `needs: publish` (publish needs the tag-gated `ci`
  # job), so it never fires for reg_meta_build/v* releases.
  integration:
    needs: publish
    uses: ./.github/workflows/integration.yml

  # Self-clearing deploy (#448): a reg_meta release can ship the DB asset an
  # already-merged schema bump was waiting on — the schema-bump's main-push
  # build-image went green-skipped, deferring the origin deploy. Publishing the
  # release fires THIS workflow, not container-build.yml, so without this the
  # origin would sit on the pre-bump image until the next image-affecting push or
  # a manual dispatch. Dispatch container-build.yml on main so it re-resolves the
  # newest reg_meta/v* release (now this one), rebakes its asset, and deploys.
  # Reuses container-build's workflow_dispatch path (everything-changed, run_id-
  # suffixed image tag, HEAD guards). workflow_dispatch is the documented
  # exception to the GITHUB_TOKEN no-recursion rule, so the default token works.
  # Also auto-deploys data-only releases (previously a manual workflow_dispatch).
  deploy-image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch container build + deploy on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run container-build.yml --repo "$GITHUB_REPOSITORY" --ref main
