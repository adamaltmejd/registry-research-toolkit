name: Release reg_meta

# A published reg_meta/v* release ships no package (no PyPI;
# crates/DESIGN.md, "Distribution"): its DB assets are checked by artifact conformance and baked
# into the origin images by container-build.yml. The `binaries` job attaches the
# `reg-meta` binaries.
on:
  release:
    types: [published]
  # Build-only: builds and smoke-tests the binaries as workflow artifacts on any ref.
  # `wait-ci` is gated on a reg_meta/v* release tag, so a dispatch skips it and every
  # job that needs it (integration, deploy-image), and it uploads no release asset.
  workflow_dispatch:

jobs:
  # The tagged commit is the bump, already `origin/main` (release skill, step 5), and
  # CI already ran on it (its PR and its push to main). Read that result by SHA rather
  # than re-run ci.yml on the tag: a tag on a commit whose CI failed, or never ran,
  # still stops integration and deploy (fails, or times out after 20 minutes).
  wait-ci:
    if: startsWith(github.event.release.tag_name, 'reg_meta/v')
    uses: ./.github/workflows/wait-ci.yml

  # Post-release check of this release's DB assets: conformance against the global
  # artifact and, when the release has it, the paired reg_meta_swecov.db.zst, served by
  # the Rust server (integration.yml). Inherits the
  # reg_meta/v* gate via `needs: wait-ci` (a skipped `wait-ci` skips it), so it never fires for
  # a release under another tag prefix.
  integration:
    needs: wait-ci
    uses: ./.github/workflows/integration.yml

  # Deploy after a release: a reg_meta release can ship the DB asset an
  # already-merged schema bump was waiting on. container-build.yml's schema-guard
  # fails closed (red, nothing deploys) while the newest release's schema differs
  # from main's. Publishing the release fires THIS workflow, not container-build.yml,
  # so without this the origin would sit on the old image until the next
  # image-affecting push or a manual dispatch. Dispatch container-build.yml on main so it re-resolves the
  # newest reg_meta/v* release (now this one), rebakes its asset, and deploys.
  # Reuses container-build's workflow_dispatch path (everything-changed, run_id-
  # suffixed image tag, HEAD guards). workflow_dispatch is the documented
  # exception to the GITHUB_TOKEN no-recursion rule, so the default token works.
  # Also auto-deploys data-only releases (previously a manual workflow_dispatch).
  # The deployed image's entrypoint smoke gate admits the baked assets before the
  # origin serves them.
  deploy-image:
    needs: wait-ci
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch container build + deploy on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run container-build.yml --repo "$GITHUB_REPOSITORY" --ref main

  # `reg-meta` binaries for local `reg-meta mcp` (crates/DESIGN.md, "Distribution"), and
  # the export gate's `reg-export-gate`, named by the gate crate's own version
  # (crates/reg-export-gate/DESIGN.md), built natively on each runner, each with a
  # `shasum -a 256 -c` checksum file. Not gated
  # on `wait-ci`: the tagged commit already passed CI on main, and gating would skip the
  # dispatch build. Linux links the runner's glibc, so it runs on Ubuntu 24.04-era
  # distributions and newer.
  binaries:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'reg_meta/v')
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      ASSET: reg-meta-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # A runner image that changes architecture must fail here, not ship a
      # mislabelled asset.
      - name: Check the host target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      # `--locked` asserts Cargo.lock is current, as in the Dockerfile.
      - run: cargo build --release --locked -p reg-meta -p reg-export-gate
      - name: Package with checksums
        run: |
          gate_version=$(cargo pkgid -p reg-export-gate | sed 's/.*[#@]//')
          GATE_ASSET="reg-export-gate-$gate_version-$TARGET"
          echo "GATE_ASSET=$GATE_ASSET" >> "$GITHUB_ENV"
          mkdir dist
          cp target/release/reg-meta "dist/$ASSET"
          cp target/release/reg-export-gate "dist/$GATE_ASSET"
          cd dist
          for name in "$ASSET" "$GATE_ASSET"; do
            shasum -a 256 "$name" > "$name.sha256"
            shasum -a 256 -c "$name.sha256"
          done
      # The binary has no --help; a missing catalog is its documented refusal
      # (`db_not_found`, exit 10), which proves it loads and parses its arguments.
      - name: Smoke-test the binary
        run: |
          status=0
          "dist/$ASSET" mcp --db "$RUNNER_TEMP/no-catalog" 2> smoke.err || status=$?
          cat smoke.err
          test "$status" -eq 10
          grep -q '"code":"db_not_found"' smoke.err
      # A missing staging folder is a setup refusal (exit 10, one stdout line).
      - name: Smoke-test the gate binary
        run: |
          status=0
          out=$("dist/$GATE_ASSET" check --staging "$RUNNER_TEMP/no-staging" \
            --output "$RUNNER_TEMP/no-output") || status=$?
          echo "$out"
          test "$status" -eq 10
          test "$out" = "refused: setup"
      # Idempotent, never `--clobber`: published assets are not replaced. A rerun,
      # or a gh retry after the first upload landed (HTTP 422), skips an asset that
      # exists with the same digest and fails on a different one.
      - name: Upload to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for name in "$ASSET" "$ASSET.sha256" "$GATE_ASSET" "$GATE_ASSET.sha256"; do
            remote=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [ -z "$remote" ]; then
              gh release upload "$TAG" "dist/$name" --repo "$GITHUB_REPOSITORY" ||
                {
                  # gh may have retried after the first attempt landed: re-check.
                  remote=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                    --jq ".assets[] | select(.name == \"$name\") | .digest")
                  test -n "$remote" || exit 1
                }
            fi
            if [ -n "$remote" ]; then
              test "$remote" = "sha256:$(shasum -a 256 "dist/$name" | cut -d' ' -f1)" ||
                { echo "::error::$name exists on $TAG with a different digest"; exit 1; }
            fi
          done
      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: dist/
          if-no-files-found: error
