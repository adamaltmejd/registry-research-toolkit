name: Release reg_meta

# A published reg_meta/v* release ships no package (no PyPI, RUST_RUNTIME_SPEC.md
# stage 4 decision 3): its DB assets are checked by artifact conformance and baked
# into the origin images by container-build.yml.
on:
  release:
    types: [published]

jobs:
  ci:
    if: startsWith(github.event.release.tag_name, 'reg_meta/v')
    uses: ./.github/workflows/ci.yml

  # Post-release check of this release's DB assets: conformance against the global
  # and SWECOV artifacts, served by the Rust server (integration.yml). Inherits the
  # reg_meta/v* gate via `needs: ci` (a skipped `ci` skips it), so it never fires for
  # reg_meta_build/v* releases.
  integration:
    needs: ci
    uses: ./.github/workflows/integration.yml

  # Self-clearing deploy (#448): a reg_meta release can ship the DB asset an
  # already-merged schema bump was waiting on — the schema-bump's main-push
  # build-image went green-skipped, deferring the origin deploy. Publishing the
  # release fires THIS workflow, not container-build.yml, so without this the
  # origin would sit on the pre-bump image until the next image-affecting push or
  # a manual dispatch. Dispatch container-build.yml on main so it re-resolves the
  # newest reg_meta/v* release (now this one), rebakes its asset, and deploys.
  # Reuses container-build's workflow_dispatch path (everything-changed, run_id-
  # suffixed image tag, HEAD guards). workflow_dispatch is the documented
  # exception to the GITHUB_TOKEN no-recursion rule, so the default token works.
  # Also auto-deploys data-only releases (previously a manual workflow_dispatch).
  # The deployed image's entrypoint smoke gate admits the baked assets before the
  # origin serves them.
  deploy-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch container build + deploy on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run container-build.yml --repo "$GITHUB_REPOSITORY" --ref main
