name: Release reg_meta

# A published reg_meta/v* release ships no package (no PyPI;
# crates/DESIGN.md, "Distribution"): its DB asset is checked by artifact conformance and baked
# into the origin image by container-build.yml. The `binaries` job attaches the
# `reg-meta` binaries.
on:
  release:
    types: [published]
  # Build-only: builds and smoke-tests the binaries as workflow artifacts on any ref.
  # `wait-ci` is gated on a reg_meta/v* release tag, so a dispatch skips it and every
  # job that needs it (integration, deploy-image), and it uploads no release asset.
  workflow_dispatch:

jobs:
  # The tagged commit is the bump, already `origin/main` (release skill, step 5), and
  # CI already ran on it (its PR and its push to main). Read that result by SHA rather
  # than re-run ci.yml on the tag: a tag on a commit whose CI failed, or never ran,
  # still stops integration and deploy (fails, or times out after 20 minutes).
  wait-ci:
    if: startsWith(github.event.release.tag_name, 'reg_meta/v')
    uses: ./.github/workflows/wait-ci.yml

  # Post-release check of this release's DB asset: conformance against the global
  # artifact, served by the Rust server (integration.yml). Inherits the
  # reg_meta/v* gate via `needs: wait-ci` (a skipped `wait-ci` skips it), so it never fires for
  # a release under another tag prefix.
  integration:
    needs: wait-ci
    uses: ./.github/workflows/integration.yml

  # Deploy after a release: a reg_meta release can ship the DB asset an
  # already-merged schema bump was waiting on. container-build.yml's schema-guard
  # fails closed (red, nothing deploys) while the newest release's schema differs
  # from main's. Publishing the release fires THIS workflow, not container-build.yml,
  # so without this the origin would sit on the old image until the next
  # image-affecting push or a manual dispatch. Dispatch container-build.yml on main so it re-resolves the
  # newest reg_meta/v* release (now this one), rebakes its asset, and deploys.
  # Reuses container-build's workflow_dispatch path (everything-changed, run_id-
  # suffixed image tag, HEAD guards). workflow_dispatch is the documented
  # exception to the GITHUB_TOKEN no-recursion rule, so the default token works.
  # Also auto-deploys data-only releases (previously a manual workflow_dispatch).
  # The deployed image's entrypoint smoke gate admits the baked assets before the
  # origin serves them.
  deploy-image:
    needs: wait-ci
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch container build + deploy on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run container-build.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The release binaries, built natively on each runner (crates/DESIGN.md,
  # "Distribution"): `reg-meta` (Linux, the server a steward deploy runs), `reg-build`
  # (Linux for steward CI, macOS for local holdings checks), the export gate's
  # `reg-export-gate` (Linux, named by the gate crate's own version,
  # crates/reg-export-gate/DESIGN.md) and `reg-mock` (every researcher platform), plus
  # the SPA bundle a steward deploy serves (Linux leg; platform-independent). No
  # checksum files: consumers check GitHub's per-asset digest. Not gated on `wait-ci`:
  # the tagged commit already passed CI on main, and gating would skip the dispatch
  # build. Linux links the runner's glibc, so it runs on Ubuntu 24.04-era distributions
  # and newer.
  binaries:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'reg_meta/v')
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bins: reg-build reg-mock
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bins: reg-meta reg-build reg-export-gate reg-mock
            spa: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bins: reg-mock
            exe: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Git Bash on the Windows runner, so every step is the same script.
    defaults:
      run:
        shell: bash
    env:
      BINS: ${{ matrix.bins }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # A runner image that changes architecture must fail here, not ship a
      # mislabelled asset.
      - name: Check the host target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      # `--locked` asserts Cargo.lock is current, as in the Dockerfile.
      - name: Build
        run: |
          packages=()
          for bin in $BINS; do packages+=(-p "$bin"); done
          cargo build --release --locked "${packages[@]}"
      - name: Package
        run: |
          gate_version=$(cargo pkgid -p reg-export-gate | sed 's/.*[#@]//')
          mkdir dist
          for bin in $BINS; do
            case $bin in
              reg-export-gate) name="reg-export-gate-$gate_version-$TARGET$EXE" ;;
              *) name="$bin-$TARGET$EXE" ;;
            esac
            cp "target/release/$bin$EXE" "dist/$name"
          done
      # Each binary's documented refusal on a missing input proves it loads and parses
      # its arguments: `reg-meta` `db_not_found` (exit 10), `reg-build verify` (exit 1),
      # the gate's setup refusal (exit 10, one stdout line), `reg-mock` `io` (exit 2).
      - name: Smoke-test the binaries
        run: |
          for path in dist/*; do
            status=0
            case ${path#dist/} in
              reg-meta-*)
                "$path" serve --db "$RUNNER_TEMP/no-catalog" --port 0 2> smoke.err || status=$?
                cat smoke.err
                test "$status" -eq 10
                grep -q '"code":"db_not_found"' smoke.err ;;
              reg-build-*)
                "$path" verify "$RUNNER_TEMP/no-catalog.db" 2> smoke.err || status=$?
                cat smoke.err
                test "$status" -eq 1
                grep -q '^reg-build: unable to open database file' smoke.err ;;
              reg-export-gate-*)
                out=$("$path" check --staging "$RUNNER_TEMP/no-staging" \
                  --output "$RUNNER_TEMP/no-output") || status=$?
                echo "$out"
                test "$status" -eq 10
                test "$out" = "refused: setup" ;;
              reg-mock-*)
                "$path" generate --spec "$RUNNER_TEMP/no-spec.json" \
                  --out "$RUNNER_TEMP/no-mock" 2> smoke.err || status=$?
                cat smoke.err
                test "$status" -eq 2
                grep -q '"code":"io"' smoke.err ;;
              *) echo "::error::no smoke test for $path"; exit 1 ;;
            esac
          done
      # The SPA bundle that steward deployments ship (steward-deploy.yml downloads it):
      # `frontend/dist` with the wasm and the API types generated at this commit, packed
      # as `reg-webapp-spa-<reg-meta version>.tar.zst`. The Node, bun and wasm-bindgen
      # pins match ci.yml's frontend job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.spa
        with:
          node-version: "26.13.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.spa
        with:
          bun-version: "1.4.4"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: matrix.spa
        with:
          tool: wasm-bindgen@0.2.130
      - name: Build and pack the SPA bundle
        if: matrix.spa
        run: |
          version=$(cargo pkgid -p reg-meta | sed 's/.*[#@]//')
          spa="reg-webapp-spa-$version.tar.zst"
          (cd reg_webapp/frontend && bun install --frozen-lockfile &&
            bun run gen:wasm && bun run gen:types && bun run build)
          # Normalized entries: a rerun rebuilds the same bytes, so the upload step
          # skips the asset instead of refusing a digest mismatch.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --format=gnu \
            -C reg_webapp/frontend/dist -cf - . | zstd -q -19 -o "dist/$spa"
          # The bundle must hold the page and the wasm the SPA mounts with.
          listing=$(zstd -dc "dist/$spa" | tar -tf -)
          grep -qx './index.html' <<< "$listing"
          grep -q '^\./assets/.*\.wasm$' <<< "$listing"
      # Idempotent, never `--clobber`: published assets are not replaced. A rerun,
      # or a gh retry after the first upload landed (HTTP 422), skips an asset that
      # exists with the same digest and fails on a different one.
      - name: Upload to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Git Bash on Windows has sha256sum, not shasum; both print `<hash>  <name>`.
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$@"; else sha256sum --text "$@"; fi; }
          for path in dist/*; do
            name=${path#dist/}
            remote=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [ -z "$remote" ]; then
              gh release upload "$TAG" "dist/$name" --repo "$GITHUB_REPOSITORY" ||
                {
                  # gh may have retried after the first attempt landed: re-check.
                  remote=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                    --jq ".assets[] | select(.name == \"$name\") | .digest")
                  test -n "$remote" || exit 1
                }
            fi
            if [ -n "$remote" ]; then
              test "$remote" = "sha256:$(sha256 "dist/$name" | cut -d' ' -f1)" ||
                { echo "::error::$name exists on $TAG with a different digest"; exit 1; }
            fi
          done
      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
