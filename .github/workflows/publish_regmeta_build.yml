name: Publish regmeta_build to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    if: startsWith(github.event.release.tag_name, 'regmeta_build/v')
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      # regmeta_build ships no release assets (the prebuilt regmeta.db /
      # regmeta_docs.db assets attach to the `regmeta` release, not this
      # one). This step just confirms the CLI entry point is wired before
      # publishing.
      - name: Smoke test CLI
        run: |
          uv sync --frozen
          uv run regmeta-build --help > /dev/null

      - run: uv build regmeta_build/ --out-dir dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
