name: Plan sequence refresh

# Event-gated refresh of the generated sequencing projection in the epic body. This is
# the DETERMINISTIC half (plan_sequence.py --write); the agentic lane ranking stays in
# /issue-pulse, which needs an LLM. Write-scoped and ISOLATED from the read-only
# issue-hygiene job (which keeps issues:read) so the write surface is a single workflow.
#   - issues / pull_request events: the projection moves when the open-issue set, labels,
#     relationships, or a PR's `Closes #N` change — so refresh on each.
#   - schedule + manual: a safety net if an event was missed (offset from issue-hygiene).
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, edited, closed, reopened]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

# Serialize CI refreshes so a burst of events can't clobber each other's body edit; the
# latest event wins (it computes from live state, so an in-flight stale run is wasted).
# This does NOT serialize against the /issue-pulse loop, which is the other body writer —
# a CI write and a loop write can still lose-update each other. That's tolerated: every
# writer is idempotent and recomputes from live state, so the next event or tick heals it.
concurrency:
  group: plan-sequence-refresh
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token (no issues:write); skip them rather than fail noisily.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags: the projection's pending-release line diffs HEAD against
          # the latest reg_meta_build/v* tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Refresh the sequencing projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/plan_sequence.py --epic 328 --write
