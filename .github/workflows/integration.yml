name: Artifact conformance

# Server-side home for the release-asset-dependent checks: conformance against the
# published global DB asset and, when the release has one, the paired SWECOV holdings
# asset, served by the Rust server. They need a published release asset matching the
# current schema, so this workflow deliberately does NOT run on push/PR — a red X on
# unrelated work when a release is merely owed would be noise. A release whose newest
# asset is schema-incompatible fails at server admission, like the deploy guard in
# container-build.yml. The paired asset is optional here until the first paired
# release exists (a missing one is a notice); once it does, a malformed or duplicated
# one fails the job.
on:
  # Weekly drift catch (GitHub Releases availability). Off the top of the hour —
  # GitHub delays/drops crons scheduled at :00 under load.
  schedule:
    - cron: "17 6 * * 1"
  # Called by publish_reg_meta.yml after a reg_meta/v* release is published, to
  # validate the just-published artifacts.
  workflow_call:
  # Manual on-demand run (e.g. after uploading a fresh DB asset).
  workflow_dispatch:

jobs:
  # The release under test, resolved once so both legs test the same one.
  #
  # It must come from the EXACT release under test: the reg_meta/v* release that
  # called this workflow (a `workflow_call` inherits the CALLER's `github` context,
  # so `event.release.tag_name` is that tag), or — for schedule/dispatch runs — the
  # newest published reg_meta/v* release, resolved the same way container-build.yml
  # resolves its bake tag, plus `--exclude-drafts`: a draft carries no published
  # assets, and a release sits in draft for the whole of the release skill's step 8.
  # (That flag is a deliberate divergence from container-build's resolver, not
  # drift.) NOT GitHub's `latest`, which is newest across both release tag prefixes
  # and could hand back a reg_meta_build/v* release.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      catalogs: ${{ steps.release.outputs.catalogs }}
    steps:
      - name: Resolve the release and its catalogs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          tag="$TRIGGER_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts \
              --json tagName -q '[.[].tagName | select(startswith("reg_meta/v"))][0] // empty')
          fi
          [ -n "$tag" ] || { echo "::error::no published reg_meta/v* release to take the artifact from"; exit 1; }
          echo "DB source release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The pair is optional until the first paired release; once the release has
          # the asset, the swecov leg requires exactly one, digested and admitted.
          n=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '[.assets[] | select(.name == "reg_meta_swecov.db.zst")] | length')
          if [ "$n" = 0 ]; then
            echo "::notice::release $tag has no reg_meta_swecov.db.zst; paired conformance skipped"
            echo 'catalogs=["global"]' >> "$GITHUB_OUTPUT"
          else
            echo 'catalogs=["global","swecov"]' >> "$GITHUB_OUTPUT"
          fi

  # One leg per catalog, in parallel: `global` serves reg_meta.db, `swecov` serves the
  # pair (`--catalog swecov`: reg_meta_swecov.db beside reg_meta.db).
  artifact-conformance:
    name: Artifact conformance (${{ matrix.catalog }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        catalog: ${{ fromJSON(needs.resolve.outputs.catalogs) }}
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SERVE_ARGS: ${{ matrix.catalog == 'swecov' && '--catalog swecov' || '' }}
      # The release build: a debug server hashes the 1 GB catalog at boot and debug
      # `reg-build verify` is slow on it. The harness finds this `reg-build` through
      # REG_BUILD_BIN (conformance/reader_artifacts.py).
      REG_BUILD_BIN: ${{ github.workspace }}/target/release/reg-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --frozen
      - run: cargo build --release --locked -p reg-meta -p reg-build
      # Tier 3 admits the downloaded artifact and its embedded import_manifest,
      # never synthetic data.
      #
      # The SHA-256 digest GitHub records for the asset is verified BEFORE
      # decompression. Admission is then the Rust server's own, at boot: a missing
      # or duplicated asset, a malformed or mismatched digest, a schema-incompatible
      # DB or a nonpublishable manifest all fail before conformance. There is
      # deliberately no fallback to an older asset or synthetic data.
      - name: Provision the selected release DBs
        id: release-db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG: ${{ matrix.catalog }}
        run: |
          set -euo pipefail
          echo "DB source release: $TAG"
          db_dir="$RUNNER_TEMP/global-db"
          mkdir -p "$db_dir"
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)
          # fetch ASSET DB: verify the digest GitHub recorded (a single asset with a
          # sha256 digest) BEFORE decompressing.
          fetch() {
            local asset=$1 db=$2 digest zst actual
            digest=$(printf '%s' "$assets" \
              | jq -r --arg name "$asset" '[.assets[] | select(.name == $name) | .digest]
                    | if length == 1 then .[0] else "" end' | tr '[:upper:]' '[:lower:]')
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::release $TAG has no single sha256-digested $asset asset"
              exit 1
            fi
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$db_dir"
            zst="$db_dir/$asset"
            actual="sha256:$(sha256sum "$zst" | cut -d ' ' -f 1)"
            if [ "$actual" != "$digest" ]; then
              echo "::error::$asset digest mismatch: $actual != $digest"
              exit 1
            fi
            zstd -q -d --rm "$zst" -o "$db_dir/$db"
          }
          fetch reg_meta.db.zst reg_meta.db
          if [ "$CATALOG" = swecov ]; then
            fetch reg_meta_swecov.db.zst reg_meta_swecov.db
          fi
          # SERVE_ARGS is empty or `--catalog swecov`: split on purpose.
          # shellcheck disable=SC2086
          target/release/reg-meta serve --db "$db_dir" --port 18000 $SERVE_ARGS &
          pid=$!
          # The refusal's error document is on the server's stderr.
          until curl -fs -o /dev/null "http://127.0.0.1:18000/api/context"; do
            kill -0 "$pid" 2>/dev/null || { echo "::error::$CATALOG refused at server admission"; exit 1; }
            sleep 1
          done
          kill "$pid"
          echo "db_dir=$db_dir" >> "$GITHUB_OUTPUT"
      # Schema drift against a published asset is a release-drift failure.
      # Search runs against the Rust server (`--server-cmd`). `-m release` runs
      # only the checks on the downloaded artifact: the fixture-bound corpus
      # ignores it and already ran in CI's `rust` job.
      - name: Run artifact conformance against the downloaded DB
        run: |
          uv run python -m pytest conformance -m release --run-release -n auto --durations=0 \
            --artifact-dir="${{ steps.release-db.outputs.db_dir }}" \
            --server-cmd="target/release/reg-meta serve --db {db} --port {port} --write-limit 100000 $SERVE_ARGS" -q
