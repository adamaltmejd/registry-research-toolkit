name: Artifact conformance

# Server-side home for the release-asset-dependent checks: conformance against the
# published global and SWECOV DB assets, served by the Rust server. They need a
# published release asset matching the current schema, so this workflow deliberately
# does NOT run on push/PR — a red X on unrelated work when a release is merely owed
# would be noise.
on:
  # Weekly drift catch (GitHub Releases availability). Off the top of the hour —
  # GitHub delays/drops crons scheduled at :00 under load.
  schedule:
    - cron: "17 6 * * 1"
  # Called by publish_reg_meta.yml after a reg_meta/v* release is published, to
  # validate the just-published artifacts.
  workflow_call:
  # Manual on-demand run (e.g. after uploading a fresh DB asset).
  workflow_dispatch:

jobs:
  artifact-conformance:
    name: Artifact conformance (${{ matrix.catalog }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Keep both artifact kinds independent: schema drift in one asset must not
    # suppress the other's gate.
    strategy:
      fail-fast: false
      matrix:
        include:
          - catalog: global
            asset: reg_meta.db.zst
          - catalog: swecov
            asset: reg_meta_swecov.db.zst
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      - run: cargo build --workspace --locked
      # Tier 3 admits the downloaded artifact and its embedded import_manifest,
      # never synthetic data. Each kind uses its own job and directory.
      #
      # It must come from the EXACT release under test: the reg_meta/v* release
      # that called this workflow (a `workflow_call` inherits the CALLER's
      # `github` context, so `event.release.tag_name` is that tag), or — for
      # schedule/dispatch runs — the newest published reg_meta/v* release,
      # resolved the same way container-build.yml resolves its bake tag, plus
      # `--exclude-drafts`: a draft carries no published assets, and a release
      # sits in draft for the whole of the release skill's step 8. (That flag is
      # a deliberate divergence from container-build's resolver, not drift.) NOT
      # GitHub's `latest`, which is newest across all three packages and would
      # hand back a reg_schema/v* or reg_meta_build/v* release.
      #
      # The SHA-256 digest GitHub records for the asset is verified BEFORE
      # decompression. Admission is then the Rust server's own, at boot with
      # `--catalog "$CATALOG"`: a missing or duplicated asset, a malformed or
      # mismatched digest, a schema-incompatible DB, nonpublishable manifest or an
      # artifact of another catalog all fail before conformance (the conformance
      # servers take `{catalog}` from the artifact itself, so only this boot pins
      # the expected kind). There is deliberately no fallback to an older asset,
      # another artifact kind or synthetic data.
      - name: Provision the selected release DB
        id: release-db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
          CATALOG: ${{ matrix.catalog }}
          TRIGGER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          tag="$TRIGGER_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts \
              --json tagName -q '[.[].tagName | select(startswith("reg_meta/v"))][0] // empty')
          fi
          [ -n "$tag" ] || { echo "::error::no published reg_meta/v* release to take the artifact from"; exit 1; }
          echo "$CATALOG DB source release: $tag"
          digest=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            | jq -r --arg name "$ASSET" '[.assets[] | select(.name == $name) | .digest]
                  | if length == 1 then .[0] else "" end' | tr '[:upper:]' '[:lower:]')
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::release $tag has no single sha256-digested $ASSET asset"
            exit 1
          fi
          db_dir="$RUNNER_TEMP/$CATALOG-db"
          mkdir -p "$db_dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir "$db_dir"
          zst="$db_dir/$ASSET"
          actual="sha256:$(sha256sum "$zst" | cut -d ' ' -f 1)"
          if [ "$actual" != "$digest" ]; then
            echo "::error::$ASSET digest mismatch: $actual != $digest"
            exit 1
          fi
          zstd -q -d --rm "$zst" -o "$db_dir/reg_meta.db"
          target/debug/reg-meta serve --db "$db_dir" --catalog "$CATALOG" \
            --stewards reg_webapp/stewards --port 18000 &
          pid=$!
          # The refusal's error document is on the server's stderr.
          until curl -fs -o /dev/null http://127.0.0.1:18000/api/context; do
            kill -0 "$pid" 2>/dev/null || { echo "::error::$ASSET refused at server admission"; exit 1; }
            sleep 1
          done
          kill "$pid"
          echo "db_dir=$db_dir" >> "$GITHUB_OUTPUT"
      # Schema drift against a published asset is a release-drift failure.
      # Search runs against the Rust server (`--server-cmd`; a release run
      # without it fails).
      - name: Run artifact conformance against the downloaded DB
        run: |
          uv run python -m pytest conformance --run-release \
            --artifact-dir="${{ steps.release-db.outputs.db_dir }}" \
            --server-cmd='target/debug/reg-meta serve --db {db} --catalog {catalog} --stewards reg_webapp/stewards --port {port} --write-limit 100000' -q
