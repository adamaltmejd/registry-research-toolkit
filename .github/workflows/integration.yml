name: Integration (Podman)

# Server-side home for the release-asset-dependent tests. The container half
# (reg_meta/tests/test_integration.py) installs reg_meta into a clean
# python:3.14-slim container and exercises install → `reg-meta update`
# (downloads the DB from GitHub Releases) → query; the host half is the
# conformance artifact gate. These independent jobs need a
# published release asset matching the current SCHEMA_VERSION, so this workflow
# deliberately does NOT run on push/PR — a red X on unrelated work when a
# release is merely owed would be noise. The workspace-mode package tests run in
# ci.yml's `package-integration` job; CI's `test` job runs `-m "not integration"`.
on:
  # Weekly drift catch (GitHub Releases availability only — the base image and
  # uv are digest-pinned since Y-25). Off the top of the hour — GitHub
  # delays/drops crons scheduled at :00 under load.
  schedule:
    - cron: "17 6 * * 1"
  # Called by publish_reg_meta.yml after a reg_meta/v* release is published, to
  # validate the just-published artifact end-to-end from a clean container.
  workflow_call:
  # Manual on-demand run (e.g. after uploading a fresh DB asset).
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      - run: uv sync --frozen
      - name: Prepare rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman info
      # Both opt-in flags: --run-integration (all container tests) and --run-release
      # (the subset that needs a published release asset). Serial, NOT `-n auto`:
      # the module-scoped image fixture builds the container once; xdist would
      # rebuild it per worker. GITHUB_TOKEN authenticates the in-container
      # `reg-meta update` GitHub API call (forwarded by the native runner) — the
      # unauthenticated 60/hr-per-IP limit is easily exhausted from shared runner
      # IPs. The separate conformance jobs select assets with --artifact-dir.
      #
      # `--install-mode registry` is explicit even though it is the module's
      # default: this job is the post-publish check of the PUBLISHED consumer's
      # install, so reg_schema must come from PyPI, never from the checkout.
      #
      # A failure during a release-owed window (main's SCHEMA_VERSION past the
      # newest published asset) is expected and informative — a release-drift
      # signal, not a code regression. The post-release call never hits this (the
      # matching asset was just published).
      - name: Run Podman integration + release tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m pytest reg_meta/tests/test_integration.py \
            --run-integration --run-release \
            --install-mode registry -m "integration or release"

  artifact-conformance:
    name: Artifact conformance (${{ matrix.catalog }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Keep both artifact kinds and the native registry boundary independent:
    # schema drift in one asset must not suppress the other gates.
    strategy:
      fail-fast: false
      matrix:
        include:
          - catalog: global
            asset: reg_meta.db.zst
          - catalog: swecov
            asset: reg_meta_swecov.db.zst
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      - run: uv sync --frozen
      # Tier 3 admits the downloaded artifact and its embedded import_manifest,
      # never synthetic data. Each kind uses its own job and directory.
      #
      # It must come from the EXACT release under test: the reg_meta/v* release
      # that called this workflow (a `workflow_call` inherits the CALLER's
      # `github` context, so `event.release.tag_name` is that tag), or — for
      # schedule/dispatch runs — the newest published reg_meta/v* release,
      # resolved the same way container-build.yml resolves its bake tag, plus
      # `--exclude-drafts`: a draft carries no published assets, and a release
      # sits in draft for the whole of the release skill's step 8. (That flag is
      # a deliberate divergence from container-build's resolver, not drift.) NOT
      # GitHub's `latest`, which is newest across all three packages and would
      # hand back a reg_schema/v* or reg_meta_build/v* release.
      #
      # The SHA-256 digest GitHub records for the asset is verified BEFORE
      # decompression. A missing or duplicated asset, a malformed or mismatched
      # digest, a schema-incompatible DB, nonpublishable manifest or mismatched
      # catalog selection all fail before conformance. There is deliberately
      # no fallback to an older asset, another artifact kind or synthetic data.
      - name: Provision the selected release DB
        id: release-db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
          CATALOG: ${{ matrix.catalog }}
          TRIGGER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          tag="$TRIGGER_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts \
              --json tagName -q '[.[].tagName | select(startswith("reg_meta/v"))][0] // empty')
          fi
          [ -n "$tag" ] || { echo "::error::no published reg_meta/v* release to take the artifact from"; exit 1; }
          echo "$CATALOG DB source release: $tag"
          digest=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            | jq -r --arg name "$ASSET" '[.assets[] | select(.name == $name) | .digest]
                  | if length == 1 then .[0] else "" end' | tr '[:upper:]' '[:lower:]')
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::release $tag has no single sha256-digested $ASSET asset"
            exit 1
          fi
          db_dir="$RUNNER_TEMP/$CATALOG-db"
          mkdir -p "$db_dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir "$db_dir"
          zst="$db_dir/$ASSET"
          actual="sha256:$(sha256sum "$zst" | cut -d ' ' -f 1)"
          if [ "$actual" != "$digest" ]; then
            echo "::error::$ASSET digest mismatch: $actual != $digest"
            exit 1
          fi
          uv run python - "$zst" "$db_dir/reg_meta.db" "$CATALOG" <<'PY'
          import sys
          from pathlib import Path

          import zstandard
          from reg_meta.db import open_db, validate_catalog_selection

          src, dest = (Path(arg) for arg in sys.argv[1:3])
          with src.open("rb") as fh, dest.open("wb") as out:
              zstandard.ZstdDecompressor().copy_stream(fh, out)
          # Admit schema/publication identity and the exact selected kind before
          # publishing the directory output. Current schema admission stays strict.
          with open_db(dest) as conn:
              validate_catalog_selection(conn, sys.argv[3])
          PY
          rm "$zst"
          echo "db_dir=$db_dir" >> "$GITHUB_OUTPUT"
      # Schema drift against a published asset is a release-drift failure.
      - name: Run artifact conformance against the downloaded DB
        run: |
          uv run python -m pytest conformance --run-release \
            --artifact-dir="${{ steps.release-db.outputs.db_dir }}" -q
