name: Publish reg_meta_build to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    if: startsWith(github.event.release.tag_name, 'reg_meta_build/v')
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"

      # reg_meta_build ships no release assets (the prebuilt reg_meta.db /
      # reg_meta_docs.db assets attach to the `reg_meta` release, not this
      # one). This step just confirms the CLI entry point is wired before
      # publishing.
      - name: Smoke test CLI
        run: |
          uv sync --frozen
          uv run reg-meta-build --help > /dev/null

      - run: uv build reg_meta_build/ --out-dir dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
