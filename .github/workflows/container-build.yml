# reg_webapp build + deploy — origin image AND Cloudflare edge worker
# (REFACTOR_SPEC.md §6.5; topology in reg_webapp/DESIGN.md → "Deployment").
#
# PRs: build-ONLY — proves the multi-stage Dockerfile still builds, including
# the `reg-meta update` DB bake and the #224 provenance-confinement assertion
# #3 (the RUN check fails the build if reg_meta.provenance.db* is present).
#
# Pushes to main: a `changes` filter scopes the work — image-affecting paths
# rebuild + push + `flyctl deploy` the origin; SPA/edge-affecting paths build
# the SPA and `wrangler deploy` the edge worker. Image-affecting paths ALSO
# redeploy the edge: each edge deploy carries a fresh DEPLOY_VERSION that the
# worker stamps into the /api/* cache key (#318), so an origin deploy that
# changes API payloads must ship an edge deploy to orphan the pre-deploy edge
# cache. The edge job `needs:` the origin deploy so a contract-changing push
# can never ship a new SPA against an old origin (deploy-skew guard). Both
# deploy jobs also verify they are still main's HEAD before shipping — GHA
# concurrency serializes deploys but admits them in BUILD-COMPLETION order,
# so without the guard an older commit's slow build could overwrite a newer
# deploy.
#
# `global` is prod and staging in one tier (§7.5), so every relevant main
# push deploys. workflow_dispatch is the manual escape hatch (rebuild +
# deploy everything); the HEAD guards make a non-main dispatch a no-op at
# the deploy steps, so it cannot ship branch code to prod.
#
# Nothing deploys without green CI: a `wait-ci` job polls the ci.yml run for
# this commit and both deploy jobs require its success — an image that builds
# but fails lint/types/tests never ships.
#
# Image filter scope (DECIDED 2026-06-11): reg_schema is a baked dep but
# deliberately NOT in the image filter — it'd rebuild on most monorepo PRs and is
# already exercised by ci.yml's test job. After a baked-dep change that should
# ship, run the manual `workflow_dispatch`. That is the rule, not a gap.

name: Container build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual escape hatch: rebuild + deploy after a baked-dep (reg_schema)
  # change the image filter intentionally skips, or after a
  # DATA-only reg_meta release. The bake build-arg always carries the CONCRETE
  # newest reg_meta/v* tag (resolved per run, below), so a data-only release
  # busts the bake layer's cache by itself — no input needed unless pinning an
  # OLDER release.
  # A reg_meta/v* release ALSO reaches this workflow indirectly: publish_reg_meta.yml
  # dispatches this workflow after publishing, so an owed-bump or data-only release
  # auto-rebakes + deploys without a manual run (the #448 self-clearing path).
  workflow_dispatch:
    inputs:
      reg_meta_tag:
        description: >-
          reg_meta release tag to bake (e.g. reg_meta/v0.9.0). Leave empty to
          resolve the newest reg_meta/v* release.
        required: false
        default: ""

jobs:
  # Path scoping runs as a job (not `on.paths`) so image and edge surfaces
  # share one trigger and one filter definition. Skipped on dispatch — the
  # downstream `if`s treat dispatch as "everything changed".
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      edge: ${{ steps.filter.outputs.edge }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          # `image` lists exactly what enters the Docker image (Dockerfile
          # COPY surfaces + bake inputs) plus Fly origin config that should
          # force a redeploy. NOT all of reg_webapp/**: edge/, .claude/, and
          # docs don't change image/origin content, and an image deploy swaps
          # prod machines (brief origin blip), so content-identical rebuilds
          # are worth avoiding.
          filters: |
            image:
              - "reg_webapp/backend/**"
              - "reg_webapp/frontend/**"
              - "reg_webapp/stewards/**"
              - "reg_webapp/Dockerfile"
              - "reg_webapp/docker-entrypoint.sh"
              - "reg_webapp/fly.toml"
              - "reg_webapp/fly.swecov.toml"
              - "reg_meta/**"
              - ".dockerignore"
              - ".github/workflows/container-build.yml"
              - "uv.lock"
              - "pyproject.toml"
            edge:
              - "reg_webapp/frontend/**"
              - "reg_webapp/edge/**"
              - "reg_webapp/backend/openapi.json"
              - ".github/workflows/container-build.yml"

  # Pending-schema-bump guard (#448) — its OWN job so EVERY deploy path can consult
  # it, including an edge-only push that skips build-image. Resolves the reg_meta/v*
  # tag to bake and decides whether main's schema is merely AHEAD of that released
  # asset (a self-clearing pending release → neutralize) vs a genuine break (fail red).
  schema-guard:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.outputs.image == 'true' ||
      needs.changes.outputs.edge == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.regmeta.outputs.tag }}
      pending_bump: ${{ steps.schemaguard.outputs.pending_bump }}
    steps:
      # fetch-depth: 0 + tags so the schema guard below can `git show <tag>:...`
      # the released asset's schema constants (the resolved reg_meta/v* tag).
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      # Resolve the CONCRETE newest reg_meta/v* release tag for the bake
      # build-arg. Passing a literal `latest` would make the bake layer's
      # buildx cache key insensitive to data-only releases — worse, after a
      # pinned-tag dispatch, the next `latest`-keyed build would resurrect the
      # OLD cached layer and silently revert prod's DB. A concrete tag makes
      # the cache key change exactly when the release does.
      #
      # Newest-by-tag is asset-blind, which is safe because every published
      # reg_meta release carries both DB assets — the release flow copies
      # assets forward on code-only releases (self-contained releases,
      # .claude/skills/release/SKILL.md step 8). A release violating that
      # invariant fails the bake stage loudly (exit 10), which is exactly the
      # #343 outage mode.
      - name: Resolve reg_meta release tag
        id: regmeta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.reg_meta_tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName -q '[.[].tagName | select(startswith("reg_meta/v"))][0]')
          fi
          [ -n "$tag" ] || { echo "FATAL: no reg_meta/v* release found" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baking reg_meta release: $tag"
      # Pending-schema-bump guard (#448). Compares main's SCHEMA_VERSION /
      # DOC_SCHEMA_VERSION against the released tag's via a three-way verdict
      # (break / pending / compatible) and FAILS RED (non-zero exit) on a genuine
      # break or a schema-behind release that's also MISSING a DB asset. Because
      # build-image, deploy, AND edge-deploy all gate on `needs.schema-guard.result
      # == 'success'`, a failed guard blocks every deploy path — including an
      # edge-only main push that has NO bake to fail (pre-#448 the break surfaced
      # only as the bake's exit 10 on image pushes; an edge-only push then shipped a
      # new SPA/cache generation against a still-stuck origin). It green-neutralizes
      # ONLY the safe code-ahead case where main's schema is merely AHEAD of the
      # latest released asset (same major, higher minor) AND the release carries both
      # `.zst` assets — that refusal is expected and self-clearing (the owed reg_meta
      # release ships the matching asset). For that case it emits `pending_bump=true`,
      # deferring the bake + deploy with a GREEN build-image + a `::notice::`; the
      # BUILD self-clears on the next image-affecting main push, the DEPLOY is
      # self-clearing on release (publish_reg_meta.yml dispatches this workflow). A
      # `compatible` verdict emits `pending_bump=false` and proceeds normally. The
      # asset schema is read from the release tag's source (a data-only release keeps
      # the tag-commit schema), so the comparison needs the tag history (checkout
      # above). The guard applies to the AUTO-RESOLVED newest reg_meta/v* tag
      # (push/PR, or a dispatch with an empty `reg_meta_tag`); an explicit
      # `workflow_dispatch` `reg_meta_tag` pin BYPASSES it (the "owed release will
      # catch up" rationale only holds for the newest tag — a deliberate pin must
      # fail loud in the bake, not green-no-op, if its asset is incompatible; dispatch
      # always runs build-image so there's no edge-only leak there).
      # Trade-off: on a schema-bumping window the Dockerfile bake isn't exercised
      # (a build-only PR goes green-skipped); it's re-exercised once the release
      # ships and branches rebase onto the now-caught-up asset.
      - name: Pending-schema-bump guard
        id: schemaguard
        env:
          GH_TOKEN: ${{ github.token }}  # for `gh release view` (missing-asset check below)
        run: |
          set -euo pipefail
          # An explicit `reg_meta_tag` dispatch pin is a deliberate operator choice — the
          # "owed release will catch up" rationale only holds for the auto-resolved newest
          # tag, so never neutralize an explicit pin. Let the bake run (and fail loud if the
          # pinned asset is incompatible with the current code), rather than green-no-op.
          if [ -n "${{ inputs.reg_meta_tag }}" ]; then
            echo "pending_bump=false" >> "$GITHUB_OUTPUT"
            echo "explicit reg_meta_tag pin (${{ inputs.reg_meta_tag }}) — pending-bump guard bypassed; bake runs as directed."
            exit 0
          fi
          TAG="${{ steps.regmeta.outputs.tag }}"
          # Anchored grep (^…) so it can't match an f-string/usage of the constant.
          code_db=$(grep -oP '^SCHEMA_VERSION = "\K[^"]+' reg_meta/src/reg_meta/db.py)
          code_doc=$(grep -oP '^DOC_SCHEMA_VERSION = "\K[^"]+' reg_meta/src/reg_meta/doc_db.py)
          asset_db=$(git show "$TAG:reg_meta/src/reg_meta/db.py" | grep -oP '^SCHEMA_VERSION = "\K[^"]+')
          asset_doc=$(git show "$TAG:reg_meta/src/reg_meta/doc_db.py" | grep -oP '^DOC_SCHEMA_VERSION = "\K[^"]+')
          verdict=$(python3 scripts/schema_pending_bump.py --code-db "$code_db" --code-doc "$code_doc" --asset-db "$asset_db" --asset-doc "$asset_doc")
          case "$verdict" in
            break)
              # A major schema mismatch is a genuine incompatibility — NOT the neutralizable
              # code-ahead case. Fail the guard so build-image/deploy/edge-deploy (all gated on
              # schema-guard success) are blocked red, including an edge-only push that has no
              # bake to fail. (Pre-#448 this surfaced as the bake's exit 10 on image pushes only.)
              echo "::error::schema-guard: major schema mismatch between code and latest release $TAG — genuine break, deploys blocked."
              exit 1 ;;
            pending)
              # Code is a minor ahead (same major) — the neutralizable pending-release case, BUT
              # only if the release actually carries both DB assets. A schema-behind release that
              # is ALSO missing an asset is a #343 invariant violation: fail red, don't mask it
              # (an edge-only push has no bake to catch it otherwise).
              assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')
              if ! printf '%s' "$assets" | grep -Fq 'reg_meta.db.zst' || ! printf '%s' "$assets" | grep -Fq 'reg_meta_docs.db.zst'; then
                echo "::error::schema-guard: release $TAG is schema-behind AND missing a DB asset (#343) — deploys blocked."
                exit 1
              fi
              echo "pending_bump=true" >> "$GITHUB_OUTPUT"
              echo "::notice::pending reg_meta release — bake + deploy paused by design (code schema ahead of latest released asset $TAG). The owed release (publish_reg_meta.yml → container-build dispatch) clears this; check_issue_hygiene.py also flags it." ;;
            compatible)
              echo "pending_bump=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::schema-guard: unexpected verdict '$verdict'"; exit 1 ;;
          esac

  # Deploy gate: nothing ships unless the ci.yml run for THIS commit succeeded
  # (lint + ty + pytest + frontend jobs). CI runs on every main push (no paths
  # filter), so a run always exists; for a workflow_dispatch the gate finds the
  # CI run from the SHA's original push. Polls because ci.yml (~2 min) and the
  # image build run in parallel — this usually resolves first.
  wait-ci:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 40); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --limit 1 --json status,conclusion \
              -q '.[0] | (.status + " " + (.conclusion // ""))')
            echo "ci.yml @ $GITHUB_SHA: ${run:-no run found yet}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "FATAL: CI did not succeed — refusing to deploy" >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "FATAL: timed out waiting for CI" >&2; exit 1

  build-image:
    needs: [changes, schema-guard]
    if: >-
      !cancelled() && needs.schema-guard.result == 'success' &&
      (needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # Image tag for the pushed artifact. Dispatch re-builds on an existing
      # main HEAD (e.g. after a data-only reg_meta release) get a -<run_id>
      # suffix so they don't overwrite the plain :sha tag — keeping every
      # pushed tag an immutable rollback handle (#290). Push builds use the
      # bare sha. The deploy job computes the identical expression.
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.1.0
      # Registry push auth (main/dispatch only). The username is ignored by
      # Fly's registry — the FLY_API_TOKEN deploy token authenticates. Skipped on a
      # pending bump (#448) — nothing to push when the bake is deferred.
      - name: Log in to registry.fly.io
        if: github.event_name != 'pull_request' && needs.schema-guard.outputs.pending_bump != 'true'
        uses: docker/login-action@v4.2.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      # Build context is the repo root (the Dockerfile needs the uv workspace);
      # -f points at reg_webapp/Dockerfile. PRs build-only: no push, no `load`
      # (nothing ever runs the PR image — all gates execute during the build
      # itself, and loading exports the full ~1 GB image into the runner's
      # docker daemon for nothing, #290). main/dispatch pushes to Fly's
      # registry addressed by IMAGE_TAG, so the deploy job (and a manual
      # rollback) references an immutable tag. GHA layer cache keeps rebuilds
      # cheap; cache is WRITTEN only on non-PR events — PR-scoped GHA cache is
      # unreadable from main, so PR writes would only evict useful cache from
      # the repo's 10 GB pool (#290). PRs still READ main's cache.
      # Skipped on a pending bump (#448): the bake would refuse the behind-schema
      # asset (exit 10) by design — defer it to the owed reg_meta release rather
      # than fail red. build-image stays green; deploys wait (job output below).
      - if: needs.schema-guard.outputs.pending_bump != 'true'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: reg_webapp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'reg-webapp:ci' || format('registry.fly.io/reg-webapp-global:{0}', env.IMAGE_TAG) }}
          build-args: |
            REG_META_TAG=${{ needs.schema-guard.outputs.tag }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  build-swecov-image:
    needs: [changes, schema-guard]
    # PRs build only the public/global image: the SWECOV image needs the flavored
    # DB release artifact, which is deployment state and not available to
    # fork-safe PR builds. SWECOV metadata is non-confidential for the current
    # testing steward, so the artifact lives on the public reg_meta/v* release
    # beside the global DB. Main/dispatch builds resolve it from that same tag
    # and fail loudly if the release has no matching SWECOV artifact rather than
    # shipping the steward against the public global DB.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.schema-guard.result == 'success' &&
      (needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to registry.fly.io
        if: needs.schema-guard.outputs.pending_bump != 'true'
        uses: docker/login-action@v4.2.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN_SWECOV }}
      - name: Resolve SWECOV DB release artifact
        id: swecov-db
        if: needs.schema-guard.outputs.pending_bump != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REG_META_TAG: ${{ needs.schema-guard.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/swecov-release.json"
          gh release view "$REG_META_TAG" --json assets > "$release_json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          tag = os.environ["REG_META_TAG"]
          release_json = Path(os.environ["RUNNER_TEMP"]) / "swecov-release.json"
          release = json.loads(release_json.read_text(encoding="utf-8"))
          assets = [
              asset
              for asset in release.get("assets", [])
              if asset.get("name") == "reg_meta_swecov.db.zst"
          ]
          if not assets:
              print(
                  f"::error::reg_meta_swecov.db.zst is missing from release {tag}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          if len(assets) != 1:
              print(
                  f"::error::release {tag} has multiple reg_meta_swecov.db.zst assets.",
                  file=sys.stderr,
              )
              sys.exit(1)
          asset = assets[0]
          missing = [
              key for key in ("url", "digest")
              if not isinstance(asset.get(key), str) or not asset[key]
          ]
          if missing:
              print(
                  "::error::reg_meta_swecov.db.zst asset missing non-empty key(s): "
                  + ", ".join(missing),
                  file=sys.stderr,
              )
              sys.exit(1)
          digest = asset["digest"]
          if not digest.startswith("sha256:"):
              print(
                  "::error::reg_meta_swecov.db.zst asset digest must be sha256-prefixed.",
                  file=sys.stderr,
              )
              sys.exit(1)
          sha256 = digest.removeprefix("sha256:").lower()
          try:
              int(sha256, 16)
          except ValueError:
              print("::error::SWECOV artifact sha256 is not hexadecimal.", file=sys.stderr)
              sys.exit(1)
          if len(sha256) != 64:
              print("::error::SWECOV artifact sha256 must be 64 hex characters.", file=sys.stderr)
              sys.exit(1)
          manifest = {"tag": tag, "url": asset["url"], "sha256": sha256}
          cache_key = {"tag": manifest["tag"], "sha256": manifest["sha256"]}
          fingerprint = hashlib.sha256(
              json.dumps(cache_key, sort_keys=True).encode()
          ).hexdigest()
          print(f"manifest={json.dumps(manifest, separators=(',', ':'))}")
          print(f"fingerprint={fingerprint}")
          PY
      - if: needs.schema-guard.outputs.pending_bump != 'true'
        uses: docker/build-push-action@v7.2.0
        env:
          SWECOV_REG_META_DB_ZST_MANIFEST: ${{ steps.swecov-db.outputs.manifest }}
        with:
          context: .
          file: reg_webapp/Dockerfile
          push: true
          tags: registry.fly.io/reg-webapp-swecov:${{ env.IMAGE_TAG }}
          build-args: |
            REG_META_TAG=${{ needs.schema-guard.outputs.tag }}
            REG_META_FLAVOR=swecov
            REG_WEBAPP_STEWARD=swecov
            SWECOV_REG_META_DB_REV=${{ steps.swecov-db.outputs.fingerprint }}
          secret-envs: |
            swecov_reg_meta_db_zst_manifest=SWECOV_REG_META_DB_ZST_MANIFEST

  deploy:
    needs: [build-image, wait-ci, schema-guard]
    # A pending schema bump (#448) leaves build-image GREEN with the bake skipped —
    # there is no new image to ship, so the deploy waits for the owed reg_meta
    # release (after which a rebase re-runs the now-passing bake and deploys).
    if: >-
      !cancelled() && needs.build-image.result == 'success' &&
      needs.schema-guard.outputs.pending_bump != 'true' &&
      needs.wait-ci.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time; queue rather than cancel — an interrupted flyctl
    # run can strand the machine mid-update. NOTE: concurrency serializes but
    # does NOT order by commit; the HEAD guard below handles ordering.
    concurrency:
      group: fly-deploy-global
      cancel-in-progress: false
    steps:
      # Checkout only for reg_webapp/fly.toml — the image is already pushed.
      - uses: actions/checkout@v7.0.0
      # Stale-deploy guard: only ship if this commit is still main's HEAD.
      # Build times vary (GHA cache hit vs miss), so an older commit's deploy
      # can reach this job AFTER a newer commit already deployed; without this
      # check it would roll prod back. Also blocks non-main dispatches.
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.head.outputs.skip != 'true'
      # Two gates guard a bad image: the container entrypoint runs the smoke
      # gate before uvicorn serves (a bad image exits non-zero), and fly.toml's
      # /api/context HTTP check must pass before flyctl reports success.
      # --ha=false keeps the single-machine topology (see fly.toml header).
      - if: steps.head.outputs.skip != 'true'
        run: >-
          flyctl deploy
          --config reg_webapp/fly.toml
          --image registry.fly.io/reg-webapp-global:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
          --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Registry pruning (#290): keep the newest KEEP tags as rollback handles,
      # delete older manifests so the registry doesn't grow unboundedly. Fly's
      # registry supports standard v2 manifest DELETE (verified live
      # 2026-06-11 — 202 Accepted, tag gone from tags/list). Ordering is by
      # the image config's .created timestamp (buildx pushes OCI indexes; the
      # real image manifest is the non-"unknown"-platform entry, the other is
      # the provenance attestation). A digest shared with any kept tag is
      # never deleted — deleting a manifest removes EVERY tag pointing at it.
      # continue-on-error: a prune hiccup must not fail a successful deploy.
      - name: Prune old registry tags
        if: steps.head.outputs.skip != 'true'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The tag this run just deployed — never pruned, regardless of
          # .created ordering. A no-op dispatch rebuild gets a full buildx
          # cache hit and inherits the ORIGINAL build's image-config .created,
          # so on a >KEEP-releases-old commit the just-deployed tag could sort
          # outside the keep window and the prune would delete the manifest
          # prod is actively running (review on #296).
          DEPLOYED_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
        run: |
          set -euo pipefail
          REPO_URL="https://registry.fly.io/v2/reg-webapp-global"
          ACCEPT='Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          KEEP=10
          auth="x:$FLY_API_TOKEN"
          listing=""
          for t in $(curl -fsS -u "$auth" "$REPO_URL/tags/list" | jq -r '.tags[]'); do
            top_digest=$(curl -fsSI -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$t" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}')
            manifest=$(curl -fsS -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$t")
            if echo "$manifest" | jq -e '.manifests' >/dev/null; then
              img=$(echo "$manifest" | jq -r '[.manifests[] | select(.platform.architecture != "unknown")][0].digest')
              cfg=$(curl -fsS -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$img" | jq -r '.config.digest')
            else
              cfg=$(echo "$manifest" | jq -r '.config.digest')
            fi
            created=$(curl -fsSL -u "$auth" "$REPO_URL/blobs/$cfg" | jq -r '.created')
            listing+="$created $t $top_digest"$'\n'
          done
          kept=$(printf '%s' "$listing" | sort -r | head -n "$KEEP")
          echo "Keeping $(printf '%s\n' "$kept" | wc -l | tr -d ' ') tags:"
          printf '%s\n' "$kept"
          kept_digests=$(printf '%s\n' "$kept" | awk '{print $3}')
          printf '%s' "$listing" | sort -r | tail -n "+$((KEEP + 1))" \
            | while read -r _ tag digest; do
              if [ "$tag" = "$DEPLOYED_TAG" ]; then
                echo "skip $tag (just deployed)"
              elif printf '%s\n' "$kept_digests" | grep -qF "$digest"; then
                echo "skip $tag (digest shared with a kept tag)"
              else
                echo "prune $tag"
                curl -fsS -X DELETE -u "$auth" "$REPO_URL/manifests/$digest" \
                  || echo "::warning::failed to delete $tag"
              fi
            done

  deploy-swecov:
    needs: [build-swecov-image, wait-ci, schema-guard]
    if: >-
      !cancelled() && needs.build-swecov-image.result == 'success' &&
      needs.schema-guard.outputs.pending_bump != 'true' &&
      needs.wait-ci.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-swecov
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping SWECOV deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.head.outputs.skip != 'true'
      - if: steps.head.outputs.skip != 'true'
        run: >-
          flyctl deploy
          --config reg_webapp/fly.swecov.toml
          --image registry.fly.io/reg-webapp-swecov:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
          --ha=false
          --wait-timeout 10m0s
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SWECOV }}
      - name: Prune old SWECOV registry tags
        if: steps.head.outputs.skip != 'true'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SWECOV }}
          DEPLOYED_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
        run: |
          set -euo pipefail
          REPO_URL="https://registry.fly.io/v2/reg-webapp-swecov"
          ACCEPT='Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          KEEP=10
          auth="x:$FLY_API_TOKEN"
          listing=""
          for t in $(curl -fsS -u "$auth" "$REPO_URL/tags/list" | jq -r '.tags[]'); do
            top_digest=$(curl -fsSI -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$t" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}')
            manifest=$(curl -fsS -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$t")
            if echo "$manifest" | jq -e '.manifests' >/dev/null; then
              img=$(echo "$manifest" | jq -r '[.manifests[] | select(.platform.architecture != "unknown")][0].digest')
              cfg=$(curl -fsS -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$img" | jq -r '.config.digest')
            else
              cfg=$(echo "$manifest" | jq -r '.config.digest')
            fi
            created=$(curl -fsSL -u "$auth" "$REPO_URL/blobs/$cfg" | jq -r '.created')
            listing+="$created $t $top_digest"$'\n'
          done
          kept=$(printf '%s' "$listing" | sort -r | head -n "$KEEP")
          echo "Keeping $(printf '%s\n' "$kept" | wc -l | tr -d ' ') tags:"
          printf '%s\n' "$kept"
          kept_digests=$(printf '%s\n' "$kept" | awk '{print $3}')
          printf '%s' "$listing" | sort -r | tail -n "+$((KEEP + 1))" \
            | while read -r _ tag digest; do
              if [ "$tag" = "$DEPLOYED_TAG" ]; then
                echo "skip $tag (just deployed)"
              elif printf '%s\n' "$kept_digests" | grep -qF "$digest"; then
                echo "skip $tag (digest shared with a kept tag)"
              else
                echo "prune $tag"
                curl -fsS -X DELETE -u "$auth" "$REPO_URL/manifests/$digest" \
                  || echo "::warning::failed to delete $tag"
              fi
            done

  # Edge worker (SPA + /api passthrough) for catalog.swecov.se. Runs AFTER the
  # global origin deploy (deploy-skew guard): on a contract-changing push the SPA
  # must not go live before the origin serves the new endpoints. `needs.deploy`
  # being skipped (edge-only change → no image rebuild) is fine; a FAILED
  # image build/deploy blocks the edge ship. Image-affecting changes also run
  # this job even when nothing edge-side changed: the deploy ships a fresh
  # DEPLOY_VERSION cache generation (#318), without which the edge would keep
  # serving pre-deploy /api/* payloads for up to the 24h TTL.
  edge-deploy:
    needs: [changes, build-image, deploy, wait-ci, schema-guard]
    # Also gated on the pending-bump guard (#448), now its OWN `schema-guard` job:
    # during a pending-bump window an edge-only main push consults `schema-guard`
    # directly (it ran because the edge filter matched, even though build-image was
    # skipped), so the edge correctly waits for the owed release alongside the origin
    # — closing the prior edge-only gap where a skipped build-image left the verdict
    # empty. A guard FAILURE also blocks the edge: build-image being skipped is
    # tolerated below, so a failed guard must not fall through to an empty output.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.wait-ci.result == 'success' &&
      needs.schema-guard.result == 'success' &&
      needs.schema-guard.outputs.pending_bump != 'true' &&
      needs.build-image.result != 'failure' && needs.deploy.result != 'failure' &&
      (needs.changes.outputs.edge == 'true' ||
      needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: edge-deploy-global
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.0
      # Pinned to the same bun the Dockerfile's frontend stage uses
      # (oven/bun:1.3.0-alpine) — bump both together. A floating toolchain
      # here would make the production SPA bundle non-reproducible while the
      # image-baked copy stays pinned.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: reg_webapp/frontend
      # Same build sequence as the Dockerfile's frontend stage: regenerate
      # types from the committed contract (no-op on a clean tree), then build.
      - run: bun run gen:types && bun run build
        working-directory: reg_webapp/frontend
      # Same stale-deploy guard as the origin job (see comment there).
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping edge deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # wrangler reads CLOUDFLARE_API_TOKEN from the env; major-pinned so a
      # breaking wrangler v5 can't land unreviewed. DEPLOY_VERSION is the
      # /api/* cache generation (#318) — the worker stamps it into every
      # origin-bound URL, orphaning all pre-deploy edge-cache entries. The
      # expression mirrors IMAGE_TAG: dispatch runs get a -<run_id> suffix so a
      # same-SHA rebuild (data-only reg_meta release) still busts the cache.
      - if: steps.head.outputs.skip != 'true'
        run: >-
          bunx wrangler@4 deploy --config reg_webapp/edge/wrangler.jsonc
          --var DEPLOY_VERSION:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aa45afed8a0f3c7162b0e0b3d4f31c2
      # Standing #220 regression probe: the /api/* Cache Rule and the ETag
      # contract are zone-dashboard state (click-ops, no IaC) — assert after
      # every edge deploy that a catalog read still caches (MISS/HIT family,
      # not DYNAMIC) and revalidates with an edge 304. Catches silent Cache
      # Rule deletion / zone drift that nothing else in CI would notice.
      # Also asserts the HIT is YOUNG (#318): this deploy started a new cache
      # generation, so any reachable entry must have been populated after it —
      # an old Age means DEPLOY_VERSION stopped reaching the cache key and the
      # stale-24h window is back.
      - name: Edge cache probe (#220 + #318)
        if: steps.head.outputs.skip != 'true'
        run: |
          url="https://catalog.swecov.se/api/catalog"
          curl -sfo /dev/null "$url"   # warm the colo
          status=""
          for _ in 1 2 3; do
            sleep 2
            status=$(curl -sfo /dev/null -w '%header{cf-cache-status}' "$url")
            [ "$status" = "HIT" ] && break
          done
          echo "cf-cache-status: $status"
          [ "$status" = "HIT" ] || { echo "FATAL: /api/* not edge-cached (Cache Rule missing?)" >&2; exit 1; }
          age=$(curl -sfo /dev/null -w '%header{age}' "$url")
          echo "age: ${age:-0}s"
          [ "${age:-0}" -le 600 ] || { echo "FATAL: edge HIT is ${age}s old — pre-deploy cache entry still reachable (#318 DEPLOY_VERSION cache-key versioning broken?)" >&2; exit 1; }
          etag=$(curl -sfo /dev/null -w '%header{etag}' "$url")
          code=$(curl -so /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$url")
          echo "If-None-Match -> $code"
          [ "$code" = "304" ] || { echo "FATAL: edge 304 revalidation broken" >&2; exit 1; }

  # Edge worker (SPA + /api passthrough) for data.swecov.se. Separate Worker
  # deployment from catalog.swecov.se so each origin can bump its own cache
  # generation after its own Fly deploy succeeds.
  edge-deploy-swecov:
    needs: [changes, build-swecov-image, deploy-swecov, wait-ci, schema-guard]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.wait-ci.result == 'success' &&
      needs.schema-guard.result == 'success' &&
      needs.schema-guard.outputs.pending_bump != 'true' &&
      needs.build-swecov-image.result != 'failure' &&
      needs.deploy-swecov.result != 'failure' &&
      (needs.changes.outputs.edge == 'true' ||
      needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: edge-deploy-swecov
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: reg_webapp/frontend
      - run: bun run gen:types && bun run build
        working-directory: reg_webapp/frontend
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping SWECOV edge deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.skip != 'true'
        run: >-
          bunx wrangler@4 deploy --config reg_webapp/edge/wrangler.swecov.jsonc
          --var DEPLOY_VERSION:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aa45afed8a0f3c7162b0e0b3d4f31c2
      - name: SWECOV edge cache probe (#220 + #318)
        if: steps.head.outputs.skip != 'true'
        run: |
          url="https://data.swecov.se/api/catalog"
          curl -sfo /dev/null "$url"   # warm the colo
          status=""
          for _ in 1 2 3; do
            sleep 2
            status=$(curl -sfo /dev/null -w '%header{cf-cache-status}' "$url")
            [ "$status" = "HIT" ] && break
          done
          echo "cf-cache-status: $status"
          [ "$status" = "HIT" ] || { echo "FATAL: /api/* not edge-cached (Cache Rule missing?)" >&2; exit 1; }
          age=$(curl -sfo /dev/null -w '%header{age}' "$url")
          echo "age: ${age:-0}s"
          [ "${age:-0}" -le 600 ] || { echo "FATAL: edge HIT is ${age}s old — pre-deploy cache entry still reachable (#318 DEPLOY_VERSION cache-key versioning broken?)" >&2; exit 1; }
          etag=$(curl -sfo /dev/null -w '%header{etag}' "$url")
          code=$(curl -so /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$url")
          echo "If-None-Match -> $code"
          [ "$code" = "304" ] || { echo "FATAL: edge 304 revalidation broken" >&2; exit 1; }
