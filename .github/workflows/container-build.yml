# reg_webapp build + deploy: the Fly origin images and the Cloudflare edge workers
# (topology in reg_webapp/DESIGN.md → "Deployment"). Two deployments, each an origin
# app behind an edge worker:
#   global  reg-webapp-global behind an MCP-only worker on reg-meta.vqv.uk: `/mcp`
#           only, no SPA and no `/api`.
#   swecov  reg-webapp-swecov behind a worker on data.swecov.se that serves the SPA
#           as static assets and passes `/api`, `/openapi.json` and `/mcp` through.
#
# SWECOV defaults off: all four SWECOV jobs require repository variable
# SWECOV_DEPLOY to equal exactly "on". After the paired release exists, the
# maintainer first runs `gh variable set SWECOV_DEPLOY --body on`, then
# `gh workflow run container-build.yml` (dispatch); never wait for the next push.
# SWECOV origin and edge always deploy together, including frontend-only pushes.
# Unset or any other value skips those jobs; turning it off again stops SWECOV
# redeploys on later pushes without affecting global.
#
# PRs: build-only. `build-image` proves the multi-stage Dockerfile still builds,
# including the digest-verified DB bake, the `reg-meta` Rust build and the #224
# provenance-confinement assertion #3 (the RUN check fails the build if
# reg_meta.provenance.db* is present). Nothing deploys.
#
# Pushes to main: the `changes` filter, diffed against the last deployed commit rather
# than the push's `before` (#1481, see the job), scopes four deploy jobs. Image-affecting paths
# build, push and `flyctl deploy` both origins (`deploy`, `deploy-swecov`). Each edge
# job (`edge-deploy` for global, `edge-deploy-swecov`, which also builds the SPA)
# runs when its own worker's inputs change, and after every origin deploy of its
# deployment: the swecov worker's fresh DEPLOY_VERSION orphans its pre-deploy /api/*
# cache (#318), and each job's public MCP smoke checks the new origin through the
# edge. Each edge job `needs:` its origin deploy, so a worker never ships ahead of
# its origin (deploy-skew guard). Every deploy job also verifies it is still main's
# HEAD before shipping: GHA concurrency serializes deploys but admits them in
# BUILD-COMPLETION order, so without the guard an older commit's slow build could
# overwrite a newer deploy. A commit the guard skips is not lost: the next push's
# `changes` range still starts at the last deployed commit, so it covers it.
#
# There is no separate staging, so every relevant main push deploys.
# workflow_dispatch is the manual escape hatch (rebuild + deploy everything); the
# HEAD guards make a non-main dispatch a no-op at the deploy steps, so it cannot ship
# branch code to prod.
#
# Nothing deploys without green CI: a `wait-ci` job polls the ci.yml run for this
# commit and every deploy job requires its success — an image that builds but fails
# lint/types/tests never ships.

name: Container build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual escape hatch: rebuild + deploy after a DATA-only reg_meta
  # release. The bake build-arg always carries the CONCRETE
  # newest reg_meta/v* tag (resolved per run, below), so a data-only release
  # rebakes by itself — no input needed unless pinning an OLDER release.
  # A reg_meta/v* release ALSO reaches this workflow indirectly: publish_reg_meta.yml
  # dispatches this workflow after publishing, so an owed-bump or data-only release
  # auto-rebakes + deploys without a manual run (the #448 self-clearing path).
  workflow_dispatch:
    inputs:
      reg_meta_tag:
        description: >-
          reg_meta release tag to bake (e.g. reg_meta/v0.9.0). Leave empty to
          resolve the newest reg_meta/v* release.
        required: false
        default: ""

jobs:
  # Path scoping runs as a job (not `on.paths`) so image and edge surfaces
  # share one trigger and one filter definition. Skipped on dispatch — the
  # downstream `if`s treat dispatch as "everything changed".
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.base.outputs.all == 'true' && 'true' || steps.filter.outputs.image }}
      edge_global: ${{ steps.base.outputs.all == 'true' && 'true' || steps.filter.outputs.edge_global }}
      edge_swecov: ${{ steps.base.outputs.all == 'true' && 'true' || steps.filter.outputs.edge_swecov }}
    steps:
      # No history, no blobs and almost no tree: the filter only runs `git diff
      # --name-status` between two commits, which reads trees, never blobs. The base
      # commit is fetched on its own below (a push) or by the filter itself (a PR, whose
      # base is the merge commit's first parent). Both ranges are compared two-dot
      # (`base..head`), so no merge-base, and therefore no history, is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          filter: blob:none
      # A push diffs against the last DEPLOYED commit, not the push's `before` (#1481).
      # Every deploy job skips unless its commit is still main's HEAD, so when push A
      # touches a served path and push B lands before A's deploy runs, A skips; diffed
      # against `before` (= A), B would see no served path and skip too, leaving A off
      # production. Diffed against the last deployed commit, B's range includes A.
      #
      # "Deployed" is read from this workflow's run history: the newest successful main
      # run (push or dispatch only: a fork PR from a branch named `main` also lists
      # here) during which no other push run started, so it was still HEAD when it
      # finished and none of its deploys took the HEAD skip. A push created up to 300 s
      # after the run's `updatedAt` also counts as overlapping, so a HEAD-skip just
      # before the run ends cannot pass as deployed. A run that overlapped a later push
      # might have skipped, so it never counts; widening the window only excludes more
      # candidates, so that over-includes paths (a redundant redeploy) but never misses one. An unfinished
      # or failed run never counts either, so a red deploy is retried by the next push.
      # Blind spot: a `[skip ci]` push starts no run, so
      # a run it overlapped (and HEAD-skipped) would count: the gap reopens for that
      # one case; none of main's commits use it. No commit found in the last 200 runs
      # (or one that is not an ancestor, or that cannot be fetched) counts as everything
      # changed.
      #
      # Ancestry comes from the compare API instead of `git merge-base --is-ancestor`,
      # which needs history: `ahead` or `identical` is exactly "base is an ancestor of
      # (or equal to) this commit"; `behind`, `diverged`, a 404 (base gone from the
      # repository) and any API failure fail closed to everything changed. The base
      # commit alone is then fetched at depth 1 for paths-filter's two-dot diff.
      #
      # Rejected: dispatching HEAD's run from a skipped deploy needs `actions: write`,
      # which this workflow does not hold; reading the deployed version from the edge
      # or Fly needs a version header the workers do not expose, or the deploy tokens.
      - name: Resolve the last deployed commit
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $pushes and $r are jq variables
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow container-build.yml \
            --branch main --limit 200 --json headSha,event,conclusion,createdAt,updatedAt \
            --jq '[.[] | select(.event == "push") | .createdAt] as $pushes
              | [.[] | select(.conclusion == "success"
                              and (.event == "push" or .event == "workflow_dispatch"))
                  | . as $r
                  | select(all($pushes[]; . <= $r.createdAt
                      or (fromdateiso8601) >= ($r.updatedAt | fromdateiso8601) + 300))]
              | sort_by(.createdAt) | last | .headSha // empty')
          if [ -n "$base" ] \
            && status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA?per_page=1" --jq .status) \
            && { [ "$status" = ahead ] || [ "$status" = identical ]; } \
            && git fetch --no-tags --depth=1 --filter=blob:none origin "$base"; then
            echo "Diffing against the last deployed commit $base"
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$base" ]; then
              echo "::warning::last deployed commit $base is not an ancestor of $GITHUB_SHA (compare: ${status:-unavailable}) or could not be fetched; treating every path as changed"
            else
              echo "::warning::no deployed commit found in the last 200 main runs; treating every path as changed"
            fi
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.base.outputs.all != 'true'
        with:
          # Use git on PRs: GitHub's diff API can time out on large changes.
          token: ""
          base: ${{ steps.base.outputs.sha || github.event.pull_request.base.sha }}
          # `image` lists exactly what enters the Docker image (Dockerfile
          # COPY surfaces + bake inputs) plus Fly origin config that should
          # force a redeploy. NOT all of reg_webapp/**: edge/, .claude/, and
          # docs don't change image/origin content, and an image deploy swaps
          # prod machines (brief origin blip), so content-identical rebuilds
          # are worth avoiding.
          #
          # Each edge filter lists its worker inputs. Only SWECOV ships SPA assets.
          filters: |
            image:
              - "reg_webapp/Dockerfile"
              - "reg_webapp/docker-entrypoint.sh"
              - "reg_webapp/fly.toml"
              - "reg_webapp/fly.swecov.toml"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".dockerignore"
              - ".github/workflows/container-build.yml"
            edge_global:
              - "reg_webapp/edge/src/**"
              - "reg_webapp/edge/wrangler.jsonc"
              - ".github/workflows/container-build.yml"
            edge_swecov:
              - "reg_webapp/edge/src/**"
              - "reg_webapp/edge/wrangler.swecov.jsonc"
              - "reg_webapp/frontend/**"
              - "crates/reg-meta/openapi.json"
              - ".github/workflows/container-build.yml"

  # Schema guard — its OWN job so EVERY deploy path can consult it, including an
  # edge-only push that skips build-image. Resolves the reg_meta/v* tag to bake and
  # fails closed unless the code's catalog schema constant equals the newest
  # release's. Two outcomes only, no pass-through: between the merge of a schema
  # change and its release, every main push is red here and nothing deploys
  # (plan: "Deploy window"). Publishing the release (publish_reg_meta.yml) dispatches
  # this workflow, which then passes.
  schema-guard:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.outputs.image == 'true' ||
      needs.changes.outputs.edge_global == 'true' ||
      needs.changes.outputs.edge_swecov == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.regmeta.outputs.tag }}
      db_sha256: ${{ steps.regmeta.outputs.db_sha256 }}
      swecov_db_sha256: ${{ steps.regmeta.outputs.swecov_db_sha256 }}
      schema_match: ${{ steps.schemaguard.outputs.schema_match }}
    steps:
      # Only the code side's schema constants file: the guard below reads the released
      # asset's side from the resolved reg_meta/v* tag, which it fetches alone, without
      # blobs (a sparse path missing here fails the guard: "code has 'absent'").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /crates/reg-core/src/lib.rs
          sparse-checkout-cone-mode: false
          filter: blob:none
      # Resolve the CONCRETE newest reg_meta/v* release tag for the bake
      # build-arg. A literal `latest` would name no release: the Dockerfile
      # requires a concrete tag, and the schema guard below reads that tag's source.
      #
      # Resolve GitHub's SHA-256 digest for each paired asset as bare hex.
      # Missing or duplicated assets resolve empty; only SWECOV requires holdings.
      # The separate asset guard isolates a missing pair from the global deploy.
      - name: Resolve reg_meta release tag and asset digests
        id: regmeta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.reg_meta_tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName -q '[.[].tagName | select(startswith("reg_meta/v"))][0]')
          fi
          [ -n "$tag" ] || { echo "FATAL: no reg_meta/v* release found" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baking reg_meta release: $tag"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets)
          for pair in db_sha256=reg_meta.db.zst swecov_db_sha256=reg_meta_swecov.db.zst; do
            digest=$(printf '%s' "$assets" \
              | jq -r --arg name "${pair#*=}" '[.assets[] | select(.name == $name) | .digest]
                    | if length == 1 then .[0] else "" end' | tr '[:upper:]' '[:lower:]' \
              | sed -n 's/^sha256:\([0-9a-f]\{64\}\)$/\1/p')
            [ -n "$digest" ] || echo "::warning::release $tag has no single sha256-digested ${pair#*=}"
            echo "${pair%%=*}=$digest" >> "$GITHUB_OUTPUT"
          done
      # The Rust server refuses to boot on an asset whose schema differs from its
      # `CATALOG_SCHEMA_VERSION` (crates/reg-core/src/lib.rs), and the SWECOV server on
      # its `HOLDINGS_SCHEMA_VERSION`; both are checked. The asset's schema is
      # read from the release tag's source (a data-only release keeps the tag-commit
      # schema), hence the tag fetch. A release from before the constant
      # existed has none, which is a mismatch too. An explicit `reg_meta_tag` pin
      # follows the same rule.
      #
      # On a pull request a mismatch is a warning, not a failure: main legitimately
      # carries a schema bump ahead of its release, and every PR would go red until the
      # release ships. The PR then skips its build-only image (it would bake an asset
      # the server refuses). Push and dispatch still fail, which blocks every deploy.
      - name: Schema guard
        id: schemaguard
        run: |
          set -euo pipefail
          TAG="${{ steps.regmeta.outputs.tag }}"
          # The tag's commit without history or blobs; `git show` below fetches the one
          # blob it names. A tag that cannot be fetched blocks the deploy like a mismatch.
          git fetch --no-tags --depth=1 --filter=blob:none origin "+refs/tags/$TAG:refs/tags/$TAG" \
            || { echo "::error::schema-guard: cannot fetch release tag $TAG; deploys blocked."; exit 1; }
          for name in CATALOG_SCHEMA_VERSION HOLDINGS_SCHEMA_VERSION; do
            pattern="$name: u32 = [0-9]+"
            code=$(grep -oE "$pattern" crates/reg-core/src/lib.rs || true)
            asset=$(git show "$TAG:crates/reg-core/src/lib.rs" | grep -oE "$pattern" || true)
            if [ -z "$code" ] || [ "$code" != "$asset" ]; then
              msg="schema-guard: $name: code has '${code:-absent}' but release $TAG has '${asset:-absent}' — publish the switch release first"
              if [ "${{ github.event_name }}" = pull_request ]; then
                echo "::warning::$msg; PR image build skipped."
                echo "schema_match=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::$msg; deploys blocked."
              exit 1
            fi
          done
          echo "schema_match=true" >> "$GITHUB_OUTPUT"
          echo "schema-guard: code and $TAG agree on both schema versions"

  # A missing paired asset blocks only SWECOV. Keep the run eligible for the
  # success-only deployed-commit resolver above, or every push would rebuild global
  # until a paired release exists. The error remains visible; no ok output is set.
  swecov-asset-guard:
    needs: schema-guard
    if: >-
      vars.SWECOV_DEPLOY == 'on' &&
      !cancelled() && github.event_name != 'pull_request' &&
      needs.schema-guard.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      ok: ${{ steps.asset.outputs.ok }}
    steps:
      - name: Require the paired SWECOV asset
        id: asset
        env:
          REG_META_TAG: ${{ needs.schema-guard.outputs.tag }}
          HOLDINGS_SHA256: ${{ needs.schema-guard.outputs.swecov_db_sha256 }}
        run: |
          if [ -z "$HOLDINGS_SHA256" ]; then
            echo "::error::release $REG_META_TAG has no single sha256-digested reg_meta_swecov.db.zst; SWECOV deploy blocked"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  # Deploy gate: nothing ships unless the ci.yml run for THIS commit succeeded
  # (lint + ty + pytest + Rust jobs). CI runs on every main push (no paths
  # filter), so a run always exists; for a workflow_dispatch the gate finds the
  # CI run from the SHA's original push. Polls because ci.yml (~2 min) and the
  # image build run in parallel — this usually resolves first.
  wait-ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/wait-ci.yml

  build-image:
    needs: [changes, schema-guard]
    if: >-
      !cancelled() && needs.schema-guard.result == 'success' &&
      needs.schema-guard.outputs.schema_match == 'true' &&
      (needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # Image tag for the pushed artifact. Dispatch re-builds on an existing
      # main HEAD (e.g. after a data-only reg_meta release) get a -<run_id>
      # suffix so they don't overwrite the plain :sha tag — keeping every
      # pushed tag an immutable rollback handle (#290). Push builds use the
      # bare sha. The deploy job computes the identical expression.
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
    steps:
      # Exactly what the Dockerfile COPYs (`Cargo.toml`, `Cargo.lock`, `crates/`,
      # `reg_webapp/docker-entrypoint.sh`) plus the Dockerfile itself and `.dockerignore`,
      # which filters the context. A missing path fails the build at its COPY.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: &image-sparse |
            /Cargo.toml
            /Cargo.lock
            /.dockerignore
            /crates/
            /reg_webapp/Dockerfile
            /reg_webapp/docker-entrypoint.sh
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Registry push auth (main/dispatch only). The username is ignored by
      # Fly's registry — the FLY_API_TOKEN deploy token authenticates. Skipped on a
      # Fly's registry — the FLY_API_TOKEN deploy token authenticates.
      - name: Log in to registry.fly.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      # Build context is the repo root (the Dockerfile needs the uv workspace);
      # -f points at reg_webapp/Dockerfile. PRs build-only: no push, no `load`
      # (nothing ever runs the PR image — all gates execute during the build
      # itself, and loading exports the full ~1 GB image into the runner's
      # docker daemon for nothing, #290). main/dispatch pushes to Fly's
      # registry addressed by IMAGE_TAG, so the deploy job (and a manual
      # rollback) references an immutable tag. No layer cache: the GHA cache's export
      # cost ~2 min per build and only the apt layers ever hit (`COPY crates/` busts
      # the cargo layer on every change). If a cargo-layer cache is wanted, use
      # cargo-chef or a registry cache that actually hits.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: reg_webapp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'reg-webapp:ci' || format('registry.fly.io/reg-webapp-global:{0}', env.IMAGE_TAG) }}
          build-args: |
            REG_META_TAG=${{ needs.schema-guard.outputs.tag }}
            REG_META_DB_SHA256=${{ needs.schema-guard.outputs.db_sha256 }}

  build-swecov-image:
    needs: [changes, schema-guard, swecov-asset-guard]
    # PRs build only the public/global image: the SWECOV image needs the paired
    # holdings release artifact, which is deployment state and not available to
    # fork-safe PR builds. SWECOV metadata is non-confidential for the current
    # testing steward, so the artifact lives on the public reg_meta/v* release
    # beside the global DB. The bake fetches it from that same tag and fails
    # loudly if the release has no reg_meta_swecov.db.zst (an empty digest),
    # rather than shipping the steward without its holdings DB (#1091).
    if: >-
      vars.SWECOV_DEPLOY == 'on' &&
      !cancelled() && github.event_name != 'pull_request' &&
      needs.schema-guard.result == 'success' &&
      needs.swecov-asset-guard.outputs.ok == 'true' &&
      (needs.changes.outputs.image == 'true' ||
      needs.changes.outputs.edge_swecov == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
    steps:
      # Same build context as `build-image`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *image-sparse
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to registry.fly.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN_SWECOV }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: reg_webapp/Dockerfile
          push: true
          tags: registry.fly.io/reg-webapp-swecov:${{ env.IMAGE_TAG }}
          build-args: |
            REG_META_TAG=${{ needs.schema-guard.outputs.tag }}
            REG_META_CATALOG=swecov
            REG_META_DB_SHA256=${{ needs.schema-guard.outputs.db_sha256 }}
            REG_META_HOLDINGS_SHA256=${{ needs.schema-guard.outputs.swecov_db_sha256 }}

  deploy:
    needs: [build-image, wait-ci, schema-guard]
    if: >-
      !cancelled() && needs.build-image.result == 'success' &&
      needs.wait-ci.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time; queue rather than cancel — an interrupted flyctl
    # run can strand the machine mid-update. NOTE: concurrency serializes but
    # does NOT order by commit; the HEAD guard below handles ordering.
    concurrency:
      group: fly-deploy-global
      cancel-in-progress: false
    # Whether this run shipped (passed the HEAD guard); `prune-registry` runs only then.
    outputs:
      deployed: ${{ steps.head.outputs.skip != 'true' }}
    steps:
      # Checkout only for reg_webapp/fly.toml — the image is already pushed. The
      # Dockerfile that its [build] section names rides along; `--image` does not use it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /reg_webapp/fly.toml
            /reg_webapp/Dockerfile
          sparse-checkout-cone-mode: false
          filter: blob:none
      # Stale-deploy guard: only ship if this commit is still main's HEAD.
      # Build times vary, so an older commit's deploy
      # can reach this job AFTER a newer commit already deployed; without this
      # check it would roll prod back. Also blocks non-main dispatches.
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.head.outputs.skip != 'true'
        with:
          version: "0.5.0"
      # Two gates guard a bad image: the container entrypoint probes
      # `context`, `search`, docs search and `/mcp` before `reg-meta serve` takes traffic (a
      # bad image exits non-zero), and fly.toml's /api/context HTTP check must
      # pass before flyctl reports success.
      # --ha=false keeps the single-machine topology (see fly.toml header).
      - if: steps.head.outputs.skip != 'true'
        run: >-
          flyctl deploy
          --config reg_webapp/fly.toml
          --image registry.fly.io/reg-webapp-global:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
          --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Registry pruning (#290): keep the newest KEEP tags as rollback handles,
  # delete older manifests so the registry doesn't grow unboundedly. Fly's
  # registry supports standard v2 manifest DELETE (verified live
  # 2026-06-11 — 202 Accepted, tag gone from tags/list). Ordering is by
  # the image config's .created timestamp (buildx pushes OCI indexes; the
  # real image manifest is the non-"unknown"-platform entry, the other is
  # the provenance attestation). A digest shared with any kept tag is
  # never deleted — deleting a manifest removes EVERY tag pointing at it.
  # Its own job after the deploy, off the critical path (it needs no checkout, only
  # the registry token). continue-on-error: a prune hiccup must not fail a successful
  # deploy, and the run must stay green for the deployed-commit resolver in `changes`.
  prune-registry:
    needs: deploy
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Prunes never overlap; a pending one is superseded by the newer one.
    concurrency:
      group: fly-prune-global
      cancel-in-progress: false
    steps:
      - name: Prune old registry tags
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The tag this run just deployed — never pruned, regardless of
          # .created ordering. Defensive since the GHA layer cache was dropped: a
          # fully cached rebuild used to inherit the ORIGINAL build's image-config
          # .created, so on a >KEEP-releases-old commit the just-deployed tag could
          # sort outside the keep window and the prune would delete the manifest
          # prod is actively running (review on #296).
          DEPLOYED_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
          FLY_APP: reg-webapp-global
        run: &prune-registry |
          set -euo pipefail
          REPO_URL="https://registry.fly.io/v2/$FLY_APP"
          ACCEPT='Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          KEEP=10
          auth="x:$FLY_API_TOKEN"
          listing=""
          for t in $(curl -fsS -u "$auth" "$REPO_URL/tags/list" | jq -r '.tags[]'); do
            top_digest=$(curl -fsSI -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$t" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}')
            manifest=$(curl -fsS -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$t")
            if echo "$manifest" | jq -e '.manifests' >/dev/null; then
              img=$(echo "$manifest" | jq -r '[.manifests[] | select(.platform.architecture != "unknown")][0].digest')
              cfg=$(curl -fsS -u "$auth" -H "$ACCEPT" "$REPO_URL/manifests/$img" | jq -r '.config.digest')
            else
              cfg=$(echo "$manifest" | jq -r '.config.digest')
            fi
            created=$(curl -fsSL -u "$auth" "$REPO_URL/blobs/$cfg" | jq -r '.created')
            listing+="$created $t $top_digest"$'\n'
          done
          kept=$(printf '%s' "$listing" | sort -r | head -n "$KEEP")
          echo "Keeping $(printf '%s\n' "$kept" | wc -l | tr -d ' ') tags:"
          printf '%s\n' "$kept"
          kept_digests=$(printf '%s\n' "$kept" | awk '{print $3}')
          # An image newer than the one just deployed may belong to a run still on its
          # way to deploy (this job no longer holds the deploy lock), so it is never
          # pruned. If the deployed tag is not listed, every tag counts as newer and
          # nothing is pruned.
          deployed_created=$(printf '%s' "$listing" | awk -v t="$DEPLOYED_TAG" '$2 == t {print $1}')
          printf '%s' "$listing" | sort -r | tail -n "+$((KEEP + 1))" \
            | while read -r created tag digest; do
              if [ "$tag" = "$DEPLOYED_TAG" ]; then
                echo "skip $tag (just deployed)"
              elif [ -z "$deployed_created" ] || [[ "$created" > "$deployed_created" ]]; then
                echo "skip $tag (newer than the deployed image: may be deploying)"
              elif printf '%s\n' "$kept_digests" | grep -qF "$digest"; then
                echo "skip $tag (digest shared with a kept tag)"
              else
                echo "prune $tag"
                curl -fsS -X DELETE -u "$auth" "$REPO_URL/manifests/$digest" \
                  || echo "::warning::failed to delete $tag"
              fi
            done

  deploy-swecov:
    needs: [build-swecov-image, wait-ci, schema-guard, swecov-asset-guard]
    if: >-
      vars.SWECOV_DEPLOY == 'on' &&
      !cancelled() && needs.build-swecov-image.result == 'success' &&
      needs.swecov-asset-guard.outputs.ok == 'true' &&
      needs.wait-ci.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-swecov
      cancel-in-progress: false
    # Whether this run shipped (passed the HEAD guard); `prune-registry-swecov` runs only then.
    outputs:
      deployed: ${{ steps.head.outputs.skip != 'true' }}
    steps:
      # As in `deploy`: the fly config, and the Dockerfile it names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /reg_webapp/fly.swecov.toml
            /reg_webapp/Dockerfile
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping SWECOV deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.head.outputs.skip != 'true'
        with:
          version: "0.5.0"
      - if: steps.head.outputs.skip != 'true'
        run: >-
          flyctl deploy
          --config reg_webapp/fly.swecov.toml
          --image registry.fly.io/reg-webapp-swecov:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
          --ha=false
          --wait-timeout 10m0s
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SWECOV }}

  # The SWECOV registry prune, as `prune-registry`.
  prune-registry-swecov:
    needs: deploy-swecov
    if: >-
      !cancelled() && needs.deploy-swecov.result == 'success' &&
      needs.deploy-swecov.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: fly-prune-swecov
      cancel-in-progress: false
    steps:
      - name: Prune old SWECOV registry tags
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SWECOV }}
          DEPLOYED_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
          FLY_APP: reg-webapp-swecov
        run: *prune-registry

  # Edge worker for the global catalog's hosted MCP on reg-meta.vqv.uk: `/mcp` only,
  # no SPA and no `/api` (reg_webapp/DESIGN.md → "Deployment"). Runs AFTER the global
  # origin deploy, so the worker never forwards to an origin that does not yet admit
  # the public host. `needs.deploy` being skipped (edge-only change → no image
  # rebuild) is fine; a FAILED image build/deploy blocks the edge ship.
  edge-deploy:
    needs: [changes, build-image, deploy, wait-ci, schema-guard]
    # A guard FAILURE also blocks the edge: build-image being skipped is tolerated
    # below, so a failed guard must not fall through.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.wait-ci.result == 'success' &&
      needs.schema-guard.result == 'success' &&
      needs.build-image.result != 'failure' && needs.deploy.result != 'failure' &&
      (needs.changes.outputs.edge_global == 'true' ||
      needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: edge-deploy-global
      cancel-in-progress: false
    steps:
      # The worker only: wrangler.jsonc and its `src/` (no imports from outside it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /reg_webapp/edge/
          sparse-checkout-cone-mode: false
          filter: blob:none
      # Bun runs the pinned Wrangler CLI for the MCP edge worker.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # Same stale-deploy guard as the origin job (see comment there).
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping edge deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # The worker's route lives in zone vqv.uk, which the token must list under its
      # Zone Resources; wrangler's own refusal names neither the zone nor the fix.
      - name: Check the Cloudflare token reaches zone vqv.uk
        if: steps.head.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          count=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=vqv.uk' | jq '.result | length')
          [ "$count" = 1 ] || { echo "::error::CLOUDFLARE_API_TOKEN cannot see zone vqv.uk: add vqv.uk to the token's Zone Resources" >&2; exit 1; }
      # wrangler reads CLOUDFLARE_API_TOKEN from the env; exact-pinned so no
      # wrangler release lands unreviewed.
      - if: steps.head.outputs.skip != 'true'
        run: >-
          bunx wrangler@4.152.0 deploy --config reg_webapp/edge/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aa45afed8a0f3c7162b0e0b3d4f31c2
      # Public-host MCP smoke: the hosted
      # endpoint answers JSON-RPC through the edge — `initialize`, `tools/list`
      # naming `search`, and one `search` call that is not a tool error. Fails
      # when the worker stops routing /mcp, the origin's allowed hosts drop the
      # public host, or the tool stops answering.
      - name: Public MCP smoke
        if: steps.head.outputs.skip != 'true'
        env:
          EDGE_HOST: reg-meta.vqv.uk
        run: &public-mcp-smoke |
          rpc() {
            curl -sfS "https://$EDGE_HOST/mcp" \
              -H 'accept: application/json, text/event-stream' \
              -H 'content-type: application/json' \
              -H 'mcp-protocol-version: 2025-11-25' \
              -d "{\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"$1\", \"params\": $2}"
          }
          rpc initialize '{"protocolVersion": "2025-11-25", "capabilities": {}, "clientInfo": {"name": "container-build", "version": "0"}}' \
            | jq -e '.result.serverInfo.name == "reg-meta"'
          rpc tools/list '{}' | jq -e '[.result.tools[].name] | index("search")'
          rpc tools/call '{"name": "search", "arguments": {"q": "inkomst", "limit": 1}}' \
            | jq -e '.result.isError == false'

  # Edge worker (SPA + /api and /mcp passthrough) for data.swecov.se. Runs AFTER the
  # SWECOV origin deploy (deploy-skew guard): on a contract-changing push the SPA
  # must not go live before the origin serves the new endpoints. Image-affecting
  # changes also run this job even when nothing edge-side changed: the deploy ships a
  # fresh DEPLOY_VERSION cache generation (#318), without which the edge would keep
  # serving pre-deploy /api/* payloads for up to the 24h TTL.
  edge-deploy-swecov:
    needs: [changes, build-swecov-image, deploy-swecov, wait-ci, schema-guard, swecov-asset-guard]
    if: >-
      vars.SWECOV_DEPLOY == 'on' &&
      !cancelled() && github.event_name != 'pull_request' &&
      needs.wait-ci.result == 'success' &&
      needs.schema-guard.result == 'success' &&
      needs.swecov-asset-guard.outputs.ok == 'true' &&
      needs.build-swecov-image.result == 'success' &&
      needs.deploy-swecov.result == 'success' &&
      (needs.changes.outputs.edge_swecov == 'true' ||
      needs.changes.outputs.image == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: edge-deploy-swecov
      cancel-in-progress: false
    steps:
      # The worker, the SPA (`reg_webapp/frontend/`) and what its build reads outside
      # it: the Rust workspace for `gen:wasm` (`Cargo.toml`, `Cargo.lock`, `.cargo/`,
      # `crates/`) and `crates/reg-meta/openapi.json` for `gen:types`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /.cargo/
            /crates/
            /reg_webapp/edge/
            /reg_webapp/frontend/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Skip unless HEAD of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::skipping SWECOV edge deploy: $GITHUB_SHA is not main HEAD ($main_sha)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.skip != 'true'
        with:
          node-version: "26.12.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.head.outputs.skip != 'true'
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.head.outputs.skip != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.head.outputs.skip != 'true'
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.head.outputs.skip != 'true'
        with:
          tool: wasm-bindgen@0.2.129
      - run: bun install --frozen-lockfile
        if: steps.head.outputs.skip != 'true'
        working-directory: reg_webapp/frontend
      - run: bun run gen:wasm && bun run gen:types && bun run build
        if: steps.head.outputs.skip != 'true'
        working-directory: reg_webapp/frontend
      # The worker's route lives in zone swecov.se, which the token must list under its
      # Zone Resources; wrangler's own refusal names neither the zone nor the fix.
      - name: Check the Cloudflare token reaches zone swecov.se
        if: steps.head.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          count=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=swecov.se' | jq '.result | length')
          [ "$count" = 1 ] || { echo "::error::CLOUDFLARE_API_TOKEN cannot see zone swecov.se: add swecov.se to the token's Zone Resources" >&2; exit 1; }
      - if: steps.head.outputs.skip != 'true'
        run: >-
          bunx wrangler@4.152.0 deploy --config reg_webapp/edge/wrangler.swecov.jsonc
          --var DEPLOY_VERSION:${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aa45afed8a0f3c7162b0e0b3d4f31c2
      # The SPA mounts only once reg-core's .wasm loads, so the deployed one must
      # answer 200 as application/wasm (WebAssembly.instantiateStreaming refuses
      # any other type).
      # Both probes wait for the new worker version (#1491): `wrangler deploy`
      # returns before every PoP serves it, so the first request can reach the
      # previous version. The worker exposes no version header, so each probe
      # retries on its own signal of the new version (the .wasm hashed for this
      # build; a young cache entry under this DEPLOY_VERSION) for a bounded
      # window, then fails naming what it expected and what it last saw.
      - name: SWECOV edge .wasm probe
        if: steps.head.outputs.skip != 'true'
        working-directory: reg_webapp/frontend
        env:
          EDGE_HOST: data.swecov.se
        run: |
          window=180 interval=10
          wasm=$(cd dist && ls assets/*.wasm)
          deadline=$((SECONDS + window))
          # Before the new assets reach a PoP, the hashed path answers the worker's
          # no-store 404: retry anything but 200 application/wasm.
          while :; do
            read -r code type < <(curl -m 15 -so /dev/null -w '%{http_code} %{content_type}\n' "https://$EDGE_HOST/$wasm")
            echo "$wasm: $code $type"
            [ "$code" = 200 ] && [ "$type" = application/wasm ] && break
            [ "$SECONDS" -lt "$deadline" ] || { echo "FATAL: expected this build's $wasm as 200 application/wasm within ${window}s, last saw $code $type" >&2; exit 1; }
            sleep "$interval"
          done
      # Standing #220 regression probe: the /api/* Cache Rule and the ETag
      # contract are zone-dashboard state (click-ops, no IaC) — assert after
      # every edge deploy that a search read still caches (MISS/HIT family,
      # not DYNAMIC) and revalidates with an edge 304. Catches silent Cache
      # Rule deletion / zone drift that nothing else in CI would notice.
      # Also asserts the HIT is YOUNG (#318): this deploy started a new cache
      # generation, so any reachable entry must have been populated after it —
      # an old Age means DEPLOY_VERSION stopped reaching the cache key and the
      # stale-24h window is back.
      - name: SWECOV edge cache probe (#220 + #318)
        if: steps.head.outputs.skip != 'true'
        env:
          EDGE_HOST: data.swecov.se
          DEPLOY_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, github.run_id) || github.sha }}
        run: |
          window=180 interval=10
          url="https://$EDGE_HOST/api/search?q=inkomst"
          deadline=$((SECONDS + window))
          # One request per attempt, so status and Age come from the same isolate.
          # A MISS (the new cache key's first read warms it) or an old HIT (a PoP
          # still on the previous worker version) retries until the window ends.
          while :; do
            IFS='|' read -r code status age < <(curl -m 15 -so /dev/null -w '%{http_code}|%header{cf-cache-status}|%header{age}\n' "$url")
            echo "$code cf-cache-status: $status, age: ${age:-0}s"
            [ "$status" = HIT ] && [ "${age:-0}" -le 600 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              [ "$status" = HIT ] || { echo "FATAL: /api/* not edge-cached within ${window}s, last saw $code $status (Cache Rule missing?)" >&2; exit 1; }
              echo "FATAL: expected a young HIT under DEPLOY_VERSION $DEPLOY_VERSION within ${window}s, last saw a HIT ${age}s old — the new worker version is not served everywhere, or #318 DEPLOY_VERSION cache-key versioning is broken" >&2
              exit 1
            fi
            sleep "$interval"
          done
          etag=$(curl -m 15 -sfo /dev/null -w '%header{etag}' "$url")
          code=$(curl -m 15 -so /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$url")
          echo "If-None-Match -> $code"
          [ "$code" = "304" ] || { echo "FATAL: edge 304 revalidation broken" >&2; exit 1; }
      # The SWECOV catalog's hosted MCP endpoint (crates/DESIGN.md, "Hosted MCP"),
      # the same smoke as the global one.
      - name: SWECOV public MCP smoke
        if: steps.head.outputs.skip != 'true'
        env:
          EDGE_HOST: data.swecov.se
        run: *public-mcp-smoke
