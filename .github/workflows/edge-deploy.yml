# Cloudflare edge-worker deploy for catalog.swecov.se (REFACTOR_SPEC.md §6.5;
# topology in reg_webapp/DESIGN.md → "Deployment").
#
# Rebuilds the SPA and deploys reg_webapp/edge/ (Workers static assets + /api
# passthrough) on main pushes that can change the deployed bundle: the SPA
# source, the edge worker itself, or the committed API contract the SPA types
# are codegen'd from. PR-side build/type/test coverage already lives in ci.yml
# (reg-webapp-frontend job) — this workflow only ships, it doesn't re-gate.
#
# Auth: CLOUDFLARE_API_TOKEN repo secret ("Edit Cloudflare Workers" template,
# scoped to the account + the swecov.se zone for the route). The account id is
# not a secret; it's pinned here so a multi-account token can't ambiguate.

name: Edge deploy

on:
  push:
    branches: [main]
    paths:
      - "reg_webapp/frontend/**"
      - "reg_webapp/edge/**"
      - "reg_webapp/backend/openapi.json"
      - ".github/workflows/edge-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One edge deploy at a time; queue rather than cancel mid-upload.
    concurrency:
      group: edge-deploy-global
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: reg_webapp/frontend
      # Same build sequence as the Dockerfile's frontend stage: regenerate
      # types from the committed contract (no-op on a clean tree), then build.
      - run: bun run gen:types && bun run build
        working-directory: reg_webapp/frontend
      # wrangler reads CLOUDFLARE_API_TOKEN from the env; major-pinned so a
      # breaking wrangler v5 can't land unreviewed.
      - run: bunx wrangler@4 deploy --config reg_webapp/edge/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aa45afed8a0f3c7162b0e0b3d4f31c2
