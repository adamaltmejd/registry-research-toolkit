name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/;
      # pre-commit's `cargo fmt` hook needs rustfmt.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Backstop: run the pre-commit-stage hooks that an agent could have
      # bypassed locally with `--no-verify`. Covers panache + ty + ruff. There
      # is no local pytest hook; the per-suite `test` matrix below is the test
      # gate.
      - run: uvx --from pre-commit==4.6.2 pre-commit run --all-files
      # Type check via ty (Astral, beta). Pinned via uvx so CI, pre-commit,
      # and cached Codex environments resolve the same checker without making
      # ty a workspace dev dependency. ty moves quickly, so bump this pin
      # deliberately/frequently. Baseline triage landed (tests and scripts
      # excluded in pyproject.toml); the check is now blocking.
      - run: uvx --from ty==0.0.79 ty check

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # The crates/ CI budget (ARCHITECTURE.md "Tiers"). The job also builds the
    # workspace and runs the gate's `rust` and `release` steps. Measured on #1249
    # (2026-10-08): 1 min 23 s warm. A Cargo.lock change adds about 1 min of
    # dependency compiles (#1231: 71 s warm, 2 min 10 s after one), so expect
    # about 2 min 40 s of the 3 min then. A fully cold cache is unmeasured.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      # A prebuilt binary for `crates`' unused-dependency check; never compiled here.
      - uses: taiki-e/install-action@v2.87.26
        with:
          tool: cargo-machete@0.9.2
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      - run: uv sync --frozen
      # `crates`: cargo fmt, clippy, test and machete. `rust`: the workspace build, then the
      # whole conformance suite against `reg-meta serve` and `reg-meta mcp`, out of
      # process (RUST_RUNTIME_SPEC.md section 10). `release`: the release-admission
      # run on the synthetic steward artifact. Commands: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py crates rust release

  # Exit-code and message tests for the repo's Claude Code hooks
  # (.claude/hooks/tests). Plain bash, python3 and git, all preinstalled on the
  # runner; the bootstrap test stubs uv and bun, so no `uv sync`. Budget:
  # ARCHITECTURE.md "Tiers".
  hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
      # Run every script so one failure does not hide another, then fail if any did.
      - name: Run hook tests
        run: |
          status=0
          for t in .claude/hooks/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # One leg per root `testpaths` entry (pyproject.toml); keep the two lists in
  # step. `budget` is the suite's CI-job budget in ARCHITECTURE.md "Tiers",
  # setup included: a leg over it is a test-audit finding, not a reason to
  # raise the number.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.budget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reg_meta_build
            budget: 6
            # Hypothesis's full example count (reg_meta_build/tests/conftest.py).
            hypothesis_profile: thorough
          # The suite without `--server-cmd`; the `rust` job reruns the whole
          # suite against the Rust server.
          - suite: conformance
            budget: 4
          - suite: scripts/tests
            budget: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      - run: uv run python -m pytest "${{ matrix.suite }}"
        env:
          HYPOTHESIS_PROFILE: ${{ matrix.hypothesis_profile }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            webapp:
              - 'reg_webapp/frontend/**'
              - 'crates/reg-meta/openapi.json'
              # Oracles the frontend unit tests read: the fold corpus
              # (catalog.fold.test.ts) and reg-core's project schema version and
              # structural corpus (project_data.test.ts, validation.test.ts).
              - 'conformance/cases/folds/**'
              - 'crates/reg-core/src/project.rs'
              - 'crates/reg-core/tests/project/corpus/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.py'

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    # The frontend CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      # The frontend bins (biome, svelte-check, vitest, vite, openapi-typescript)
      # are `#!/usr/bin/env node` launchers, so bun does not decide the runtime
      # they get: without this step the gates run on whatever node the runner
      # happens to ship, and stop exercising the one production builds use.
      # Pinned to reg_webapp/Dockerfile's version — bump both together.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.8.1"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # The `browser` Vitest project (vitest-browser-svelte) renders `.svelte`
      # components in a real headless Chromium via Playwright. Cache the browser
      # binary (keyed on the lockfile, so it re-downloads only when deps change)
      # so the ~90 MB download is a one-time cost, not per-run.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('reg_webapp/frontend/bun.lock') }}
      # Cache miss → download the browser + its OS libs. Cache hit → the binary is
      # restored, but the apt-level libs are NOT cached, so still install those.
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # The gate script runs from the repository root on a uv-managed Python; it
      # needs no workspace sync. `frontend`: check, lint, test (`vitest run`: the
      # jsdom `unit` and Chromium `browser` projects), build, and the codegen drift
      # check: TS types are codegen'd from the committed Rust `openapi.json`
      # snapshot, so regenerating must leave them unchanged.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      - run: uv run --no-project scripts/gate.py frontend
        working-directory: .
