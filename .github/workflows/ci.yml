name: CI

on:
  # rebuild-c: milestone C's integration branch; its stacked
  # PRs need CI until it merges into main.
  push:
    branches: [main, rebuild-c]
  pull_request:
    branches: [main, rebuild-c]
  workflow_call:
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: uv sync --frozen
      # ruff, panache and ty; commands and tool pins: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py lint

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # ARCHITECTURE.md "Tiers"; sized for a cold rust-cache plus its save (#1410).
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      # A prebuilt binary for `crates`' unused-dependency check; never compiled here.
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-machete@0.9.2
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      # `crates`: cargo fmt, clippy, test and machete. `rust`: the workspace build, then the
      # whole conformance suite against `reg-meta serve` and `reg-meta mcp`, out of
      # process (its only run). `release`: the release-admission checks
      # on the synthetic steward artifact. Commands: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py crates rust release

  # One leg per root `testpaths` entry (pyproject.toml); keep the two lists in
  # step. `budget` is the suite's CI-job budget in ARCHITECTURE.md "Tiers",
  # setup included: a leg over it is a test-audit finding, not a reason to
  # raise the number.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.budget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reg_meta_build
            budget: 6
            # Hypothesis's full example count (reg_meta_build/tests/conftest.py).
            hypothesis_profile: thorough
          - suite: scripts/tests
            budget: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: uv sync --frozen
      - run: uv run python -m pytest "${{ matrix.suite }}" -n auto
        env:
          HYPOTHESIS_PROFILE: ${{ matrix.hypothesis_profile }}
