name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The curation locks are most of the ~1 GB tree and alone push checkout
      # toward each job's budget (the full-tree checkout took 36 s here, 9 s
      # without them). No job here reads them: Rust tests, the conformance run
      # and the suites below use fixture curation only (conformance/cases/fixtures),
      # never curation/; lint's tools read source, markdown and manifests, not
      # `.lock` files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: &no-locks |
            /*
            !curation/**/*.lock
          sparse-checkout-cone-mode: false
      # The prebuilt panache release binary at gate.sh's PANACHE_VERSION (the one pin; the
      # gate refuses any other), checked against that release's SHA256SUMS. Not
      # taiki-e/install-action: it does not know panache, and its cargo-binstall
      # fallback compiles from source (~3 min). shellcheck is preinstalled on the
      # runner. No Rust toolchain: lint compiles nothing.
      - name: Install panache
        run: |
          version=$(sed -n 's/^PANACHE_VERSION=//p' scripts/gate.sh)
          asset=panache-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/jolars/panache/releases/download/v$version
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "$base/$asset" -O "$base/SHA256SUMS"
          grep " $asset\$" SHA256SUMS | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$asset" -C "$HOME/.local/bin" ./panache
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # panache (markdown) and shellcheck; commands and tool pins: scripts/gate.sh.
      - run: bash scripts/gate.sh lint

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # ARCHITECTURE.md "Tiers"; sized for a cold rust-cache plus its save (#1410).
    # 9 min since 2026-11-04: cold builds with reg-export-gate run 6-7 min.
    timeout-minutes: 9
    steps:
      # Without the curation locks, as in `lint` (the pattern is defined there).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A prebuilt binary for `crates`' unused-dependency check; never compiled here.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete@0.9.2
      # `crates`: cargo fmt, clippy, test and machete. `rust`: the workspace build, then the
      # whole conformance suite against `reg-meta serve` and `reg-meta mcp`, out of
      # process, then the release checks on the synthetic artifact (`--test release`): the
      # one job that builds the binaries, so the builder leg below does not.
      # Commands: scripts/gate.sh.
      - run: bash scripts/gate.sh crates rust

  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Diff with git, not the GitHub API: the API refuses a PR diff as
          # large as a full relock ("this diff is taking too long to generate").
          token: ""
          filters: |
            webapp:
              - 'reg_webapp/frontend/**'
              - 'reg_webapp/dev/**'
              - 'crates/reg-meta/**'
              - 'crates/reg-catalog/**'
              - 'crates/reg-build/**'
              - 'conformance/cases/fixtures/**'
              # Oracles the frontend unit tests read: the fold corpus
              # and the server's unsupported-version case
              # (reg_core.test.ts); reg-core's structural corpus is under
              # crates/reg-core below. The grammar corpus pins the periods the
              # module parses.
              - 'conformance/cases/folds/**'
              - 'conformance/cases/api/validate-unsupported-schema-version/**'
              - 'conformance/cases/grammar/**'
              # The SPA's reg-core module (`bun run gen:wasm`).
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/reg-core/**'
              - 'crates/reg-core-wasm/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.sh'
              # `dev.sh --paired-fixture` (flows) builds the holdings pair with
              # reg-fixture from these sources.
              - 'crates/reg-conformance/**'
              - 'conformance/cases/holdings/**'

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    # The frontend CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      # The frontend bins (biome, vitest, vite, openapi-typescript)
      # are `#!/usr/bin/env node` launchers, so bun does not decide the runtime
      # they get: without this step the gates run on whatever node the runner
      # happens to ship, and stop exercising the one production builds use.
      # Same Node pin as edge-deploy-swecov (container-build.yml), which builds the SPA
      # that ships.
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # reg-core-wasm (`bun run gen:wasm`, which the gate runs): Rust for wasm32 and
      # the wasm-bindgen CLI at the `wasm-bindgen` version Cargo.lock pins (bump
      # both together; a mismatch fails the bindgen run).
      - &rust-wasm
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - &rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - &wasm-bindgen
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.129
      # The gate script runs from the repository root. `frontend`: gen:wasm and its size budget, check
      # (tsgo), lint, test (`vitest run`, jsdom), build, the codegen drift check (TS types are codegen'd from the
      # committed Rust `openapi.json` snapshot, so regenerating must leave them
      # unchanged). Browser checks run in the separate flows job.
      - run: bash scripts/gate.sh frontend
        working-directory: .

  reg-webapp-flows:
    runs-on: ubuntu-latest
    # The browser-flow CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      - *setup-node
      - *setup-bun
      - *rust-wasm
      - *rust-cache
      - *wasm-bindgen
      - run: bun install --frozen-lockfile
      # The build smoke (scripts/smoke_build.ts) loads the built app in a real
      # headless Chromium via Playwright. Cache the browser binary (keyed on the
      # lockfile, so it re-downloads only when deps change) so the ~90 MB download is a one-time cost, not per-run.
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('reg_webapp/frontend/bun.lock') }}
      # A no-op on a cache hit. No `--with-deps`/`install-deps`: the runner image
      # ships Chrome, so every shared library headless Chromium needs is already
      # there, and apt would only add fonts and xvfb the smoke never uses. That apt
      # fetch is what timed the job out when the Azure Ubuntu mirror slowed to
      # ~40 kB/s (Oct 2026). If the image ever drops a library, launch fails fast
      # naming it; restore `install-deps` then.
      - run: bunx playwright install chromium
      # Bootstrap plus shell/search against the source-built synthetic fixture.
      # Phone and desktop only (about 80 s saved); the design-review skill's
      # four-width review covers 768 px and the wide viewport.
      - run: bash scripts/gate.sh flows
        working-directory: .
        env:
          REG_WEBAPP_FLOW_VIEWPORTS: mobile,desktop
