name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/;
      # pre-commit's `cargo fmt` hook needs rustfmt.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Backstop: run the pre-commit-stage hooks that an agent could have
      # bypassed locally with `--no-verify`. Covers panache + ty + ruff. There
      # is no local pytest hook; the per-suite `test` matrix and
      # `package-integration` below are the test gate.
      - run: uvx --from pre-commit==4.6.2 pre-commit run --all-files
      # Type check via ty (Astral, beta). Pinned via uvx so CI, pre-commit,
      # and cached Codex environments resolve the same checker without making
      # ty a workspace dev dependency. ty moves quickly, so bump this pin
      # deliberately/frequently. Baseline triage landed (scripts/tests excluded,
      # structural.py validator-narrow noise suppressed via [tool.ty.overrides]
      # in pyproject.toml); the check is now blocking.
      - run: uvx --from ty==0.0.79 ty check

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # The crates/ CI budget (ARCHITECTURE.md "Tiers"). The job also builds
    # reg-meta and runs the Rust HTTP cases: 38-72 s warm, 98 s with dependencies
    # recompiled after a Cargo.lock change. A fully cold cache is unmeasured.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The Rust HTTP run (RUST_RUNTIME_SPEC.md section 10): the conformance cases of
      # the operations `reg-meta serve` implements and the MCP equivalence suite, out
      # of process.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      - run: uv sync --frozen
      - run: cargo build -p reg-meta --locked
      - run: >-
          uv run python -m pytest conformance -q -n auto
          -k '[api/admission or [api/context or [api/meta] or [api/cursor- or [api/invalid-parameters] or [api/scope-unavailable] or [api/search-paging] or [api/search-scope] or [api/search-group-hit] or [api/search-register or [api/search-period or [api/search-reference-paging] or test_mcp'
          --server-cmd='target/debug/reg-meta serve --db {db} --catalog {catalog} --stewards reg_webapp/stewards --port {port}'
          --mcp-cmd='target/debug/reg-meta mcp --db {db} --catalog {catalog}'

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      - run: bash scripts/check_versions.sh

  # One leg per root `testpaths` entry (pyproject.toml); keep the two lists in
  # step. `budget` is the suite's CI-job budget in ARCHITECTURE.md "Tiers",
  # setup included: a leg over it is a test-audit finding, not a reason to
  # raise the number.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.budget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reg_meta_build
            budget: 6
          # The full suite against the in-process Python adapters. The `rust`
          # job reruns the admission/context cases against the Rust server:
          # the same cases, a different implementation under test.
          - suite: conformance
            budget: 4
          - suite: reg_meta
            budget: 3
          - suite: reg_webapp/backend/tests
            budget: 3
          - suite: reg_schema
            budget: 2
          - suite: scripts/tests
            budget: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      - run: uv run python -m pytest "${{ matrix.suite }}" -m "not integration"

  package-integration:
    runs-on: ubuntu-latest
    # Successful runs take 33-111 s (median 47 s). The bound sits just above
    # the test's own 300 s image-build timeout, so a hung build fails with
    # pytest's located error instead of a bare runner cancellation.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: uv sync --frozen
      # The ubuntu-24.04 runner image ships Podman (4.9.3), so there is no
      # apt step: `apt-get update` only exposed the job to Ubuntu mirror
      # stalls, which hung it until the timeout on 2026-10-07. If an image
      # drops Podman, `podman: command not found` fails this step.
      - name: Check rootless Podman
        timeout-minutes: 2
        run: |
          podman --version
          podman info
      # Source coherence only: registry dependencies and release assets have
      # separate publication gates in publish_reg_meta.yml / integration.yml.
      - name: Verify workspace wheels install together with Podman
        run: |
          uv run python -m pytest reg_meta/tests/test_integration.py \
            --run-integration --install-mode workspace -m "not release"

  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            webapp:
              - 'reg_webapp/frontend/**'
              - 'reg_webapp/backend/openapi.json'
              - 'reg_webapp/backend/src/**'
              # Oracles the frontend unit tests read: the fold corpus
              # (catalog.fold.test.ts) and reg_schema's corpus + version
              # (validation.test.ts, project_data.test.ts).
              - 'conformance/cases/folds/**'
              - 'reg_schema/**'
              - '.github/workflows/ci.yml'

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    # The frontend CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      # The frontend bins (biome, svelte-check, vitest, vite, openapi-typescript)
      # are `#!/usr/bin/env node` launchers, so bun does not decide the runtime
      # they get: without this step the gates run on whatever node the runner
      # happens to ship, and stop exercising the one production builds use.
      # Pinned to reg_webapp/Dockerfile's version — bump both together.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.8.1"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      # The `browser` Vitest project (vitest-browser-svelte) renders `.svelte`
      # components in a real headless Chromium via Playwright. Cache the browser
      # binary (keyed on the lockfile, so it re-downloads only when deps change)
      # so the ~90 MB download is a one-time cost, not per-run.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('reg_webapp/frontend/bun.lock') }}
      # Cache miss → download the browser + its OS libs. Cache hit → the binary is
      # restored, but the apt-level libs are NOT cached, so still install those.
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # `bun run test` (= `vitest run`, NOT Bun's own `bun test`) runs BOTH the
      # jsdom `unit` project (`*.test.ts`) and the Chromium `browser` project
      # (`*.browser.test.ts`); the shared vite.config compiles `.svelte`/`.svelte.ts`.
      - run: bun run test
      - run: bun run build
      # TS types are codegen'd from ../backend/openapi.json and committed.
      # Regenerating must produce no diff — a dirty tree means the SPA's types
      # drifted from the API contract.
      - run: bun run gen:types
      - run: git diff --exit-code -- src/lib/api-types.ts
