name: CI

on:
  # rebuild-c: milestone C's integration branch; its stacked
  # PRs need CI until it merges into main.
  push:
    branches: [main, rebuild-c]
  pull_request:
    branches: [main, rebuild-c]
  workflow_call:
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --frozen
      # ruff, panache and ty; commands and tool pins: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py lint

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # ARCHITECTURE.md "Tiers"; sized for a cold rust-cache plus its save (#1410).
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A prebuilt binary for `crates`' unused-dependency check; never compiled here.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-machete@0.9.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      # `crates`: cargo fmt, clippy, test and machete. `rust`: the workspace build, then the
      # whole conformance suite against `reg-meta serve` and `reg-meta mcp`, out of
      # process (its only run). `release`: the release-admission checks
      # on the synthetic steward artifact. Commands: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py crates rust release

  # One leg per root `testpaths` entry (pyproject.toml); keep the two lists in
  # step. `budget` is the suite's CI-job budget in ARCHITECTURE.md "Tiers",
  # setup included: a leg over it is a test-audit finding, not a reason to
  # raise the number.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.budget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reg_meta_build
            budget: 6
            # Hypothesis's full example count (reg_meta_build/tests/conftest.py).
            hypothesis_profile: thorough
          - suite: scripts/tests
            budget: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --frozen
      - run: uv run python -m pytest "${{ matrix.suite }}" -n auto
        env:
          HYPOTHESIS_PROFILE: ${{ matrix.hypothesis_profile }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            webapp:
              - 'reg_webapp/frontend/**'
              - 'crates/reg-meta/openapi.json'
              # Oracles the frontend unit tests read: the fold corpus
              # and the server's unsupported-version case
              # (reg_core.test.ts); reg-core's structural corpus is under
              # crates/reg-core below. The grammar corpus pins the periods the
              # module parses.
              - 'conformance/cases/folds/**'
              - 'conformance/cases/api/validate-unsupported-schema-version/**'
              - 'conformance/cases/grammar/**'
              # The SPA's reg-core module (`bun run gen:wasm`).
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/reg-core/**'
              - 'crates/reg-core-wasm/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.py'

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    # The frontend CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The frontend bins (biome, vitest, vite, openapi-typescript)
      # are `#!/usr/bin/env node` launchers, so bun does not decide the runtime
      # they get: without this step the gates run on whatever node the runner
      # happens to ship, and stop exercising the one production builds use.
      # Pinned to reg_webapp/Dockerfile's version — bump both together.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # reg-core-wasm (`bun run gen:wasm`, which the gate runs): Rust for wasm32 and
      # the wasm-bindgen CLI at the `wasm-bindgen` version Cargo.lock pins (bump
      # both together with container-build.yml's edge-deploy-swecov job; a mismatch fails the
      # bindgen run).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen@0.2.129
      - run: bun install --frozen-lockfile
      # The build smoke (scripts/smoke_build.ts) loads the built app in a real
      # headless Chromium via Playwright. Cache the browser binary (keyed on the
      # lockfile, so it re-downloads only when deps change) so the ~90 MB download is a one-time cost, not per-run.
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('reg_webapp/frontend/bun.lock') }}
      # A no-op on a cache hit. No `--with-deps`/`install-deps`: the runner image
      # ships Chrome, so every shared library headless Chromium needs is already
      # there, and apt would only add fonts and xvfb the smoke never uses. That apt
      # fetch is what timed the job out when the Azure Ubuntu mirror slowed to
      # ~40 kB/s (Oct 2026). If the image ever drops a library, launch fails fast
      # naming it; restore `install-deps` then.
      - run: bunx playwright install chromium
      # The gate script runs from the repository root on a uv-managed Python; it
      # needs no workspace sync. `frontend`: gen:wasm and its size budget, check
      # (tsgo), lint, test (`vitest run`, jsdom), build, the codegen drift check (TS types are codegen'd from the
      # committed Rust `openapi.json` snapshot, so regenerating must leave them
      # unchanged) and the built app's bootstrap smoke.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv run --no-project scripts/gate.py frontend
        working-directory: .
