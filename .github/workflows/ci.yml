name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Backstop: run the pre-commit suite that an agent could have bypassed
      # locally with `--no-verify`. Covers panache + ty + ruff hooks.
      # SKIP=pytest avoids duplicating the test job below.
      - run: uvx pre-commit run --all-files
        env:
          SKIP: pytest
      # Type check via ty (Astral, beta). Pinned via uvx so it tracks latest
      # without needing lockfile bumps. Baseline triage landed (scripts/tests
      # excluded, structural.py validator-narrow noise suppressed via
      # [tool.ty.overrides] in pyproject.toml); the check is now blocking.
      - run: uvx ty check

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: bash scripts/check_versions.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: uv run python -m pytest -m "not integration"

  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'mock_data_wizard/web/**'
              - 'mock_data_wizard/src/mock_data_wizard/static/**'
              - '.github/workflows/ci.yml'
            webapp:
              - 'reg_webapp/frontend/**'
              - 'reg_webapp/backend/openapi.json'
              - 'reg_webapp/backend/src/**'
              - '.github/workflows/ci.yml'

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: mock_data_wizard/web
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      # Catches "edited the frontend without rebuilding the bundle"
      # — the static dir ships in the wheel, so it must match source.
      - name: Assert built bundle matches commit
        run: git diff --exit-code -- ../src/mock_data_wizard/static/

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      # The `browser` Vitest project (vitest-browser-svelte) renders `.svelte`
      # components in a real headless Chromium via Playwright. Cache the browser
      # binary (keyed on the lockfile, so it re-downloads only when deps change)
      # so the ~90 MB download is a one-time cost, not per-run.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('reg_webapp/frontend/bun.lock') }}
      # Cache miss → download the browser + its OS libs. Cache hit → the binary is
      # restored, but the apt-level libs are NOT cached, so still install those.
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # `bun run test` (= `vitest run`, NOT Bun's own `bun test`) runs BOTH the
      # jsdom `unit` project (`*.test.ts`) and the Chromium `browser` project
      # (`*.browser.test.ts`); the shared vite.config compiles `.svelte`/`.svelte.ts`.
      - run: bun run test
      - run: bun run build
      # TS types are codegen'd from ../backend/openapi.json and committed.
      # Regenerating must produce no diff — a dirty tree means the SPA's types
      # drifted from the API contract.
      - run: bun run gen:types
      - run: git diff --exit-code -- src/lib/api-types.ts
