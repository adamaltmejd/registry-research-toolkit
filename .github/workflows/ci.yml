name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - uses: oven-sh/setup-bun@v2
      - run: bunx markdownlint-cli2
      # Backstop: run the pre-commit suite that an agent could have bypassed
      # locally with `--no-verify`. SKIP=pytest avoids duplicating the test
      # job below.
      - run: uvx pre-commit run --all-files
        env:
          SKIP: pytest
      # Advisory type check via ty (Astral, beta). Pinned via uvx so it tracks
      # latest without needing lockfile bumps; non-blocking while the baseline
      # of JSON-boundary noise is being triaged.
      - run: uvx ty check
        continue-on-error: true

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: bash scripts/check_versions.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - run: uv run python -m pytest -m "not integration"

  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'mock_data_wizard/web/**'
              - 'mock_data_wizard/src/mock_data_wizard/static/**'
              - '.github/workflows/ci.yml'

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: mock_data_wizard/web
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      # Catches "edited the frontend without rebuilding the bundle"
      # — the static dir ships in the wheel, so it must match source.
      - name: Assert built bundle matches commit
        run: git diff --exit-code -- ../src/mock_data_wizard/static/
