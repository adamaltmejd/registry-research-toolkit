name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The curation locks are most of the ~1 GB tree and alone push checkout
      # toward each job's budget (the full-tree checkout took 36 s here, 9 s
      # without them). No job here reads them: Rust tests, the conformance run
      # and the suites below use fixture curation only (conformance/cases/fixtures),
      # never curation/; lint's shellcheck reads shell scripts, not `.lock` files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: &no-locks |
            /*
            !curation/**/*.lock
          sparse-checkout-cone-mode: false
      # shellcheck, preinstalled on the runner; the command: scripts/gate.sh. No Rust
      # toolchain: lint compiles nothing.
      - run: bash scripts/gate.sh lint

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # ARCHITECTURE.md "Tiers"; sized for a cold rust-cache plus its save (#1410).
    # 9 min since 2026-11-04: cold builds with reg-export-gate run 6-7 min.
    timeout-minutes: 9
    steps:
      # Without the curation locks, as in `lint` (the pattern is defined there).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A prebuilt binary for `crates`' unused-dependency check; never compiled here.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      # `crates`: cargo fmt, clippy, test and machete. `rust`: the workspace build, then the
      # whole conformance suite against `reg-meta serve` and `reg-meta mcp`, out of
      # process, then the release checks on the synthetic artifact (`--test release`): the
      # one job that builds the binaries.
      # Commands: scripts/gate.sh.
      - run: bash scripts/gate.sh crates rust

  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Diff with git, not the GitHub API: the API refuses a PR diff as
          # large as a full relock ("this diff is taking too long to generate").
          token: ""
          filters: |
            webapp:
              - 'reg_webapp/frontend/**'
              - 'reg_webapp/dev/**'
              - 'crates/reg-meta/**'
              - 'crates/reg-catalog/**'
              - 'crates/reg-build/**'
              - 'conformance/cases/fixtures/**'
              # Oracles the frontend unit tests read: the fold corpus
              # and the server's unsupported-version case
              # (reg_core.test.ts); reg-core's structural corpus is under
              # crates/reg-core below. The grammar corpus pins the periods the
              # module parses.
              - 'conformance/cases/folds/**'
              - 'conformance/cases/api/validate-unsupported-schema-version/**'
              - 'conformance/cases/grammar/**'
              # The SPA's reg-core module (`bun run gen:wasm`).
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/reg-core/**'
              - 'crates/reg-core-wasm/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.sh'
              # `dev.sh --paired-fixture` (flows) builds the holdings pair with
              # reg-fixture from these sources.
              - 'crates/reg-conformance/**'
              - 'conformance/cases/holdings/**'

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    # The frontend CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      # The frontend bins (biome, vitest, vite, openapi-typescript)
      # are `#!/usr/bin/env node` launchers, so bun does not decide the runtime
      # they get: without this step the gates run on whatever node the runner
      # happens to ship, and stop exercising the one production builds use.
      # Same Node pin as publish_reg_meta.yml's `binaries` job, which builds the SPA
      # bundle that ships.
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # reg-core-wasm (`bun run gen:wasm`, which the gate runs): Rust for wasm32 and
      # the wasm-bindgen CLI at the `wasm-bindgen` version Cargo.lock pins (bump
      # both together; a mismatch fails the bindgen run).
      - &rust-wasm
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - &rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - &wasm-bindgen
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.130
      # The gate script runs from the repository root. `frontend`: gen:wasm and its size budget, check
      # (tsgo), lint, test (`vitest run`, jsdom), build, the codegen drift check (TS types are codegen'd from the
      # committed Rust `openapi.json` snapshot, so regenerating must leave them
      # unchanged). Browser checks run in the separate flows job.
      - run: bash scripts/gate.sh frontend
        working-directory: .

  reg-webapp-flows:
    runs-on: ubuntu-latest
    # The browser-flow CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: *no-locks
          sparse-checkout-cone-mode: false
      - *setup-node
      - *setup-bun
      - *rust-wasm
      - *rust-cache
      - *wasm-bindgen
      - run: bun install --frozen-lockfile
      # The build smoke and the user journeys (ARCHITECTURE.md "Tiers") drive the
      # runner image's preinstalled Google Chrome with agent-browser, whose npm package
      # ships its native binaries: no browser download or apt step.
      - run: bash scripts/gate.sh flows
        working-directory: .
