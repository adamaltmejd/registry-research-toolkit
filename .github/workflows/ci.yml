name: CI

on:
  # react-port: the React port's integration branch; its stacked
  # PRs need CI until it merges into main.
  push:
    branches: [main, react-port]
  pull_request:
    branches: [main, react-port]
  workflow_call:
  # Manual re-fire (#326): GitHub occasionally drops a push event (hit on the
  # #317 rollout — container-build.yml got the event, ci.yml didn't), and the
  # deploy gate (wait-ci in container-build.yml) hard-requires a green ci.yml
  # run on main HEAD. `gh workflow run ci.yml --ref main` unbricks the gate
  # without an empty commit; wait-ci matches runs by SHA regardless of trigger.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: uv sync --frozen
      # ruff, panache and ty; commands and tool pins: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py lint

  # The Rust workspace (root Cargo.toml, crates/). Latest stable toolchain, no pin:
  # the workspace has no minimum-version policy.
  rust:
    runs-on: ubuntu-latest
    # ARCHITECTURE.md "Tiers"; sized for a cold rust-cache plus its save (#1410).
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      # A prebuilt binary for `crates`' unused-dependency check; never compiled here.
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-machete@0.9.2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      # `crates`: cargo fmt, clippy, test and machete. `rust`: the workspace build, then the
      # whole conformance suite against `reg-meta serve` and `reg-meta mcp`, out of
      # process (its only run). `release`: the release-admission checks
      # on the synthetic steward artifact. Commands: scripts/gate.py.
      - run: uv run --no-project scripts/gate.py crates rust release

  # One leg per root `testpaths` entry (pyproject.toml); keep the two lists in
  # step. `budget` is the suite's CI-job budget in ARCHITECTURE.md "Tiers",
  # setup included: a leg over it is a test-audit finding, not a reason to
  # raise the number.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.budget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reg_meta_build
            budget: 6
            # Hypothesis's full example count (reg_meta_build/tests/conftest.py).
            hypothesis_profile: thorough
          - suite: scripts/tests
            budget: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      # `uv sync` builds the reg-core-py extension (maturin) from crates/.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: uv sync --frozen
      - run: uv run python -m pytest "${{ matrix.suite }}" -n auto
        env:
          HYPOTHESIS_PROFILE: ${{ matrix.hypothesis_profile }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
      runner: ${{ steps.filter.outputs.runner }}
      export_gate: ${{ steps.filter.outputs.export_gate }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            webapp:
              - 'reg_webapp/frontend/**'
              - 'crates/reg-meta/openapi.json'
              # Oracles the frontend unit tests read: the fold corpus
              # and the server's unsupported-version case
              # (reg_core.test.ts); reg-core's structural corpus is under
              # crates/reg-core below. The grammar corpus pins the periods the
              # module parses.
              - 'conformance/cases/folds/**'
              - 'conformance/cases/api/validate-unsupported-schema-version/**'
              - 'conformance/cases/grammar/**'
              # The SPA's reg-core module (`bun run gen:wasm`).
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/reg-core/**'
              - 'crates/reg-core-wasm/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.py'
            runner:
              - 'reg_mona_runner/**'
              # The order goldens the runner's extract cases read.
              - 'conformance/cases/order/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.py'
            export_gate:
              - 'reg_export_gate/**'
              - '.github/workflows/ci.yml'
              - 'scripts/gate.py'

  # The MONA extract runner (reg_mona_runner/): `gate.py runner` (air, jarl, the
  # testthat suite), its SQL Server cases against a service container. MONA runs
  # SQL Server, and the production T-SQL runs nowhere else.
  runner:
    runs-on: ubuntu-latest
    # The runner CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # A throwaway container's password, not a secret.
          MSSQL_SA_PASSWORD: Runner-fixture-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Runner-fixture-1 -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SWECOV_TEST_CONNECTION: "Driver={ODBC Driver 18 for SQL Server};Server=localhost,1433;UID=sa;PWD=Runner-fixture-1;TrustServerCertificate=yes;"
    steps:
      - uses: actions/checkout@v7.0.1
      # R with binary DBI, odbc, jsonlite and testthat from Posit's package manager
      # (Ubuntu's archive has no r-cran-odbc), and Microsoft's ODBC driver unless the
      # image ships it.
      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2.14.0
        with:
          packages: |
            any::DBI
            any::odbc
            any::jsonlite
            any::testthat
      - run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
      # air and jarl at scripts/gate.py's AIR and JARL pins (bump all three).
      - run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/posit-dev/air/releases/download/0.12.0/air-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin" --strip-components=1
          curl -fsSL https://github.com/etiennebacher/jarl/releases/download/0.7.1/jarl-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin" --strip-components=1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - run: uv run --no-project scripts/gate.py runner

  # The export gate's MONA check (reg_export_gate/): `gate.py export_gate` (air, jarl,
  # the case corpus). arrow is a binary from Posit's package manager, as on MONA,
  # where arrow is preinstalled.
  export-gate:
    runs-on: ubuntu-latest
    # The export gate CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.export_gate == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2.14.0
        with:
          packages: |
            any::arrow
            any::jsonlite
            any::testthat
      # air and jarl at scripts/gate.py's AIR and JARL pins (bump all three).
      - run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/posit-dev/air/releases/download/0.12.0/air-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin" --strip-components=1
          curl -fsSL https://github.com/etiennebacher/jarl/releases/download/0.7.1/jarl-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin" --strip-components=1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - run: uv run --no-project scripts/gate.py export_gate

  reg-webapp-frontend:
    runs-on: ubuntu-latest
    # The frontend CI budget (ARCHITECTURE.md "Tiers").
    timeout-minutes: 6
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    defaults:
      run:
        working-directory: reg_webapp/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      # The frontend bins (biome, vitest, vite, openapi-typescript)
      # are `#!/usr/bin/env node` launchers, so bun does not decide the runtime
      # they get: without this step the gates run on whatever node the runner
      # happens to ship, and stop exercising the one production builds use.
      # Pinned to reg_webapp/Dockerfile's version — bump both together.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      # reg-core-wasm (`bun run gen:wasm`, which the gate runs): Rust for wasm32 and
      # the wasm-bindgen CLI at the `wasm-bindgen` version Cargo.lock pins (bump
      # both together with container-build.yml's edge-deploy-swecov job; a mismatch fails the
      # bindgen run).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-bindgen@0.2.129
      - run: bun install --frozen-lockfile
      # The build smoke (scripts/smoke_build.ts) loads the built app in a real
      # headless Chromium via Playwright. Cache the browser binary (keyed on the
      # lockfile, so it re-downloads only when deps change) so the ~90 MB download is a one-time cost, not per-run.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('reg_webapp/frontend/bun.lock') }}
      # Cache miss → download the browser + its OS libs. Cache hit → the binary is
      # restored, but the apt-level libs are NOT cached, so still install those.
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # The gate script runs from the repository root on a uv-managed Python; it
      # needs no workspace sync. `frontend`: gen:wasm and its size budget, check
      # (tsgo), lint, test (`vitest run`, jsdom), build, the codegen drift check (TS types are codegen'd from the
      # committed Rust `openapi.json` snapshot, so regenerating must leave them
      # unchanged) and the built app's bootstrap smoke.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      - run: uv run --no-project scripts/gate.py frontend
        working-directory: .
