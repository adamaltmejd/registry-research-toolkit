[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-monabundle"
version = "0.2.0"
description = "MONA bundle builder, bundle runtime, PII scanner, and type compatibility map"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# The lightweight surface (validate_block, and — once moved — build / scan /
# types) is pure-stdlib so it amalgamates cleanly into the MONA bundle.
# Bundle-runtime extras (duckdb, pyodbc) live behind `[runtime]` and only
# matter on MONA, where WinPython preinstalls them.
dependencies = ["reg-schema"]

[project.optional-dependencies]
# Reserved for §15 step 5 phase 2 — bundle-runtime deps that the MONA
# WinPython env preinstalls. The webapp pins reg-monabundle without
# extras; researchers running the bundle locally never need this group
# either (MONA brings its own).
runtime = []

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_monabundle"]
