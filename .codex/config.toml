# Keep normal commands inside a workspace-write sandbox. Project rules preserve prompt
# boundaries for shell tools whose trailing options can launch host helpers; safe
# browser operations are approved per MCP tool schema.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# chrome-devtools-mcp launches an isolated, headless browser for this project's render
# and performance checks. Safe navigation, inspection, and interaction tools skip
# confirmation; filesystem-capable tools retain it.
[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@1.6.0",
  "--headless=true",
  "--isolated=true",
  "--blocked-url-pattern=file://*",
  "--no-usage-statistics",
  "--no-performance-crux",
]
default_tools_approval_mode = "prompt"

# Safe within the isolated, unsigned browser profile.
[mcp_servers.chrome-devtools.tools.list_pages]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.select_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.close_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.new_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.navigate_page]
approval_mode = "approve"

