[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regmeta_build"
version = "0.1.0"
description = "Builder for the regmeta SQLite databases (main + docs)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "regmeta>=0.11.1",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[project.scripts]
regmeta-build = "regmeta_build.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regmeta_build"]

# Curated TOMLs (fqid_slugs/, classifications.toml) and source CSVs
# (input_data/) live in this package directory as maintainer-edited assets.
# They are NOT bundled into the wheel — end users consume the prebuilt
# regmeta.db downloaded via `regmeta update`.
