[project]
name = "registry-research-toolkit"
version = "0.4.0"
description = "Workspace coordinator for reg_meta_build"
requires-python = ">=3.15"
dependencies = [
  "reg-meta-build",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "hypothesis>=6.170.13",
  "jsonschema>=4.26.0",
  "maturin>=1.15.0",
  "pytest>=9.2.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["conformance"]
# Not `conformance`: it needs the Rust server (`--server-cmd`), so `scripts/gate.py
# rust` runs it.
testpaths = [
  "reg_meta_build",
  "scripts/tests",
]
markers = [
  "release: conformance cases run against a real artifact selected with --run-release --artifact-dir",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# Trimmed pydevtools recommendation: dropped TD (TODO diligence — conflicts
# with the keep-comments memory). FA stays because TC moves type-only imports
# into TYPE_CHECKING blocks and only works without breaking runtime annotations
# when `from __future__ import annotations` is in effect (already adopted in
# 89/98 .py files in this workspace).
# Ruff 0.16's expanded defaults (413 rules) adopted; these groups extend them
# where not already included.
extend-select = [
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "FA",   # from __future__ import annotations
  "ISC",  # implicit string concat
  "ICN",  # import conventions
  "RET",  # return values
  "SIM",  # simplifications
  "TID",  # tidy imports
  "TC",   # type-checking imports
  "PTH",  # pathlib
  "FURB", # refurb
]
# ISC004 (new in ruff 0.16's ISC group) flags the deliberate wrapped-long-string
# pattern used throughout (56 sites); parenthesizing them is churn with no
# missing-comma signal here. Revisit with the default-rules adoption follow-up.
ignore = ["ISC004"]

[tool.ruff.lint.isort]
# Merge `from X import a` + `from X import b as c` into one block. Default
# isort treats aliased imports as a separate group, which splits `from .fqid
# import (...)` blocks awkwardly when one member is aliased.
combine-as-imports = true

[tool.ty.src]
# Tests use sibling-module sys.path injection and JSON-shaped fixtures that
# defeat ty's narrowing. The three excluded scripts lazily import one-off deps
# that aren't in any workspace pyproject.toml (xlrd, certifi, pymupdf4llm). None
# of these categories are part of the shipped library surface, so exclude from
# the type baseline.
exclude = [
  "**/tests/**",
  "scripts/extract_lkf.py",
  "scripts/fetch_sos_classifications.py",
  "scripts/parse_lisa_docs.py",
  "conformance/**",
]

[tool.uv]
package = false
# Explicit `false`, not omitted: an absent key inherits a global
# ~/.config/uv/uv.toml `exclude-newer`, which makes plain `uv run` discard the
# committed lock and re-resolve to older versions than the ones locked here.
exclude-newer = false

[tool.uv.sources]
reg-meta-build = { workspace = true }

[tool.uv.workspace]
members = [
  "crates/reg-core-py",
  "reg_meta_build",
]
