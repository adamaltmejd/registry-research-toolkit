[project]
name = "registry-research-toolkit"
version = "0.4.0"
description = "Workspace coordinator for reg_meta, reg_meta_build, and reg_schema"
requires-python = ">=3.14"
dependencies = [
  "reg-meta",
  "reg-meta-build",
  "reg-schema",
  "reg-webapp",
]

[dependency-groups]
dev = [
  "duckdb>=1.5.2",
  # Locked so the yard gates' offline `uv sync --no-build-isolation` can build
  # the editable workspace members without dynamic build-backend resolution
  # (uv's offline resolver refuses registry lookups for build-system.requires).
  "hatchling>=1.32.0",
  "httpx2>=2.4.0",
  "hypothesis>=6.155.2",
  "openpyxl>=3.1.5",
  "pytest>=9.0.3",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = [
  "reg_meta",
  "reg_meta_build",
  "reg_schema",
  "reg_webapp/backend/tests",
  "scripts/tests",
]
markers = [
  "integration: full pipeline tests requiring Docker",
  "release: integration tests that download a published GitHub release asset",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Trimmed pydevtools recommendation: dropped TD (TODO diligence — conflicts
# with the keep-comments memory). FA stays because TC moves type-only imports
# into TYPE_CHECKING blocks and only works without breaking runtime annotations
# when `from __future__ import annotations` is in effect (already adopted in
# 89/98 .py files in this workspace).
# Ruff 0.16's expanded defaults (413 rules) adopted; these groups extend them
# where not already included.
extend-select = [
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "FA",   # from __future__ import annotations
  "ISC",  # implicit string concat
  "ICN",  # import conventions
  "RET",  # return values
  "SIM",  # simplifications
  "TID",  # tidy imports
  "TC",   # type-checking imports
  "PTH",  # pathlib
  "NPY",  # numpy
  "FURB", # refurb
]
# ISC004 (new in ruff 0.16's ISC group) flags the deliberate wrapped-long-string
# pattern used throughout (56 sites); parenthesizing them is churn with no
# missing-comma signal here. Revisit with the default-rules adoption follow-up.
ignore = ["ISC004"]

[tool.ruff.lint.per-file-ignores]
# B008 flags FastAPI's `Depends(...)`-in-default idiom, a known false positive;
# the framework evaluates these per-request, never at import time.
"reg_webapp/backend/**" = ["B008"]

[tool.ruff.lint.isort]
# Merge `from X import a` + `from X import b as c` into one block. Default
# isort treats aliased imports as a separate group, which splits `from .fqid
# import (...)` blocks awkwardly when one member is aliased.
combine-as-imports = true

[tool.ty.src]
# Tests use sibling-module sys.path injection (reg_meta/tests/conftest.py
# pulls reg_meta_build/tests/_shared_fixtures) and JSON-shaped fixtures
# that defeat ty's narrowing. Scripts are maintainer-only and import
# optional deps (xlrd, pyodbc, pymupdf4llm) that aren't in workspace
# pyproject.toml. test_corpus/ holds fixture-generators that produce
# JSON-shaped dicts (object-typed values, by design). None of these
# categories are part of the shipped library surface, so exclude from
# the type baseline.
exclude = ["**/tests/**", "**/scripts/**", "scripts/**", "**/test_corpus/**"]

[[tool.ty.overrides]]
# The structural validator (see reg_schema/DESIGN.md → Structural rules and issue codes) narrows JSON-loaded values via
# isinstance(x, Mapping); ty narrows to Top[Mapping[Unknown, object]]
# rather than Mapping[str, object], producing per-callsite false
# positives. The validator does its own isinstance checks at every
# step, so the narrowing limitation is not a correctness gap.
include = ["**/structural.py"]
rules.invalid-argument-type = "ignore"
rules.not-subscriptable = "ignore"

[tool.uv]
package = false
# Project-level 7-day minimum release age (supply-chain guard). uv records this in
# uv.lock's [options] block; without it, checkouts lacking the maintainer's global
# ~/.config/uv/uv.toml would discard the committed lock on plain `uv run` and
# re-resolve against PyPI.
exclude-newer = "7 days"

[tool.uv.sources]
reg-meta = { workspace = true }
reg-meta-build = { workspace = true }
reg-schema = { workspace = true }
reg-webapp = { workspace = true }

[tool.uv.workspace]
members = [
  "reg_meta",
  "reg_meta_build",
  "reg_schema",
  "reg_webapp/backend",
]
