[project]
name = "registry-research-toolkit"
version = "0.4.0"
description = "Workspace coordinator for mock_data_wizard, reg_meta, and reg_meta_build"
requires-python = ">=3.11"
dependencies = [
  "mock-data-wizard",
  "reg-meta",
  "reg-meta-build",
]

[dependency-groups]
dev = [
  "duckdb>=1.4.0",
  "openpyxl>=3.1",
  "playwright>=1.58.0",
  "pytest>=8.4.2",
  "pytest-xdist>=3.6",
  "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["mock_data_wizard", "reg_meta", "reg_meta_build"]
markers = ["integration: full pipeline tests requiring Docker"]

[tool.uv]
package = false

[tool.uv.sources]
mock-data-wizard = { workspace = true }
reg-meta = { workspace = true }
reg-meta-build = { workspace = true }

[tool.uv.workspace]
members = [
  "mock_data_wizard",
  "reg_meta",
  "reg_meta_build",
]
