# Review runs on a candidate head whose candidate-stage gates have all passed,
# and gates before it. A confirmed gate failure returns to the implementer like
# a blocking review finding; max_rounds counts autoreview rounds only, and a
# gate-bought repair round is paid for by the attempt's total-work window
# instead. timeout_minutes limits one review run; blocking sets the repair
# threshold and max_priority the least severe reported finding (P0 most severe
# through P3). Both are keys of [review]: one truth per project.
[review]
max_rounds = 5
# 90 because the DeepSeek pi seat (retired 2026-09-25) reviewed a large diff in
# ~500 KB chunks at 1-2 minutes each: Y-230's 28 chunks (mostly moved curation
# TOML) passed the old 30-minute deadline half way through.
timeout_minutes = 90
blocking = "P1"
max_priority = "P3"

# A seat is one reviewer under a name: engine, model and effort, with optional
# instructions and context. A workflow selects a list of seats. A reviewer from
# a different engine family than the implementer is recommended.
# speed is a fast service tier for codex seats only:
# a queue, not an identity — model/effort stay what the review is recorded
# against, and it is a load error on any other engine.
# No seat declares a `when` scope: that asks a pinned judgment per candidate and
# needs TYPESAFE_API_KEY in operator.env, which this machine does not carry. A
# daemon without the key runs the whole panel, which is what an unanswered
# question always selects.
# The Sol seat reviews every implementation workflow. Implementer and reviewer
# share a model family, against the recommendation above, by choice
# (2026-09-25): the operator's host slice proof is the independent check on
# curation-reorg candidates, and the cross-provider seats failed in practice.
# Muse answered autoreview's overall_correctness with a boolean, so every review
# errored. The DeepSeek pi seat failed ~8 reviews in one day on budget,
# malformed JSON, the ~1,200 s Bun fetch socket cut and the pinfold version
# check, and its advisories were mostly false.
[review.reviewers.sol]
engine = "codex"
model = "gpt-6-sol"
effort = "high"
speed = "fast"

# autoreview runs codex seats on the host's codex CLI, not the vendored worker
# pin: gpt-6-sol needs codex >= 0.156 there (0.153 refuses it on a ChatGPT
# session).
# The design seat judges source against the supplied design contracts. Rendered
# checks belong to workers and gates; the operator judges their visual evidence.
# Context is the reviewer skill plus the frontend design language
# (reg_webapp/frontend/DESIGN.md, ~15 KB), not the 178 KB engineering doc, and
# never src/tokens.css — autoreview rejects that filename as sensitive.
[review.reviewers.design]
engine = "codex"
model = "gpt-6-sol"
effort = "high"
context = [
  ".claude/skills/reg-webapp-design-reviewer/SKILL.md",
  "reg_webapp/frontend/DESIGN.md",
]
instructions = "Review this reg_webapp frontend candidate using only the diff and supplied context files. Judge markup, styles, copy, component states, keyboard focus and interaction semantics against the source-visible checklist, design-system contract and semantic tokens. Check accessibility, component reuse, responsive rules and error-state affordances where the supplied source supports a conclusion. The supplied skill's rendering, self-check and rendered-evidence reporting procedures belong to the implementation worker and operator; they do not apply to this seat. Do not claim rendered verification or raise findings merely because this seat has no rendered evidence. Report concrete defects supported by the supplied source, with file and line, severity, user impact and the smallest correction; distinguish established defects from behavior the available context cannot establish."

# A workflow is a named binding of the knobs above, never a step language. It
# states what an implementation lane running it is: implementer names the agent
# its worker runs as, review is a list of the seat names above -- or "none" for
# no review at all -- plus the four worker-binding keys (instructions, access,
# and the two timeouts). A workflow names no gates: every gate runs on the batch
# in full, and each gate's own stage says whether it also runs on a candidate
# head. A ticket selects a workflow with yard ticket new --workflow NAME, and a
# ticket that names none runs "default" above, so what unspecified tickets run
# is moved by editing that table rather than by touching the backlog. Every
# workflow below states only the keys it differs from "default" in and inherits
# the rest. yard workflow list shows what every workflow this project declares
# binds.

# The ui workflow adds the source-level design seat to the default code seat.
# Select it for rendered frontend changes. Note that since v0.16.0 it no longer
# carries the rendered flow gates -- those are project-wide batch gates now, so
# their screenshots arrive on the landing batch rather than on the candidate the
# operator approves. Until per-workflow gates return upstream, a ui candidate is
# approved on the worker's own render; see .yard/OPERATOR.md "UI approval
# evidence".
[workflows.ui]
review = ["sol", "design"]

# The light workflow is the everyday lane for simple work, selected one ticket
# at a time: a cheaper agent and no review. Skipping the review panel is its one
# economy, and it is the right one for a rename, a message, or a small fix --
# work where a panel would cost more than it catches. The gates are not part of
# that economy: gates are project-wide, so a light candidate takes the same
# staged CI gates as any other and lands behind the same batch.
# A review of "none" means no review execution is ever started for such a lane
# -- its gates still run and its candidate is still yours to approve. A light
# candidate is therefore unreviewed by policy, and it lands the way any other
# one does: because you read it and approved it. Send a ticket whose difficulty
# you cannot judge in advance down "default" instead -- an unreviewed candidate
# that needed a reviewer spends the difference again on repair rounds you drive
# yourself.
[workflows.light]
implementer = "light"
review = "none"

# light-ui is light's economy applied to a rendered change: the same model at
# full effort (Sonnet at xhigh -- more reasoning per turn than light's medium),
# dropping the in-session review machinery (no reg-webapp-design-reviewer
# subagent, no design seat). Select it for a small rendered change whose
# surface the flow-gate scenarios already render -- a copy change, a gate flip,
# a label source.
[workflows.light-ui]
implementer = "light-ui"
review = "none"

# Bounded non-UI trials on the Pi/Muse agent, retaining the default code review.
# Rendered frontend changes still use ui/light-ui.
[workflows.muse]
implementer = "muse"

# heavy: Sol at xhigh effort for design-heavy tickets, with the default review.
[workflows.heavy]
implementer = "heavy"

# data-move: a ticket whose diff is mostly relocated curation data, landed on the
# operator's host slice proof (byte-identical to baseline) instead of a review.
# The DeepSeek seat cannot finish a diff this size: Y-230's 13 MB (28 ~500 KB
# passes) failed four reviews on budget, malformed JSON and the ~1,200 s socket
# cut, at high and at medium effort (2026-09-25). Gates still run.
[workflows.data-move]
implementer = "implementation"
review = "none"

# build_artifacts names the directories ordinary build activity fills with
# output your .gitignore already covers -- target, node_modules, dist, and
# whatever your toolchain writes. Each is a directory path relative to the
# repository root, not a pattern, and none is guessed for you.
# A candidate must be exactly what its commits say, so replaying one onto a
# moved target reads the clone it came from and refuses whatever the candidate
# does not contain. Naming these directories is what keeps ordinary build
# output from being that, including the empty directories a build leaves
# behind that no file listing enumerates at all.
# Naming a directory settles nothing on its own: a declared directory is
# disregarded only where Git classifies the whole of it as ignored -- which is
# also what accounts for those empty directories, since Git reports the
# ignored directory in place of its contents. Two things keep a directory from
# qualifying: anything tracked inside it, and an ignore rule covering only its
# contents -- target/ classifies the directory, target/** does not.
# Everything else still counts: a change to a source file, an unignored file
# anywhere, and an ignored entry outside these directories. Being ignored is
# not being reproducible. A .env file, a local database, and a build's
# leftovers are all ignored, and only the last is build output.
[workspace]
build_artifacts = [
  ".venv",
  # __pycache__ spray: build_artifacts takes literal directories, not patterns,
  # so each pycache dir a worker's in-clone test run creates must be named.
  # Extend this list if a retarget stops on another one.
  "__pycache__",
  "scripts/__pycache__",
  "scripts/tests/__pycache__",
  # Full per-package spray from an in-clone full-suite run (enumerated from a
  # main checkout 2026-08-31 after Y-13/1's retarget stopped on the reg_webapp
  # one; .gitignore's `__pycache__/` classifies each as an ignored directory).
  "reg_meta/src/reg_meta/__pycache__",
  "reg_meta/tests/__pycache__",
  "reg_meta_build/src/reg_meta_build/__pycache__",
  "reg_meta_build/src/reg_meta_build/ir/__pycache__",
