# Yard project configuration.
# Every key that has a default is written out below, set to that default.
# Commented lines are examples of keys that have none.
# Unknown keys are errors.

# Finished work lands on this branch.
[target]
ref = "main"

# Lanes and gates run in a container built from the named Dockerfile.
[isolation]
dockerfile = ".yard/Dockerfile"

# The implementation role writes code.
# backend selects "claude" or "codex", and model names a model that backend
# offers. effort sets reasoning depth to "low", "medium", "high", "xhigh", or
# "max". access grants "writable" or "read-only" workspace access, and tools
# turns subagents on or off. instructions add your own standing guidance to
# every prompt for the role.
# If a worker emits no events for inactivity_timeout_minutes, Yard kills the
# generation and starts a fresh one with the same session. Zero disables that,
# and zero is the shipped default because silence is not proof of a wedge: a
# worker inside one long tool call is legitimately silent for exactly as long
# as that call takes. Recommended when you leave lanes running unattended or
# watch the board for stalls: set it above this project's longest silent step
# (its slowest test run or image build) with room to spare. A value below that
# makes healthy lanes kill and repeat their own slow step, without attention,
# until the total-work budget is gone.
# total_work_timeout_minutes is the unconditional stop across every automatic
# restart, and automation never resets it. It applies whatever the setting
# above is, and a worker wedged under it is reported by its lane's last-event
# age in the status board and by worker-failed attention when it runs out.
# A lane's rounds all resume one session, so its context grows across them,
# and the two settings below are how that is managed in the open rather than
# left to whatever the CLI does when it runs out.
# context_limit_tokens states the window this model actually runs with and is
# passed straight to the backend, so the CLI's own mid-round auto-compaction
# triggers there rather than wherever it would have on its own. Claude takes
# 100000 to 1000000 tokens; Codex takes no such setting and refuses one.
# compaction_threshold_share is the better moment: when a round ends with more
# than this share of that window occupied, Yard compacts the session before the
# next round resumes it -- at a boundary where the round's conclusion is already
# stated, instead of mid-thought. It runs while the round is being reviewed and
# gated, so it usually costs no wall-clock. Occupancy is read from the backend's
# own reports; a round that reports none is left alone and says so in the lane's
# history.
# 300000 with a 0.7 share is the shipped pair, and the arithmetic is the point:
# a round starts at 210000 or less with about 90000 of headroom, so the
# provider's mid-round fallback should essentially never fire, while every round
# after a full one starts from a compacted brief. A far larger window is not the
# better default it looks like -- a repair round reasons better from a current
# brief than from stale plans and old tool output it is still carrying. Raise it
# if your work genuinely needs a bigger window.
# The profile below is quality-first: Opus at xhigh effort, with subagents on.
# Fable is the stronger model, but implementation is by far this board's
# highest-token role, and xhigh -- the documented sweet spot for coding and
# agentic work -- earns more here than Fable's 2x per-token price would. It is
# the setting for a ticket whose difficulty you cannot bound in advance. Simple
# work you still mean to land is what the light role and the light workflow
# further down are for, and they are selected per ticket, so this dial stays
# where hard work needs it. Yard meters no cost, enforces no budget, and quotes
# no price; every model turn here is billed by the provider whose CLI ran it,
# and their usage reporting is the only account of it.
[roles.implementation]
backend = "claude"
model = "claude-opus-5"
effort = "xhigh"
access = "writable"
tools = { subagents = true }
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360
context_limit_tokens = 300000
compaction_threshold_share = 0.7
instructions = "Smallest safe change, in the ticket's scope only. Follow the repo ladder (no change > existing capability > stdlib > installed dep > minimal new code > new dep) and prefer deletion to addition: pre-v1 with no external users, break and delete freely — no compat shims, migration code, deprecation wrappers, or speculative options/abstractions no ticket asked for. Never simplify away the load-bearing guards: PII/MONA confinement, k-anonymity/disclosure control, determinism/byte-identity, JSON-contract validation, fail-fast. If the work grows past the ticket, do less and file a proposal instead. Before declaring the candidate, once your own checks pass: run the /simplify skill over the candidate diff in a clean subagent (reuse, simplification, efficiency, altitude — quality only, no behavior change), apply what it finds, and re-run the checks; if the skill is unavailable, do that pass yourself. If the ticket changes rendered reg_webapp frontend UI: load the repo skill reg-webapp-frontend-design before authoring (if the Skill tool does not list it, read .claude/skills/reg-webapp-frontend-design/SKILL.md), and before declaring the candidate run reg-webapp-design-reviewer (.claude/skills/reg-webapp-design-reviewer/SKILL.md) in a clean subagent and fix or explicitly dismiss what it finds."

# Plan-first tickets need the planning role. Without it, such a ticket waits
# for the operator instead of planning itself.
# The frozen planning prompt already asks every plan for its named consumer,
# the minimum behavior that consumer needs, which assumptions were stated and
# which inferred, the deployment's own threat model, and its exclusions -- and
# to delete or defer behavior before splitting it. That half is universal, so
# it is not yours to write. instructions is the other half: what is true of
# this project only, and nowhere in the ticket. The plan document a ticket is
# planned against earns its place, and so does a size ceiling this project wants
# held -- though Yard ships no number of its own, because a budget in the
# scaffold reads as a contract and size is a signal read after the fact.
[roles.planning]
backend = "claude"
# claude-fable-5-1 needs worker CLI >= 2.1.251: yard 0.12.0's pin (2.1.258)
# carries it; yard 0.11.0's (2.1.236) refused it, which is why this briefly
# ran claude-opus-5.
model = "claude-fable-5-1"
effort = "high"
instructions = "Plan against this repository's CLAUDE.md conventions and each package's DESIGN.md; name the package(s) each ticket touches. This project is shedding overengineering: delete or defer behavior before splitting it, and split only what is independently useful — answer a frightening size by shrinking the scope, never by subdividing it into a backlog. Every ticket names its consumer and the observable behavior they get. Problems that have not happened are not requirements, and this single-maintainer research tool is not an adversarial environment."

# The conflict role resolves a conflicted retarget and takes the same keys as
# the implementation role. Without it, the lane stops for the operator.
[roles.conflict]
backend = "claude"
model = "claude-opus-5"
effort = "high"
access = "writable"
tools = { subagents = true }
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360

# A role table named anything other than implementation, planning, conflict, or
# review is an additional worker role a workflow can select, and it takes the
# same keys as the roles above. This one is for simple work, and the light
# workflow further down is what puts a lane on it. Its candidates are meant to
# land, so the model is one that finishes a small task correctly rather than the
# least this backend can run; medium effort is what such a task takes, and
# subagents are off because work small enough to select this role is work one
# worker holds in its own context.
[roles.light]
backend = "claude"
model = "claude-sonnet-5"
effort = "medium"
access = "writable"
tools = { subagents = false }
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360
instructions = "Smallest safe change, in the ticket's scope only; match the conventions of the code you are changing. No scope beyond the ticket — if more is needed, file a proposal. Before declaring the candidate, make one simplification pass over your own diff (the /simplify skill if available): reuse what exists, drop what the ticket did not ask for, then re-run the checks."

# Each [checks.<name>] section defines a gate, and each workflow's checks key
# (see [workflows.*] below) selects which gates its candidates must pass — a
# gate no workflow lists runs nowhere.
# command runs the gate and timeout_minutes limits one run. environment is
# "container" or "host": container gates have no credentials and no network,
# and a host gate must also name the platform and architecture it needs.
# A gate that sets test_report to "junit" has its JUnit XML read back from
# $YARD_TEST_REPORT. Give each gate a name of your own in place of "test".

# A container gate command is run as /bin/sh -c under env -i, so the image's
# own ENV lines never reach it and nothing of your shell profile does either.
# The whole environment is this floor:
#   PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
#   HOME=/tmp
#   TMPDIR=/tmp
#   LANG=C.UTF-8
#   YARD_TEST_REPORT, when this gate sets test_report
#   GIT_CONFIG_* trusting /workspace, so Git commands there are not refused
# A toolchain the Dockerfile installs outside that PATH, or one that reads its
# own variables, is therefore unreachable by its bare name; state what it needs
# in the command itself, which is a shell command and expands $PATH as usual.
# There is no env key for a check. Rust installed by rustup under /usr/local is
# the worked case -- bare "cargo" resolves to nothing there, and this works:
#   command = "PATH=/usr/local/cargo/bin:$PATH RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo cargo clippy --all-targets -- -D warnings"

# The three gates mirror .github/workflows/ci.yml (lint / test /
# reg-webapp-frontend). Gates run network-disabled, so every command resolves
# offline against the caches the .yard/Dockerfile pre-warms under /opt
# (uv wheel cache + managed python, uvx tool envs for the pinned ty/panache,
# and a baked frontend node_modules). UV_LINK_MODE=copy because the baked
# cache is another uid's files and hardlinking across owners is refused.

# Each command is wrapped in an explicit `sh -c` so its head word is a real
# executable preflight can resolve (a head of `export`/`cd` reports as
# undecided gate-resolution).
[checks.lint]
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
uv run ruff check
uv run ruff format --check
uvx --offline --from ty==0.0.74 ty check
uvx --offline --from panache-cli==3.6.1 panache format --check .
uvx --offline --from panache-cli==3.6.1 panache lint .
bash scripts/check_versions.sh
' '''
timeout_minutes = 20

[checks.test]
# junit evidence: zero tests or any skip is missing evidence, so the optional
# marker-gated suites are deselected rather than skipped — a deselected test
# never enters the report, a conftest-skipped one does.
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
uv run python -m pytest -q -n auto -m "not integration and not release" --junitxml="$YARD_TEST_REPORT"
' '''
timeout_minutes = 40
test_report = "junit"

[checks.frontend]
command = '''sh -ec '
export PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
cd reg_webapp/frontend
cp -a /opt/frontend/node_modules .
bun run lint
bun run check
bun run test
bun run build
bun run gen:types
git diff --exit-code -- src/lib/api-types.ts
' '''
timeout_minutes = 30

# The rendered project evidence (Y-34), selected by the `ui` workflow only. It
# drives the CANDIDATE's own app — a fresh backend on the synthetic catalog
# fixture DB the backend tests build, plus the Vite dev server — through three
# /project error/retry scenarios and the catalog-authored draft flow (Y-42:
# pick from a catalog leaf, reload, recover, extend on a cold entry) at four
# viewports (16 cases), and keeps one PNG per settled state for the operator's
# visual judgment. No model runs here: the driver asserts the behavior,
# `artifacts` retains the pictures.
#
# Provisioning mirrors the gates above (offline two-step `uv sync`, the baked
# node_modules, /opt/pw-browsers), plus two things dev.sh needs: the candidate's
# own `.venv/bin` on PATH (it shells out to `python3` to pick free ports; the
# image has no system Python), and the worktree-bootstrap fingerprints stamped
# so dev.sh's self-provision call is a no-op fast path instead of a swallowed,
# network-dependent `uv sync` / `bun install` we would then have to trust.
#
# `artifacts` names exactly the files the driver writes into $YARD_ARTIFACT_DIR;
# a missing or oversize one is a gate error, so the case list and this list are
# one contract. Retained paths are on `yard lane show` — open the PNGs, they are
# the evidence this gate exists to produce.
[checks.project-flows]
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
cp -a /opt/frontend/node_modules reg_webapp/frontend/
cksum < uv.lock | cut -d" " -f1 > .venv/.wt-provisioned
cksum < reg_webapp/frontend/bun.lock | cut -d" " -f1 > reg_webapp/frontend/node_modules/.wt-provisioned
export PATH="$PWD/.venv/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
db=$(mktemp -d)
python3 reg_webapp/.claude/skills/run-reg-webapp/catalog_fixture_db.py "$db"
echo "candidate HEAD $(git rev-parse HEAD)"
REG_META_DB="$db" bash reg_webapp/.claude/skills/run-reg-webapp/dev.sh flows "$YARD_ARTIFACT_DIR"
ls -l "$YARD_ARTIFACT_DIR"
du -sk "$YARD_ARTIFACT_DIR"
' '''
timeout_minutes = 30
artifacts = [
  "project-blocked-375x812.png",
  "project-blocked-768x1024.png",
  "project-blocked-1280x900.png",
  "project-blocked-1920x1080.png",
  "order-error-375x812.png",
  "order-error-768x1024.png",
  "order-error-1280x900.png",
  "order-error-1920x1080.png",
  "order-recovered-375x812.png",
  "order-recovered-768x1024.png",
  "order-recovered-1280x900.png",
  "order-recovered-1920x1080.png",
  "validation-error-375x812.png",
  "validation-error-768x1024.png",
  "validation-error-1280x900.png",
  "validation-error-1920x1080.png",
  "catalog-pick-375x812.png",
  "catalog-pick-768x1024.png",
  "catalog-pick-1280x900.png",
  "catalog-pick-1920x1080.png",
  "project-restored-375x812.png",
  "project-restored-768x1024.png",
  "project-restored-1280x900.png",
  "project-restored-1920x1080.png",
]

# Review runs on every candidate. max_gate_repair_rounds limits repairs after
# gate failures, max_rounds limits repairs after blocking review findings, and
# timeout_minutes limits one review run. blocking sets the repair threshold and
# max_priority the least severe reported finding (P0 most severe through P3);
# codex_speed is a fast service tier for the codex seats only (Y-493): a queue,
# not an identity — model/effort stay what the review is recorded against.
# panel lists the seats the default workflow runs.
[checks.review]
max_gate_repair_rounds = 2
max_rounds = 5
timeout_minutes = 30
blocking = "P1"
max_priority = "P3"
codex_speed = "fast"
panel = ["codex"]

# A seat is one reviewer under a name (v0.12.0, Y-526): engine:model:effort,
# with optional instructions and context. A workflow selects a list of seats.
# A reviewer from a different engine family than the implementer is
# recommended.
[checks.review.reviewers.codex]
reviewer = "codex:gpt-5.6-sol:high"

# The design seat judges source against the supplied design contracts. Rendered
# checks belong to workers and gates; the operator judges their visual evidence.
# Context is the reviewer skill plus the frontend design language
# (reg_webapp/frontend/DESIGN.md, ~15 KB), not the 178 KB engineering doc, and
# never src/tokens.css — autoreview rejects that filename as sensitive.
[checks.review.reviewers.design]
reviewer = "claude:claude-opus-5:high"
context = [
  ".claude/skills/reg-webapp-design-reviewer/SKILL.md",
  "reg_webapp/frontend/DESIGN.md",
]
instructions = "Review this reg_webapp frontend candidate using only the diff and supplied context files. Judge markup, styles, copy, component states, keyboard focus and interaction semantics against the source-visible checklist, design-system contract and semantic tokens. Check accessibility, component reuse, responsive rules and error-state affordances where the supplied source supports a conclusion. The supplied skill's rendering, self-check and rendered-evidence reporting procedures belong to the implementation worker and operator; they do not apply to this seat. Do not claim rendered verification or raise findings merely because this seat has no rendered evidence. Report concrete defects supported by the supplied source, with file and line, severity, user impact and the smallest correction; distinguish established defects from behavior the available context cannot establish."

# A workflow is a named binding of the knobs above, never a step language. It
# states three: role names the worker role its lanes run as, review is a list
# of the seat names above -- or "none" for no review at all -- and checks is
# either "all" or a list of the gate names such a lane must pass. A ticket
# selects one with yard ticket new --workflow NAME, and a ticket that names none
# runs "default", so what unspecified tickets run is moved by editing the table
# below rather than by touching the backlog. yard workflow list shows what every
# workflow this project declares binds.
[workflows.default]
role = "implementation"
review = ["codex"]
# The three CI-mirroring gates, listed rather than "all": a gate is added for
# the workflow that needs it (project-flows below), and an unrelated candidate
# must not acquire a rendered browser gate just by existing.
checks = ["lint", "test", "frontend"]

# The ui workflow adds source-level design review to the default code seat AND
# the rendered project-flows gate. Select it for rendered frontend changes; the
# operator owns visual judgment, and project-flows is what hands them pictures.
[workflows.ui]
role = "implementation"
review = ["codex", "design"]
checks = ["lint", "test", "frontend", "project-flows"]

# The light workflow is the everyday lane for simple work, selected one ticket
# at a time: the role above, the CI gates, and no review. Skipping the review
# panel is its one economy, and it is the right one for a rename, a message, or
# a small fix -- work where a panel would cost more than it catches. The gates
# are not part of that economy: a light candidate you might land has passed the
# same CI as any other, because a candidate no gate has seen is not light, it is
# unverified.
# A review of "none" means no review execution is ever started for such a lane
# -- its checks still run, its candidate is still yours to approve, and it is
# never eligible for automatic merging, which requires a clean current review.
# A light candidate is therefore unreviewed by policy, and it lands the way any
# other one does: because you read it and approved it. Send a ticket whose
# difficulty you cannot judge in advance down "default" instead -- an unreviewed
# candidate that needed a reviewer spends the difference again on repair rounds
# you drive yourself.
[workflows.light]
role = "light"
review = "none"
checks = ["lint", "test", "frontend"]

# concurrency limits how many ready tickets run at once.
[scheduler]
concurrency = 2

# The merge policy governs automatic merging only. Operator approval is never
# limited by it.
# enabled turns automatic merging on. Every changed path must match
# allow_paths, so an empty list qualifies nothing, and no changed path may
# match protected_paths. allow_non_hermetic_gates names the host gates that
# may still count toward an automatic merge. autoreview_pin holds the one
# reviewer-tool commit automatic merging accepts.
[merge]
enabled = false
allow_paths = []
protected_paths = []
allow_non_hermetic_gates = []
# autoreview_pin = "fe588b1fe588b1fe588b1fe588b1fe588b1fe588"

# build_artifacts names the directories ordinary build activity fills with
# output your .gitignore already covers -- target, node_modules, dist, and
# whatever your toolchain writes. Each is a directory path relative to the
# repository root, not a pattern, and none is guessed for you.
# A candidate must be exactly what its commits say, so replaying one onto a
# moved target reads the clone it came from and refuses whatever the candidate
# does not contain. Naming these directories is what keeps ordinary build
# output from being that, including the empty directories a build leaves
# behind that no file listing enumerates at all.
# Naming a directory settles nothing on its own: a declared directory is
# disregarded only where Git classifies the whole of it as ignored -- which is
# also what accounts for those empty directories, since Git reports the
# ignored directory in place of its contents. Two things keep a directory from
# qualifying: anything tracked inside it, and an ignore rule covering only its
# contents -- target/ classifies the directory, target/** does not.
# Everything else still counts: a change to a source file, an unignored file
# anywhere, and an ignored entry outside these directories. Being ignored is
# not being reproducible. A .env file, a local database, and a build's
# leftovers are all ignored, and only the last is build output.
[workspace]
build_artifacts = [
  ".venv",
  # __pycache__ spray: build_artifacts takes literal directories, not patterns,
  # so each pycache dir a worker's in-clone test run creates must be named.
  # Extend this list if a retarget stops on another one.
  "__pycache__",
  "scripts/__pycache__",
  "scripts/tests/__pycache__",
  # Full per-package spray from an in-clone full-suite run (enumerated from a
  # main checkout 2026-08-31 after Y-13/1's retarget stopped on the reg_webapp
  # one; .gitignore's `__pycache__/` classifies each as an ignored directory).
  "reg_meta/src/reg_meta/__pycache__",
  "reg_meta/tests/__pycache__",
  "reg_meta_build/src/reg_meta_build/__pycache__",
  "reg_meta_build/src/reg_meta_build/ir/__pycache__",
  "reg_meta_build/src/reg_meta_build/sources/__pycache__",
  "reg_meta_build/tests/__pycache__",
  "reg_meta_build/input_data/swecov/__pycache__",
  "reg_schema/src/reg_schema/__pycache__",
  "reg_schema/tests/__pycache__",
  "reg_webapp/backend/scripts/__pycache__",
  "reg_webapp/backend/src/reg_webapp/__pycache__",
  "reg_webapp/backend/src/reg_webapp/routes/__pycache__",
  "reg_webapp/backend/tests/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  # Hypothesis example DB, written by in-clone property-test runs (.gitignore
  # matches the directory: `.hypothesis/`). First tripped a Y-13/1 retarget.
  ".hypothesis",
  "reg_webapp/frontend/node_modules",
  "reg_webapp/frontend/dist",
  # svelte-check --tsgo emission cache, left by an in-clone `bun run check`
  # (frontend/.gitignore matches the directory: `.svelte-check/`). First
  # tripped a Y-29/4 retarget.
  "reg_webapp/frontend/.svelte-check",
]
