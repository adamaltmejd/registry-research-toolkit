# Yard project configuration. Unknown keys are errors.

# max_lanes limits how many ready tickets run at once. Raised to 4 for the slice
# rules/curation stage (2026-09-26): lanes awaiting the operator's host slice proof hold
# their slot, so 2 left the queue idle during proofs.
max_lanes = 4

# approve says whether a clean candidate needs an operator to enqueue it.
# "manual" (the default) raises approval-needed for every clean candidate;
# "auto" enqueues one as soon as it is verified. This project approves every
# candidate by hand: UI work is judged on rendered evidence and builder work on
# focused diffs, neither of which a clean review establishes on its own.
approve = "manual"

# max_batch (top-level, default 8) caps how many approved candidates one merge
# queue batch verifies together; the default stands.

[target]
ref = "main"
# protected_paths names the paths that always take an operator's own decision,
# whatever approve says; .yard/ is protected regardless. Empty because approve
# is "manual" — every path already takes one.
protected_paths = []

[isolation]
dockerfile = ".yard/Dockerfile"

# Agents hold harness/model/session settings. Jobs below hold access,
# instructions and timeouts; workflows select an implementation agent.
# GPT-6 Sol implements (default and heavy); Opus 5.5 plans and resolves
# conflicts; Sonnet handles light work. Implementation moved off Opus on
# 2026-09-25 to save Claude tokens. A GPT-6 Luna trial (Y-229) cost more and
# needed more operator nudges than Opus, so it ended. Review is a Sol seat too
# (see [review.reviewers.sol] for why).
[agents.implementation]
harness = "codex"
model = "gpt-6-sol"
effort = "high"
tools = { subagents = true }

[agents.planning]
harness = "claude"
model = "claude-opus-5-5"
effort = "high"

[agents.conflict]
harness = "claude"
model = "claude-opus-5-5"
effort = "high"
tools = { subagents = true }

[agents.light]
harness = "claude"
model = "claude-sonnet-5"
effort = "medium"
tools = { subagents = false }

[agents.light-ui]
harness = "claude"
model = "claude-sonnet-5"
effort = "xhigh"
tools = { subagents = false }

# Sol at xhigh effort for design-heavy tickets, selected by the heavy workflow.
[agents.heavy]
harness = "codex"
model = "gpt-6-sol"
effort = "xhigh"
tools = { subagents = true }

# Explicitly selected for bounded trials, using OPENROUTER_API_KEY in
# operator.env. Contributor prompts and outputs may be used by Meta for training.
# Pi has no subagent tool and does not accept context/compaction overrides.
[agents.muse]
harness = "pi"
provider = "openrouter"
model = "meta/muse-spark-1.3-contributor"
effort = "high"
tools = { subagents = false }

# [workflows.default] is what a ticket naming no workflow runs, and it carries
# the implementation job settings every other workflow inherits where it leaves
# them unset. Light agents and Pi do their simplification pass themselves;
# light-ui leaves rendered evidence to gates.
[workflows.default]
implementer = "implementation"
review = ["sol"]
access = "writable"
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360
instructions = "Smallest safe change, in the ticket's scope only. Follow the repo ladder (no change > existing capability > stdlib > installed dep > minimal new code > new dep) and prefer deletion to addition: pre-v1 with no external users, break and delete freely — no compat shims, migration code, deprecation wrappers, or speculative options/abstractions no ticket asked for. Never simplify away the load-bearing guards: PII/MONA confinement, k-anonymity/disclosure control, determinism/byte-identity, JSON-contract validation, fail-fast. If the work grows past the ticket, do less and file a proposal instead. Run focused tests for what you changed; the lint and test gates run the full suites and ruff after your turn and send failures back as gate repairs. Import, unused-import and formatter-only edits to existing tests that your change caused are authorized, including during a gate repair; changing an assertion still needs the ticket or the operator. If the ticket changes rendered reg_webapp frontend UI: load the repo skill reg-webapp-frontend-design before authoring (if the Skill tool does not list it, read .claude/skills/reg-webapp-frontend-design/SKILL.md), and, when subagents are enabled, before declaring the candidate run reg-webapp-design-reviewer (.claude/skills/reg-webapp-design-reviewer/SKILL.md) in a clean subagent and fix or explicitly dismiss what it finds. On light-ui, do not run that reviewer or render screenshots yourself: the flow gates retain the pictures and the operator judges them."

[planning]
agent = "planning"
instructions = "Plan against this repository's CLAUDE.md conventions and each package's DESIGN.md; name the package(s) each ticket touches. This project is shedding overengineering: delete or defer behavior before splitting it, and split only what is independently useful — answer a frightening size by shrinking the scope, never by subdividing it into a backlog. Every ticket names its consumer and the observable behavior they get. Problems that have not happened are not requirements, and this single-maintainer research tool is not an adversarial environment."

[conflict]
agent = "conflict"
access = "writable"
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360

# Each [gates.<name>] section defines a gate. Every gate a project declares
# runs on the merge queue, against the ref that batches approved candidates
# ahead of canonical — that batch run is what green means. A gate that also
# declares stage = "candidate" runs on a candidate head as well, before any
# review, so a failure is caught while the lane is still warm.
# A workflow names no gates: since v0.16.0 the gate set is project-wide, so
# lint/test/frontend are staged at the candidate (cheap, decide most failures)
# and the three rendered flow gates are left to the batch. See the flow-gate
# comment below and .yard/OPERATOR.md for what that costs the UI evidence.
# command runs the gate and timeout_minutes limits one run. environment is
# "container" or "host": container gates have no credentials and no network,
# and a host gate must also name the platform and architecture it needs.
# A gate that sets test_report to "junit" has its JUnit XML read back from
# $YARD_TEST_REPORT.

# A container gate command is run as /bin/sh -c under env -i, so the image's
# own ENV lines never reach it and nothing of your shell profile does either.
# The whole environment is this floor:
#   PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
#   HOME=/tmp
#   TMPDIR=/tmp
#   LANG=C.UTF-8
#   YARD_TEST_REPORT, when this gate sets test_report
#   GIT_CONFIG_* trusting /workspace, so Git commands there are not refused
# A toolchain the Dockerfile installs outside that PATH, or one that reads its
# own variables, is therefore unreachable by its bare name; state what it needs
# in the command itself, which is a shell command and expands $PATH as usual.
# There is no env key for a check. Rust installed by rustup under /usr/local is
# the worked case -- bare "cargo" resolves to nothing there, and this works:
#   command = "PATH=/usr/local/cargo/bin:$PATH RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo cargo clippy --all-targets -- -D warnings"

# The three gates mirror .github/workflows/ci.yml (lint / test /
# reg-webapp-frontend). Gates run network-disabled, so every command resolves
# offline against the caches the .yard/Dockerfile pre-warms under /opt
# (uv wheel cache + managed python, uvx tool envs for the pinned ty/panache,
# and a baked frontend node_modules). UV_LINK_MODE=copy because the baked
# cache is another uid's files and hardlinking across owners is refused.

# Each command is wrapped in an explicit `sh -c` so its head word is a real
# executable preflight can resolve (a head of `export`/`cd` reports as
# undecided gate-resolution).
[gates.lint]
stage = "candidate"
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
uv run ruff check
uv run ruff format --check
uvx --offline --from ty==0.0.79 ty check
uvx --offline --from panache-cli==3.9.0 panache format --check .
uvx --offline --from panache-cli==3.9.0 panache lint .
bash scripts/check_versions.sh
' '''
timeout_minutes = 20

[gates.test]
stage = "candidate"
# junit evidence: zero tests or any skip is missing evidence, so the optional
# marker-gated suites are deselected rather than skipped — a deselected test
# never enters the report, a conftest-skipped one does.
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
uv run python -m pytest -q -n auto -m "not integration and not release" --junitxml="$YARD_TEST_REPORT"
' '''
timeout_minutes = 40
test_report = "junit"

[gates.frontend]
stage = "candidate"
command = '''sh -ec '
export PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
cd reg_webapp/frontend
cp -a /opt/frontend/node_modules .
bun run lint
bun run check
bun run test
bun run build
bun run gen:types
git diff --exit-code -- src/lib/api-types.ts
' '''
timeout_minutes = 30

# The rendered /project error/retry evidence (Y-34). Like every gate it runs on
# each landing batch; it declares no stage, so it stays off candidate heads and
# its PNGs arrive with the batch, not before approval. Yard 0.17 can scope a gate
# with `when` (Y-727), but that asks a pinned judgment needing TYPESAFE_API_KEY,
# which this machine does not carry, so the flow gates stay unscoped. It drives the CANDIDATE's own app — a fresh backend on the
# synthetic catalog fixture DB the backend tests build, plus the Vite dev server
# — through three /project scenarios at four viewports (12 cases) and keeps one
# PNG per settled state for the operator's visual judgment. No model runs here:
# the driver asserts the behavior, `artifacts` retains the pictures.
#
# The driver's two CATALOG scenarios (the authored draft, Y-42, and the pick with
# no period chosen, Y-58) are the SEPARATE `catalog-flows` gate below, and each
# gate names the scenarios it runs so neither pays for the other's cases. They are
# two gates rather than one because `artifacts` accepts at most 16 filenames and
# the five scenarios write 32; `dev.sh flows <dir>` with no scenario names still
# runs all five, which is how the flow is verified locally.
#
# Provisioning mirrors the gates above (offline two-step `uv sync`, the baked
# node_modules, /opt/pw-browsers), plus two things dev.sh needs: the candidate's
# own `.venv/bin` on PATH (it shells out to `python3` to pick free ports; the
# image has no system Python), and the worktree-bootstrap fingerprints stamped
# so dev.sh's self-provision call is a no-op fast path instead of a swallowed,
# network-dependent `uv sync` / `bun install` we would then have to trust.
#
# `artifacts` names exactly the files the driver writes into $YARD_ARTIFACT_DIR;
# a missing or oversize one is a gate error, so the case list and this list are
# one contract. Retained paths are on the landing batch — open the PNGs, they
# are the evidence this gate exists to produce.
[gates.project-flows]
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
cp -a /opt/frontend/node_modules reg_webapp/frontend/
cksum < uv.lock | cut -d" " -f1 > .venv/.wt-provisioned
cksum < reg_webapp/frontend/bun.lock | cut -d" " -f1 > reg_webapp/frontend/node_modules/.wt-provisioned
export PATH="$PWD/.venv/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
db=$(mktemp -d)
python3 reg_webapp/.claude/skills/run-reg-webapp/catalog_fixture_db.py "$db"
echo "candidate HEAD $(git rev-parse HEAD)"
REG_META_DB="$db" bash reg_webapp/.claude/skills/run-reg-webapp/dev.sh flows "$YARD_ARTIFACT_DIR" blocked-order order-retry validation-retry
ls -l "$YARD_ARTIFACT_DIR"
du -sk "$YARD_ARTIFACT_DIR"
' '''
timeout_minutes = 30
artifacts = [
  "project-blocked-375x812.png",
  "project-blocked-768x1024.png",
  "project-blocked-1280x900.png",
  "project-blocked-1920x1080.png",
  "order-error-375x812.png",
  "order-error-768x1024.png",
  "order-error-1280x900.png",
  "order-error-1920x1080.png",
  "order-recovered-375x812.png",
  "order-recovered-768x1024.png",
  "order-recovered-1280x900.png",
  "order-recovered-1920x1080.png",
  "validation-error-375x812.png",
  "validation-error-768x1024.png",
  "validation-error-1280x900.png",
  "validation-error-1920x1080.png",
]

# The rendered CATALOG evidence, a batch gate beside `project-flows`. Same driver, same provisioning, two scenarios at the same four
# viewports (8 cases): the authored draft (Y-42) picks a column from a catalog leaf
# with /project never opened, leaves the route, reloads into /project and recovers
# the draft, then extends it with a second pick made on a cold catalog entry; the
# period-required pick (Y-58) enters the same leaf the way ordinary browsing does
# — no query string — and must refuse a column it can give no finite period,
# recovering when 2018 is chosen. It is its own gate purely because `artifacts`
# holds at most 16 filenames; the shots are the operator's evidence that a draft
# authored away from /project survives and that no pick authors an invalid source,
# and the driver asserts the behavior behind them (including what the browser's own
# IndexedDB holds across the reloads, and what it does NOT hold after a refusal).
[gates.catalog-flows]
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
cp -a /opt/frontend/node_modules reg_webapp/frontend/
cksum < uv.lock | cut -d" " -f1 > .venv/.wt-provisioned
cksum < reg_webapp/frontend/bun.lock | cut -d" " -f1 > reg_webapp/frontend/node_modules/.wt-provisioned
export PATH="$PWD/.venv/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
db=$(mktemp -d)
python3 reg_webapp/.claude/skills/run-reg-webapp/catalog_fixture_db.py "$db"
echo "candidate HEAD $(git rev-parse HEAD)"
REG_META_DB="$db" bash reg_webapp/.claude/skills/run-reg-webapp/dev.sh flows "$YARD_ARTIFACT_DIR" catalog-draft catalog-period-required
ls -l "$YARD_ARTIFACT_DIR"
du -sk "$YARD_ARTIFACT_DIR"
' '''
timeout_minutes = 30
artifacts = [
  "catalog-pick-375x812.png",
  "catalog-pick-768x1024.png",
  "catalog-pick-1280x900.png",
  "catalog-pick-1920x1080.png",
  "project-restored-375x812.png",
  "project-restored-768x1024.png",
  "project-restored-1280x900.png",
  "project-restored-1920x1080.png",
  "catalog-no-period-375x812.png",
  "catalog-no-period-768x1024.png",
  "catalog-no-period-1280x900.png",
  "catalog-no-period-1920x1080.png",
  "catalog-period-recovered-375x812.png",
  "catalog-period-recovered-768x1024.png",
  "catalog-period-recovered-1280x900.png",
  "catalog-period-recovered-1920x1080.png",
]

# The rendered DELIBERATE-REPLACEMENT evidence (Y-48), a batch gate beside the
# two above. Same driver, same provisioning, one
# scenario at the same four viewports (4 cases): an edited draft is replaced on
# purpose — New raises the confirmation over the work it would destroy, a cancel
# keeps the draft and returns focus to the button that opened it, and an Open
# raises the SAME confirmation once the file has parsed, loading it only on a
# confirm. Its own gate for the same reason `catalog-flows` is: `artifacts` holds
# at most 16 filenames. The shots are the operator's evidence for the one modal
# surface this app has; the driver asserts the behavior behind them.
[gates.replace-flows]
command = '''sh -ec '
export UV_CACHE_DIR=/opt/uv/cache UV_PYTHON_INSTALL_DIR=/opt/uv/python UV_LINK_MODE=copy
uv sync --frozen --offline --no-install-workspace
uv sync --frozen --offline --no-build-isolation
cp -a /opt/frontend/node_modules reg_webapp/frontend/
cksum < uv.lock | cut -d" " -f1 > .venv/.wt-provisioned
cksum < reg_webapp/frontend/bun.lock | cut -d" " -f1 > reg_webapp/frontend/node_modules/.wt-provisioned
export PATH="$PWD/.venv/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
db=$(mktemp -d)
python3 reg_webapp/.claude/skills/run-reg-webapp/catalog_fixture_db.py "$db"
echo "candidate HEAD $(git rev-parse HEAD)"
REG_META_DB="$db" bash reg_webapp/.claude/skills/run-reg-webapp/dev.sh flows "$YARD_ARTIFACT_DIR" replace-confirm
ls -l "$YARD_ARTIFACT_DIR"
du -sk "$YARD_ARTIFACT_DIR"
' '''
timeout_minutes = 30
artifacts = [
