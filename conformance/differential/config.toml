# G1 differential harness (RUST_RUNTIME_SPEC.md section 4, "G1"): the seed, the pins and
# the named semantic exceptions. The cache root is the only other setting
# (`$REG_META_G1_CACHE`). A re-pin package edits this file and section 4 together: it
# runs G1 on the old and new pin and records any difference. Each run deletes every
# cached artifact or baseline environment that is not pinned here.

# Seeds every query sample (`cases.py`).
seed = 0

# Named semantic exceptions: accepted differences between the baseline and the reader
# under test. An entry covers a difference only when stdout alone differs and every
# differing JSON pointer lies under one of `paths` (all of stdout when omitted):
#
#   [[exception]]
#   name = "search-rank-ties"        # reported per difference
#   reason = "why the new behavior is correct"
#   case = "*/search/*"              # fnmatch glob over `<catalog>/<scope>/<command>/<key>`
#   paths = ["/results"]             # JSON pointer prefixes
#
# The fold sweep's one exception, `baseline-ucd-unassigned`, is defined in `folds.py`:
# its scalar set comes from the baseline interpreter's `unicodedata`.

[[exception]]
name = "derived-generation-cursor"
reason = "The baseline reads the release originals and the checkout its derived copies, so their generations differ (section 4); a search cursor binds the generation, so none outlives it. `has_more` still compares, and page 2 of `search-limit-5` exercises the shared cursor encoder."
case = "*/*/search*"
paths = ["/next_cursor"]

[[exception]]
name = "derived-generation-order"
reason = "An order manifest records the catalog's generation, which differs between the release original and the checkout's derived copy (section 4)."
case = "*/*/order/*"
paths = ["/provenance/catalog_generation_id"]

[[exception]]
name = "reader-version"
reason = "The reader's release version is build identity, not behavior: the frozen baseline commit reports its own version, and main bumps versions between re-pins, so the two differ."
case = "*/*/context"
paths = ["/data/reg_meta_version"]

[[exception]]
name = "register-scope-code-classifications"
reason = "#1240: under --register a code hit keeps its owning classifications (code_system, classifications, classification_count), as it does unscoped; the 553ea622 baseline predates the fix and blanks them. Here three SUN codes."
case = "global/reference/search-register/19"
paths = [
  "/results/10/classification_count",
  "/results/10/classifications",
  "/results/10/code_system",
  "/results/11/classification_count",
  "/results/11/classifications",
  "/results/11/code_system",
  "/results/12/classification_count",
  "/results/12/classifications",
  "/results/12/code_system",
]

# The baseline reader (CLI and webapp), run from a detached worktree with its own
# locked environment. It reads the release originals, so code under change never
# derives what it is compared against. 553ea622 (main after 3a.2) is the last commit
# whose webapp serves every route the served arm compares against (3a.10 and 3a.11
# deleted /api/context, /api/stats and /api/search), so it cannot move to the release
# commit; Python fixes after it are named exceptions (section 4, "Current pin").
[baseline]
commit = "553ea622fdb3a5fd42a04c46920b6f7b9a5fe8d2"

# The pinned release artifacts. `sha256` is the GitHub release asset digest (of the
# `.zst`), checked while the asset streams into the cache.
[release]
tag = "reg_meta/v0.43.0"

[[release.asset]]
catalog = "global"
name = "reg_meta.db.zst"
sha256 = "60acf6c8ee37ff5566f536af4337b876b4413899dc4d9a01c685499f513bd3c5"

[[release.asset]]
catalog = "swecov"
name = "reg_meta_swecov.db.zst"
sha256 = "67bc9cd8d07d897dc969d89b4fef4b012a128c6144fa2c65b6ff3742c71ee652"

# The docs database is optional enrichment for `search` and required by `docs`; it is
# placed beside both catalogs so the two read the same documentation.
[release.docs]
name = "reg_meta_docs.db.zst"
sha256 = "b110210901daa4e2a13e33a8574a6e2b52b43258f05bbbc6378255ddf7e75afe"
