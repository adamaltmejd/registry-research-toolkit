# G1 differential harness (RUST_RUNTIME_SPEC.md section 4, "G1"): the seed, the pins and
# the named semantic exceptions. The cache root is the only other setting
# (`$REG_META_G1_CACHE`). A re-pin package edits this file and section 4 together: it
# runs G1 on the old and new pin and records any difference. Each run deletes every
# cached artifact or baseline build that is not pinned here.

# Seeds every sample (`cases.py`, `served.py`).
seed = 0

# Named semantic exceptions: accepted differences between the baseline and the reader
# under test. An entry covers a difference only when stdout alone differs and every
# differing JSON pointer lies under one of `paths` (all of stdout when omitted):
#
#   [[exception]]
#   name = "search-rank-ties"        # reported per difference
#   reason = "why the new behavior is correct"
#   case = "*/search/*"              # fnmatch glob over `<catalog>/<scope>/<command>/<key>`,
#                                    # or a list of them
#   paths = ["/results"]             # JSON pointer prefixes or fnmatch globs

[[exception]]
name = "derived-generation"
reason = "The baseline reads the release originals and the checkout its derived copies, so their generations differ (section 4): every served response's `meta.generation`, every cursor (which binds the generation, so none outlives it) and an order manifest's recorded generation. A derive PR that bumps the schema minor (section 10, schema minors) also gives the derived copies a newer schema version than the originals until the next release and re-pin, which the manifest records beside the generation. Each arm follows its own cursor, so every page still compares."
case = "*"
paths = [
  "/meta/generation",
  "/data/next_cursor",
  "/provenance/catalog_generation_id",
  "/provenance/catalog_schema_version",
]

[[exception]]
name = "reader-version"
reason = "The server's release version and the catalog's schema version are build identity, not behavior: main bumps versions between re-pins, and a derive PR that bumps the schema minor gives the derived copies a newer one than the release originals, so both may differ until the next re-pin. `meta.generation` differs as in derived-generation; one exception must cover every differing path of a case."
case = "*/*/context"
paths = ["/meta/generation", "/data/reg_meta_version", "/data/schema_version"]

# The pinned release: its artifacts, and its tag's `reg-meta` binary as the baseline,
# which reads the originals, so code under change never derives what it is
# compared against. `sha256` is the GitHub release asset digest (of the `.zst`), checked
# while the asset streams into the cache.
[release]
tag = "reg_meta/v0.46.0"

[[release.asset]]
catalog = "global"
name = "reg_meta.db.zst"
sha256 = "08a92e9f2965b987a065ace4c41c1bf00644d2f2debcee1b47107d4d145fbe52"

[[release.asset]]
catalog = "swecov"
name = "reg_meta_swecov.db.zst"
sha256 = "682042a8a32964d01bce2e3dfa470718f7cee2d389264a6e5213ba5effcd1792"

# The docs database is optional enrichment for `search` and required by `docs`; it is
# placed beside both catalogs so the two read the same documentation.
[release.docs]
name = "reg_meta_docs.db.zst"
sha256 = "85a1a6c883fca2ded5203c60c33d8657a438344c39ab088c0b01299a47721f57"
