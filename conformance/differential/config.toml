# G1 differential harness (RUST_RUNTIME_SPEC.md section 4, "G1"): the seed, the pins and
# the named semantic exceptions. The cache root is the only other setting
# (`$REG_META_G1_CACHE`). A re-pin package edits this file and section 4 together: it
# runs G1 on the old and new pin and records any difference. Each run deletes every
# cached artifact or baseline environment that is not pinned here.

# Seeds every query sample (`cases.py`).
seed = 0

# Named semantic exceptions: accepted differences between the baseline and the reader
# under test. An entry covers a difference only when stdout alone differs and every
# differing JSON pointer lies under one of `paths` (all of stdout when omitted):
#
#   [[exception]]
#   name = "search-rank-ties"        # reported per difference
#   reason = "why the new behavior is correct"
#   case = "*/search/*"              # fnmatch glob over `<catalog>/<scope>/<command>/<key>`,
#                                    # or a list of them
#   paths = ["/results"]             # JSON pointer prefixes or fnmatch globs
#
# The fold sweep's one exception, `baseline-ucd-unassigned`, is defined in `folds.py`:
# its scalar set comes from the baseline interpreter's `unicodedata`.

[[exception]]
name = "derived-generation-cursor"
reason = "The baseline reads the release originals and the checkout its derived copies, so their generations differ (section 4); a search cursor binds the generation, so none outlives it. `has_more` still compares, and page 2 of `search-limit-5` exercises the shared cursor encoder."
case = "*/*/search*"
paths = ["/next_cursor"]

[[exception]]
name = "derived-generation-order"
reason = "An order manifest records the catalog's generation, which differs between the release original and the checkout's derived copy (section 4)."
case = "*/*/order/*"
paths = ["/provenance/catalog_generation_id"]

[[exception]]
name = "reader-version"
reason = "The reader's release version and the catalog's schema version are build identity, not behavior: the frozen baseline commit reports its own version, main bumps versions between re-pins, and a stage-3 schema PR bumps the derived copies' minor past the release originals' (section 10, schema minors), so both differ until the next re-pin."
case = "*/*/context"
paths = ["/data/reg_meta_version", "/data/schema_version"]

[[exception]]
name = "register-scope-code-classifications"
reason = "#1240: under --register a code hit keeps its owning classifications (code_system, classifications, classification_count), as it does unscoped; the 553ea622 baseline predates the fix and blanks them. Here three SUN codes."
case = "global/reference/search-register/19"
paths = [
  "/results/10/classification_count",
  "/results/10/classifications",
  "/results/10/code_system",
  "/results/11/classification_count",
  "/results/11/classifications",
  "/results/11/code_system",
  "/results/12/classification_count",
  "/results/12/classifications",
  "/results/12/code_system",
]

[[exception]]
name = "derived-schema-minor-order"
reason = "A stage-3 schema PR bumps the builder's minor (section 10, schema minors): the checkout's derived copies carry it, while the release originals keep theirs until the next release and re-pin. The order manifest records that schema version beside the generation, which differs as in derived-generation-order."
case = "*/*/order/*"
paths = ["/provenance/catalog_generation_id", "/provenance/catalog_schema_version"]

[[exception]]
name = "february-period-token"
reason = "rust-only fix: the baseline ends every February on the 29th (`_MONTH_LAST_DAY`), so it renders a non-leap February window as `YYYY-02-01..YYYY-02-28`; `states` renders `YYYY-02`, the token whose bounds those are. Pinned by api/states-window-fallback. The token sits at a row index that varies per variable, hence the glob. Blind spot: the glob excepts every period_token difference on a states case, not only February's; api/states-* and reg-core's grammar tests (period_token_inverts_bounds, period_token_edges_and_next_day) pin the token rule, so February is the only difference expected here."
case = "*/*/states*"
paths = ["/*/period_token"]

[[exception]]
name = "schema-alias-windows"
reason = "rust-only fix: `schema` lists the representations the resolver emits over the whole history in reference as in holdings, so a variable whose source alias windows replace its state (shared metadata, no per-column window) lists its windows; the frozen reference `get schema` expands only variables with a per-column window and lists such a state raw. Pinned by api/schema-alias-windows. The added rows shift every later row of the sorted comparison, so the whole answer is excepted, for each register G1 reports. Blind spot: every other column of these registers' reference `get schema` answers goes uncompared; api/schema-register, api/schema-variable and api/schema-alias-windows pin the row rule. The globs cover more cases than G1 reported (10 global: summary for all seven SCB registers, sampled year for bas, ekonomiskt-bistand and lisa; 16 SWECOV: summary for all twelve, sampled year for bas, ekonomiskt-bistand, it-anvandning and lisa) because a sampled year that misses every replaced state agrees with the baseline, and the sampled year moves with the seed."
case = [
  "*/reference/get-schema-*/scb/bas",
  "*/reference/get-schema-*/scb/ekonomiskt-bistand",
  "*/reference/get-schema-*/scb/hreg",
  "*/reference/get-schema-*/scb/innovation-foretag",
  "*/reference/get-schema-*/scb/it-anvandning",
  "*/reference/get-schema-*/scb/lisa",
  "*/reference/get-schema-*/scb/rams",
  "swecov/reference/get-schema-*/inera/bestallda-prover",
  "swecov/reference/get-schema-*/inera/samtal",
  "swecov/reference/get-schema-*/swecov/population",
  "swecov/reference/get-schema-*/swedbank/konsumtion",
  "swecov/reference/get-schema-*/tillvaxtverket/korttidsarbete",
]

[[exception]]
name = "schema-held-request-clip"
reason = "rust-only fix: holdings `schema` with a period clips each held window to the requested years (today's `_scope_states` with request bounds, as `states` does); the frozen `get schema --years` keeps the held window whole. Pinned by api/schema-register (holdings with period 2019). Only the window bounds differ. Blind spot: the glob excepts any held window bound on a sampled-year holdings schema, not only the request clip; api/schema-register and api/states-held-split pin the held clip and merge."
case = "*/holdings/get-schema-year/*"
paths = ["/*/1", "/*/2"]

[[exception]]
name = "coverage-alias-windows"
reason = "rust-only fix: reference `coverage` names the columns the resolver emits each year, so a variable's source alias windows name their own column (Different in 2019 rather than its state's Value); the frozen reference `get availability` reads raw states. Pinned by api/coverage-alias-windows. Only the per-year column lists differ (years are equal: the replacing windows tile their states). Blind spot: the glob excepts any per-year column list of a reference variable coverage; api/coverage-alias-windows and api/coverage-variable pin the columns per year."
case = "*/reference/get-availability-variable/*"
paths = ["/registers/*/3/*"]

[[exception]]
name = "docs-fold-search"
reason = "Docs folding (decision 16, 3b.6): doc_fts now holds fold_search text, so fold_search's full case folding and NFKD apply where unicode61 did not. The edge terms `ß` (folds to `ss`) and `ﬁlm` (NFKD `film`) find documents the baseline's unicode61 index never matched; both readers, the checkout's Python docs search and Rust docs_search, now find them."
case = "global/*/docs*-*/3[47]"
paths = ["/results", "/total", "/total_count"]

[[exception]]
name = "docs-fold-search-hint"
reason = "As docs-fold-search: the CLI search mixes docs search's hits into its results and its doc_hint, so the same two edge terms (`ß`, `ﬁlm`) gain doc rows, which also moves the cursor and, in a full page, the trailing catalog rows."
case = "*/*/search/7[47]"
paths = ["/doc_hint", "/next_cursor", "/results"]

# The baseline reader (CLI and webapp), run from a detached worktree with its own
# locked environment. It reads the release originals, so code under change never
# derives what it is compared against. 553ea622 (main after 3a.2) is the last commit
# whose webapp serves every route the served arm compares against (3a.10 and 3a.11
# deleted /api/context, /api/stats and /api/search), so it cannot move to the release
# commit; Python fixes after it are named exceptions (section 4, "Current pin").
[baseline]
commit = "553ea622fdb3a5fd42a04c46920b6f7b9a5fe8d2"

# The pinned release artifacts. `sha256` is the GitHub release asset digest (of the
# `.zst`), checked while the asset streams into the cache.
[release]
tag = "reg_meta/v0.43.0"

[[release.asset]]
catalog = "global"
name = "reg_meta.db.zst"
sha256 = "60acf6c8ee37ff5566f536af4337b876b4413899dc4d9a01c685499f513bd3c5"

[[release.asset]]
catalog = "swecov"
name = "reg_meta_swecov.db.zst"
sha256 = "67bc9cd8d07d897dc969d89b4fef4b012a128c6144fa2c65b6ff3742c71ee652"

# The docs database is optional enrichment for `search` and required by `docs`; it is
# placed beside both catalogs so the two read the same documentation.
[release.docs]
name = "reg_meta_docs.db.zst"
sha256 = "b110210901daa4e2a13e33a8574a6e2b52b43258f05bbbc6378255ddf7e75afe"
