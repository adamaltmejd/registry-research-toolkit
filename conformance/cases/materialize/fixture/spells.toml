# Synthetic: Spells is a spell table (start Start, end Stop) placing its row
# identifier in Id over 2017 and in IdAlt over 2018..2020, as Visits does. Appended
# to holdings.toml.
[[table]]
physical_name = "Spells"
disposition = "dated"
delivery = "2017..2020"
table_pids = ["demo/spells/benefit"]
period_column = "Start"
period_end_column = "Stop"
period_encoding = "yyyymmdd"
locator = "fixture:spells"

[[table.column]]
name = "Id"
locator = "fixture:spells-id-2017"
[[table.column.mapping]]
table_pid = "demo/spells/benefit"
variable_pid = "demo/spells/id"
delivery = "2017"
locator = "fixture:spells-id-2017"

[[table.column]]
name = "IdAlt"
locator = "fixture:spells-id-later"
[[table.column.mapping]]
table_pid = "demo/spells/benefit"
variable_pid = "demo/spells/id"
delivery = "2018..2020"
locator = "fixture:spells-id-later"

[[table.key]]
entity = ["demo/spells/id"]
time = []
locator = "fixture:spells-key"
