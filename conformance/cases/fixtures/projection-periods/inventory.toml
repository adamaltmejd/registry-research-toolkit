version = 1
steward = "swecov"

# Yearly and its projection YearlyNarrow span two years under one key, Person;
# YearlyNarrow has its own plain Own and a 2019 year member Late_2019.
[[table]]
id = "Yearly"
edition = { from = 2018, to = 2019 }
[[table.column]]
name = "Person"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/person"
representation = "Person"

[[table]]
id = "YearlyNarrow"
edition = { from = 2018, to = 2019 }
projection = { of = "Yearly", token = "yearly-narrow" }
[[table.column]]
name = "Late_2019"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/late"
representation = "Late"
member = { year = 2019 }
[[table.column]]
name = "Own"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/own"
representation = "Own"
[[table.column]]
name = "Person"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/person"
representation = "Person"

# Diag holds Dia at positions 1 and 2; its projection DiagNarrow holds position 1,
# which Diag serves, and its own Own.
[[table]]
id = "Diag"
edition = 2021
[[table.column]]
name = "Dia1"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/dia"
representation = "Dia"
member = { position = 1 }
[[table.column]]
name = "Dia2"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/dia"
representation = "Dia"
member = { position = 2 }
[[table.column]]
name = "Person"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/person"
representation = "Person"

[[table]]
id = "DiagNarrow"
edition = 2021
projection = { of = "Diag", token = "diag-narrow" }
[[table.column]]
name = "Dia1"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/dia"
representation = "Dia"
member = { position = 1 }
[[table.column]]
name = "Own"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/own"
representation = "Own"
[[table.column]]
name = "Person"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/person"
representation = "Person"
