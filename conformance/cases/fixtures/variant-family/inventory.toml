version = 1
steward = "swecov"

# One table per year, as SWECOV holds LISA: 2007..2009 under 16+ (which alone
# delivers Sun2000niva_Old and spells sysselsättningsstatus SyssStat), 2010..2012
# under 15+ (SyssStat11). Neither member holds 2005..2006 or 2013.

[[table]]
id = "LISA2007"
edition = 2007
[[table.column]]
name = "LopNr"
[[table.column.mapping]]
register_variant = "scb/lisa/individer-16plus"
variable = "scb/lisa/lopnr"
representation = "LopNr"
[[table.column]]
name = "DispInk04"
[[table.column.mapping]]
register_variant = "scb/lisa/individer-16plus"
variable = "scb/lisa/dispink"
representation = "DispInk04"
[[table.column]]
name = "Sun2000niva_Old"
[[table.column.mapping]]
register_variant = "scb/lisa/individer-16plus"
variable = "scb/lisa/sun2000niva-old"
representation = "Sun2000niva_Old"
[[table.column]]
name = "SyssStat"
[[table.column.mapping]]
register_variant = "scb/lisa/individer-16plus"
variable = "scb/lisa/syssstat"
representation = "SyssStat"

