version = 1
steward = "swecov"

# SCB delivered Valuenew in 2015 and 2016 and Valueold in 2016 through 2018, both
# in 2016. T2016 maps each 2016 spelling to its own column. Parent maps Value only
# as Valuenew, so it serves Valueold where SCB did not deliver Valuenew: 2017 and
# 2018, the cells Child (its projection) maps.
[[table]]
id = "T2016"
edition = 2016
[[table.column]]
name = "New"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/value"
representation = "Valuenew"
[[table.column]]
name = "Old"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/value"
representation = "Valueold"

[[table]]
id = "Child"
edition = { from = 2017, to = 2018 }
projection = { of = "Parent", token = "child" }
[[table.column]]
name = "Old"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/value"
representation = "Valueold"

[[table]]
id = "Parent"
edition = { from = 2017, to = 2018 }
[[table.column]]
name = "Observed"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/value"
representation = "Valuenew"
