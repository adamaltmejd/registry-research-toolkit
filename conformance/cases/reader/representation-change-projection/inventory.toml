version = 1
steward = "swecov"

# Child2018 is Parent2018's delivery under other columns. Parent2018 maps Value
# only as SCB's 2019 spelling Valuenew, so it serves 2018's Valueold too, the
# spelling Child2018 maps.
[[table]]
id = "Child2018"
edition = 2018
projection = { of = "Parent2018", token = "child" }
[[table.column]]
name = "Old"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/value"
representation = "Valueold"

[[table]]
id = "Parent2018"
edition = 2018
[[table.column]]
name = "Observed"
[[table.column.mapping]]
register_variant = "scb/example/annual"
variable = "scb/example/value"
representation = "Valuenew"
