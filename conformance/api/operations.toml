# Operation table: the API contract the Rust server implements, defined once and
# exposed over HTTP and MCP (crates/DESIGN.md, "Agent and web interface"). Error codes live in
# `errors.toml`; `conformance/test_api_spec.py` lints both and the `api` cases.
# Changing it is a maintainer decision; choices the interface rules do not dictate say
# so in `note`.
#
# Every response is `{"data": <result>, "meta": <Meta>}`; an error is
# `{"error": <Error>, "meta": <Meta>}` (shapes below). Raw-bytes downloads
# (`[[download]]`) are the only exception.
#
# [[operation]]
#   name     the operation, in reg-catalog and in MCP dispatch.
#   http     its routes, "METHOD /path". `{ref}` spans several path segments (a FQID);
#            other placeholders are one segment. Query parameters for GET, a JSON body
#            for POST.
#   tool     the MCP tool that exposes it. A tool exposing several operations takes an
#            `operation` argument naming one; its other arguments are that operation's
#            params. No tool: HTTP only, and `note` says why.
#   params   name = type. Types: ref (FQID or bare name; a one-segment ref
#            resolves as a FQID first, then as a bare name, so an exact ref never turns
#            ambiguous), period (the FQID/project period grammar), scope ("holdings" | "reference", default the
#            artifact's), limit (1..200, default 50), cursor (opaque `next_cursor`),
#            storage_id (a storage id as the decimal string results spell it, since ids
#            pass 2^53), string, boolean, string[], enum(a|b), project (a
#            project_data.json document as the body). A trailing `?` marks optional.
#   result   the `data` shape: a [shape.*] name, `Page<T>` (= {items: [T], next_cursor:
#            cursor | null}) or a description of its fields. A list bounded by
#            the request or the entity (a variable's warnings, a register's documents) is
#            a plain array, not a page.
#   errors   codes from errors.toml it can return beyond the ones every operation can:
#            invalid_parameter, catalog_unavailable, internal_error.

contract_version = "4.0.0"

[[operation]]
name = "search"
http = ["GET /api/search"]
tool = "search"
params = { q = "string", type = "enum(register|variable|classification|classification_code|register_value)?", register = "ref?", period = "period?", scope = "scope?", limit = "limit?", cursor = "cursor?" }
result = "Page<SearchHit>"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "invalid_period", "scope_unavailable", "invalid_cursor", "stale_cursor"]
note = """One ranked list per call. Without `type` it ranks every type together with \
best-bets ordering (exact identity first, then type priors), continued by the cursor; \
with `type` it returns that type only. The SPA's top-results strip is a call without \
`type` and its five typed groups are one call each (rejected alternative: \
`data.groups[]`, each its own page, which breaks "every list is {items, next_cursor}"). \
`q` is at most 200 characters with no NUL; a query with no letter or digit returns no \
items, not an error. The description and value arms are chosen by `type`, exact column \
names are `resolve`, and concept groups always fold. Paging stops at depth 1000. Default \
limit 50, maximum 200."""

[[operation]]
name = "search_facets"
http = ["GET /api/search/facets"]
params = { q = "string", register = "ref?", limit = "limit?", scope = "scope?" }
result = "RegisterFacets: {registers: [{fqid, name?, variable_matches, variables?: [{fqid, name}]}]} in FQID order"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = """Per register, the count of its variables that `search`'s variable arm admits \
for `q` (the same fold, full-text match, scope and multi-token register-context \
admission), counted in one grouped query: not cut by `limit` or the depth-1000 bound, \
and before concept groups fold, so a group's members each count. Registers with no \
match are absent; a query with no letter or digit returns none. Its own route, not a \
`search` parameter: a facet is neither a page nor a hit list, and `search`'s cursor \
binds its parameters. With `register` (resolved as `search`'s), the list holds only \
that register, and its entry adds `variables`: the matched variables (FQID and name) \
in FQID order, from the same admission, so the register page narrows by the server's \
match (which reads definition and description text the page never loads) rather than \
its own. Without `register`, `limit` adds each register's first `limit` matched \
variables the same way, `variable_matches` still counting them all, and a listed \
entry adds the register's `name`: the browse column lists other registers' matches \
under their names with an honest remainder. Absent, it is counts only (not `search`'s \
page default); with `register` the list is never cut. \
No MCP tool: it feeds the SPA's in-place register filter, and an agent narrows with \
`search`'s `register`."""

[[operation]]
name = "context"
http = ["GET /api/context"]
params = { scope = "scope?" }
result = "Context"
errors = ["scope_unavailable"]
note = """The catalog's identity, branding and counts (the counts take `scope`). No MCP \
tool: an agent's catalog identity is in every response's `meta`, and the branding and \
counts serve the SPA shell."""

[[operation]]
name = "show"
http = ["GET /api/catalog", "GET /api/catalog/{ref}"]
tool = "show"
params = { ref = "ref?", scope = "scope?" }
result = "Show"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = """The summary for any ref; no ref is the catalog root. Group refs are \
`group/<provider>/<register>/<key>` and `group/class/<key>`, so `group` joins `class` as \
a reserved first segment."""

[[operation]]
name = "states"
http = ["GET /api/states/{ref}"]
tool = "states"
params = { ref = "ref", period = "period?", variant = "string?", value_set_version = "string?", scope = "scope?", limit = "limit?", cursor = "cursor?" }
result = "Page<State>"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "invalid_period", "scope_unavailable", "invalid_cursor", "stale_cursor"]
note = """A variable's states; `variant` and `value_set_version` narrow independently. \
Facet routes are `/api/<operation>/{ref}` rather than `/api/catalog/{fqid}/<facet>`, \
which a variable slug such as `states` could shadow."""

[[operation]]
name = "warnings"
http = ["GET /api/warnings/{ref}"]
params = { ref = "ref", period = "period?", variant = "string?", representation = "string?", unassigned_only = "boolean?", scope = "scope?" }
result = "[DataWarning], deduplicated and ordered by warning_id"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "invalid_period", "scope_unavailable"]
note = """A register's or variable's data warnings. The filters \
need the period grammar and the delivery-column alias mapping, so they stay server-side. \
No MCP tool: the SPA's project editor is the consumer."""

[[operation]]
name = "values"
http = ["GET /api/values/{ref}"]
tool = "values"
params = { ref = "ref", state = "storage_id?", partition = "enum(source_extensions|canonical|nonstandard|sentinels)?", classification = "ref?", column = "string?", alias_window_from = "string?", parent = "string?", q = "string?", scope = "scope?", limit = "limit?", cursor = "cursor?" }
result = "Page<Value> plus `total` (matches of `q` in the whole set)"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable", "invalid_cursor", "stale_cursor"]
note = """A classification's codes, or the value set of one state of a variable (`state` \
required for a variable). Value is ValueSetMember | \
ClassificationExtensionMember | ClassificationCode: a classification's rows are \
ClassificationCode (`level` and `is_valid`, which the classification page renders). \
`total` is there because the SPA shows it. An agent lists states, then values per \
state. A state without `classification` answers its whole value set; \
with one, `partition` (default `source_extensions`) picks that book's part. \
`alias_window_from` is an identity key: with `column` it selects which delivered alias's \
codes, not a time filter, so it stays a string rather than a period. A classification's \
`parent` pages one level of its code tree (#1297): empty for the roots, a code for its \
children, each ClassificationCode with `child_count` (null for a book without a tree); \
a non-empty `q` reads the book flat. Default limit 50, maximum 200."""

[[operation]]
name = "graph"
http = ["GET /api/graph/{ref}"]
tool = "graph"
params = { ref = "ref", scope = "scope?" }
result = "RelationshipGraph {nodes, edges, focus_id}"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = "For a variable, classification or group ref."

[[operation]]
name = "lineage"
http = ["GET /api/lineage/{ref}"]
tool = "graph"
params = { ref = "ref", scope = "scope?" }
result = "{edges: [LineageEdge], warnings: [LineageWarning], registers: [per-register provenance rows]}"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = "A variable's lineage."

[[operation]]
name = "coverage"
http = ["GET /api/coverage/{ref}"]
tool = "coverage"
params = { ref = "ref", scope = "scope?" }
result = "Coverage (the ref's kind is in `fqid`)"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = "For a variable or register ref."

[[operation]]
name = "schema"
http = ["GET /api/schema/{ref}"]
tool = "schema"
params = { ref = "ref", period = "period?", variant = "string?", scope = "scope?", limit = "limit?", cursor = "cursor?" }
result = "Page<delivered column row, with its register variant and version window>"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "invalid_period", "scope_unavailable", "invalid_cursor", "stale_cursor"]
note = "A register's delivered columns, or a variable's."

[[operation]]
name = "diff"
http = ["GET /api/diff/{ref}"]
tool = "schema"
params = { ref = "ref", from = "period", to = "period", variant = "string?", scope = "scope?" }
result = "Diff"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "invalid_period", "scope_unavailable"]
note = "A register's schema between two periods; the caller filters by variable."

[[operation]]
name = "coded_variables"
http = ["GET /api/coded-variables"]
tool = "schema"
params = { scope = "scope?", limit = "limit?", cursor = "cursor?" }
result = "Page<coded variable row>"
errors = ["scope_unavailable", "invalid_cursor", "stale_cursor"]
note = "The page is ordered by distinct codes."

[[operation]]
name = "resolve"
http = ["GET /api/resolve"]
tool = "resolve"
params = { columns = "string[]", register = "ref?", scope = "scope?" }
result = "{columns: [resolved column row]}"
errors = ["invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = """Delivered column names to variables (at most 200 names). Not ref resolution, \
which every operation does. A name that matches nothing is not an error: each column \
row has a status."""

[[operation]]
name = "validate"
http = ["POST /api/project/validate"]
tool = "order"
params = { project = "project" }
result = "the validation result {ok, issues}"
note = "An invalid project is a 200 with `ok: false`."

[[operation]]
name = "order"
http = ["POST /api/project/order"]
tool = "order"
params = { project = "project" }
result = "the order manifest"
errors = ["project_invalid", "order_blocked"]
note = "The manifest's exact bytes come from the download route below."

[[operation]]
name = "docs_search"
http = ["GET /api/docs/search"]
tool = "docs"
params = { q = "string?", register = "ref?", scope = "scope?", limit = "limit?", cursor = "cursor?" }
result = "Page<DocResult> plus `total` and `register_ingested` (whether `register` has ingested docs)"
errors = ["docs_unavailable", "invalid_ref", "not_found", "ambiguous_ref", "invalid_cursor", "stale_cursor"]
note = """Without `q` it lists the documents. A catalog without docs answers \
`docs_unavailable`."""

[[operation]]
name = "docs_get"
http = ["GET /api/docs/doc/{identifier}"]
tool = "docs"
params = { identifier = "string", scope = "scope?" }
result = "DocDetail, with its 500-character `excerpt` (the SPA) and the full `body` (agents)"
errors = ["docs_unavailable", "not_found", "scope_unavailable"]

[[operation]]
name = "docs_related"
http = ["GET /api/docs/related/{ref}"]
tool = "docs"
params = { ref = "ref", scope = "scope?" }
result = "[related document {title, filename, source_url, license, fetched, sha256, byte_size}]"
errors = ["docs_unavailable", "invalid_ref", "not_found", "ambiguous_ref", "scope_unavailable"]
note = "A register's related documents; the JSON metadata for the document download route."

[[download]]
route = "POST /api/project/order/manifest"
media_type = "application/json"
operation = "order"
note = "The manifest bytes byte-identical to `order`'s `data`, as an attachment named `order_<slug>_<UTC date>.json`."

[[download]]
route = "GET /api/docs/file/{ref}/{filename}"
media_type = "application/pdf"
operation = "docs_related"
note = "Served inline."

# The shapes `result` names. A result described in words above has its fields fixed by
# its `api` cases.

[shape.Meta]
contract_version = "string; contract_version above"
generation = "string; the catalog's generation_id (64 hex)"
scope = "\"holdings\" | \"reference\"; the effective scope (project operations: the artifact's)"

[shape.Error]
code = "string; a code in errors.toml"
class = "string; its class"
message = "string; rendered from the code and fields"
remediation = "string"
fields = "object; the code's fields in errors.toml"

[shape.SearchHit]
type = "\"register\" | \"variable\" | \"group\" | \"classification\" | \"classification_succession\" | \"code\"; selects the fields below"
note = """No `rank`: the order is the contract. `register_name`, not `register`, since \
`register` is a ref everywhere else; a group's `key`/`label` as on concept-group nodes. \
A group's `matched_count` and `members[].delivery_column` serve agents over MCP."""
register = "fqid, name, purpose"
variable = "fqid, name, register_name, definition, operational_definition, delivery_column_names"
group = "kind (\"variable\" | \"classification\"), key, label, register_name, matched_count, members [{fqid, name, delivery_column}]"
classification = "fqid, short_name, name, terminal_fqid"
classification_succession = "fqid, short_name, name, matched_count, editions [{slug, fqid, name, effective_year}]"
code = "code, label, code_system, variable_count, variables [{fqid, name, register_name}] (at most 5), classification_count, classifications [{fqid, short_name, name}] (at most 5)"

[shape.Context]
steward = "{id, name, long_name}"
schema_version = "string"
import_date = "string"
period_span = "{from: integer, to: integer} | null; the catalog's period span"
reg_meta_version = "string; the server's version, which seeds a new project's reg_meta_version"
sizes = "{providers, registers, variables} in the requested scope"

[shape.Show]
note = """A `kind`-tagged summary: root, provider, register, variable, classification_root, \
classification, concept_group, classification_group, classification_family. Heavy \
parts are facets: a variable's states \
(`states`), lineage and succession chain (`lineage`, `graph`), a classification's edition \
chain (`graph`), a classification's codes (`values`), data warnings (`warnings`). A \
register carries its variants and a classification its owning variables, both \
unpaged."""
