# Error catalog (crates/DESIGN.md, "Agent and web interface"). An error is the document
# {code, class, message, remediation, fields} (operations.toml, shape.Error). HTTP sends
# it as `{"error": ..., "meta": ...}` with the code's status; MCP returns the same
# document as a tool error; a process that refuses to start prints it on stderr and
# exits with the code's `exit`. Changing a code is a maintainer decision.
#
# code       stable; `fields` lists the keys of its `fields` object.
# class      usage 400/422, not_found 404, conflict 409, order_blocked 422,
#            unavailable 503, internal 500; limit 413/429 (HTTP only).
# surface    operation: any operation, either transport. http: the HTTP transport only.
#            startup: `serve` or `mcp` refuses to start (never listens).
# status     the HTTP status (operation and http codes).
# exit       the process exit status (startup codes): 2 usage, 10 configuration. A
#            process run with a bad argument prints invalid_parameter and exits 2.
#
# Not carried over: uv_not_found, upgrade_failed, pypi_lookup_failed (the binary does
# not upgrade itself); db_exists, doc_db_exists, catalog_bootstrap_required (the
# binary installs no catalog); no_match (`resolve` reports a status per
# column); unknown_search_row_type, state_variant_unresolved,
# corrupt_concept_group_source (artifact invariants, so internal_error);
# inventory_* codes (build-side, stay in reg_meta_build).
# Order finding codes and project issue codes are data inside `order_blocked` and
# `validate` results, owned by the project validator (`reg-core`) and the order check,
# not error codes.

[[code]]
code = "invalid_parameter"
class = "usage"
surface = "operation"
status = 422
fields = ["parameter"]
note = """An unknown, missing, mistyped or out-of-range parameter, and a pair the \
operation takes exactly one of (`values`: `value_set`, `classification` or `code`; \
`label` without `code`). \
Out-of-range `limit` is an error, not a silent clamp; unknown parameters are errors, \
not ignored."""

[[code]]
code = "invalid_ref"
class = "usage"
surface = "operation"
status = 422
fields = ["ref"]
note = "A malformed public id, or one of a kind the operation does not take."

[[code]]
code = "invalid_period"
class = "usage"
surface = "operation"
status = 422
fields = ["parameter"]

[[code]]
code = "invalid_cursor"
class = "usage"
surface = "operation"
status = 422

[[code]]
code = "project_invalid"
class = "usage"
surface = "operation"
status = 422
fields = ["issues"]
note = "`order` on a project the structural validator rejects; `issues` are validate's."

[[code]]
code = "not_found"
class = "not_found"
surface = "operation"
status = 404
fields = ["ref"]
note = "`ref` is the requested ref or identifier (a document hash for `docs_get`, a value-set hash for `values`). A `values` call by `code` that matches no value set is an empty page, not `not_found`."

[[code]]
code = "retired_ref"
class = "not_found"
surface = "operation"
status = 404
fields = ["ref", "kind", "retired_in", "reason"]
note = """`ref` is in `ident_retired`: `retired_in` is the catalog_version that retired \
it, `reason` is merged, split or withdrawn. No successor is named or followed."""

[[code]]
code = "table_is_register"
class = "usage"
surface = "operation"
status = 422
fields = ["ref", "tables"]
note = """`ref` names a register that has named tables, not a table. `tables` is the \
register's table ids ([fqid]), so the next call can be exact."""

[[code]]
code = "docs_unavailable"
class = "not_found"
surface = "operation"
status = 404
note = "The catalog has no documents."

[[code]]
code = "ambiguous_ref"
class = "conflict"
surface = "operation"
status = 409
fields = ["ref", "candidates"]
note = "`candidates` is [{fqid, kind, name}], so the next call can be exact."

[[code]]
code = "stale_cursor"
class = "conflict"
surface = "operation"
status = 409
fields = ["generation"]
note = "The cursor was issued by another catalog generation; `generation` is the current one. Restart without `cursor`."

[[code]]
code = "order_blocked"
class = "order_blocked"
surface = "operation"
status = 422
fields = ["findings"]
note = "`findings` is every order finding at once, as [Issue]; the blocking ones have level `error`."

[[code]]
code = "catalog_unavailable"
class = "unavailable"
surface = "operation"
status = 503
note = "The admitted catalog cannot be read (file gone, I/O error)."

[[code]]
code = "internal_error"
class = "internal"
surface = "operation"
status = 500

[[code]]
code = "malformed_request"
class = "usage"
surface = "http"
status = 400
note = "A POST body that is not one UTF-8 JSON object (BOM, duplicate key, too deep)."

[[code]]
code = "payload_too_large"
class = "limit"
surface = "http"
status = 413
fields = ["limit_bytes"]

[[code]]
code = "rate_limited"
class = "limit"
surface = "http"
status = 429
fields = ["retry_after_seconds"]

[[code]]
code = "db_not_found"
class = "unavailable"
surface = "startup"
exit = 10

[[code]]
code = "schema_incompatible"
class = "unavailable"
surface = "startup"
exit = 10
fields = ["schema_version", "supported"]
note = """Admission is exact. A missing required manifest key, or a `generation_id` that is \
not 64 hex, is also `schema_incompatible`, with `schema_version` set to the file's value \
or `null`."""

