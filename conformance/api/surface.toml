# Surface inventory (RUST_RUNTIME_SPEC.md package 1.1a): every surface the Python
# runtime exposes today, and where it goes. `conformance/test_api_surface.py` fails when
# a `reg-meta` subcommand or imported `reg_meta` name lacks a row, or a row names
# something that no longer exists. Reviewed at checkpoint 1; judgment calls say so in
# `note`. The FastAPI route rows went as each slice deleted its routes; package F
# deleted the app.
#
# kind         command: an `add_parser` in reg_meta/src/reg_meta/cli.py, id = the argv path.
#              import: a `reg_meta` name imported by any git-visible .py file outside
#                     reg_meta/ (tests, scripts and tools included).
#                     `from M import N` is "M.N"; `import M` is "M".
# disposition  command:
#                retained  the same surface stays.
#                replaced  a Rust operation covers it (HTTP and MCP, section 7);
#                          package 1.1 adds its name as `operation`, this file does not
#                          choose names.
#                removed   nothing replaces it; `note` says why.
#              import (the name's fate in Python):
#                retained  moves into reg_meta_build in stage 4.
#                replaced  reg-core-py provides it (FQID and period grammar, folds,
#                          canonical JSON and hashing; section 5).
#                removed   no Python consumer remains; the Rust reader owns the behavior.
# owner        the stage-3 slice that ports the surface (3a admission + search, 3b show /
#              states / values, 3c schema / diff / coverage / coded, 3d chains and graph,
#              3e order and project validation), or stage 4 / 5. For an import only the
#              webapp or conformance uses, the slice whose deletions remove its last
#              importer; otherwise stage 4. Build-side imports are always stage 4.
# covered_by   the existing tests or conformance cases that exercise the surface today
#              (paths; empty means none). For imports this is a proxy: the nearest test of
#              the name's behavior, not of each consumer's use of it.
# used_by      import rows: the top-level directories whose files import the name.

