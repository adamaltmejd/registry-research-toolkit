# evidence: order sheet row "Utvecklingsersättning"; vocab (BELOPP, FROM_DATUM, TOM_DATUM, UTTAGET_MANAD) = FK_utvecklingsersattning_lev2
[[assign]]
table = "FK_UTVECKLINGSERSATTNING_lev4"
register_variant = "fk/utvecklingsersattning/_default"

# evidence: order sheet row "Vårdbidrag" = FK_VB_lev3 vocab (belopp, NIVA_MERKOST, omfattning, Utbetalningsmanad, period); vardbidrag has a single _default variant covering both recipient and barn columns
[[assign]]
table = "FK_VB_lev4"
register_variant = "fk/vardbidrag/_default"

# FK_MEKB/FK_MEKV are the barn/vuxna population shards of one variant
# (merkostnadsersattning/mottagare) with overlapping editions — §12 disjoint
# partitions, opaque labels.
[[partition]]
table = "FK_MEKB_lev4"
label = "barn"

[[partition]]
table = "FK_MEKV_lev4"
label = "vuxna"

# ── DECIDED (maintainer-approved 2026-09-02): all 173 GDB geocoded-extract
# tables → scb/gdb/adresser-fastigheter, the only GDB variant carrying the
# source material (DeSO, RegSO, address coordinates; entity key uuid-adr).
