# SWECOV delivery-inventory curation overlay (REFACTOR_SPEC.md §12).
#
# POLICY side of the inventory build: the holdings CSV
# (input_data/swecov/SWECOV_variables_full_<date>.csv, untracked) is the
# maintainer's own re-extractable listing of everything CURRENTLY ON MONA —
# superseded snapshots included, so it is never hand-edited. This file carries
# every curation decision instead; `build_catalog.py inventory` computes
# reality ∩ policy and emits the committed `inventory.toml` next to this file.
# Entries naming tables no longer in the CSV are flagged stale by the emitter.
#
# Sections:
#   [[exclude]]  table, reason
#       Discard a superseded delivery. The §12 one-to-one validator turns any
#       still-overlapping pair into a red build — each conflict line gets an
#       exclude (or an edition fix) here, with the rationale in `reason`.
#   [[edition]]  table, edition
#       Explicit edition for a table whose name yields zero or several period
#       tokens. `edition` uses the shared period grammar: a year int, a token
#       string ("2019-Q3", "HT2020"), an inline range { from = ..., to = ... },
#       or a list of those for an interrupted series.
#   [[partition]] table, label
#       §12 disjoint-partition label (a slug): names which sub-population
#       shard of one edition this table carries (survey stratum, reporter
#       stream, municipality). Distinct labels legalize overlapping tables of
#       one cell; extraction emits one file per shard. Explicit curated facts,
#       never inferred — label BOTH sides of a split.
#   [[assign]]   table, register_variant
#       Variant coordinate(s) (<provider>/<register>/<variant>, string or
#       list) for a table the curated MAPPING/disposition cannot place —
#       residue-provider deliveries (FHM_*, FK_*, …) and grafted holdings.

