id = "fdb-ae-ng"
register = "scb/fdb"
variants = ["scb/fdb/arbetsstalleenheter"]

# route note: stem:FDB_AE_: incl. _Ng_ näringsgren extras

[[table]]
table = "FDB_AE_Ng_2023"
edition = 2023

[[table]]
table = "FDB_AE_Ng_2024"
edition = 2024

[[column]]
column = "P1105_Lopnr_cfarnr"
tables = ["FDB_AE_Ng_2023"]
unmap = "Workplace join key of the näringsgren aspect table; scb/fdb/cfar-nummer is orderable from FDB_AE_2023, same edition. Maintainer-decided 2026-09-02 (aux-table join keys); reason added 2026-10-13."

[[column]]
column = "P1105_Lopnr_cfarnr"
tables = ["FDB_AE_Ng_2024"]
unmap = "Workplace join key of the näringsgren aspect table; scb/fdb/cfar-nummer is orderable from FDB_AE_2024, same edition. Maintainer-decided 2026-09-02 (aux-table join keys); reason added 2026-10-13."

[[column]]
column = "RangOrdning"
mappings = [{ register_variant = "scb/fdb/arbetsstalleenheter", variable = "scb/fdb/ng-rangordning", representation = "RangOrdning" }]
reason = "RangOrdning ranks the Näringsgren rows of the unit: in SWECOV's extract the rank-1 row holds the largest TidOmsPct share (aggregate check on MONA, reported as a conclusion only). So SWECOV's Ng mapping settles the owner as ng-rangordning (880), not ngs-rangordning (885). Maintainer ruling M2, settled from data 2026-10-19 (#1657; #1603 batch-g)."
select_owner = true

[[column]]
column = "tidomspct"
mappings = [{ register_variant = "scb/fdb/arbetsstalleenheter", variable = "scb/fdb/ng-tid-oms-pct", representation = "TidOmsPct" }]
reason = "TidOmsPct is the share of time or turnover of the Näringsgren slot it sits beside: in SWECOV's extract each share is filled exactly where its Ng slot is, the values are whole percentages, a unit's shares sum to about 100, and the rank-1 slot holds the largest share (aggregate check on MONA, reported as a conclusion only). So SWECOV's Ng mapping settles the owner as ng-tid-oms-pct (881), not procent-tid-omsattning (887). Maintainer ruling M2, settled from data 2026-10-19 (#1657; #1603 batch-g)."
select_owner = true
