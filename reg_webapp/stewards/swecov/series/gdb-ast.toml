reason = "GDB year-end rule (maintainer decision 2026-10-16): SWECOV's GDB table for year Y is the status at 31 December Y, which SCB publishes as the annual version per 1 January Y+1 (OV0100: årsversionerna skapas per den 1 januari), so each table's edition is the 1 January Y+1 version. DeSO maps onto the arbetsstallen grain variant (#1855); gdb.toml adds it there from adresser-fastigheter, with SCB's coding where SCB documents the version and a reference-date data warning. The GDB_Ast tables are coded on year Y+1's municipality division (aggregate check on MONA, reported as a conclusion only)."
