tables = ["GDB_Ind1990", "GDB_Ind1991", "GDB_Ind1992", "GDB_Ind1993", "GDB_Ind1994", "GDB_Ind1995", "GDB_Ind1996", "GDB_Ind1997", "GDB_Ind1998", "GDB_Ind1999", "GDB_Ind2000", "GDB_Ind2001", "GDB_Ind2002", "GDB_Ind2003", "GDB_Ind2004", "GDB_Ind2005", "GDB_Ind2006", "GDB_Ind2007", "GDB_Ind2008", "GDB_Ind2009", "GDB_Ind2010", "GDB_Ind2011", "GDB_Ind2012", "GDB_Ind2013", "GDB_Ind2014", "GDB_Ind2015", "GDB_Ind2016", "GDB_Ind2017", "GDB_Ind2018", "GDB_Ind2019", "GDB_Ind2020", "GDB_Ind2021", "GDB_Ind2022", "GDB_Ind2023"]
mappings = [{ register_variant = "scb/gdb/individer", variable = "scb/gdb/deso", representation = "DeSO" }]
reason = "GDB year-end rule (maintainer decision 2026-10-16): SWECOV's GDB table for year Y is the status at 31 December Y, which SCB publishes as the annual version per 1 January Y+1 (OV0100: årsversionerna skapas per den 1 januari), so each table's edition is the 1 January Y+1 version. DeSO maps onto the individer grain variant (#1855); gdb.toml adds it there from adresser-fastigheter, with SCB's coding where SCB documents the version and a reference-date data warning."
