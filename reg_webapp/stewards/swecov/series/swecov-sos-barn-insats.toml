id = "swecov-sos-barn-insats"
register = "sos/bu"
variants = ["sos/bu/bu-insats", "sos/bu/bu-insats-pnrq0"]

[[table]]
table = "SWECOV_SOS_BARN_INSATS"
edition = { from = 2007, to = 2021 }

[[column]]
column = "INSATS_BESLUT_DATUM"
mappings = [{ register_variant = "sos/bu/bu-insats", variable = "sos/bu/insats-beslut-datumn", representation = "INSATS_BESLUT_DATUMN", window = { from = 2018, to = 2021 } }]
reason = "The table unions rows from SoS's BU registers before and after the 2017 rules change (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 registers, and the new field set from the registers from reference year 2018 on. SoS made no register for 2017 and documents no recode of earlier years; new-field rows with earlier decision years are interventions still ongoing in a 2018+ reference year (SoS 2021-12-7710 pp. 4–7, 12; #1610). Decision date, filled on rows from both registers; it maps on bu-insats for 2018–2021 only, since SoS documents no decision-date variable on the old variants, so the earlier years stay unmapped. (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

[[column]]
column = "INSATS_FORM"
mappings = [{ register_variant = "sos/bu/bu-insats", variable = "sos/bu/insats-form", representation = "INSATS_FORM", window = { from = 2018, to = 2021 } }]
reason = "The table unions rows from SoS's BU registers before and after the 2017 rules change (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 registers, and the new field set from the registers from reference year 2018 on. SoS made no register for 2017 and documents no recode of earlier years; new-field rows with earlier decision years are interventions still ongoing in a 2018+ reference year (SoS 2021-12-7710 pp. 4–7, 12; #1610). New-field column, collected from reference year 2018, so it maps on bu-insats for 2018–2021 only. (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

[[column]]
column = "P1105_LopNr_PersonNr"
mappings = [{ register_variant = "sos/bu/bu-insats-pnrq0", variable = "sos/bu/personnr", representation = "PNR", window = { from = 2007, to = 2016 } }, { register_variant = "sos/bu/bu-insats", variable = "sos/bu/personnr", representation = "PNR", window = { from = 2018, to = 2021 } }]
reason = "The table unions rows from SoS's BU registers before and after the 2017 rules change (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 registers, and the new field set from the registers from reference year 2018 on. SoS made no register for 2017 and documents no recode of earlier years; new-field rows with earlier decision years are interventions still ongoing in a 2018+ reference year (SoS 2021-12-7710 pp. 4–7, 12; #1610). Pseudonymised person key on every row, so it maps once per variant window; 2017 has no SoS register. (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

[[column]]
column = "PLACDAT1"
mappings = [{ register_variant = "sos/bu/bu-insats-pnrq0", variable = "sos/bu/datum-start-placering", representation = "PLACDAT1", window = { from = 2015, to = 2016 } }]
reason = "The table unions rows from SoS's BU registers before and after the 2017 rules change (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 registers, and the new field set from the registers from reference year 2018 on. SoS made no register for 2017 and documents no recode of earlier years; new-field rows with earlier decision years are interventions still ongoing in a 2018+ reference year (SoS 2021-12-7710 pp. 4–7, 12; #1610). Old-coding column, mapped on the old variant (bu-insats-pnrq0), where SoS documents it as the start date of the first placement; its mixed identifier claim is resolved by the #1662 correction (#1603 batch-e; maintainer approval 2026-10-17). Windowed to the 2015–2016 registers: values appear only on rows decided in 2015–2016 (aggregate check on MONA, reported as a conclusion only; Operator acceptance 2026-10-18, #1603 batch-f F2)."
