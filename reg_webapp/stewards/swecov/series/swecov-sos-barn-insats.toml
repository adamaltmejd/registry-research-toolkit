reason = "The table unions two SoS BU deliveries (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 deliveries, and the new field set from the deliveries from 2017 on, which recode the older history into separate columns. Old-coding column, mapped on the old variant (bu-insats-pnrq0), where SoS documents it as the start date of the first placement; its mixed identifier claim is resolved by the #1662 correction (#1603 batch-e; maintainer approval 2026-10-17). Windowed to decision years 2015–2016, the only years with values (aggregate check on MONA, reported as a conclusion only; Operator acceptance 2026-10-18, #1603 batch-f F2)."
