reason = "The table unions two SoS BU deliveries (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 deliveries, and the new field set from the deliveries from 2017 on, which recode the older history into separate columns. New-coding column, mapped where its catalog variant covers it (bu-insats opens in 2018); 2007–2017 stay unmapped until SoS's variant windows are settled (#1645). (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

[[column]]
column = "P1105_LopNr_PersonNr"
mappings = [{ register_variant = "sos/bu/bu-insats-pnrq0", variable = "sos/bu/personnr", representation = "PNR", window = { from = 2007, to = 2016 } }, { register_variant = "sos/bu/bu-insats", variable = "sos/bu/personnr", representation = "PNR", window = { from = 2018, to = 2021 } }]
reason = "The table unions two SoS BU deliveries (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 deliveries, and the new field set from the deliveries from 2017 on, which recode the older history into separate columns. Pseudonymised person key, present in both deliveries, so it maps once per variant window (#1645); 2017 is outside both catalog variants. (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

[[column]]
