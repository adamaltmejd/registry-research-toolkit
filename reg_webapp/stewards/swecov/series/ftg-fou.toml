[[column]]
column = "V601"
tables = ["FTG_FOU_1999"]
hold = { follow_up = "#1509", reason = "By code pattern V601 would be FoU-årsverken in Östergötland (scb/fou/v0601), but the aggregate check found values that look like an amount, not person-years, so the meaning is not established (#1603, #1509; aggregate check on MONA, reported as a conclusion only; maintainer decision 2026-10-16)." }

[[column]]
column = "VIKT"
tables = ["FTG_FOU_1999", "FTG_FOU_2001"]
hold = { follow_up = "#1509", reason = "1999 and 2001 are not editions of scb/fou/foretagssektorn in the catalog (SCB documents the variant from 2003), so viktrev cannot be extended to these tables; SCB's documentation for these rounds was not checked for the weight definition (#1603, #1509; maintainer decision 2026-10-16, 9b: viktrev is extended only to editions where SCB's own documentation confirms the delivered weight is the nonresponse-adjusted N_h/m_h)." }

[[column]]
column = "VIKT"
tables = ["FTG_FOU_2003"]
hold = { follow_up = "#1509", reason = "SCB publishes no production documentation (SCBDOK) for the 2003 round on scb.se/uf0301, and SCB documents three weights on this variant in 2003 (urvalsvikt, viktU, ViktRev), so nothing settles which weight VIKT is (#1603, #1509; maintainer decision 2026-10-16, 9b: viktrev is extended only to editions where SCB's own documentation confirms the delivered weight is the nonresponse-adjusted N_h/m_h)." }

[[column]]
column = "VIKT"
tables = ["FTG_FOU_2005"]
hold = { follow_up = "#1509", reason = "SCB publishes no SCBDOK for the 2005 round on scb.se/uf0301; Beskrivning av statistiken 2005 (uf0301_bs_2005.doc, section 2.2.4) defers nonresponse handling to the survey documentation and does not define the weight (#1603, #1509; maintainer decision 2026-10-16, 9b: viktrev is extended only to editions where SCB's own documentation confirms the delivered weight is the nonresponse-adjusted N_h/m_h)." }

[[column]]
column = "VIKT"
tables = ["FTG_FOU_2007"]
hold = { follow_up = "#1509", reason = "SCBDOK 2007 (uf0301_do_2007.pdf, PDF p. 76) defines n_h in its estimator as the number of firms in the sample, and its section 0.12 compensates unit nonresponse first by imputation from the previous survey and only second by rak uppräkning; it does not establish that the delivered VIKT is the nonresponse-adjusted weight rather than the design weight (#1603, #1509; maintainer decision 2026-10-16, 9b: viktrev is extended only to editions where SCB's own documentation confirms the delivered weight is the nonresponse-adjusted N_h/m_h)." }

[[column]]
column = "VIKT"
tables = ["FTG_FOU_2009"]
mappings = [{ register_variant = "scb/fou/foretagssektorn", variable = "scb/fou/viktrev", representation = "ViktRev" }]
reason = "SWECOV storage spelling VIKT of the catalog variable scb/fou/viktrev (delivery column ViktRev); SCBDOK 2009 confirms the nonresponse-adjusted weight N_h/m_h; catalog errata of #1603 batch C (#1509), maintainer decision 2026-10-16."

