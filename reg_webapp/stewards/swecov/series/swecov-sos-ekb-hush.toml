unmap = "Year join column of the household file; sos/ekb/ar is orderable from SWECOV_SOS_EKB_PERS, same edition. Maintainer-decided 2026-09-02 (aux-table join keys); reason added 2026-10-13."

[[column]]
column = "MANAD"
unmap = "Month join column of the household file; sos/ekb/manad is orderable from SWECOV_SOS_EKB_PERS, same edition. Maintainer-decided 2026-09-02 (aux-table join keys); reason added 2026-10-13."

[[column]]
column = "P1105_LopNr_EKB"
hold = { follow_up = "#1633", reason = "Household-year link key between the EKB household and person files: the aggregate check on MONA, reported as a conclusion only found it unique per household and year in the household file, with every person-file key present there. It needs its own sos/ekb variable, which a non-SCB register cannot mint yet (#1633; #1556; maintainer decision 2026-10-16)." }
