id = "swecov-sos-lmed"
register = "sos/lmed"
variants = ["sos/lmed/lmed", "sos/lmed/lmed-vara"]

# route note: ATC/FORPDDD live in lmed-vara; SWECOV table is a denormalized join

[[table]]
table = "SWECOV_SOS_LMED"
edition = { from = "2005-07", to = 2023 }

[[column]]
column = "AR"
unmap = "Dispensing year added to the SoS delivery: the aggregate check on MONA, reported as a conclusion only found it equal to the year of EDATUM on every row, so it is derivable from EDATUM and carries nothing to order on its own (#1556; maintainer decision 2026-10-16)."

[[column]]
column = "ARBETSPL_PSEUDO"
mappings = [{ register_variant = "sos/lmed/lmed", variable = "sos/lmed/arbetspl", representation = "ARBETSPL" }]
reason = "SWECOV delivery spelling (pseudonymised) of the LMED workplace code ARBETSPL. Full catalog coverage of the edition (#1302); maintainer-decided 2026-10-13."

[[column]]
column = "P1105_LopNr_PersonNr"
mappings = [{ register_variant = "sos/lmed/lmed", variable = "sos/lmed/personnr", representation = "PNR" }]
reason = "Pseudonymised patient key of the LMED delivery (PNR). Full catalog coverage of the edition (#1302); maintainer-decided 2026-10-13."

[[column]]
column = "AR"
graft_onto = "sos/lmed/lmed"
reason = "Gap-fill graft onto sos/lmed/lmed, the holding's former grafts route target."

[[column]]
column = "ar"
graft_onto = "sos/lmed/lmed"
reason = "Gap-fill graft onto sos/lmed/lmed, the holding's former grafts route target."

[[column]]
column = "arbetspl_lopnr"
graft_onto = "sos/lmed/lmed"
reason = "Gap-fill graft onto sos/lmed/lmed, the holding's former grafts route target."

[[column]]
column = "lopnr"
graft_onto = "sos/lmed/lmed"
reason = "Gap-fill graft onto sos/lmed/lmed, the holding's former grafts route target."
