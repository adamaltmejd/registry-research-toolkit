reason = "The table unions rows from SoS's BU registers before and after the 2017 rules change (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 registers, and the new field set from the registers from reference year 2018 on. SoS made no register for 2017 and documents no recode of earlier years; new-field rows with earlier decision years are interventions still ongoing in a 2018+ reference year (SoS 2021-12-7710 pp. 4–7, 12; #1610). Old-coding column of the 2015–2016 deliveries, mapped on the old variant (bu-plac-pnrq0) for the 2015–2016 registers: values appear only on rows decided in 2015–2016 (aggregate check on MONA, reported as a conclusion only; Operator acceptance 2026-10-18, #1603 batch-f F3). (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

