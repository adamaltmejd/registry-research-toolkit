id = "swecov-sos-barn-placering"
register = "sos/bu"
variants = ["sos/bu/bu-plac", "sos/bu/bu-plac-pnrq0"]

[[table]]
table = "SWECOV_SOS_BARN_PLACERING"
edition = { from = 2008, to = 2021 }

[[column]]
column = "INSATS_BESLUT_DATUM"
mappings = [{ register_variant = "sos/bu/bu-plac", variable = "sos/bu/insats-beslut-datumn", representation = "INSATS_BESLUT_DATUMN", window = { from = 2018, to = 2021 } }]
reason = "The table unions rows from SoS's BU registers before and after the 2017 rules change (aggregate check on MONA, reported as a conclusion only): the old field set comes from the 2015–2016 registers, and the new field set from the registers from reference year 2018 on. SoS made no register for 2017 and documents no recode of earlier years; new-field rows with earlier decision years are interventions still ongoing in a 2018+ reference year (SoS 2021-12-7710 pp. 4–7, 12; #1610). Decision date, filled on rows from both registers; it maps on bu-plac for 2018–2021 only, since SoS documents no decision-date variable on the old variants, so the earlier years stay unmapped. (#1603 batch-e; maintainer decision 2026-10-16, D6a)"

