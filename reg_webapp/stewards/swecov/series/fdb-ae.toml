[[column]]
column = "tidomspct1"
tables = ["FDB_AE_2015", "FDB_AE_2016", "FDB_AE_2017", "FDB_AE_2018", "FDB_AE_2019", "FDB_AE_2020", "FDB_AE_2021", "FDB_AE_2022"]
mappings = [{ register_variant = "scb/fdb/arbetsstalleenheter", variable = "scb/fdb/ng-tid-oms-pct", representation = "TidOmsPct", member = { position = 1 } }]
reason = "Wide-pivot slot 1 of tidomspct, beside Ng slot 1. TidOmsPct is the share of time or turnover of the Näringsgren slot it sits beside: in SWECOV's extract each share is filled exactly where its Ng slot is, the values are whole percentages, a unit's shares sum to about 100, and the rank-1 slot holds the largest share (aggregate check on MONA, reported as a conclusion only). So SWECOV's Ng mapping settles the owner as ng-tid-oms-pct (881), not procent-tid-omsattning (887). Maintainer ruling M2, settled from data 2026-10-19 (#1657; #1603 batch-g)."
select_owner = true

