# Fly.io config for the reg_webapp `global` deployment (REFACTOR_SPEC.md §6.5).
#
# Deploy from the REPO ROOT — the Dockerfile needs the uv and Cargo workspaces as
# build context (see reg_webapp/Dockerfile header):
#
#   fly deploy . --config reg_webapp/fly.toml --ha=false
#
# --ha=false: `fly deploy` otherwise provisions TWO machines for redundancy;
# `global` runs a single always-on machine (Cloudflare edge caching in front
# absorbs read traffic, and a brief rolling-deploy blip is acceptable pre-v1).

app = "reg-webapp-global"
primary_region = "arn" # Stockholm — the user base is Swedish register researchers.

[build]
  # Resolved relative to this file (flyctl convention), i.e. reg_webapp/Dockerfile.
  dockerfile = "Dockerfile"
  # REG_META_TAG (cache-bust knob for DATA-only reg_meta releases) can be
  # pinned per-deploy: fly deploy ... --build-arg REG_META_TAG=reg_meta/vX.Y.Z

[env]
  # The hosted MCP endpoint (RUST_RUNTIME_SPEC.md decision 12): `/mcp` admits this
  # `Host` besides loopback. Only the global catalog serves it. The edge token
  # (REG_META_EDGE_TOKEN, a Fly secret matching the edge worker's EDGE_TOKEN)
  # lets `/mcp` rate-limit each edge client by its own address.
  REG_META_PUBLIC_HOST = "catalog.swecov.se"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: Fly's ephemeral-rootfs I/O is throttled (~8 MiB/s), so a cold
  # boot re-reads the SQLite pair slowly — keep the page cache warm instead of
  # scaling to zero (the machine costs ~$6/mo). No min_machines_running: it
  # only applies when auto_stop is "stop"/"suspend".
  auto_stop_machines = "off"
  # NOT a scale-to-zero lifecycle (auto_stop is off) — this is the
  # wake-on-request safety net: if the machine is stopped manually or exits
  # past its restart policy, the proxy boots it on the next request.
  auto_start_machines = true

  # Gate deploys on the live API: the first endpoint the entrypoint smoke gate
  # probes before it hands the foreground to `reg-meta serve`.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # The entrypoint's smoke gate runs before the server takes traffic; allow it
    # time before checks count.
    grace_period = "60s"
    method = "GET"
    path = "/api/context"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB so the OS page cache holds the read-only reg_meta DB working set
  # (~a few hundred MB unpacked) — first-query latency, not throughput.
  memory = "1gb"
