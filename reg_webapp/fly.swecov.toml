# Fly.io config for the reg_webapp `swecov` deployment (REFACTOR_SPEC.md §11).
#
# Deploy from the REPO ROOT — the Dockerfile needs the whole uv workspace as
# build context (see reg_webapp/Dockerfile header):
#
#   fly deploy . --config reg_webapp/fly.swecov.toml --ha=false \
#     --build-arg REG_META_TAG=reg_meta/vX.Y.Z
#
# The bake runs `reg-meta update --catalog swecov --tag REG_META_TAG`, which
# fetches `reg_meta_swecov.db.zst` (plus the shared docs asset) from that
# reg_meta/v* release and fails the build if the release lacks it.

app = "reg-webapp-swecov"
primary_region = "arn" # Stockholm — the user base is Swedish register researchers.

[build]
  # Resolved relative to this file (flyctl convention), i.e. reg_webapp/Dockerfile.
  dockerfile = "Dockerfile"

[build.args]
  REG_META_FLAVOR = "swecov"
  REG_WEBAPP_STEWARD = "swecov"

[env]
  REG_WEBAPP_STEWARD = "swecov"
  # Keep the entrypoint smoke deadline aligned with Fly's health-check grace.
  REG_WEBAPP_SMOKE_READY_DEADLINE = "420"

[http_service]
  internal_port = 8000
  force_https = true
  # Same always-on single-machine topology as the global catalog deployment:
  # Cloudflare edge caching absorbs reads, while the warm page cache keeps the
  # flavored SQLite DB responsive.
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "420s"
    method = "GET"
    path = "/api/context"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
