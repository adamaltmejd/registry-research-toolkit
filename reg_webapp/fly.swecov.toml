# Fly.io config for the reg_webapp `swecov` deployment (REFACTOR_SPEC.md §11).
#
# Deploy from the REPO ROOT — the Dockerfile needs the whole uv workspace as
# build context (see reg_webapp/Dockerfile header):
#
#   swecov_manifest="$(cat /path/to/private-swecov-reg_meta.db.zst.json)"
#   swecov_rev="$(printf '%s' "$swecov_manifest" | shasum -a 256 | awk '{print $1}')"
#   fly deploy . --config reg_webapp/fly.swecov.toml --ha=false \
#     --build-arg REG_META_TAG=reg_meta/vX.Y.Z \
#     --build-arg "SWECOV_REG_META_DB_REV=$swecov_rev" \
#     --build-secret "swecov_reg_meta_db_zst_manifest=$swecov_manifest"
#
# The BuildKit secret is a private JSON manifest:
# {"tag":"reg_meta/vX.Y.Z","url":"https://.../reg_meta.db.zst","sha256":"..."}.
# CI passes it from SWECOV_REG_META_DB_ZST. The Docker bake refuses a manifest
# whose tag disagrees with REG_META_TAG or whose downloaded zstd digest disagrees
# with sha256.

app = "reg-webapp-swecov"
primary_region = "arn" # Stockholm — the user base is Swedish register researchers.

[build]
  # Resolved relative to this file (flyctl convention), i.e. reg_webapp/Dockerfile.
  dockerfile = "Dockerfile"

[build.args]
  REG_META_FLAVOR = "swecov"
  REG_WEBAPP_STEWARD = "swecov"

[env]
  REG_WEBAPP_STEWARD = "swecov"
  REG_WEBAPP_FAIL_ON_STEWARD_DRIFT = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # Same always-on single-machine topology as the global catalog deployment:
  # Cloudflare edge caching absorbs reads, while the warm page cache keeps the
  # private flavored SQLite DB responsive.
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/context"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
