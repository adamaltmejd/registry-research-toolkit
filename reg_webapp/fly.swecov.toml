# Fly.io config for the reg_webapp `swecov` deployment (REFACTOR_SPEC.md §11).
#
# Deploy from the REPO ROOT — the Dockerfile needs the Cargo workspace as build
# context (see reg_webapp/Dockerfile header):
#
#   fly deploy . --config reg_webapp/fly.swecov.toml --ha=false \
#     --build-arg REG_META_TAG=reg_meta/vX.Y.Z \
#     --build-arg REG_META_DB_SHA256=<reg_meta_swecov.db.zst digest> \
#     --build-arg REG_META_DOCS_SHA256=<reg_meta_docs.db.zst digest>
#
# The bake fetches `reg_meta_swecov.db.zst` (plus the shared docs asset) from that
# reg_meta/v* release, verifies both digests, and fails the build if the release
# lacks it. The image
# serves it as `--catalog swecov`, with no public MCP host (decision 12: steward
# catalogs are never served over hosted MCP).

app = "reg-webapp-swecov"
primary_region = "arn" # Stockholm — the user base is Swedish register researchers.

[build]
  # Resolved relative to this file (flyctl convention), i.e. reg_webapp/Dockerfile.
  dockerfile = "Dockerfile"

[build.args]
  REG_META_FLAVOR = "swecov"

[http_service]
  internal_port = 8000
  force_https = true
  # Same always-on single-machine topology as the global catalog deployment:
  # Cloudflare edge caching absorbs reads, while the warm page cache keeps the
  # flavored SQLite DB responsive.
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/context"

[[vm]]
  size = "shared-cpu-1x"
  # 2 GB: the entrypoint preloads the whole catalog into the page cache (see fly.toml).
  memory = "2gb"
