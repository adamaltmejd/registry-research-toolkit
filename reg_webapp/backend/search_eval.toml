# Search-relevance eval set — DRAFT (#393 item 10).
#
# ~21 real `(query -> intended result)` pairs (a DRAFT seed; the steward should grow it
# bounded, curated catalog, so ranking changes become MEASURABLE (the precondition
# #393 calls out; it gates the ranking items 2/5/6/7). Run with:
#
#     uv run python reg_webapp/backend/scripts/run_search_eval.py
#
# against a real reg_meta.db — it reports, per case, whether `intended` appears in its
# group and at what rank.
#
# !!! DRAFT GROUND TRUTH — STEWARD MUST CONFIRM !!!
# Every `intended` below is a PROPOSED answer, grounded in what the live search returns
# today, NOT a steward verdict. Review each: fix wrong `intended`s, then flip
# `confirmed = false` -> true. Several are deliberately ambiguous (noted) — that is the
# judgment the eval exists to capture.
#
# Fields:
#   query     - the omnibox input.
#   group     - which result group the intended result should land in
#               (register | variable | classification | value).
#   intended  - the navigable target: an FQID (scb/iot, class/icd-10-se) or, for a
#               folded concept group, "group:<group_key>".
#   expect    - "hit": should rank well today (regression guard).
#               "gap": known-unsurfaced today; documents a planned lever (e.g. the
#               Swedish<->English synonym map, #393 item 8). A gap that turns into a hit
#               is progress, flagged "closed!" by the runner.
#   note      - what the case exercises / why the intended is what it is.
#   confirmed - false until a steward signs off on this pair.

# ── Exact register acronym -> that register ──────────────────────────────────
[[case]]
query = "LISA"
group = "register"
intended = "scb/lisa"
expect = "hit"
confirmed = false
note = "Exact acronym -> register, rank 1."

[[case]]
query = "RAMS"
group = "register"
intended = "scb/rams"
expect = "hit"
confirmed = false
note = "Exact acronym -> register, rank 1."

