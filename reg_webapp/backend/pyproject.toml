[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-webapp"
version = "0.1.0"
description = "Dev tooling beside the Svelte SPA: the fixture DB, the search eval, the period parity test"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Internal deps carry meaningful floors, matching the repo's floor-pin convention
# (cf. reg_meta_build's `reg-meta>=0.37.0`). The Rust server (`reg-meta serve`)
# serves every route; this member keeps only dev tooling (package F of
# RUST_RUNTIME_SPEC.md deleted the FastAPI app).
dependencies = [
    "reg-meta>=0.43.0",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_webapp"]
