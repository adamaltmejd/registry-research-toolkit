[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-webapp"
version = "0.1.0"
description = "FastAPI backend serving the reg_meta catalog to the Svelte SPA"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# reg-schema is load-bearing for A5.1b (project_data response models, §9.6);
# A5.1a only touches reg-meta, but the dependency is declared now so the
# member's runtime surface is complete and `uv sync` resolves the workspace
# edge. reg-monabundle joins for the /api/bundle write endpoint (A5.2+).
dependencies = [
    "reg-meta",
    "reg-schema",
    "reg-monabundle",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_webapp"]
