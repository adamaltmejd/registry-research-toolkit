[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-webapp"
version = "0.1.0"
description = "FastAPI backend for the Svelte SPA's project validation and order writes"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Internal deps carry meaningful floors, matching the repo's floor-pin convention
# (cf. reg_meta_build's `reg-meta>=0.37.0`). Since 3e.4 the app serves no route and
# imports only reg_meta's DB boot; reg-schema and starlette are no longer imported.
# Package F of RUST_RUNTIME_SPEC.md deletes this package with its dependencies.
# starlette keeps its security floor (GHSA-82w8-qh3p-5jfq, fixed in 1.3.1) until then;
# fastapi >=0.137.0 is the first release whose starlette range admits 1.3.x.
dependencies = [
    "reg-meta>=0.43.0",
    "reg-schema>=3.0.0",
    "fastapi>=0.137.0",
    "starlette>=1.3.1",
    "uvicorn>=0.48.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_webapp"]
