[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-webapp"
version = "0.1.0"
description = "FastAPI backend serving the reg_meta catalog to the Svelte SPA"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Adam Altmejd", email = "adam@altmejd.se" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Internal deps carry meaningful floors, matching the repo's floor-pin convention
# (cf. reg_meta_build's `reg-meta>=0.37.0`): reg_webapp embeds reg_meta's frozen
# Pydantic catalog models directly (collapsed in #681, reg-meta 0.19.0), the
# classification derivation refs added in #779 (reg-meta 0.37.0), the
# classification family lookup added in #1116 (reg-meta 0.38.2), and
# reg-schema's project_data response models (reg-schema 2.0.0). Exact pins are
# deliberately NOT used — they'd force monorepo-wide version lockstep and wouldn't
# enable out-of-workspace builds anyway (these packages resolve via
# [tool.uv.sources], not PyPI).
# starlette is a DIRECT import (limits.py / middleware.py use BaseHTTPMiddleware +
# Response/Request types), so it's declared here with its security floor
# (GHSA-82w8-qh3p-5jfq, fixed in 1.3.1) rather than left to fastapi's transitive
# pin; fastapi >=0.137.0 is the first release whose starlette range admits 1.3.x.
dependencies = [
    "reg-meta>=0.38.2",
    "reg-schema>=2.0.0",
    "fastapi>=0.137.0",
    "starlette>=1.3.1",
    "uvicorn>=0.48.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/adamaltmejd/registry-research-toolkit"
Repository = "https://github.com/adamaltmejd/registry-research-toolkit"
Issues = "https://github.com/adamaltmejd/registry-research-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reg_webapp"]
