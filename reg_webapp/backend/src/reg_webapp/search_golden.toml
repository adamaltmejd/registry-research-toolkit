# Curated golden answers (#393 item 4 / #311): pin a canonical result to the top of
# its search group for an exact (normalized: diacritic-fold + casefold + strip) query,
# even when FTS would not surface it. Steward-curated; grow as needed.
#
# Loaded + validated fail-fast by reg_webapp.golden at import. A pin needs a
# supported `group` (register | classification) and `fqids` that parse as FQIDs of
# that kind; resolvability against the DB is checked at apply time (a typo'd fqid
# raises, never silently drops). Both the route AND the eval runner apply the SAME
# `apply_golden_boost` over the raw reg_meta dicts, so the eval measures the route's
# true behavior.

[[pin]]
query = "sysselsättning"
group = "register"
fqids = ["scb/lisa"]
note = "RAMS is stale (-> BAS); steer employment queries to LISA."

[[pin]]
query = "diagnos"
group = "register"
fqids = ["sos/par"]
note = "Patientregistret = the broad diagnosis register."
