# Rust runtime workspace (RUST_RUNTIME_SPEC.md).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The every-scalar sweeps take ~11 s unoptimized; opt-level 1 keeps G0 fast.
[profile.test]
opt-level = 1
