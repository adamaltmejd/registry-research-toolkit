# Rust runtime workspace (crates/DESIGN.md).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The every-scalar sweeps take ~11 s unoptimized; opt-level 1 keeps G0 fast.
[profile.test]
opt-level = 1

# `reg-meta serve` hashes its binary and databases at boot (validator.rs), and the
# conformance suite boots a debug server per artifact: unoptimized SHA-256 made that
# suite several times slower.
[profile.dev.package.sha2]
opt-level = 3

# `reg-core-wasm` for the SPA (`bun run gen:wasm`): size over speed, under the
# gzipped budget `scripts/gate.py` checks.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
