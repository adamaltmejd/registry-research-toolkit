# `pre-commit install` wires THREE hook types: the commit gate (fast lint/type/
# format), the pre-push gate (the full test suite), and the post-checkout
# provisioner (below). Existing clones: re-run `pre-commit install` once to pick
# up the pre-push + post-checkout hooks.
# NOTE: pre-commit refuses to install while `core.hooksPath` is set (even to the
# default `.git/hooks`). If `git config --get core.hooksPath` returns a value,
# `git config --unset core.hooksPath` first, then `pre-commit install`.
default_install_hook_types: [pre-commit, pre-push, post-checkout]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # CLAUDE.md is a real copy of AGENTS.md (not a symlink), so static tools that
      # don't follow links — e.g. PR-review bots — see both. Keep them byte-identical.
      - id: claude-agents-sync
        name: "CLAUDE.md must equal AGENTS.md (to fix drift: cp AGENTS.md CLAUDE.md)"
        entry: diff -q CLAUDE.md AGENTS.md
        language: system
        pass_filenames: false
        files: ^(CLAUDE|AGENTS)\.md$
        stages: [pre-commit]
      # ty (Astral, beta): pinned via uvx, same as CI. It moves quickly, so
      # bump this pin deliberately/frequently. Whole-program check, so
      # pass_filenames: false. files gate skips doc-only commits.
      - id: ty
        name: ty check
        entry: uvx --from ty==0.0.51 ty check
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]
      # panache (formatter + linter) replaces markdownlint-cli2. Pinned because
      # uvx always grabs latest, which would defeat the 7-day release-age policy;
      # keep the pin in sync with scripts/parse_lisa_docs.py. Discovery is
      # whole-repo (.panache.toml excludes + .gitignore), so pass_filenames: false;
      # files gate skips non-doc commits. CI runs via `pre-commit run --all-files`.
      - id: panache-format
        name: panache format --check
        entry: uvx --from panache-cli==2.57.0 panache format --check .
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]
      - id: panache-lint
        name: panache lint --check
        entry: uvx --from panache-cli==2.57.0 panache lint --check .
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]
      # Full test suite — runs at PUSH time, not on every commit, so the tight
      # commit loop stays fast (ruff/ty/panache only, all sub-second). The
      # --run-integration flag opts the Docker integration test
      # (reg_meta/tests/test_integration.py) IN past the root conftest's
      # collection gate, making a running Docker daemon a REQUIRED pre-push gate:
      # with Docker down the integration test FAILS (its `docker` fixture fails,
      # not skips, once opted in), so the push is blocked until Docker is up —
      # start it and push again rather than bypassing with --no-verify. CI's
      # `test` job runs `-m "not integration"` (and passes no --run-integration),
      # so pre-push is the only automated home for the integration test. The
      # files gate runs the suite for code (.py) AND the committed data the suite
      # validates directly — .toml (curation pins, fqid_slugs snapshots, concept
      # groups; see test_repo_curation_tomls.py / test_slug_snapshot.py) and
      # .json (openapi snapshot, fixtures) — skipping only pushes confined to
      # docs/markdown/workflow-YAML (over the whole push range).
      - id: pytest
        name: pytest (parallel, pre-push)
        entry: uv run python -m pytest -n auto -q --run-integration
        language: system
        pass_filenames: false
        files: \.(py|toml|json)$
        stages: [pre-push]
      # post-checkout only: provision a freshly checked-out / `git worktree add`ed
      # tree (its own .venv + node_modules) so worktrees created mid-session — by
      # `git worktree add`, or the harness (which uses it under the hood) — are
      # ready without waiting for the next SessionStart. Idempotent + fingerprinted,
      # so an in-sync checkout is a fast skip; a dep-changing branch switch re-syncs.
      - id: worktree-provision
        name: provision worktree env (uv sync / bun install)
        entry: .claude/hooks/worktree_bootstrap.sh --provision
        language: script
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
