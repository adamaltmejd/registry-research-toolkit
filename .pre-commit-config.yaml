repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest (parallel)
        entry: uv run python -m pytest -n auto -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
