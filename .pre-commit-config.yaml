repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # CLAUDE.md is a real copy of AGENTS.md (not a symlink), so static tools that
      # don't follow links — e.g. PR-review bots — see both. Keep them byte-identical.
      - id: claude-agents-sync
        name: "CLAUDE.md must equal AGENTS.md (to fix drift: cp AGENTS.md CLAUDE.md)"
        entry: diff -q CLAUDE.md AGENTS.md
        language: system
        pass_filenames: false
        files: ^(CLAUDE|AGENTS)\.md$
        stages: [pre-commit]
      # ty (Astral, beta): unpinned via uvx to track latest, same as CI. Whole-program
      # check, so pass_filenames: false. files gate skips doc-only commits.
      - id: ty
        name: ty check
        entry: uvx ty check
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]
      # panache (formatter + linter) replaces markdownlint-cli2. Pinned because
      # uvx always grabs latest, which would defeat the 7-day release-age policy;
      # keep the pin in sync with scripts/parse_lisa_docs.py. Discovery is
      # whole-repo (.panache.toml excludes + .gitignore), so pass_filenames: false;
      # files gate skips non-doc commits. CI runs via `pre-commit run --all-files`.
      - id: panache-format
        name: panache format --check
        entry: uvx --from panache-cli==2.51.0 panache format --check .
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]
      - id: panache-lint
        name: panache lint --check
        entry: uvx --from panache-cli==2.51.0 panache lint --check .
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]
      - id: pytest
        name: pytest (parallel)
        entry: uv run python -m pytest -n auto -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
