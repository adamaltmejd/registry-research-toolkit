repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # ty (Astral, beta): unpinned via uvx to track latest, same as CI. Whole-program
      # check, so pass_filenames: false. files gate skips doc-only commits.
      - id: ty
        name: ty check
        entry: uvx ty check
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]
      # markdownlint via bunx (project standardizes on bun, not node). Config in
      # .markdownlint-cli2.yaml drives discovery, so pass_filenames: false; files
      # gate skips non-doc commits. CI runs this via `pre-commit run --all-files`.
      - id: markdownlint
        name: markdownlint-cli2
        entry: bunx markdownlint-cli2
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]
      - id: pytest
        name: pytest (parallel)
        entry: uv run python -m pytest -n auto -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
